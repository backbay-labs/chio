notes = [
  "The implementation-linked protocol core is the pure security decision surface plus bounded models for adjacent state transitions. Concrete platform effects are tracked as audited assumptions.",
  "The budget-admission and revocation-projection public Kani harnesses verify shared scalar projection functions called by both production backends or callers; they do not verify storage IO, mutation journals, snapshot freshness, or reservation-ledger transitions. The separate budget checked-add harness remains model-level.",
  "Reservation conservation has four independent enforcement surfaces: bounded Apalache interleavings, the pure ledger_apply transition with Kani, Creusot, and Lean witnesses, a debug-only concrete monetary-journal replay plus runtime-metadata check, and a stateful InMemoryBudgetStore property test. The store test does not drive kernel lifecycle or receipts; the in-kernel drop_guard_disposition_table separately exercises the production hook and guard. Scalar admission is linked; production ledger linkage is not established.",
  "Lean assets are release evidence only when root-imported, sorry-free, and mapped to property_matrix entries.",
  "Creusot and Kani are required strict-CI lanes for production implementation linkage; public Kani harnesses target verify_capability, NormalizedScope::is_subset_of, resolve_matching_grants, evaluate, sign_receipt, and the shared budget and revocation admission projections.",
  "Aeneas production extraction pairs every decision-core and reservation-ledger function with a generated Lean equivalence theorem. The ledger theorem reaches the bounded transition model; concrete runtime store linkage remains outside that theorem.",
  "The post-admission drop lifecycle is model-checked at two invocations and one buffered child per invocation. Its evidence requires both a positive NoError result and every paired negative mutation producing a registered ITF counterexample.",
  "RevocationPropagation is checked nightly against callback-complete, canonical, signed traces captured at real kernel revocation commit, revocation admission, and receipt append boundaries. The full-state ITF is the sole state input, Apalache evaluates four non-vacuous invariant witnesses, every invariant has a registered real-runtime negative calibration, and ASSUME-TRACE-OBSERVER remains the explicit callback-completeness boundary.",
  "Release-facing formal claims must name this manifest, the theorem inventory, and the audited assumptions.",
  "ReceiptBeforeAllow proves the abstract persist-before-publish ordering and its production replay exercises the native happy path. It does not discharge concrete cross-row crash recovery, which remains excluded until implementation trace validation and crash-reopen conservation gates establish refinement.",
  "Manual Rust-to-model hashes are enforced by cargo xtask check formal-mirrors; transliteration and abstraction-anchor records require review, but matching hashes do not prove semantic equivalence or modeled properties.",
  "The Rust relying-party inclusion walk is bound to the symbolic Lean walk by paired manual-mirror hashes, an authenticated generated-output Aeneas theorem for the scalar step, bounded Kani parity with unwinding assertions over runtime-cross-checked fixtures for every size from 1 through 8, and required Rust-TypeScript tamper differentials. Hash collision resistance remains ASSUME-SHA256.",
  "The treaty PredicateLang is a bounded post-validation abstraction over production-shaped federation inputs. Its Lean abstraction anchors are drift tripwires, not a Rust refinement proof.",
  "docs/formal/COVERAGE.md is the generated per-surface join of declared verification registries. It reports evidence identity and attribution without licensing claims beyond docs/reference/CLAIM_REGISTRY.md.",
]

# Discharged assumptions: prior audited assumptions that are no longer
# load-bearing because a named property in this manifest now establishes
# the same guarantee. Each row cites (a) the retired assumption ID in
# `formal/assumptions.toml` retired_assumptions, (b) the discharging
# artifacts (TLA invariants, Kani harnesses, Lean theorems, runtime
# invariants), and (c) the Rust call sites the discharge constrains.
# Format: id|discharging_artifacts|rust_call_sites|prose
discharged_assumptions = []

# ASSUME-NETWORK-TRANSPORT remains an audited assumption in
# `formal/assumptions.toml` `required_assumption_ids` rather than a
# discharged one.
#
# The `RevocationFreshness` invariant in
# `formal/tla/RevocationPropagation.tla` (~L344) constrains every
# recorded local revocation epoch to be strictly less than the global
# clock value, which discharges only the LOCAL freshness gate
# (single-authority observed-epoch monotonicity vs the model clock).
# It does NOT model multiple gossip peers, vector-clock-ordered
# delivery, or any other cross-peer ordering primitive: the predicate
# is `\A a \in ProcSet, c \in CapSet : rev_epoch[a][c] # 0 =>
# rev_epoch[a][c] < clock`, where `clock` is a single shared variable
# rather than a per-peer logical timestamp.
#
# Therefore the cross-peer ordering claim that
# `ASSUME-NETWORK-TRANSPORT` covers ("authenticated messages received
# by Chio are not silently rewritten below TLS or signature checks")
# remains audited rather than discharged. The wire-level signature
# pinning in `crates/trust/chio-federation/src/revocation_gossip.rs`
# (signer_id pin, signature verification before
# `RevocationView::install_if_newer`) is the operational mitigation;
# the formal discharge is deferred until a distributed-time TLA model
# ships.
m04_p5_t5_assumptions_decision = "ASSUME-NETWORK-TRANSPORT-unchanged"
m04_p5_t5_rationale_anchor = "formal/tla/RevocationPropagation.tla::RevocationFreshness"

