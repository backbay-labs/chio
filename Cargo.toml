[workspace]
resolver = "2"
members = [
    # Core & types
    "crates/chio-core",
    "crates/chio-core-types",
    "crates/chio-errors",
    "crates/chio-adversarial-suite",
    "crates/chio-arena",
    #
    # Kernel variants
    "crates/chio-kernel",
    "crates/chio-kernel-browser",
    "crates/chio-kernel-core",
    "crates/chio-kernel-mobile",
    "crates/chio-lsp",
    #
    # Guards & policy
    "crates/chio-data-guards",
    "crates/chio-data-guards/redactors/default",
    "crates/chio-external-guards",
    "crates/chio-guard-registry",
    "crates/chio-guard-sdk",
    "crates/chio-guard-sdk-macros",
    "crates/chio-guards",
    "crates/chio-policy",
    "crates/chio-wasm-guards",
    #
    # Protocol adapters & edges
    "crates/chio-a2a-adapter",
    "crates/chio-a2a-edge",
    "crates/chio-acp-edge",
    "crates/chio-acp-proxy",
    "crates/chio-ag-ui-proxy",
    "crates/chio-anthropic-tools-adapter",
    "crates/chio-bedrock-converse-adapter",
    "crates/chio-cohere-tools-adapter",
    "crates/chio-cross-protocol",
    "crates/chio-envoy-ext-authz",
    "crates/chio-gemini-tools-adapter",
    "crates/chio-groq-tools-adapter",
    "crates/chio-mcp-adapter",
    "crates/chio-mcp-edge",
    "crates/chio-mcp-remote",
    "crates/chio-mistral-tools-adapter",
    "crates/chio-ollama-tools-adapter",
    "crates/chio-openai",
    "crates/chio-openapi",
    "crates/chio-openapi-mcp-bridge",
    "crates/chio-provider-adapter-core",
    "crates/chio-provider-conformance",
    "crates/chio-tool-call-fabric",
    "crates/chio-tower",
    #
    # Economics & settlement
    "crates/chio-anchor",
    "crates/chio-appraisal",
    "crates/chio-autonomy",
    "crates/chio-credit",
    "crates/chio-link",
    "crates/chio-listing",
    "crates/chio-market",
    "crates/chio-open-market",
    "crates/chio-settle",
    "crates/chio-underwriting",
    "crates/chio-web3",
    "crates/chio-web3-bindings",
    #
    # Supply-chain attestation
    "crates/chio-replay-corpus",
    "crates/chio-attest-verify",
    "crates/chio-custody-hw",
    "crates/chio-weights",
    "crates/chio-tee",
    "crates/chio-tee-frame",
    #
    # Identity, credentials, federation
    "crates/chio-credentials",
    "crates/chio-did",
    "crates/chio-federation",
    "crates/chio-governance",
    "crates/chio-revocation-oracle",
    "crates/chio-reputation",
    #
    # Observability & ops
    "crates/chio-lineage",
    "crates/chio-log-redact",
    "crates/chio-metering",
    "crates/chio-metrics-spec",
    "crates/chio-otel-receipt-exporter",
    "crates/chio-siem",
    #
    # Control plane & storage
    "crates/chio-config",
    "crates/chio-control-plane",
    "crates/chio-manifest",
    "crates/chio-store-sqlite",
    "crates/chio-workflow",
    "integrations/aws-bedrock/control-plane",
    "integrations/mcp-adapter",
    #
    # HTTP & session
    "crates/chio-hosted-mcp",
    "crates/chio-http-core",
    "crates/chio-http-session",
    #
    # Products
    "crates/chio-api-protect",
    "crates/chio-cli",
    "crates/chio-mercury",
    "crates/chio-mercury-core",
    "crates/chio-wall",
    "crates/chio-wall-core",
    #
    # SDK support
    "crates/chio-binding-helpers",
    "crates/chio-bindings-ffi",
    "crates/chio-cpp-kernel-ffi",
    "crates/chio-conformance",
    "crates/chio-conformance/verdict_matrix/drivers/lambda",
    "crates/chio-eval-receipt",
    "crates/chio-spec-codegen",
    "crates/chio-spec-validate",
    #
    # Examples
    "examples/cross-provider-policy",
    "examples/guards/enriched-inspector",
    "examples/guards/tool-gate",
    "examples/hello-a2a",
    "examples/hello-acp",
    "examples/hello-mcp",
    "examples/hello-tool",
    "examples/otel-genai",
    #
    # Tests
    "formal/diff-tests",
    "tests/e2e",
    "tests/replay",
    #
    # Tooling
    "bench/healthcare-pilot-capacity",
    "bench/ttfrh",
    "xtask",
    #
    # Editor extensions
    "editors/zed-chio",
]
exclude = [
    # PyO3 extension package: built through maturin with an explicit Python
    # sysconfig, not by the default Rust workspace gate.
    "crates/chio-eval-receipt/py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/backbay/chio"

[workspace.metadata.chio]
rust_public_entrypoints = [
    "chio-cli",
    "chio-control-plane",
    "chio-core",
    "chio-guards",
    "chio-hosted-mcp",
    "chio-kernel",
    "chio-manifest",
    "chio-mcp-adapter",
    "chio-mcp-edge",
    "chio-mcp-remote",
    "chio-policy",
]

[workspace.metadata.cargo-vet]

[workspace.metadata.cargo-auditable]
# release-binaries.yml wraps every release build with `cargo auditable build`,
# embedding the workspace dependency graph (per RFC at
# github.com/rust-secure-code/cargo-auditable) into each published binary.
# Downstream consumers can extract the manifest with `cargo audit -f <binary>`
# to scan for known vulnerabilities without needing the source tree.

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
panic = "abort"

[workspace.dependencies]
aws-sdk-bedrockruntime = "1.130.0"
aws-sdk-marketplaceentitlement = "1"
aws-sdk-marketplacemetering = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serde_yml = "0.0.12"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
miette = { version = "7.6.0", features = ["fancy"] }
chrono = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
fips204 = { version = "0.4.6", default-features = false, features = ["ml-dsa-65"] }
dcap-rs = "0.1.0"
sev = { version = "7.1.0", default-features = false, features = ["snp", "crypto_nossl"] }
coset = { version = "0.4.2", default-features = false }
x509-parser = "0.16"
der = "0.7"
jsonwebtoken = "9"
rand_core = { version = "0.6", features = ["getrandom"] }
rand = "0.8"
rand_chacha = "0.3"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
hex = "0.4"
base64 = "0.22"
base64ct = "=1.8.3"
bs58 = "0.5"
chacha20poly1305 = "0.10"
ryu = "1"
sha2 = "0.10"
reqwest = { version = "0.13.2", default-features = false }
rusqlite = { version = "0.39", features = ["bundled"] }
rs_merkle = "1.5"
uuid = "1"
url = "2"
webauthn-rs = "=0.5.2"
webauthn-rs-proto = "=0.5.2"
proptest = "1.10"
criterion = "0.5"
dhat = "0.3"
tempfile = "3"
testcontainers = { version = "0.27.3", default-features = false }
jsonschema = { version = "0.46", default-features = false, features = ["resolve-file"] }
# Pin concurrency primitives + tower feature set in the workspace so member
# crates can share resolved versions.
dashmap = "6"
arc-swap = "1"
loom = "0.7"
parking_lot = "0.12"
tower = { version = "0.5", features = ["util", "make", "buffer", "timeout", "load-shed", "limit", "retry"] }
tower-lsp = "0.20.0"
lsp-types = "0.95.1"
notify = "6.1.1"
opentelemetry-semantic-conventions = { version = "=0.29.0", default-features = false, features = ["semconv_experimental"] }
# M09 wave-opener: lineage DAG (petgraph) and marketplace CSV exports (csv).
petgraph = "0.6"
csv = "1"
