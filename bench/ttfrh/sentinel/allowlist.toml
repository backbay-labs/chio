# Telemetry-free first-run sentinel allowlist.
#
# Hosts listed here are accepted as the explicitly configured upstream
# provider during the TTFRH first-run bench. Any other hostname captured
# by the iptables-style sentinel inside the bench container fails the
# gate. Per-template allowlists live under `[templates.<slug>]`; the
# top-level `[global]` entries cover loopback and the local KV / sink
# transports the templates rely on.

[global]
hosts = [
  "127.0.0.1",
  "localhost",
  "::1",
]
loopback_only = true

[templates.next-ai-sdk-receipts]
hosts = [
  # Empty: the template runs against an in-memory sink. Users that opt
  # into a hosted upstream provider extend this list manually before
  # rerunning the bench.
]

[templates.fastapi-langchain]
hosts = []

[templates.cloudflare-worker]
hosts = []

[notes]
schema_version = "1"
last_reviewed_iso = "2026-04-30"
maintainer = "@backbay-labs"
