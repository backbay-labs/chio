schema = "chio.loom.v1"

# Every entry is a bounded abstract synchronization model. The tests use
# Loom-owned primitives in test-local state machines. They do not replace or
# prove the kernel's production std, Tokio, DashMap, or ArcSwap primitives.
#
# The runner fixes `--cfg chio_kernel_loom`, applies the per-entry preemption
# bound, and records runtime evidence under `target/loom/`.

[[harness]]
crate = "chio-kernel"
test = "loom_concurrency::loom_session_create_lookup_terminal_same_id"
max_preemptions = 3
lane = "nightly"
scope = "bounded_abstract_model"
notes = "Models create, lookup, and terminal-state ordering for one session identity."

[[harness]]
crate = "chio-kernel"
test = "loom_concurrency::loom_parent_signs_receipt_while_child_spawns"
max_preemptions = 3
lane = "nightly"
scope = "bounded_abstract_model"
notes = "Models parent receipt publication before a child receipt becomes observable."

