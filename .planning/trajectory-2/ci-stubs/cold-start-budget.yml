# [trajectory-2 stub] cold-start-budget gate (browser kernel)
#
# Copy to .github/workflows/cold-start-budget.yml as part of the M06.P5
# wave-opener. Loads the browser-kernel WASM bundle in a headless
# Chromium instance and measures cold-start time from `init()` to first
# successful `verdict()`. Fails if the median across N runs exceeds the
# budget recorded at bench/browser-cold-start-budget.toml.
#
# Activated by: M06.P5.T2 (browser kernel cold-start budget gate).
# Disposition: required on PRs that touch crates/chio-portable-browser/**,
# crates/chio-kernel-core/**, or sdks/web/**.
#
# Pre-reqs not yet satisfied at stub time:
#   - tooling/cold-start-runner/ headless harness exists.
#   - bench/browser-cold-start-budget.toml exists.
#   - scripts/check-cold-start-budget.sh enforces the threshold.

name: cold-start-budget [trajectory-2 stub]

on:
  pull_request:
    paths:
      - "crates/chio-portable-browser/**"
      - "crates/chio-kernel-core/**"
      - "sdks/web/**"
      - "tooling/cold-start-runner/**"
      - ".github/workflows/cold-start-budget.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cold-start-budget-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cold-start-budget:
    name: cold-start-budget (browser kernel)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install wasm-pack (pinned to repo tooling version)
        run: cargo install wasm-pack --version "$(cat .tooling/wasm-pack.version)" --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install headless Chromium
        run: |
          sudo apt-get update
          if ! sudo apt-get install -y chromium-driver chromium libcurl4-openssl-dev; then
            sudo apt-get install -y chromium-driver chromium-browser libcurl4-openssl-dev
          fi
      - name: Build browser-kernel WASM bundle
        run: ./scripts/qualify-portable-browser.sh --release-build-only
      - name: Measure cold-start latency (median of 11)
        env:
          CHIO_COLD_START_RUNS: "11"
          CHIO_COLD_START_OUTPUT: target/cold-start
        run: |
          set -euo pipefail
          mkdir -p target/cold-start
          node tooling/cold-start-runner/index.mjs \
            --bundle target/wasm32-unknown-unknown/release/chio_portable_browser.wasm \
            --runs "$CHIO_COLD_START_RUNS" \
            --emit "$CHIO_COLD_START_OUTPUT/result.json"
      - name: Enforce cold-start budget
        env:
          CHIO_COLD_START_BUDGET: bench/browser-cold-start-budget.toml
          CHIO_COLD_START_REPORT: target/cold-start/result.json
          CHIO_COLD_START_FAIL_CLOSED: "1"
        run: bash scripts/check-cold-start-budget.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cold-start-budget-${{ github.run_id }}
          path: target/cold-start
          retention-days: 30
