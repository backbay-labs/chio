# [trajectory-2 stub] mutation-coverage gate
#
# Copy to .github/workflows/mutation-coverage.yml as part of the M02.P3
# wave-opener. This stub extends the trajectory-1 mutants.yml lane onto
# the full six-crate trust-boundary set (chio-policy, chio-credentials,
# chio-attest-verify, chio-kernel-core, chio-guards, chio-anchor) and
# flips the gate to required at >= 80% kill rate after two consecutive
# nightly green runs (per M02.P3.T1 gate_check).
#
# Activated by: M02.P3.T1 (Flip mutants-pr lane to required CI for the
# six trust-boundary crates).
# Disposition: required on PRs that touch any of the six crates; nightly
# full-workspace sweep (advisory until two consecutive nightly runs land
# >= 80%, then required by virtue of the M02.P3.T1 cutover).
#
# Pre-reqs not yet satisfied at stub time:
#   - chio-anchor crate exists in workspace (lands with M09 wake-up).
#   - .cargo/mutants.toml updated to include chio-attest-verify and
#     chio-anchor in examine_globs.
#   - scripts/mutants-gate.sh teaches the >= 80% rule.

name: mutation-coverage [trajectory-2 stub]

on:
  pull_request:
    paths:
      - "crates/chio-policy/src/**"
      - "crates/chio-credentials/src/**"
      - "crates/chio-attest-verify/src/**"
      - "crates/chio-kernel-core/src/**"
      - "crates/chio-guards/src/**"
      - "crates/chio-anchor/src/**"
      - "**/mutants.toml"
      - ".github/workflows/mutation-coverage.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: mutation-coverage-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutation-coverage:
    name: mutation-coverage (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        package:
          - chio-policy
          - chio-credentials
          - chio-attest-verify
          - chio-kernel-core
          - chio-guards
          - chio-anchor
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install cargo-mutants (Decision 12 pin)
        run: cargo install cargo-mutants --version 25.3.1 --locked
      - name: Run mutation sweep
        env:
          CHIO_MUTANTS_KILL_RATE_FLOOR: "0.80"
        run: |
          set -euo pipefail
          mkdir -p mutants-out/${{ matrix.package }}
          cargo mutants \
            --package "${{ matrix.package }}" \
            --no-shuffle \
            --timeout 600 \
            --jobs 2 \
            --output mutants-out/${{ matrix.package }} \
            --json
      - name: Enforce 80% kill-rate floor
        env:
          MUTANTS_PACKAGE: ${{ matrix.package }}
          MUTANTS_OUTPUT_DIR: mutants-out/${{ matrix.package }}
          CHIO_MUTANTS_GATE: blocking
        run: bash scripts/mutants-gate.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mutation-coverage-${{ matrix.package }}-${{ github.run_id }}
          path: mutants-out/${{ matrix.package }}
          retention-days: 30
