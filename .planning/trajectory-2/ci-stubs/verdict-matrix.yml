# [trajectory-2 stub] verdict-matrix gate (cross-SDK semantic differential)
#
# Copy to .github/workflows/verdict-matrix.yml as part of the M02.P5
# wave-opener. The lane runs the cross-SDK verdict matrix harness (at
# crates/chio-conformance/verdict_matrix/) over the corpus shipped by
# M02.P0..P4 and fails if any two SDK languages disagree on a verdict
# for the same hash-pinned input.
#
# Activated by: M02.P5.T1 (verdict-matrix lane wired as required on SDK PRs).
# Disposition: required on any PR that touches sdks/** or the verdict
# matrix corpus; advisory on push-to-main (uploaded as artifact).
#
# Pre-reqs not yet satisfied at stub time:
#   - crates/chio-conformance/verdict_matrix/ harness exists.
#   - The five SDK runners (rust, ts, py, go, jvm) all expose the
#     `verdict-matrix` subcommand from chio-conformance.

name: verdict-matrix [trajectory-2 stub]

on:
  pull_request:
    paths:
      - "sdks/**"
      - "crates/chio-conformance/**"
      - "spec/**"
      - ".github/workflows/verdict-matrix.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verdict-matrix-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verdict-matrix:
    name: verdict-matrix (cross-SDK differential)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.23.0"
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
      - name: Build cross-SDK verdict matrix harness
        run: cargo build -p chio-conformance --bin verdict-matrix --release
      - name: Run verdict matrix across 5 SDK languages
        env:
          CHIO_VERDICT_MATRIX_LANGS: "rust,ts,py,go,jvm"
        run: |
          set -euo pipefail
          ./target/release/verdict-matrix \
            --corpus tests/replay/fixtures/verdict-matrix \
            --langs "$CHIO_VERDICT_MATRIX_LANGS" \
            --report verdict-matrix-report.json \
            --fail-on-divergence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verdict-matrix-report
          path: verdict-matrix-report.json
          retention-days: 30
