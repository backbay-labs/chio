# [trajectory-2 stub] lean-build gate (capability-algebra theorems)
#
# Copy to .github/workflows/lean-build.yml as part of the M04.P4
# wave-opener. Runs `lake build` over the Lean 4 capability-algebra
# theorems under formal/lean4/Chio/Capability/. Counterexamples land at
# formal/lean4/counterexamples/<sha>.lean per EXECUTION-BOARD section 7.
#
# Activated by: M04.P4.T1 (Lean 4 capability-algebra theorem set is
# proven and gated).
# Disposition: required on PRs that touch capability-algebra source
# (crates/chio-core-types/src/capability*.rs,
# crates/chio-kernel/src/delegation*.rs) or formal/lean4/Chio/Capability/**.
#
# Pre-reqs not yet satisfied at stub time:
#   - formal/lean4/Chio/Capability/ directory exists with the four
#     delegation theorems (M04.P4 narrative section).
#   - lakefile.lean lists Capability as a buildable library target.

name: lean-build [trajectory-2 stub]

on:
  pull_request:
    paths:
      - "formal/lean4/**"
      - "crates/chio-core-types/src/capability**"
      - "crates/chio-kernel/src/delegation**"
      - ".github/workflows/lean-build.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CHIO_ELAN_VERSION: v4.2.1
  CHIO_ELAN_TARBALL_SHA256: 4e717523217af592fa2d7b9c479410a31816c065d66ccbf0c2149337cfec0f5c

jobs:
  lean-build:
    name: lean-build (capability theorems)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Restore Lean 4 toolchain cache
        id: elan-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ env.CHIO_ELAN_VERSION }}-${{ env.CHIO_ELAN_TARBALL_SHA256 }}-${{ hashFiles('formal/lean4/Chio/lean-toolchain') }}
      - name: Install Lean 4 toolchain
        if: steps.elan-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/leanprover/elan/releases/download/${CHIO_ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz" \
            -o /tmp/elan.tar.gz
          echo "${CHIO_ELAN_TARBALL_SHA256}  /tmp/elan.tar.gz" | sha256sum -c -
          tar -xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain none
      - name: Configure Lean 4 toolchain path
        run: |
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "ELAN_HOME=$HOME/.elan" >> "$GITHUB_ENV"
      - name: Prime Lean 4 toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(tr -d '\r\n' < formal/lean4/Chio/lean-toolchain)"
          "$HOME/.elan/bin/elan" toolchain install "$toolchain"
      - name: lake build Capability library
        shell: bash
        run: |
          set -euo pipefail
          cd formal/lean4/Chio
          "$HOME/.elan/bin/lake" build Chio.Capability
      - name: Verify counterexample drawer is clean
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G "formal/lean4/counterexamples/*.lean" > /dev/null; then
            echo "Open Lean counterexamples present; failing closed." >&2
            ls formal/lean4/counterexamples/*.lean
            exit 1
          fi
