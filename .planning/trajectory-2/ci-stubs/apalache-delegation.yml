# [trajectory-2 stub] apalache-delegation gate (DelegationDepthBound TLA+)
#
# Copy to .github/workflows/apalache-delegation.yml as part of the
# M04.P4 wave-opener. Runs `apalache-mc check` over
# formal/tla/DelegationDepthBound.tla; failing traces land at
# formal/tla/counterexamples/<sha>.tla per EXECUTION-BOARD section 7.
#
# Activated by: M04.P4.T2 (DelegationDepthBound TLA+ module proven and
# gated).
# Disposition: required on PRs that touch capability or delegation
# crates (crates/chio-core-types/src/capability*.rs,
# crates/chio-kernel/src/delegation*.rs) or formal/tla/**.
#
# Pre-reqs not yet satisfied at stub time:
#   - formal/tla/DelegationDepthBound.tla and matching .cfg exist.
#   - tools/install-apalache.sh handles the trajectory-2 pin (matches the
#     trajectory-1 0.50.x pin until M04.P4 bumps it).

name: apalache-delegation [trajectory-2 stub]

on:
  pull_request:
    paths:
      - "crates/chio-core-types/src/capability**"
      - "crates/chio-kernel/src/delegation**"
      - "crates/chio-credentials/**"
      - "formal/tla/**"
      - ".github/workflows/apalache-delegation.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apalache-delegation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apalache-delegation:
    name: apalache-delegation (DelegationDepthBound)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install Java runtime (apalache-mc requires Java 17+)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Apalache (pinned)
        shell: bash
        run: |
          set -euo pipefail
          ./tools/install-apalache.sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Confirm apalache-mc on PATH
        run: |
          command -v apalache-mc
          apalache-mc version || true
      - name: Apalache check DelegationDepthBound
        shell: bash
        run: |
          set -euo pipefail
          apalache-mc check \
            --length=8 \
            --config=formal/tla/DelegationDepthBound.cfg \
            formal/tla/DelegationDepthBound.tla
      - name: Verify counterexample drawer is clean
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G "formal/tla/counterexamples/*.tla" > /dev/null; then
            echo "Open TLA+ counterexamples present; failing closed." >&2
            ls formal/tla/counterexamples/*.tla
            exit 1
          fi
