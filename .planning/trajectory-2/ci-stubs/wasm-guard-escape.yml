# [trajectory-2 stub] wasm-guard-escape nightly libFuzzer lane
#
# Copy to .github/workflows/wasm-guard-escape.yml as part of the M05.P3
# wave-opener. Nightly libFuzzer run against the chio-wasm-guards escape
# surface (see crates/chio-wasm-guards/fuzz/). Escape-class panics trip
# the P0 incident path described in EXECUTION-BOARD section 7.
#
# Activated by: M05.P3.T1 (libFuzzer lane against the escape surface).
# Disposition: nightly only; advisory on dashboards but escape-class
# crashes file an incident under crates/chio-wasm-guards/incidents/ via
# scripts/file-wasm-guard-incident.sh (lands with M05.P3.T3).
#
# Pre-reqs not yet satisfied at stub time:
#   - crates/chio-wasm-guards/fuzz/fuzz_targets/escape_surface.rs exists.
#   - scripts/file-wasm-guard-incident.sh exists (M05.P3.T3).

name: wasm-guard-escape [trajectory-2 stub]

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "libFuzzer wall budget per target"
        required: false
        default: "1800"

permissions:
  contents: read
  issues: write

concurrency:
  group: wasm-guard-escape
  cancel-in-progress: false

jobs:
  wasm-guard-escape:
    name: wasm-guard-escape (libFuzzer nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Install Rust nightly toolchain (required by cargo-fuzz)
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Verify shared 30-day fuzz budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-fuzz-budget.sh "${{ github.repository }}"
      - name: Run libFuzzer escape-surface lane
        env:
          DURATION: ${{ inputs.duration_seconds || '1800' }}
        run: |
          set -euo pipefail
          cd crates/chio-wasm-guards
          cargo fuzz run escape_surface -- \
            -max_total_time="${DURATION}" \
            -timeout=25 \
            -rss_limit_mb=2048 \
            -print_final_stats=1
      - name: File incident on escape-class crash
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/file-wasm-guard-incident.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wasm-guard-escape-corpus-${{ github.run_id }}
          path: crates/chio-wasm-guards/fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 30
