# [trajectory-2 stub] adversarial-suite gate
#
# Copy to .github/workflows/adversarial-suite.yml as part of the M05.P1
# wave-opener. Runs the M05 adversarial corpus (one JSON case per attack
# class under crates/chio-adversarial-suite/cases/) against the live
# kernel-core + attest-verify path and fails closed on any
# DENY-expected -> ALLOW divergence.
#
# Activated by: M05.P1.T1 (chio-adversarial-suite crate scaffolded with
# corpus runner + replay harness).
# Disposition: required on every PR that touches crates/chio-kernel-core/**
# or crates/chio-attest-verify/**; advisory on push-to-main (artifact only).
#
# Pre-reqs not yet satisfied at stub time:
#   - crates/chio-adversarial-suite/ exists in workspace.
#   - corpus replayer binary `chio-adversarial-replay` is built by that crate.

name: adversarial-suite [trajectory-2 stub]

on:
  pull_request:
    paths:
      - "crates/chio-kernel-core/**"
      - "crates/chio-attest-verify/**"
      - "crates/chio-adversarial-suite/**"
      - ".github/workflows/adversarial-suite.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adversarial-suite-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  adversarial-suite:
    name: adversarial-suite (DENY-expected fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Build adversarial replayer
        run: cargo build -p chio-adversarial-suite --release --bin chio-adversarial-replay
      - name: Replay every adversarial case (fail on DENY-expected -> ALLOW)
        env:
          CHIO_ADVERSARIAL_CASES: crates/chio-adversarial-suite/cases
          CHIO_ADVERSARIAL_FAIL_CLOSED: "1"
        run: |
          set -euo pipefail
          ./target/release/chio-adversarial-replay \
            --cases "$CHIO_ADVERSARIAL_CASES" \
            --report adversarial-report.json \
            --fail-on deny-to-allow
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: adversarial-suite-report
          path: adversarial-report.json
          retention-days: 30
