# [trajectory-2 stub] m04-freeze-guard required check
#
# Copy to .github/workflows/m04-freeze-guard.yml as part of the M04.P1
# wave-opener. This workflow is the server-side enforcement leg of both
# M04 trust-boundary freezes (CODEOWNERS supplies the review-team leg).
#
# Activated by: M04.P1.T1 (oracle public API ticket) opening the
# m04-revocation-oracle-pivot freeze. The same workflow file also covers
# m04-delegation-pivot (opens later at M04.P3.T1).
#
# Disposition: required on every PR; fail-closed when a non-M04 PR
# touches any frozen path of any active M04 freeze row.
#
# Overlap behaviour (load-bearing):
#   M04 has TWO freeze rows in .planning/trajectory-2/freezes.yml:
#     - m04-revocation-oracle-pivot (P1..P3, ends at M04.P3.T5)
#     - m04-delegation-pivot         (P3..P5, starts at M04.P3.T1)
#   During the M04.P3.T1..M04.P3.T5 window both rows are active. This
#   workflow loads ALL freeze rows whose milestone == M04 and whose
#   start_trigger has merged but end_trigger has not, then UNIONS their
#   path_globs into the frozen-paths set. The union behaviour is
#   recorded canonically by the overlap_with field on each row. Same
#   pattern applies to the M03 P1..P2 overlap when this workflow is
#   reused as m03-freeze-guard.yml (just swap the milestone filter).
#
# Required status check name: m04-freeze-guard / freeze-guard
# Branch ruleset on the trajectory-2 integration branch references this
# name (see WAVE-OPENER-STRATEGY.md section 2.2).
#
# Pre-reqs not yet satisfied at stub time:
#   - .planning/trajectory-2/freezes.yml entries for m04-revocation-oracle-pivot
#     and m04-delegation-pivot are present (already on disk).
#   - scripts/classify-trust-diff.sh exists (carry-over from trajectory-1).
#   - The m04-* freeze rows opt every M04-touching PR title into the
#     `[M04]` / `[M04-bypass]` regime, mirroring trajectory-1 m05.

name: m04-freeze-guard [trajectory-2 stub]

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: m04-freeze-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CHIO_FREEZE_MILESTONE: M04
  CHIO_FREEZE_REGISTER: .planning/trajectory-2/freezes.yml

jobs:
  freeze-guard:
    name: freeze-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head with merge base
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install yq + jq
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL --retry 3 \
            "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64" \
            -o "${HOME}/.local/bin/yq"
          echo "a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7  ${HOME}/.local/bin/yq" | sha256sum -c -
          chmod +x "${HOME}/.local/bin/yq"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          jq --version
          "${HOME}/.local/bin/yq" --version

      - name: Compute changed files
        id: diff
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          merge_base="$(git merge-base "${base_sha}" "${head_sha}")"
          echo "merge_base=${merge_base}" >> "${GITHUB_OUTPUT}"
          echo "merge-base: ${merge_base}"
          git diff --name-only "${merge_base}" "${head_sha}" > changed.txt
          printf 'changed file count: %d\n' "$(wc -l < changed.txt)"
          cat changed.txt

      - name: Resolve active M04 freeze rows (union of overlaps)
        id: rows
        env:
          REGISTER: ${{ env.CHIO_FREEZE_REGISTER }}
          MILESTONE: ${{ env.CHIO_FREEZE_MILESTONE }}
        run: |
          set -euo pipefail
          # Emit one path per line, taking the union of path_globs across
          # ALL freeze rows whose milestone matches and whose state is
          # active (start_trigger merged, end_trigger not merged). At PR
          # check time the workflow does not have wave state, so the
          # conservative posture is to union every row whose milestone
          # matches; M04 ships only two M04 rows, both in scope for the
          # P3 overlap window.
          frozen_paths="$(mktemp)"
          if ! yq -r \
            '.freezes[] | select(.milestone == strenv(MILESTONE)) | .path_globs[]' \
            "${REGISTER}" > "${frozen_paths}"; then
            echo "ERROR: failed to read M04 freeze rows from ${REGISTER}" >&2
            exit 1
          fi
          # Deduplicate (overlap_with may list the same path twice in
          # principle; today the M04 rows do not overlap path-wise).
          sort -u "${frozen_paths}" -o "${frozen_paths}"
          mv "${frozen_paths}" frozen-paths.txt
          printf 'unioned frozen path count: %d\n' "$(wc -l < frozen-paths.txt)"
          cat frozen-paths.txt

      - name: Enforce M04 freeze (union of active rows)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          mapfile -t frozen < frozen-paths.txt
          if ((${#frozen[@]} == 0)); then
            echo "no active M04 frozen paths"
            exit 0
          fi
          touched_frozen=0
          while IFS= read -r path; do
            for pat in "${frozen[@]}"; do
              # Glob-to-regex (gitignore subset). Mirrors trajectory-1
              # m05-freeze-guard.
              regex="$(printf '%s' "${pat}" | sed -e 's|\.|\\.|g' \
                -e 's|\*\*|__DSTAR__|g' -e 's|\*|[^/]*|g' \
                -e 's|__DSTAR__|.*|g')"
              if [[ "${path}" =~ ^${regex}$ ]]; then
                touched_frozen=1
                printf 'TOUCHED FROZEN: %s (matches %s)\n' "${path}" "${pat}"
              fi
            done
          done < changed.txt

          if (( touched_frozen == 1 )); then
            if [[ "${PR_TITLE}" == \[M04\]* ]]; then
              echo "freeze label [M04] present in PR title; allowing in-milestone work"
            elif [[ "${PR_TITLE}" == \[M04-bypass\]* ]]; then
              echo "freeze bypass label [M04-bypass] present in PR title; allowing hotfix path"
              echo "Reminder: hotfix bypass requires @bb-connor review and a Bypass-log entry"
              echo "in .planning/trajectory-2/audits/M04-AUDIT.md."
            else
              echo "ERROR: PR touches M04-frozen paths but title does not begin with [M04] or [M04-bypass]" >&2
              echo "PR title: ${PR_TITLE}" >&2
              echo "Frozen path list (union of m04-revocation-oracle-pivot + m04-delegation-pivot):" >&2
              cat frozen-paths.txt >&2
              exit 1
            fi
          else
            echo "no M04 frozen paths touched"
          fi

      - name: Classify trust-boundary diff
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          MERGE_BASE: ${{ steps.diff.outputs.merge_base }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          diff_file="$(mktemp)"
          git diff --no-color \
            "${MERGE_BASE}" \
            "${HEAD_SHA}" > "${diff_file}"
          label="$(scripts/classify-trust-diff.sh "${diff_file}" || true)"
          printf 'classifier verdict: %s\n' "${label}"
          case "${label}" in
            "trust-boundary/none")
              echo "no trust-boundary path touched; nothing to enforce"
              ;;
            "trust-boundary/cosmetic"|"trust-boundary/substantive")
              has_label="$(printf '%s' "${PR_LABELS}" \
                | jq -r --arg want "${label}" \
                  'any(. == $want)')"
              if [[ "${has_label}" != "true" ]]; then
                echo "ERROR: trust-boundary diff requires PR label: ${label}" >&2
                echo "Add the label and re-run; the orchestrator does not auto-label" >&2
                exit 1
              fi
              echo "label ${label} present on PR"
              ;;
            *)
              echo "ERROR: classifier returned unexpected verdict: ${label}" >&2
              exit 1
              ;;
          esac

# Reusing this workflow for M03, M05, M10:
#   The shape generalizes to every trust-boundary milestone. For
#   m{nn}-freeze-guard.yml, copy this file and:
#     1. Update the workflow `name:` and the env CHIO_FREEZE_MILESTONE.
#     2. Update the [M04] / [M04-bypass] PR-title regex to [Mnn] /
#        [Mnn-bypass].
#     3. Update the audit-doc reference in the bypass message.
#   The "Resolve active rows" step already filters by milestone, so the
#   overlap-union behaviour transfers automatically (M03 has its own
#   P1..P2 overlap between m03-attest-verify-pivot and
#   m03-pq-primitives-pivot, recorded via overlap_with on those rows).
