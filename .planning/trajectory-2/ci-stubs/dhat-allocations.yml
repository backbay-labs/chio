# [trajectory-2 stub] dhat-allocations heap-budget gate
#
# Copy to .github/workflows/dhat-allocations.yml as part of the M06.P5
# wave-opener. Runs the dhat-rs heap profiler over the kernel hot path
# benchmarks and fails closed if total bytes-allocated or peak resident
# bytes exceed the budget recorded at bench/dhat-budget.toml.
#
# Activated by: M06.P5.T1 (dhat heap-budget gate; baseline + threshold
# committed).
# Disposition: required on every PR. Hot-path drift is a regression
# even when latency does not move.
#
# Pre-reqs not yet satisfied at stub time:
#   - bench/dhat-budget.toml exists with budget table per benchmark.
#   - crates/chio-bench-dhat/ houses the dhat-instrumented harnesses.
#   - scripts/check-dhat-allocations.sh enforces the budget.

name: dhat-allocations [trajectory-2 stub]

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dhat-allocations-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dhat-allocations:
    name: dhat-allocations (heap-budget gate)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Build dhat-instrumented harnesses
        env:
          RUSTFLAGS: "-C debuginfo=1"
        run: cargo build -p chio-bench-dhat --release --features dhat-heap
      - name: Run dhat allocation profiles
        run: |
          set -euo pipefail
          mkdir -p target/dhat
          ./target/release/chio-bench-dhat \
            --output target/dhat \
            --emit json
      - name: Enforce heap-allocation budget
        env:
          CHIO_DHAT_BUDGET: bench/dhat-budget.toml
          CHIO_DHAT_REPORT_DIR: target/dhat
          CHIO_DHAT_FAIL_CLOSED: "1"
        run: bash scripts/check-dhat-allocations.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dhat-allocations-${{ github.run_id }}
          path: target/dhat
          retention-days: 30
