# [trajectory-2 stub] threat-model-coverage gate
#
# Copy to .github/workflows/threat-model-coverage.yml as part of the
# M05.P5 wave-opener. The gate parses spec/security/chio-threat-model.v1.json
# and asserts that every threat ID has at least one green test attached
# (test linkage is recorded in the registry's `coverage:` block, owned by
# the M05 adversarial-suite + producer milestones M03/M04/M10).
#
# Activated by: M05.P5.T1 (threat-model-coverage gate wired as required
# on every PR; coverage = 100% required to merge).
# Disposition: required on every PR. Fail-closed: any threat ID missing
# a green test fails the gate.
#
# Pre-reqs not yet satisfied at stub time:
#   - spec/security/chio-threat-model.v1.json exists and carries a
#     `coverage:` block per row.
#   - scripts/check-threat-model-coverage.sh exists (lands with M05.P5.T2).

name: threat-model-coverage [trajectory-2 stub]

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: threat-model-coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  threat-model-coverage:
    name: threat-model-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install jq (registry parser)
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Build adversarial harness binaries
        run: |
          set -euo pipefail
          cargo build -p chio-adversarial-suite --release
          cargo test -p chio-adversarial-suite --release --no-run
      - name: Verify every threat ID has a green test
        env:
          CHIO_THREAT_MODEL: spec/security/chio-threat-model.v1.json
          CHIO_COVERAGE_FAIL_CLOSED: "1"
        run: bash scripts/check-threat-model-coverage.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: threat-model-coverage-report
          path: target/threat-model-coverage/
          if-no-files-found: ignore
          retention-days: 14
