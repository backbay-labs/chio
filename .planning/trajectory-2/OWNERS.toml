# trajectory-2 ownership manifest.
#
# Single-owner trajectory: every milestone reviewer is `@bb-connor`.
# This file records:
#   1. Per-milestone path globs that the orchestrator uses to route tickets
#      and to seed CODEOWNERS for trust-boundary freezes.
#   2. The agent_role hint per milestone (informational; the per-ticket
#      `agent_role` field in tickets/M{nn}/P{n}.yml is authoritative).
#   3. Trust-boundary status (drives security x2 review and freeze rules
#      in freezes.yml).
#
# Format mirrors trajectory-1 OWNERS.toml. Schema is informal; CI does not
# validate this file, but the orchestrator reads it to assign tickets.

trajectory = "trajectory-2"
genesis = "2026-04-29"
single_owner = "@bb-connor"

# ---- Per-milestone records ----

