# ---- Path overlaps requiring orchestrator coordination ----

[overlaps]
"crates/chio-cli/src/cli/" = ["M01", "M07", "M08", "M09", "M10"]
"crates/chio-attest-verify/src/" = ["M03", "M05", "M09", "M10"]
"crates/chio-credentials/src/" = ["M04", "M10"]
"crates/chio-kernel/src/" = ["M04", "M06", "M09", "M10"]
"crates/chio-core-types/src/" = ["M03", "M06"]
"sdks/typescript/packages/" = ["M07", "M10"]

# Orchestrator uses [overlaps] to require explicit ordering when two
# milestones in the same wave touch the same prefix. M01 owns the dispatch
# CLI surface; later milestones additively register subcommands.
