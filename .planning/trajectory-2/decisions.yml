  # ---- M01 ----

  - id: D05
    milestone: M01
    title: "URN scheme: urn:chio:error:<domain>:<code>"
    resolved_on: 2026-04-29
    resolved_by: "M01 authoring agent"
    decision: "Error codes use `urn:chio:error:<domain>:<code>` URN scheme. Numeric `CHIOxxxx` form is the human-display alias rendered by miette diagnostics."
    rationale: "URN form is stable across SDK languages and embeddable in JSON-RPC error payloads. CHIOxxxx alias preserves the user-mental-model the round-2 DX agent argued for."
    alternatives_rejected:
      - "Pure numeric CHIOxxxx without URN substrate (loses domain encoding)"
      - "ruff-style ABCDE (no domain encoding; not URN-shaped)"
    consequences:
      - "Every Err carries both `urn` and a CHIO-numeric alias derived deterministically from a registry lookup."
    superseded_by: null

