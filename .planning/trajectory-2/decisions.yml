# trajectory-2 decisions register.
#
# Locked design decisions per milestone. Once authored, each decision is
# binding for the trajectory; reopening requires an explicit amendment
# committed to this file with a `superseded_by` reference.
#
# Schema (informal):
#   id: D{NN} per-trajectory unique
#   milestone: M{NN} or "trajectory" for cross-cutting
#   title: one-line summary
#   resolved_on: date
#   resolved_by: "@handle" or "ten-agent debate (round 2)"
#   decision: short prose statement
#   rationale: why this choice; cite evidence
#   alternatives_rejected: list of alternatives considered and rejected
#   consequences: downstream effects this commits to
#   superseded_by: null or D{NN} reference

decisions:

  # ---- Trajectory-wide decisions (resolved during the round-2 debate) ----

  - id: D01
    milestone: trajectory
    title: "Bundle vs unbundle milestone surfaces"
    resolved_on: 2026-04-29
    resolved_by: "round-2 debate synthesis"
    decision: "Bundle. Several milestones collapse 2-4 round-2 proposals into one shippable surface."
    rationale: "trajectory-1 enforced single-lens-per-milestone; trajectory-2 prefers shipping coherent surfaces over slicing them across waves. Each bundled milestone delivers a single user-visible capability."
    alternatives_rejected:
      - "Single-lens discipline (trajectory-1 model) producing ~22 narrower milestones"
    consequences:
      - "M01 includes error registry + chio doctor + LSP rather than three milestones."
      - "M03 includes PQ + TEE quote rather than two milestones."
      - "M05 includes adversarial + escape + threat-model rather than three milestones."
      - "Larger ticket counts per milestone (29-38) offset by clearer end-to-end demos."
    superseded_by: null

  - id: D02
    milestone: trajectory
    title: "M08 (chio-arena) ships before M09 (economic layer)"
    resolved_on: 2026-04-29
    resolved_by: "round-2 debate synthesis"
    decision: "M08 sequences before M09 within Wave 3 -> Wave 4."
    rationale: "Arena-generated adversarial corpora feed reputation-weighted guard marketplace in M09; reverse order would force M09 to ship without adversarial signal."
    alternatives_rejected:
      - "M09 first, M08 second (reputation has no adversarial input)"
      - "M08 and M09 in the same wave (file-ownership overlaps in chio-cli too contentious)"
    consequences:
      - "M09 reputation phase reads from M08 leaderboard outputs."
    superseded_by: null

  - id: D03
    milestone: trajectory
    title: "Wildcard V02 (chio-zk-verify) and V07 (chio-mesh) out of trajectory-2 scope"
    resolved_on: 2026-04-29
    resolved_by: "round-2 debate synthesis"
    decision: "Both items are out of scope for trajectory-2 and penciled for the post-trajectory-2 review."
    rationale: "ZK verifier needs the canonical-JSON encoding and receipt provenance to be in-place for at least one trajectory-cycle of stability before locking a circuit. Mesh consensus is newly tractable thanks to M04 determinism slashing predicate but premature without federation having real users."
    alternatives_rejected:
      - "Replace M09 lineage half with a chio-zk-verify milestone"
      - "Add chio-mesh as M11 in trajectory-2"
    consequences:
      - "Both items remain in the round-2 debate output and can be promoted in the next trajectory."
    superseded_by: null

