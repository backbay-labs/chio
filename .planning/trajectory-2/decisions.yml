  - id: D09
    milestone: M03
    title: "No KEM (Kyber) in trajectory-2"
    resolved_on: 2026-04-29
    resolved_by: "round-2 security agent + M03 authoring agent"
    decision: "Kyber / ML-KEM is out of scope. Transport is already TLS; PQ migration focuses on signature non-repudiation, which is the long-tail risk."
    rationale: "Receipts have multi-year retention; harvested signatures are the harvest-now-decrypt-later threat. Transport keys rotate quickly enough that PQ KEM is lower priority."
    alternatives_rejected:
      - "Hybrid TLS with Kyber"
    consequences:
      - "TEE quote backends pin a TLS profile but do not require PQ KEM."
    superseded_by: null

  - id: D10
    milestone: M03
    title: "TEE quote backends: TDX + SEV-SNP + Nitro NSM"
    resolved_on: 2026-04-29
    resolved_by: "M03 authoring agent"
    decision: "Three backends in P3-P4: Intel TDX DCAP, AMD SEV-SNP VLEK/VCEK, AWS Nitro NSM."
    rationale: "Covers the major hosted-TEE surfaces. Apple SEP deferred (Wildcard suggested it; small per-device user surface, larger engineering cost than the rest combined)."
    alternatives_rejected:
      - "Apple SEP in this milestone"
      - "Intel SGX (legacy; superseded by TDX)"
    consequences:
      - "QuoteVerifier trait is shaped for the three above; SEP can be added as a fourth backend without a breaking change."
    superseded_by: null

