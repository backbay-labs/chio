  - id: D15
    milestone: M06
    title: "Drop-oldest only at OTEL boundary; signing channel stays backpressured-block"
    resolved_on: 2026-04-29
    resolved_by: "M06 authoring agent"
    decision: "OTEL exporter uses bounded mpsc with drop-oldest. Signing mpsc uses bounded backpressured blocking (sender awaits)."
    rationale: "Receipt signing is a correctness boundary; dropping a receipt drops a kernel verdict. OTEL is observability and may drop. Different policies per channel."
    alternatives_rejected:
      - "Drop-oldest everywhere"
      - "Backpressured-block everywhere"
    consequences:
      - "Two distinct mpsc shapes; drop counters surface only on OTEL."
    superseded_by: null

