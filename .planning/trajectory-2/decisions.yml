  # ---- Cross-cutting (post-cold-reader triage) ----

  - id: D25
    milestone: trajectory
    title: "Domain enum extension story: M01 seeds eighteen domains; downstream milestones contribute codes only"
    resolved_on: 2026-04-29
    resolved_by: "cross-cutting triage (BLOCKER B1) + M01 + M09/M10 authoring agents"
    decision: "M01.P1.T2 ships the `Domain` Rust enum with eighteen variants seeded up front: ten core (capability, policy, guard, attest, replay, provider, manifest, kernel, transport, cli) plus eight reserved for downstream milestones (delegation for M04, adversarial and threat for M05, arena for M08, economy and lineage for M09, custody and weights for M10). The enum is `#[non_exhaustive]` so future trajectories can extend it without a workspace-clippy break, but downstream trajectory-2 milestones contribute codes under existing domains, not new domains. Adding a new domain in trajectory-2 requires editing the M01 enum and regenerating `error_codes.rs`; this is intentionally friction-laden so the registry surface remains stable."
    rationale: "Cold-reader BLOCKER flagged the enum extension story as undefined: M01 originally listed ten domains while M10 P1.T6 introduces `urn:chio:error:custody:*` codes (a new `custody` domain) and M05 P3-P4 implies a `threat` shape. Picking the widen-up-front option preserves M01's authority over the registry shape, keeps the `Domain` enum closed enough for `unwrap_used = deny` to give clean compile errors on missing variants, and lets every downstream milestone add codes via single-file YAML edits without touching the chio-errors crate. The alternative (registry-driven extension API at M01 P1) was rejected as scope creep into M01 P1; M01's lens is single-DX, not codegen extensibility."
    alternatives_rejected:
      - "Closed enum with only the original ten domains (forces every downstream milestone into a breaking-change PR through chio-errors)"
      - "Registry-driven extension API at M01 P1 (downstream milestones author Domain via registry-only edits with no enum constraint; rejected because it widens M01 P1 by 1-2 tickets and undermines the typed-enum surface SDKs codegen against)"
      - "Open string-typed Domain (loses compile-time exhaustiveness; rejected as anti-pattern under workspace clippy regime)"
    consequences:
      - "M01 P1.T1 seeds ~40 codes spread across all eighteen domains; the eight downstream-reserved domains carry one or two seed entries each so the schema validates non-empty domain partitions on day one."
      - "M04 contributes codes under `delegation`; M05 contributes under `adversarial` and `threat`; M08 contributes under `arena`; M09 contributes under `economy` and `lineage`; M10 contributes under `custody` and `weights`. Each contribution is a registry-YAML edit plus a regenerated `error_codes.rs`."
      - "The `non_exhaustive` attribute prevents downstream consumers from pattern-matching exhaustively without a wildcard arm; this is the documented price of the choice."
    superseded_by: null

  - id: D26
    milestone: M09
    title: "D21 dormant-crate list: chio-mercury, chio-mercury-core, chio-anchor scope clarified"
    resolved_on: 2026-04-29
    resolved_by: "cross-cutting triage (cold-reader M09 finding 1)"
    decision: "D21 enumerates the dormant economic crates by family (`chio-credit`, `chio-settle`, `chio-reputation`, `chio-underwriting`, `chio-appraisal`) plus the indirect-consumption crates (`chio-mercury`, `chio-mercury-core`, `chio-anchor`). Phases P1-P4 directly activate the first family; `chio-mercury` and `chio-mercury-core` are awakened transitively as dependencies of `chio-settle` (existing one caller in the workspace today), and `chio-anchor` is consumed by P5.T6 lineage anchor-pinning. No dedicated activation phase is added; the indirect activation is documented in the M09 narrative cross-milestone interactions block so the orchestrator does not flag dormant-crate drift."
    rationale: "D21 reads as an activation list, but `chio-mercury` and `chio-mercury-core` are settlement-routing helpers consumed by `chio-settle` (via the existing `chio-mercury-core` import in `chio-settle/src/`); waking `chio-settle` necessarily exercises them. `chio-anchor` is consumed at P5.T6 via the trajectory-1 M10 anchored-root corpus path. Adding three new activation phases would dilute the crate-per-phase shape; documenting transitive activation is the lower-cost fix."
    alternatives_rejected:
      - "Drop chio-mercury, chio-mercury-core, chio-anchor from D21 (loses the explicit no-new-crates accounting D21 establishes)"
      - "Add a dedicated P6 activation phase for the three indirect crates (1-2 tickets; rejected because the phases already exercise the surfaces transitively)"
    consequences:
      - "M09 narrative explicitly notes that chio-mercury and chio-mercury-core wake transitively through chio-settle activation in P2, and chio-anchor wakes via lineage anchor-pinning in P5.T6."
      - "Audit doc records transitive-caller counts for the three indirect crates so the no-new-crates discipline stays observable."
    superseded_by: null
