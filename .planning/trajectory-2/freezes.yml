# trajectory-2 freeze register.
#
# Trust-boundary milestones (M03, M04, M05, M10) impose path-scoped freezes
# during their pivot phases. While a freeze is active, only its owning
# milestone may write to the listed paths. All other PRs touching the
# paths are auto-rejected by the trajectory-2 orchestrator and the
# `m{nn}-freeze-guard` GitHub required-check.
#
# Hot-fix bypass: branches matching `hotfix/*` with the `[trajectory-2]`
# label may merge with a documented single-reviewer override. The audit
# doc for the affected milestone records the override.
#
# Schema (informal):
#   id: stable freeze id
#   milestone: M{NN}
#   phases: list of phase ids that scope the freeze window
#   path_globs: list of paths the freeze covers
#   start_trigger: ticket id whose merge opens the freeze
#   end_trigger: ticket id whose merge closes the freeze
#   trust_boundary: boolean
#   guard_check: GitHub required-check name
#   bypass_lane: branch pattern + label combination
#   overlap_with: optional list of {id, phases} entries for sibling freezes
#     that are simultaneously active during the listed phases. The
#     m{nn}-freeze-guard workflow unions the path_globs of all entries
#     whose overlap window intersects the PR's target phase.

freezes:
  - id: m03-attest-verify-pivot
    milestone: M03
    phases: [P1, P2, P3]
    path_globs:
      - crates/chio-attest-verify/src/**
    start_trigger: M03.P1.T1
    end_trigger: M03.P3.T5
    trust_boundary: true
    guard_check: m03-freeze-guard
    bypass_lane: "hotfix/* + [trajectory-2]"
    overlap_with:
      - id: m03-pq-primitives-pivot
        phases: [P1, P2]
    rationale: "chio-attest-verify is the verifier choke-point; PQ + TEE quote work must not race other contributors."

  - id: m03-pq-primitives-pivot
    milestone: M03
    phases: [P1, P2]
    path_globs:
      - crates/chio-core/src/signature*.rs
      - crates/chio-core/tests/pq_kats.rs
      - crates/chio-core-types/src/canonical*.rs
    start_trigger: M03.P1.T1
    end_trigger: M03.P2.T6
    trust_boundary: true
    guard_check: m03-freeze-guard
    bypass_lane: "hotfix/* + [trajectory-2]"
    overlap_with:
      - id: m03-attest-verify-pivot
        phases: [P1, P2]
    rationale: "Hybrid Signature variant + canonical-JSON encoding deltas land atomically."

  - id: m04-revocation-oracle-pivot
    milestone: M04
    phases: [P1, P2, P3]
    path_globs:
      - crates/chio-revocation-oracle/**
      - crates/chio-credentials/src/revocation*.rs
      - crates/chio-federation/src/revocation*.rs
    start_trigger: M04.P1.T1
    end_trigger: M04.P3.T5
    trust_boundary: true
    guard_check: m04-freeze-guard
    bypass_lane: "hotfix/* + [trajectory-2]"
    overlap_with:
      - id: m04-delegation-pivot
        phases: [P3]
    rationale: "Sub-second revocation propagation requires unified ownership of the oracle surface during P1-P3."

  - id: m04-delegation-pivot
    milestone: M04
    phases: [P3, P4, P5]
    path_globs:
      - crates/chio-core-types/src/capability*.rs
      - crates/chio-kernel/src/delegation*.rs
      - formal/lean4/Chio/Capability/Delegation.lean
      - formal/tla/DelegationDepthBound.tla
    start_trigger: M04.P3.T1
    end_trigger: M04.P5.T5
    trust_boundary: true
    guard_check: m04-freeze-guard
    bypass_lane: "hotfix/* + [trajectory-2]"
    overlap_with:
      - id: m04-revocation-oracle-pivot
        phases: [P3]
    rationale: "Capability::Delegate variant + Lean theorems + Apalache model land as one trust boundary."

  - id: m05-adversarial-corpus-pivot
    milestone: M05
    phases: [P1, P2, P3, P4, P5]
    path_globs:
      - crates/chio-adversarial-suite/**
      - fuzz/fuzz_targets/wasm_guard_escape.rs
      - crates/chio-wasm-guards/tests/escape/**
      - crates/chio-attest-verify/src/policy.rs
      - spec/security/chio-threat-model.v1.json
      - crates/chio-conformance/tests/threats/**
    start_trigger: M05.P1.T1
    end_trigger: M05.P5.T6
    trust_boundary: true
    guard_check: m05-freeze-guard
    bypass_lane: "hotfix/* + [trajectory-2]"
    rationale: "Threat-model registry + adversarial corpus + escape suite + expected_identity policy land atomically."

  - id: m10-custody-issuer-pivot
    milestone: M10
    phases: [P1, P2, P3]
    path_globs:
      - crates/chio-custody-hw/**
      - sdks/typescript/packages/passkey/src/**
    start_trigger: M10.P1.T1
    end_trigger: M10.P3.T5
    trust_boundary: true
    guard_check: m10-freeze-guard
    bypass_lane: "hotfix/* + [trajectory-2]"
    rationale: "Issuer service + audience-pinned capability envelope are the M08.P3 (trajectory-1) verdict response; must ship coherently."

# Cross-freeze ordering and overlap invariants:
#
# Overlap windows (both freezes simultaneously active; m{nn}-freeze-guard
# unions the path_globs of all listed rows for the duration of the overlap):
#   - M03 P1..P2: m03-attest-verify-pivot AND m03-pq-primitives-pivot are
#     both active. The m03-freeze-guard required-check unions
#     `crates/chio-attest-verify/src/**` with
#     `crates/chio-core/src/signature*.rs`,
#     `crates/chio-core/tests/pq_kats.rs`, and
#     `crates/chio-core-types/src/canonical*.rs`. M03 P3 keeps only
#     m03-attest-verify-pivot active (PQ primitives close at M03.P2.T6).
#     The overlap is recorded on each row via the `overlap_with` field.
#   - M04 P3: m04-revocation-oracle-pivot is in its final phase
#     (end_trigger M04.P3.T5) AND m04-delegation-pivot has just opened
#     (start_trigger M04.P3.T1). For the M04.P3.T1..M04.P3.T5 window,
#     both freezes are active; the m04-freeze-guard required-check
#     unions `crates/chio-revocation-oracle/**`,
#     `crates/chio-credentials/src/revocation*.rs`,
#     `crates/chio-federation/src/revocation*.rs` with
#     `crates/chio-core-types/src/capability*.rs`,
#     `crates/chio-kernel/src/delegation*.rs`,
#     `formal/lean4/Chio/Capability/Delegation.lean`, and
#     `formal/tla/DelegationDepthBound.tla`. The overlap is recorded on
#     each row via the `overlap_with` field. Both freezes share the
#     same milestone owner (M04), so the union is enforced against
#     non-M04 PRs only.
#
# Ordering invariants (one freeze closes before another's trigger fires):
#   - m03-attest-verify-pivot must close before m04-revocation-oracle-pivot's
#     end_trigger so that revocation roots can be PQ-signed. The carrying
#     soft_dep lives on M04.P1.T3 (per-epoch signed root) and references
#     the M03 chio-attest-verify PQ-hybrid signing surface; the M03 surface
#     concretizes in M03.P2 (HybridBackend integration).
#   - m05-adversarial-corpus-pivot's `crates/chio-attest-verify/src/policy.rs`
#     overlap with m03-attest-verify-pivot is sequenced: M05.P4 lands AFTER
#     M03.P3 closes. (Sequenced overlap, not simultaneous; not recorded
#     via `overlap_with`.)
#   - m10-custody-issuer-pivot opens AFTER m03 + m04 close so the issuer
#     can sign via M03 hybrid surface and revoke via M04 oracle.
