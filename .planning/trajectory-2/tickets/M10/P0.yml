# M10 Phase 0 - Wave-opener Cargo.lock bump, audit-doc seeding, and threat-model rows.
# Source of truth: .planning/trajectory-2/10-hardware-custody-and-model-cards.md
# (P0 section). Phase 0 pins WebAuthn / passkey crates the rest of the
# milestone consumes; no behaviour change ships in this phase.
#
# Wave: W4 (capstone). Branch prefix `wave/W4/m10/`. Trust-boundary
# milestone: every PR carries security x2 review (two independent LLM
# reviewer instances with different seeds and no shared scratchpad), in
# addition to the human-side reviewer @bb-connor.
#
# Hard precondition: docs/trust-boundary-browser-signing.md must remain
# in `rejected` state. M10 does NOT re-litigate the verdict; it satisfies
# the verdict's section 5 follow-on criteria.
#
# All P0 tickets touch root `Cargo.toml` and `Cargo.lock`; the orchestrator
# must serialize them via `shared_paths`.

- id: M10.P0.T1
  milestone: M10
  phase: 0
  title: Pin webauthn-rs, webauthn-rs-proto, base64ct in workspace Cargo.toml
  status: pending
  effort_days: 1
  owner_glob:
    - Cargo.toml
  shared_paths:
    - Cargo.toml
    - Cargo.lock
  depends_on: []
  soft_deps:
    - "Re-check crates.io for current latest patch versions on the day P0 opens before pasting the pin set."
    - "coset is already pinned by trajectory-2 M03.P0.T1; reused not re-pinned."
  gate_check:
    cmd: grep -q '^webauthn-rs' Cargo.toml && grep -q '^webauthn-rs-proto' Cargo.toml && grep -q '^base64ct' Cargo.toml && cargo metadata --format-version 1 --no-deps >/dev/null
    timeout_seconds: 900
  worktree_branch: wave/W4/m10/p0.t1-pin-webauthn-and-base64ct
  agent_role: crypto-rust
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

