# M10 Phase 2 - Capability minting via M03 HybridBackend, replay-attack
# resistance, and revocation cascade through M04 oracle.
# Source of truth: .planning/trajectory-2/10-hardware-custody-and-model-cards.md
# (P2 section).
#
# Wave: W4. Branch prefix `wave/W4/m10/`. Trust-boundary milestone: every
# PR carries security x2 review.
#
# CROSS-MILESTONE GATES:
# - P2.T1 hard-depends on trajectory-2 M03.P2.T2 (HybridBackend) merging.
#   Tracked as soft_dep in YAML (cross-trajectory-2 hard deps go through
#   the orchestrator's multi-milestone scheduler) but the gate command
#   imports from chio-core-types features `pq` so a missing M03 surface
#   surfaces as a build failure rather than silent classical fallback.
# - P2.T3 hard-depends on trajectory-2 M04.P3 (chio-revocation-oracle
#   sparse-Merkle surface). Same orchestrator-level handling.
#
# Cryptographic density: P2.T1 and P2.T3 are 2-day tickets per the
# synthesis-brief target (custody P1-P3 average 2 days each).

- id: M10.P2.T1
  milestone: M10
  phase: 2
  title: Wire M03 HybridBackend into issuer mint_capability path under crypto_floor policy
  status: merged
  effort_days: 2
  owner_glob:
    - crates/chio-custody-hw/src/issuer.rs
    - crates/chio-custody-hw/src/mint.rs
    - crates/chio-custody-hw/tests/mint_signed.rs
  shared_paths: []
  depends_on:
    - M10.P1.T4
  soft_deps:
    - "trajectory-2 M03.P2.T2 HybridBackend is the signing surface; M10 does not fork."
    - "crypto_floor=allow_classical preserves byte-identity with classical signatures."
  gate_check:
    cmd: cargo test -p chio-custody-hw --test mint_signed --quiet && cargo build -p chio-custody-hw --features pq --quiet
    timeout_seconds: 900
  worktree_branch: wave/W4/m10/p2.t1-hybrid-backend-mint-capability
  agent_role: crypto-rust
  review_required:
    - "@bb-connor"
  first_commit_sha: e300e2fdc0ac6a3f3154153179dc0f32f9a15a1a
  merged_sha: null
  opened_ts: null
  merged_ts: null

- id: M10.P2.T2
  milestone: M10
  phase: 2
  title: PasskeyNonceStore trait plus in-memory and SQLite implementations (replay-attack resistance)
  status: merged
  effort_days: 1.5
  owner_glob:
    - crates/chio-custody-hw/src/nonce_store.rs
    - crates/chio-custody-hw/tests/replay_resistance.rs
  shared_paths: []
  depends_on:
    - M10.P2.T1
  soft_deps:
    - "trajectory-1 chio-store-sqlite reused for the durable backing store."
    - "Replay window: nonce store retains entries for `exp + clock_skew` (clock_skew = 30s default). Entries older than that are GC-able by a background sweep; the GC is documented in the rustdoc and tested via a fixture-driven integration test. The retention bound is the capability `exp` (5 minutes fixed per P1.T3), NOT the underlying credential lifetime and NOT an open-ended issuer-side window."
  agent_role: crypto-rust
  review_required:
    - "@bb-connor"
  first_commit_sha: d4eb2768535392341bea89b34f29a681e99f9066
  merged_sha: null
  opened_ts: null
  merged_ts: null

