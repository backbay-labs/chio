# M10 Phase 4 - chio-weights crate, model card schema, cosign bundle helper,
# kernel binding refusal, and arc bind --card CLI subcommand.
# Source of truth: .planning/trajectory-2/10-hardware-custody-and-model-cards.md
# (P4 section).
#
# Wave: W4. Branch prefix `wave/W4/m10/`. Trust-boundary milestone with
# security x2 review on every PR.
#
# Half B of the milestone. If schedule pressure forces a cut per the
# README open-questions resolution, P4-P5 are the half that gets cut and
# the milestone ships at P3 (custody-only). Document any cut decision in
# the audit doc; do not silently descope.

- id: M10.P4.T1
  milestone: M10
  phase: 4
  title: Create chio-weights crate skeleton with workspace registration and forbid-unsafe lints
  status: merged
  effort_days: 1
  owner_glob:
    - crates/chio-weights/Cargo.toml
    - crates/chio-weights/src/lib.rs
  shared_paths:
    - Cargo.toml
    - Cargo.lock
  depends_on:
    - M10.P0.T1
  soft_deps:
    - "Crate-level lints copy chio-attest-verify discipline."
  gate_check:
    cmd: cargo build -p chio-weights --quiet && cargo clippy -p chio-weights -- -D warnings && grep -q 'forbid(unsafe_code)' crates/chio-weights/src/lib.rs && grep -q 'forbid(clippy::unwrap_used)' crates/chio-weights/src/lib.rs
    timeout_seconds: 600
  worktree_branch: wave/W4/m10/p4.t1-weights-crate-skeleton
  agent_role: spec-rust
  review_required:
    - "@bb-connor"
  first_commit_sha: 42693c627e00ece32df6d8b884b85cb41e7a25dc
  merged_sha: null
  opened_ts: null
  merged_ts: null

