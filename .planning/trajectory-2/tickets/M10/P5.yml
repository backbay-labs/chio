  title: Threat-model coverage gate marking passkey_credential_theft, audience_confusion, weights_hash_spoof covered
  status: pending
  effort_days: 1
  owner_glob:
    - spec/security/coverage.yaml
    - .planning/audits/M10-hardware-custody-and-model-cards.md
  shared_paths: []
  depends_on:
    - M10.P2.T4
    - M10.P2.T6
    - M10.P4.T5
    - M10.P5.T2
  soft_deps:
    - "trajectory-2 M05 owns the coverage.yaml shape and the threat-model schema (M05.P5.T1) defines the coverage_state enum {covered, partial, pending}."
    - "passkey_credential_theft and audience_confusion land as coverage_state: covered. weights_hash_spoof lands as coverage_state: partial when chio-providers hash-recompute has not yet landed; the M10 audit doc documents the residual gap and the docs/security/threat-coverage.md report flags it under the Partial heading. If chio-providers hash-recompute lands within the M10 window, weights_hash_spoof flips to covered."
  gate_check:
    cmd: grep -q 'passkey_credential_theft' spec/security/coverage.yaml && grep -q 'audience_confusion' spec/security/coverage.yaml && grep -q 'weights_hash_spoof' spec/security/coverage.yaml
    timeout_seconds: 60
