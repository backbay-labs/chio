# M05 Phase 3 - WASM guard escape harness.
# Source of truth: .planning/trajectory-2/05-adversarial-escape-threat-model.md
# (Phase 3). One new libFuzzer target wasm_guard_escape.rs plus companion
# fixtures at crates/chio-wasm-guards/tests/escape/ covering 25+ escape
# classes. Every escape attempt yields typed GuardError; never panics; never
# escapes linear memory; never exceeds declared imports.
#
# Reuses chio-guard-registry cosign-verified fixtures so escape attempts run
# against signed-but-malicious modules (the grafted-signature class).

- id: M05.P3.T1
  milestone: M05
  phase: 3
  title: Create fuzz/fuzz_targets/wasm_guard_escape.rs and seed corpus with 8 hand-curated seeds
  status: merged
  effort_days: 1.5
  owner_glob:
    - fuzz/fuzz_targets/wasm_guard_escape.rs
    - fuzz/Cargo.toml
    - fuzz/corpus/wasm_guard_escape/**
    - .github/workflows/fuzz.yml
  shared_paths:
    - Cargo.lock
  depends_on:
    - M05.P0.T1
  soft_deps:
    - "trajectory-1 M02.P1.T4 wasm_preinstantiate_validate is the parser-side fuzz target this complements"
  gate_check:
    cmd: cd fuzz && cargo +nightly fuzz build wasm_guard_escape && ls corpus/wasm_guard_escape | wc -l | grep -q '^[ ]*[8-9]\| [1-9][0-9]'
    timeout_seconds: 1200
  worktree_branch: wave/W2/m05/p3.t1-wasm-guard-escape-target-and-seeds
  agent_role: wasm-rust
  review_required:
