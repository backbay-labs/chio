# M05 Phase 5 - Threat-model-as-code.
# Source of truth: .planning/trajectory-2/05-adversarial-escape-threat-model.md
# (Phase 5). spec/security/chio-threat-model.v1.json becomes load-bearing:
# chio-spec-codegen generates one stub test per threat ID under
# crates/chio-conformance/tests/threats/<id>.rs; CI gate threat-model-coverage
# fails the build on uncovered IDs; coverage report published to
# docs/security/threat-coverage.md.

- id: M05.P5.T1
  milestone: M05
  phase: 5
  title: Author chio-threat-model.schema.json with coverage_state enum (covered, partial, pending) validating the v1 threat-model JSON
  status: merged
  effort_days: 1
  owner_glob:
    - spec/security/chio-threat-model.schema.json
    - spec/security/tests/threat_model_schema_test.rs
  shared_paths: []
  depends_on:
    - M05.P0.T1
  soft_deps:
    - "trajectory-1 M01 canonical JSON schema tooling pattern is reused"
    - "Schema MUST include a coverage_state field per threat-id with enum values {covered, partial, pending}. partial is reserved for IDs whose backing test exists but whose attack surface is only partially defended (e.g. M10 P5.T3 weights_hash_spoof when chio-providers hash-recompute is not yet landed); the milestone audit doc for the partial owner documents the residual gap. The threat-model-coverage CI gate (M05.P5.T4) treats partial as PASS but the generated docs/security/threat-coverage.md report flags it under a separate Partial heading."
  gate_check:
    cmd: cargo test -p chio-spec-codegen --test threat_model_schema_test
    timeout_seconds: 600
  worktree_branch: wave/W2/m05/p5.t1-threat-model-schema
  agent_role: spec-rust
  review_required:
    - "@bb-connor"
  first_commit_sha: 6ddb52cf044257ae134c23cd046d2440ee6c5596
  merged_sha: null
  opened_ts: null
  merged_ts: null

