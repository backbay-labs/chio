    - editors/vscode-chio/src/extension.ts
    - editors/vscode-chio/src/lsp_client.ts
    - editors/vscode-chio/language-configuration.json
    - editors/vscode-chio/syntaxes/chio.tmLanguage.json
    - editors/vscode-chio/test/integration.test.ts
  shared_paths: []
  depends_on:
    - M01.P4.T6
  soft_deps: []
  gate_check:
    cmd: "test -f editors/vscode-chio/package.json && cd editors/vscode-chio && npm install --silent && npm run compile && npm test -- --run"
    timeout_seconds: 1500
  worktree_branch: wave/W1/m01/p5.t1-vscode-extension-scaffold
  agent_role: lsp-rust
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

