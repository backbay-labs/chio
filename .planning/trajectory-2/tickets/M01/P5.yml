# M01 Phase 5 - VSCode and Zed editor extensions, snippets, README.
# Source of truth: .planning/trajectory-2/01-error-taxonomy-doctor-lsp.md
# (section "Phases" P5 + "Scope" bullets on editors).
#
# Milestone scope: P5 ships first-party VSCode and Zed extensions that spawn
# the chio-lsp binary from P4, plus a tool-neutral snippet pack at
# editors/snippets/ regenerated into each editor's native format at install
# time. editors/README.md documents the install path, the LSP-binary contract,
# and the snippet set so any third-party editor (Neovim, IntelliJ, Helix) can
# adopt chio-lsp without first-party packaging.
#
# Both extensions ship CI integration tests that spawn a real chio-lsp binary
# and assert urn:chio:error:* diagnostics flow through unchanged.
#
# Regenerate the manifest after edits: `cargo xtask trajectory regen-manifest`.

