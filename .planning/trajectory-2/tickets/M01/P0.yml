# Milestone scope (from .planning/trajectory-2/README.md): M01 lands in Wave 1
# alongside M02 and M06 on `wave/W1/m01/...` worktrees. P0 is the dependency
# wave-opener: it pins miette / tower-lsp / lsp-types / notify in the
