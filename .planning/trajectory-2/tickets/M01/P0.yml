# (chio-guard-registry, chio-attest-verify) must remain green; this milestone
# extends the codegen pipeline and consumes the OCI / cosign verifier surface
# rather than forking either.
#
# M01 is NOT a trust-boundary milestone (developer experience lens), so no
# security x2 review applies; reviewer is the human-side @bb-connor only.
#
# Regenerate the manifest after edits: `cargo xtask trajectory regen-manifest`.

