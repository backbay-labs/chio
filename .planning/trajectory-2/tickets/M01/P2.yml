# M01 Phase 2 - Migrate dispatch.rs and CliError sites to registry codes.
# Source of truth: .planning/trajectory-2/01-error-taxonomy-doctor-lsp.md
# (section "Phases" P2 + the 976-site CliError::Other count under "Hard counts").
#
# Milestone scope: P2 retires the 976 `CliError::Other(format!(...))` call
# sites across crates/chio-cli/src/, crates/chio-control-plane/src/, and
# crates/chio-hosted-mcp/src/ in domain-grouped chunks. Each ticket touches
# one logical domain so the PR diff is reviewable. Per-ticket owner_glob is
# expressed in glob form so the orchestrator can serialize against the
# `crates/chio-control-plane/src/lib.rs` shared file (which hosts the public
# `CliError` enum and is touched by every chunk).
#
# Order chosen to retire the highest-frequency call sites first
# (passport_verifier 83, evidence_export 77, passport 61, certify 44, etc).
#
# P2.T5 closes with a workspace grep gate asserting `CliError::Other` only
# survives inside an explicitly named deprecation shim helper.
#
# CROSS-MILESTONE GATE: M07 per-provider README tables in chio-openai,
# chio-anthropic-tools-adapter, and chio-bedrock-converse-adapter become
# regenerated from the registry in P2.T6 so M07 (trajectory-1) doctests
# remain green against the new source of truth.
#
# Regenerate the manifest after edits: `cargo xtask trajectory regen-manifest`.

- id: M01.P2.T1
  milestone: M01
  phase: 2
  title: Migrate capability and policy domains (passport, passport_verifier, trust_commands)
  status: pending
  effort_days: 1.5
  owner_glob:
    - crates/chio-cli/src/passport.rs
    - crates/chio-cli/src/passport_verifier.rs
    - crates/chio-cli/src/cli/trust_commands.rs
    - crates/chio-control-plane/src/lib.rs
  shared_paths:
    - crates/chio-control-plane/src/lib.rs
  depends_on:
    - M01.P1.T5
  soft_deps: []
  gate_check:
    cmd: "cargo test -p chio-cli --quiet && cargo clippy -p chio-cli -- -D warnings && grep -cE 'CliError::Other' crates/chio-cli/src/passport.rs crates/chio-cli/src/passport_verifier.rs crates/chio-cli/src/cli/trust_commands.rs | awk -F: '{s+=$2} END {exit (s>0)}'"
    timeout_seconds: 1200
  worktree_branch: wave/W1/m01/p2.t1-capability-policy-domain-migration
  agent_role: dx-rust
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

