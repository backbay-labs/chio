# M01 Phase 3 - chio doctor subcommand and probe pack.
# Source of truth: .planning/trajectory-2/01-error-taxonomy-doctor-lsp.md
# (section "Phases" P3 + "Scope" bullets on the five probe classes).
#
# Milestone scope: P3 introduces a `chio doctor` subcommand that probes
# toolchain version, OCI registry reachability, guard bundle cosign signature
# freshness, OTEL endpoint resolution + kernel runtime metrics, and
# `chio.yaml` schema validity. Each probe carries a `urn:chio:error:*` code;
# the subcommand emits plain-text or `--json` output and accepts a `--fix`
# flag that runs idempotent repairs only. Destructive repairs are explicitly
# rejected; the audit doc in P0.T2 enumerates which repairs are allowed.
#
# CROSS-MILESTONE GATE: P3 probes consume trajectory-1 M06 (chio-guard-registry,
# chio-attest-verify), trajectory-1 M05 (chio-tower /metrics), and
# trajectory-1 M10 (chio-otel-receipt-exporter) without forking any of them.
#
# Regenerate the manifest after edits: `cargo xtask trajectory regen-manifest`.

