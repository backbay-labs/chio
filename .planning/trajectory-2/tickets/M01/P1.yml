  status: pending
  effort_days: 1.5
  owner_glob:
    - crates/chio-spec-codegen/src/lib.rs
    - crates/chio-spec-codegen/src/main.rs
    - crates/chio-spec-codegen/src/errors_pass.rs
    - crates/chio-errors/src/_generated/error_codes.rs
    - crates/chio-errors/src/_generated/mod.rs
  shared_paths: []
  depends_on:
    - M01.P1.T2
  soft_deps:
    - "trajectory-1 M01 chio-spec-codegen wire-types pass remains the sibling pass we extend; do not fork the crate"
  gate_check:
    cmd: "cargo run -p chio-spec-codegen --quiet -- --errors-only && grep -q 'DO NOT EDIT' crates/chio-errors/src/_generated/error_codes.rs && cargo build -p chio-errors --quiet && cargo test -p chio-errors --quiet"
    timeout_seconds: 900
  worktree_branch: wave/W1/m01/p1.t3-codegen-errors-pass
  agent_role: spec-rust
