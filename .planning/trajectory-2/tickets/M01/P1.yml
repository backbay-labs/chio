# M01 Phase 1 - chio-errors crate genesis and registry codegen.
# Source of truth: .planning/trajectory-2/01-error-taxonomy-doctor-lsp.md
# (section "Phases" P1 + "Scope" bullets on chio-errors and codegen).
#
# Milestone scope: P1 lands the typed `chio_errors::ChioError` surface, the
# YAML registry at `spec/errors/registry.yaml`, the schema validating it at
# `spec/errors/registry.schema.json`, and a codegen pass in the existing
# `chio-spec-codegen` crate (NOT a fork) that emits
# `crates/chio-errors/src/_generated/error_codes.rs`. The output carries the
# trajectory-1 `// DO NOT EDIT` header and is regenerated by
# `cargo xtask codegen` plus a CI check that fails on drift.
#
# CROSS-MILESTONE GATE: P1.T5 round-trips every registry entry with a
# `jsonrpc_code` against the existing wire-side numeric registry at
# `spec/errors/chio-error-registry.v1.json` so the two surfaces cannot drift.
#
# Regenerate the manifest after edits: `cargo xtask trajectory regen-manifest`.

- id: M01.P1.T1
  milestone: M01
  phase: 1
  title: Author registry.schema.json and seed registry.yaml with ~40 codes across eighteen domains (ten core plus eight reserved for downstream)
  status: pending
  effort_days: 1.5
  owner_glob:
    - spec/errors/registry.yaml
    - spec/errors/registry.schema.json
    - spec/errors/README.md
  shared_paths: []
  depends_on:
    - M01.P0.T2
  soft_deps:
    - "trajectory-1 wire-side numeric registry at spec/errors/chio-error-registry.v1.json must remain stable; this ticket cross-references it via the jsonrpc_code field"
  gate_check:
    cmd: "test -f spec/errors/registry.yaml && test -f spec/errors/registry.schema.json && python3 -c 'import json,yaml,jsonschema;jsonschema.validate(yaml.safe_load(open(\"spec/errors/registry.yaml\")),json.load(open(\"spec/errors/registry.schema.json\")))' && grep -c 'urn:chio:error:' spec/errors/registry.yaml | (read n; test \"$n\" -ge 40)"
    timeout_seconds: 600
  worktree_branch: wave/W1/m01/p1.t1-registry-yaml-and-schema-seed
  agent_role: spec-rust
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

- id: M01.P1.T2
  milestone: M01
  phase: 1
  title: Scaffold crates/chio-errors with Code, Domain, Severity, ChioError, Diagnostic impls
  status: pending
  effort_days: 2
  owner_glob:
    - crates/chio-errors/Cargo.toml
    - crates/chio-errors/src/lib.rs
    - crates/chio-errors/src/code.rs
    - crates/chio-errors/src/domain.rs
    - crates/chio-errors/src/severity.rs
    - crates/chio-errors/src/diagnostic.rs
    - crates/chio-errors/tests/lookup.rs
  shared_paths:
    - Cargo.toml
    - Cargo.lock
  depends_on:
    - M01.P1.T1
  soft_deps:
    - "Domain enum is `#[non_exhaustive]` and lists all eighteen seed variants at P1.T2: ten core (capability, policy, guard, attest, replay, provider, manifest, kernel, transport, cli) plus eight reserved-for-downstream (delegation for M04, adversarial and threat for M05, arena for M08, economy and lineage for M09, custody and weights for M10). Downstream milestones contribute codes under existing domains; new domains require an enum edit plus a regenerated error_codes.rs."
  gate_check:
    cmd: "cargo build -p chio-errors --quiet && cargo test -p chio-errors --quiet && cargo clippy -p chio-errors -- -D warnings && grep -q 'non_exhaustive' crates/chio-errors/src/domain.rs"
    timeout_seconds: 900
  worktree_branch: wave/W1/m01/p1.t2-chio-errors-crate-scaffold
  agent_role: dx-rust
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

- id: M01.P1.T3
  milestone: M01
  phase: 1
