# M01 Phase 4 - chio-lsp server (tower-lsp) and editor diagnostics.
# Source of truth: .planning/trajectory-2/01-error-taxonomy-doctor-lsp.md
# (section "Phases" P4 + "Scope" bullets on chio-lsp).
#
# Milestone scope: P4 ships the tower-lsp server at crates/chio-lsp/ providing
# textDocument completion, hover, go-to-capability-definition, and schema
# validation for chio.yaml, manifest documents, and the guard DSL.
# Diagnostics carry urn:chio:error:* codes via lsp_types::Diagnostic.code so
# the editor extensions in P5 surface registry codes directly. Document cache
# is dashmap-backed and diagnostic refresh is debounced at 150 ms; criterion
# benches at crates/chio-lsp/benches/ assert cold-start p99 < 200 ms and
# steady-state diagnostic latency p99 < 50 ms on a 1k-line chio.yaml.
#
# CROSS-MILESTONE GATE: schemas under spec/schemas/chio-wire/v1/ (trajectory-1
# M01) and the M06 guard-bundle schema are loaded read-only.
#
# Regenerate the manifest after edits: `cargo xtask trajectory regen-manifest`.

- id: M01.P4.T1
  milestone: M01
  phase: 4
  title: Crate scaffold crates/chio-lsp with tower-lsp lifecycle and dashmap document cache
  status: pending
  effort_days: 2
  owner_glob:
    - crates/chio-lsp/Cargo.toml
    - crates/chio-lsp/src/lib.rs
    - crates/chio-lsp/src/main.rs
    - crates/chio-lsp/src/server.rs
    - crates/chio-lsp/src/document.rs
    - crates/chio-lsp/tests/lifecycle.rs
  shared_paths:
    - Cargo.toml
    - Cargo.lock
  depends_on:
    - M01.P3.T6
  soft_deps:
    - "tower-lsp 0.20 pinned in M01.P0.T1"
  gate_check:
    cmd: "cargo build -p chio-lsp --quiet && cargo test -p chio-lsp --test lifecycle && cargo clippy -p chio-lsp -- -D warnings"
    timeout_seconds: 900
  worktree_branch: wave/W1/m01/p4.t1-chio-lsp-scaffold-and-cache
  agent_role: lsp-rust
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

