# M02 Phase 5 - Per-SDK drivers and cross-language diff activation.
# Source of truth: .planning/trajectory-2/02-mutation-and-cross-sdk-differential.md
# (Phase P5 section). Per-SDK drivers (Python, TypeScript, WASM browser
# kernel, Go) plus the cross-language oracle activation that closes the
# loop. Five primary kernels total once landed: Rust + four non-Rust.
#
# JVM, dotnet, lambda, k8s SDKs are explicitly out of scope here per the
# narrative; revisited in M07 (adoption beachhead).
#
# Each driver MUST emit (verdict, reason_code, scope_set) tuples in the
# scenario format spec from M02.P4.T1 and submit them to the diff oracle
# from M02.P4.T4. The drivers themselves are a thin shim over each SDK's
# native kernel call.

- id: M02.P5.T1
  milestone: M02
  phase: 5
  title: Python SDK driver under verdict_matrix/drivers/python
  status: pending
  effort_days: 1.5
  owner_glob:
    - crates/chio-conformance/verdict_matrix/drivers/python/**
    - sdks/python/chio-sdk-python/tests/test_verdict_matrix.py
  shared_paths: []
  depends_on:
    - M02.P4.T5
  soft_deps:
    - "sdks/python/chio-sdk-python is the kernel SDK; driver wraps its public verdict-emitting entrypoint"
  gate_check:
    cmd: test -d crates/chio-conformance/verdict_matrix/drivers/python && test -f crates/chio-conformance/verdict_matrix/drivers/python/run_scenarios.py && cd sdks/python/chio-sdk-python && python -m pytest tests/test_verdict_matrix.py -q
    timeout_seconds: 1200
  worktree_branch: wave/W1/m02/p5.t1-python-sdk-driver
  agent_role: spec-python
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

