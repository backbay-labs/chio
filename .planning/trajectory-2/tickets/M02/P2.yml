# M02 Phase 2 - Targeted test work to raise kill rate to >= 80% per crate.
# Source of truth: .planning/trajectory-2/02-mutation-and-cross-sdk-differential.md
# (Phase P2 section). One ticket per trust-boundary crate; each ticket
# lists the targeted mutant classes pulled from the P1 missed-mutant
# inventory and adds tests to the crate's existing tests/ tree.
#
# These tickets are parallelizable across crates but each must hit the
# >= 80% threshold for two consecutive nightly runs before being
# considered green (per the success criteria in the narrative). The
# gate_check command runs the lane locally on the crate-relevant
# mutation set; the two-consecutive-night requirement is an
# orchestrator-level rule, not a per-ticket cmd.

- id: M02.P2.T1
  milestone: M02
  phase: 2
  title: Add targeted tests to chio-policy to raise mutation kill rate to >= 80 percent
  status: pending
  effort_days: 2
  owner_glob:
    - crates/chio-policy/tests/**
    - crates/chio-policy/mutants.toml
  shared_paths: []
  depends_on:
    - M02.P1.T6
  soft_deps:
    - "trajectory-1 M03 proptest invariants in chio-policy stay green"
  gate_check:
    cmd: cargo test -p chio-policy --quiet && cargo clippy -p chio-policy -- -D warnings
    timeout_seconds: 1200
  worktree_branch: wave/W1/m02/p2.t1-chio-policy-mutation-kills
  agent_role: quality-rust
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

