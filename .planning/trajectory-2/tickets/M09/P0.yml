# (P0 section). Phase 0 pins the lineage helper crates, genesis the new
# chio-lineage crate skeleton, and seeds the audit doc.
#
# Wave: W4 (capstone). M09 depends on trajectory-2 M04
# (revocation oracle), trajectory-2 M06 (CanonicalBytes), trajectory-2 M08
# (arena survival feed), trajectory-1 M05 (async-kernel evaluator/observer
# slot), and trajectory-1 M07 (verdict-equality oracle). Branch prefix
