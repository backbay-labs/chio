# M08 Phase 4 - Co-evolution loop and fitness function.
# Source of truth: .planning/trajectory-2/08-chio-arena-replay-coliseum.md
# (Phase P4 section). Lifts the adversary populations from fixed sets to
# co-evolving populations with a survival-rate fitness function. The
# determinism witness (RNG seed, virtual clock, scenario hash) ensures the
# generation trace is bit-exact reproducible (P4.T6).
#
# CROSS-MILESTONE NOTES:
# - Fitness function (P4.T1) consumes the trajectory-2 M02.P4
#   verdict_matrix harness as the verdict oracle. Hard ticket-level
#   dependency: P4.T1 cannot enter pending until M02.P4.T1 merged_sha is
#   green. Encoded as soft_dep string sentence; the Wave 1 -> Wave 3
#   wave-gate already enforces this (M02 closes before M08 opens).
# - Bounded-budget gate (P4.T5): default 200 generations or 30 minutes
#   wall, fail-closed on exceed. CI runs the 5-minute PR variant; nightly
#   runs the full 30-minute variant.

