# M08 Phase 2 - Multi-agent runtime, virtual clock, seeded RNG,
# deterministic scheduler.
# Source of truth: .planning/trajectory-2/08-chio-arena-replay-coliseum.md
# (Phase P2 section). Lifts the walking skeleton from one agent to N agents
# while preserving bit-exact replay. The determinism gate (P2.T6) is the
# load-bearing exit criterion for the phase.
#
# CROSS-MILESTONE NOTES:
# - The kernel multiplexer (P2.T4) wraps Arc<ChioKernel> directly; M05's
#   async surface must remain stable. Any M05 follow-on PR that re-imposes
#   &mut self on ChioKernel breaks M08 P2. Soft-coupling, not blocking.
# - The determinism gate is Linux-only, mirroring trajectory-1 M04's
#   platform pinning rule. macOS smoke runs read-only.

- id: M08.P2.T1
  milestone: M08
  phase: 2
  title: Implement virtual clock for arena (tokio time-pause harness, no wall-clock reads)
  status: pending
  effort_days: 1.5
  owner_glob:
    - crates/chio-arena/src/runtime.rs
    - crates/chio-arena/src/clock.rs
    - crates/chio-arena/src/lib.rs
    - crates/chio-arena/tests/virtual_clock.rs
  shared_paths: []
  depends_on:
    - M08.P1.T6
  soft_deps: []
  gate_check:
    cmd: cargo test -p chio-arena --test virtual_clock && ! grep -RE 'std::time::SystemTime::now|Instant::now\(\)' crates/chio-arena/src/runtime.rs crates/chio-arena/src/clock.rs
    timeout_seconds: 900
  worktree_branch: wave/W3/m08/p2.t1-virtual-clock-no-wallclock
  agent_role: arena-rust
  review_required:
    - "@bb-connor"
  first_commit_sha: null
