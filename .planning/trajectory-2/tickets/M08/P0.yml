# - Receipt-bundle layout reuses chio_replay_corpus::write_m04_fixture
#   (trajectory-1 M04). The arena does not reimplement the writer.
#
# ANTI-PATTERN GUARD: chio-arena/Cargo.toml MUST NOT depend on any provider
# crate (chio-openai, chio-anthropic-tools-adapter,
# chio-bedrock-converse-adapter). CODEOWNERS gate on the Cargo.toml file
# enforces; verified in the gate_check for P0.T3.
#
# Regenerate the manifest after edits: `cargo xtask trajectory regen-manifest`.

