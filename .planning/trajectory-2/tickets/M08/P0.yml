# M08 Phase 0 - Wave-opener Cargo.lock bump and audit doc.
# Source of truth: .planning/trajectory-2/08-chio-arena-replay-coliseum.md
# (Phase P0 section, "Wave-opener Cargo.lock bump and audit doc"). Wave 3.
#
# Milestone scope: M08 lands in Wave 3 in parallel with M07 on
# `wave/W3/m08/...` worktrees. P0 stages the workspace; P1 lands the
# walking skeleton; P2 lifts to multi-agent; P3 ships adversary classes;
# P4 wires co-evolution; P5 wires auto-promotion + CLI surfaces.
#
# CROSS-MILESTONE NOTES:
# - The verdict oracle for the fitness function (P4.T1) consumes the
#   trajectory-2 M02.P4 verdict_matrix harness. M08 P4 worktrees gate on
#   M02.P4.T1 merged_sha via the Wave-3 sync rule.
