# M08 Phase 3 - Adversary populations (one class per ticket).
# Source of truth: .planning/trajectory-2/08-chio-arena-replay-coliseum.md
# (Phase P3 section). Each adversary class is a self-contained module
# under chio-arena::adversary with a unit test, a reference scenario, and
# a deterministic trigger.
#
# CROSS-MILESTONE NOTES:
# - The replay-attempt class (P3.T4) intersects trajectory-1 M04's
#   replay_attack fixture family. The arena class consumes the family's
#   nonce-reuse patterns; it does not duplicate the fixtures.
# - The scope-superset escape class (P3.T5) intersects trajectory-1 M03
#   capability algebra properties (scope monotonicity); the class triggers
#   the property and asserts fail-closed verdict. M03 properties are the
#   correctness backstop.

