# M08 Phase 1 - chio-arena crate genesis and walking skeleton.
# Source of truth: .planning/trajectory-2/08-chio-arena-replay-coliseum.md
# (Phase P1 section). Lands the scenario DSL, the in-process kernel link
# transport, the single-agent runtime, the receipt-bundle writer, and the
# walking-skeleton end-to-end test that proves bit-exact replay via the
# existing trajectory-1 M04 chio replay engine.
#
# CROSS-MILESTONE NOTES:
# - P1.T5 delegates to chio_replay_corpus::write_m04_fixture (the
#   trajectory-1 M04 receipt-bundle writer). The arena MUST NOT
#   reimplement signature, canonical-JSON, or root-recompute logic.
# - P1.T6's walking-skeleton test runs `chio replay` on the arena's output
#   directory. The chio replay engine is unchanged; if a future change to
#   that engine breaks arena outputs, the bug is on the engine side.

