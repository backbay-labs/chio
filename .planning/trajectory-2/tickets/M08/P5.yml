# M08 Phase 5 - Output plumbing, leaderboard, and CLI surfaces.
# Source of truth: .planning/trajectory-2/08-chio-arena-replay-coliseum.md
# (Phase P5 section). Auto-promotion to two corpora (trajectory-1 M04
# vector corpus and trajectory-2 M05 chio-adversarial-suite), the
# leaderboard renderer, and the three `arc arena` CLI subcommands.
#
# CROSS-MILESTONE NOTES:
# - P5.T1 auto-promotion to M04 fixtures uses the existing CHIO_BLESS gate
#   from trajectory-1 M04 unchanged. The new BLESS_REASON value is
#   `arena:<scenario-id>`. CI cannot bless (CI=true and TTY rules from M04
#   stand). The per-PR cap (default 5) carries forward.
# - P5.T2 auto-promotion to chio-adversarial-suite gates on trajectory-2
#   M05.P0 (suite scaffold). Until M05.P0 is green, P5.T2 writes to
#   target/arena/promote-pending/ and the gate is soft-disabled; this
#   keeps M08 unblocked.
# - The `arc arena replay <scenario-id>` subcommand delegates to the
#   existing trajectory-1 M04 `chio replay` engine; arena does not
#   reimplement signature verification or root recompute.

