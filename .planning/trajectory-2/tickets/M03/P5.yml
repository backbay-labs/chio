# M03 Phase 5 - Cross-cutting integration: PQ + TEE composition (TEE-bound
# PQ key), end-to-end migration suite, M06 CanonicalBytes consumer wiring,
# threat-model coverage gate handshake with M05, and audit-doc final pass.
# Source of truth: .planning/trajectory-2/03-pq-hybrid-and-tee-quote-verifier.md
# (P5 section).
#
# P5 is the milestone-closing phase. Every ticket here depends on at least
# one earlier phase landing; P5.T1 specifically requires both the hybrid
# signing path (P2) and the TDX backend (P3) to be merged. Trust-boundary
# review applies; P5.T1 is the most attack-relevant ticket because it ties
# the kernel signing key roll to a quote verification result.

- id: M03.P5.T1
  milestone: M03
  phase: 5
  title: Kernel boot loads PQ signing key only after self-quote binds expect_report_data classical_pk and receipt_root_genesis
  status: pending
  effort_days: 2
  owner_glob:
    - crates/chio-kernel/src/boot.rs
    - crates/chio-kernel/tests/pq_key_load_after_self_quote.rs
  shared_paths: []
  depends_on:
    - M03.P2.T2
    - M03.P3.T3
  soft_deps:
    - "trajectory-1 M10 chio-tee container is the source of the self-quote bytes."
    - "`receipt_root_genesis` is defined as the Merkle root of the empty receipt tree at boot (the all-zero 32-byte sentinel `[0u8; 32]`); the first signed receipt advances the root, but the genesis-quote binds to the empty tree so the chain has a fixed cryptographic anchor independent of the first receipt's contents."
  gate_check:
    cmd: cargo test -p chio-kernel --features pq --test pq_key_load_after_self_quote
    timeout_seconds: 900
  worktree_branch: wave/W2/m03/p5.t1-tee-bound-pq-key-load
  agent_role: kernel-rust
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

