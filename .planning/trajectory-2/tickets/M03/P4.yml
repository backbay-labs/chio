  title: Cross-backend conformance test rejects mislabelled quotes across TDX SEV-SNP and Nitro
  status: merged
  effort_days: 1
  owner_glob:
    - crates/chio-attest-verify/tests/cross_backend_conformance.rs
  shared_paths: []
  depends_on:
    - M03.P4.T2
    - M03.P4.T4
  soft_deps:
    - "trajectory-2 M05 adversarial suite consumes mislabelled quotes as a class."
    - "Fixture filename convention is mechanical: `tdx_*.bin` only loads in tdx::Backend, `sev_snp_*.bin` only in sev_snp::Backend, `nitro_*.bin` only in nitro::Backend; cross_backend_conformance walks all three fixture trees and asserts each backend rejects (returns AttestError) for fixtures whose prefix does not match its own kind."
  gate_check:
    cmd: "cargo test -p chio-attest-verify --test cross_backend_conformance && find crates/chio-attest-verify/fixtures/quotes -name '*.bin' | grep -qE '/(tdx_|sev_snp_|nitro_)'"
    timeout_seconds: 600
