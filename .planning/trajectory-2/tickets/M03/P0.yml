# M03 Phase 0 - Wave-opener Cargo.lock bump and audit-doc seeding.
# Source of truth: .planning/trajectory-2/03-pq-hybrid-and-tee-quote-verifier.md
# (P0 section). Phase 0 pins the PQ + TEE crates the rest of the milestone
# consumes; no behaviour change ships in this phase.
#
# Wave: W2 (trust-boundary, parallel with M04 and M05). Branch prefix
# `wave/W2/m03/`. Trust-boundary milestone: every PR carries security x2
# review (two independent LLM reviewer instances with different seeds and
# no shared scratchpad), in addition to the human-side reviewer @bb-connor.
#
# All P0 tickets touch root `Cargo.toml` and `Cargo.lock`; the orchestrator
# must serialize them via `shared_paths`. Per-ticket gate commands stay
# local to the crate they affect.

- id: M03.P0.T1
  milestone: M03
  phase: 0
  title: Pin fips204, dcap-rs, sev, coset crates in workspace Cargo.toml
  status: pending
  effort_days: 1
  owner_glob:
    - crates/chio-attest-verify/Cargo.toml
    - crates/chio-core-types/Cargo.toml
  shared_paths:
    - Cargo.toml
    - Cargo.lock
  depends_on: []
  soft_deps:
    - "Re-check crates.io for current latest patch versions on the day P0 opens before pasting the pin set."
  gate_check:
    cmd: cargo build -p chio-core-types --quiet && cargo build -p chio-attest-verify --quiet && cargo tree -p chio-attest-verify -d
    timeout_seconds: 900
  worktree_branch: wave/W2/m03/p0.t1-pin-pq-and-tee-crates
