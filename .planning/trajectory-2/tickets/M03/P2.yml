# M03 Phase 2 - Hybrid signing in receipts, capability tokens, compliance
# certificates; crypto_floor policy plumbed through the kernel.
# Source of truth: .planning/trajectory-2/03-pq-hybrid-and-tee-quote-verifier.md
# (P2 section).
#
# P2 depends on P1's Hybrid variant + MlDsa65Backend. Every P2 ticket is a
# trust-boundary change: receipt signing, capability validation, and
# compliance certificate issuance all sit on the kernel-side trust surface.
# Security x2 review applies.
#
# Migration discipline: existing classical Ed25519 envelopes MUST remain
# byte-identical. P2.T5 is the byte-equivalence regression and P2.T6 is the
# cosign-bundle regression that protects M06 P2's verifier path.

