- id: M03.P3.T3
  milestone: M03
  phase: 3
  title: report_data binding helper expect_report_data fails closed when kernel_pk or receipt_root is unset
  status: merged
  effort_days: 1
  owner_glob:
    - crates/chio-attest-verify/src/lib.rs
    - crates/chio-attest-verify/src/quote.rs
    - crates/chio-attest-verify/tests/expect_report_data.rs
  shared_paths: []
  depends_on:
    - M03.P3.T2
  soft_deps:
    - "Byte layout: SHA256(kernel_signing_pk_canonical_bytes || receipt_root) yields 32 bytes; expect_report_data right-pads with 32 zero bytes to fill the 64-byte report_data slot. The first 32 bytes are the digest; bytes 32..64 are 0x00. Verifiers MUST byte-compare the full 64-byte slot."
  gate_check:
    cmd: "cargo test -p chio-attest-verify --test expect_report_data && grep -qE 'right.?pad|\\[0u8;\\s*32\\]' crates/chio-attest-verify/src/quote.rs"
    timeout_seconds: 600
  worktree_branch: wave/W2/m03/p3.t3-expect-report-data-binding
  agent_role: tee-rust
  review_required:
    - "@bb-connor"
  first_commit_sha: 11a496804a6d3197329a09a098fcb991d14ec1f8
  merged_sha: null
  opened_ts: null
  merged_ts: null

