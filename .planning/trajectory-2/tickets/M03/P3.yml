# M03 Phase 3 - Intel TDX DCAP backend in chio-attest-verify.
# Source of truth: .planning/trajectory-2/03-pq-hybrid-and-tee-quote-verifier.md
# (P3 section).
#
# P3 introduces the QuoteVerifier trait next to the existing AttestVerifier
# trait in crates/chio-attest-verify/src/lib.rs. The trait surface MUST land
# in the same PR as the TDX backend so consumers (M04 revocation roots,
# M10 custody envelopes) are not handed a half-defined API.
#
# Trust-boundary: security x2 review applies. The report_data binding rule
# (P3.T3) is the single most attack-relevant primitive in this milestone;
# review the helper carefully and reject any path that returns success
# without consuming kernel_pk and receipt_root.

