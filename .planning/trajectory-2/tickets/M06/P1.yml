# M06 Phase 1 - CanonicalBytes newtype and signing-path migration.
# Source of truth: .planning/trajectory-2/06-performance-hardening-pack.md
# (Phases P1, plus Risks and Cross-milestone interactions sections).
#
# CanonicalBytes is a newtype in chio-core-types wrapping the canonical-JSON
# byte buffer with a phantom witness for "ran through trajectory-1 M01
# vectors". Migration is wide and intentionally split per crate so each
# ticket independently passes `cargo test --workspace` and preserves M04
# replay byte-equivalence.
#
# Determinism gate: every M06 P1 PR must keep the trajectory-1 M04 replay
# goldens green. The audit doc enumerates every receipt path observed by
# M04 replay; tick each before P1 closes.

- id: M06.P1.T1
  milestone: M06
  phase: 1
  title: Add CanonicalBytes newtype with phantom witness in chio-core-types canonical module
  status: pending
  effort_days: 1.5
  owner_glob:
    - crates/chio-core-types/src/canonical.rs
    - crates/chio-core-types/src/lib.rs
  shared_paths: []
  depends_on:
    - M06.P0.T2
  soft_deps:
    - "trajectory-1 M01 canonical-JSON vectors at spec/vectors/canonical_json/ are the byte-equivalence oracle"
    - "trajectory-2 M03 PQ signing and trajectory-2 M09 lineage are downstream consumers; their tickets will declare M06.P1.T1 as a soft_dep when they open"
  gate_check:
    cmd: cargo build -p chio-core-types --quiet && cargo test -p chio-core-types --quiet && cargo clippy -p chio-core-types -- -D warnings
    timeout_seconds: 600
  worktree_branch: wave/W1/m06/p1.t1-canonical-bytes-newtype
  agent_role: kernel-rust
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

