- id: M06.P5.T1
  milestone: M06
  phase: 5
  title: Add dhat allocation-count harness on dispatch-allow bench gated on cfg(dhat)
  status: pending
  effort_days: 1.5
  owner_glob:
    - crates/chio-kernel/benches/dispatch_allow_dhat.rs
    - crates/chio-kernel/Cargo.toml
    - .planning/audits/M06-perf-hardening.md
  shared_paths:
    - Cargo.lock
  depends_on:
    - M06.P1.T4
  soft_deps:
    - "trajectory-1 M05 dispatch-allow bench at crates/chio-kernel/benches/dispatch_allow.rs is the host"
  gate_check:
    cmd: cargo bench -p chio-kernel --features dhat-heap --bench dispatch_allow_dhat -- --test && grep -q 'dhat allocation-count baseline' .planning/audits/M06-perf-hardening.md
    timeout_seconds: 1200
  worktree_branch: wave/W1/m06/p5.t1-dhat-allocation-bench
  agent_role: kernel-rust
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

