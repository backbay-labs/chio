# M07 Phase 2 - arc mcp wrap CLI subcommand and IDE config generators.
# Source of truth: .planning/trajectory-2/07-adoption-beachhead-pack.md
# (Phase P2 section).
#
# Phase scope: Promote crates/chio-mcp-adapter and crates/chio-hosted-mcp
# into a chio-cli subcommand that wraps any stdio MCP server with verdict
# gating, infers per-tool capability scopes from MCP tools/list, and
# emits ready-to-paste config blobs for Cursor / Claude Desktop /
# Continue / Zed. Local-trust-edge defaults; no hosted control plane
# required. The chio-attest-verify "Chio-verified" attestation header is
# embedded in tool responses.
#
# CROSS-MILESTONE: P2.T6 e2e test reuses the chio-mcp-adapter fixture
# server; the underlying crates do not change shape.
#
# Regenerate the manifest after edits: `cargo xtask trajectory regen-manifest`.

