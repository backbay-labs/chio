# M07 Phase 3 - Provider adapter pack II first three (Gemini / Mistral / Groq).
# Source of truth: .planning/trajectory-2/07-adoption-beachhead-pack.md
# (Phase P3 section).
#
# Phase scope: Three new HTTP-native provider adapter crates following
# the trajectory-1 M07.P1-P4 ladder collapsed into one ticket cluster
# per provider (scaffold + lift/lower + streaming + 12 fixtures + bench
# + error-taxonomy doctest). Cross-provider verdict-equality oracle is
# extended to 6 providers in advisory mode; required-CI flip to 8
# happens in P4.T5.
#
# CROSS-MILESTONE: Each adapter's error-taxonomy doctest consumes the
# trajectory-2 M01 urn:chio:error:* registry. The orchestrator gates the
# doctest on M01.P1.T1 merged_sha via the wave sync rule.
#
# All three providers are HTTP-native and reuse the workspace reqwest
# pin; no new SDK pins land here.
#
# Regenerate the manifest after edits: `cargo xtask trajectory regen-manifest`.

