# M07 Phase 5 - Templates and TTFRH gate.
# Source of truth: .planning/trajectory-2/07-adoption-beachhead-pack.md
# (Phase P5 section).
#
# Phase scope: Three first-run templates (Next.js + AI SDK + receipts
# viewer; FastAPI + LangChain; Cloudflare Worker), the create-chio-app
# CLI that scaffolds them, and the TTFRH (time to first receipt happy
# path) bench gate enforcing < 60 s end-to-end on the reference 4-core
# Linux runner. Telemetry-free first-run sentinel ensures no outbound
# network call to a hosted control plane unless the user opts in.
#
# CROSS-MILESTONE: P5.T5 flips the bench harness scaffolded in P0.T4
# from advisory to required CI on changes under
# sdks/typescript/templates/** or bench/ttfrh/**.
#
# Regenerate the manifest after edits: `cargo xtask trajectory regen-manifest`.

- id: M07.P5.T1
  milestone: M07
  phase: 5
  title: Complete next-ai-sdk-receipts template with chat route receipts viewer and local sink
  status: pending
  effort_days: 2
  owner_glob:
