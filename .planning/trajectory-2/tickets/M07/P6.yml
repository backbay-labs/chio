    - "trajectory-2 M02.P5.T5 cross-language diff oracle activation must be merged before this driver registers in the manifest"
    - "trajectory-1 sdks/jvm/chio-sdk-jvm provides the host kernel bindings the driver invokes"
  gate_check:
    cmd: cd crates/chio-conformance/verdict_matrix/drivers/jvm && ./gradlew --quiet test
