# M07 Phase 6 - Deployment-shape SDK drivers (JVM / dotnet / Lambda / k8s) into the M02 verdict matrix.
# Source of truth: .planning/trajectory-2/07-adoption-beachhead-pack.md
# (Phase P6 section).
#
# Phase scope: Closes the D07 deferral. M02 ships the five-primary-kernel
# verdict matrix (Rust + Python + TS node-http + WASM browser + Go); the
# remaining four SDK trees (JVM, dotnet, Lambda, k8s) are deployment
# shapes that re-host one of those primary kernels but expose distinct
# wire surfaces. P6 lands one driver per SDK tree, registers each driver
# into the M02 verdict_matrix manifest, and adds an integration-smoke
# gate that fails if any of the four diverges from the Rust kernel
# verdict tuple on the hash-pinned scenario corpus.
#
# CROSS-MILESTONE: Each P6 driver registers under
# `crates/chio-conformance/verdict_matrix/drivers/{jvm,dotnet,lambda,k8s}/`
# and is included in the M02 P5.T6 hash-pinned manifest. The orchestrator
# gates the P6 drivers on M02.P5.T5 merged_sha (cross-language diff
# oracle activation) via a soft_deps string sentence; P6 cannot register
# new drivers until the diff oracle is required-CI.
#
# All four drivers are adapters over the trajectory-1 SDK trees; no
# new kernel logic ships here. Drivers transmit the canonical scenario
# input through the SDK's host bindings (JVM via JNI/HTTP, dotnet via
# the existing ChioMiddleware HTTP client, Lambda via a local invoke
# shim, k8s via the controller's admission-webhook test harness) and
# emit the (verdict, reason_code, scope_set) tuple in the M02 schema.
#
# Regenerate the manifest after edits: `cargo xtask trajectory regen-manifest`.

