# ---- Path overlaps requiring orchestrator coordination ----
#
# Per R1 finding 3.4 / 3.5 (cross-lane review), every multi-lane overlap row
# carries a `coordination_owner` so a Wave-3 evidence-gate script (and PR
# reviewers) can resolve "which human signs off when lanes touch the same
# path?". Defaults to the trj5 single_owner; per-row overrides allowed.
#
# `chio-federation` overlap is the most active: Lane B sub-lane B4 (DSSE
# bilateral signing) lives at `crates/chio-federation/src/bilateral_dsse.rs`
# and Lane C C2 (the §7 verifier and predicate helper) extends the same
# module. Both lanes touch the file in weeks 5-7 of the timeline.

[overlaps]
"crates/chio-kernel/src/kernel/mod.rs" = { lanes = ["B"], coordination_owner = "@bb-connor" }
"crates/chio-anchor/" = { lanes = ["A", "B", "C"], coordination_owner = "@bb-connor" }
"crates/chio-conformance/tests/" = { lanes = ["A", "B"], coordination_owner = "@bb-connor" }
"crates/chio-federation/" = { lanes = ["B", "C"], coordination_owner = "@bb-connor", path_overlaps = ["crates/chio-federation/src/bilateral_dsse.rs", "crates/chio-federation/src/bilateral.rs", "crates/chio-federation/src/lib.rs"], notes = "B4 (DSSE signing) and Lane C C2 (verifier + predicate helper) both extend `bilateral_dsse.rs`. Coordination owner mediates merge order." }
"spec/PROTOCOL.md" = { lanes = ["B"], coordination_owner = "@bb-connor" }
"spec/registries/" = { lanes = ["A", "B"], coordination_owner = "@bb-connor" }
"audits/evidence/" = { lanes = ["A"], coordination_owner = "@bb-connor" }
"formal/" = { lanes = ["A"], coordination_owner = "@bb-connor" }
".planning/trajectory-5/" = { lanes = ["A", "B", "C"], coordination_owner = "@bb-connor" }

