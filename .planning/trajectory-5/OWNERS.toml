# trajectory-5 ownership manifest.
#
# Owner-classes only. Human assignment to owner-classes is a Wave-2 deliverable
# and gates kickoff (see KICKOFF-CHECKLIST.md).
#
# Format mirrors trajectory-3 OWNERS.toml. Trj5 is the "honesty trajectory":
# three coupled lanes, no separate brand from the trj4 wave plan, one ship-bar
# visible from outside (per debate/00-SYNTHESIS.md).
#
# ---------------------------------------------------------------------------
# AUTONOMOUS EXECUTION NOTE (baseline kickoff, 2026-05-08)
# ---------------------------------------------------------------------------
#
# Trj5 executes autonomously: agent waves orchestrated by Claude pick up and
# close tickets. The `human_assignment` field on each lane below is the
# escalation path (a real GitHub handle), NOT the implementer. The actual
# ticket execution happens via `automation_coordinator` agent waves, gated by the
# `execution_mode = "autonomous"` field.
#
# Per-owner-class `assigned_to = "release owner"` rows record the same escalation
# path at the role granularity; they do not name fictitious teammates. The
# only real human handle in the release work ledger is `release owner` (verified by
# `git config user.email` -> `whelan.connor11@gmail.com`).
#
# When an autonomous wave hits one of the eleven canonical halt triggers
# (READINESS.md "Autonomous Orchestration Cadence"), control routes to
# `human_assignment` for review and unblock. Otherwise wave-to-wave handoff
# is by ticket-state transitions in planning docs and Wave-N closeout docs in
# `closeout/wave-NN-summary.md`.
#
# The `coordination_owner` field on `[overlaps]` rows mediates merge order
# when multiple lanes touch the same path; it is also `release owner` because
# autonomous lanes do not arbitrate among themselves on path conflicts.
# ---------------------------------------------------------------------------

trajectory = "trajectory-5"
genesis = "2026-05-07"
single_owner = "release owner"
execution_mode = "autonomous"
automation_coordinator = "release automation coordinator"

[planning_ownership]
owner_pr = 620
owner_globs = [".planning/trajectory-5/**"]
rule = "No non-planning PR may carry .planning/trajectory-5 paths. Lane docs are planning truth owned by PR 620, not by source/evidence lanes."

