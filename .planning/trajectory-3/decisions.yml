# trajectory-3 decisions register.
#
# Locked design decisions per milestone or trajectory-wide. Once authored,
# each decision is binding for the trajectory; reopening requires an
# explicit amendment committed to this file with a `superseded_by`
# reference.
#
# Schema (informal):
#   id: D{NN} per-trajectory unique
#   milestone: M{NN} or "trajectory" for cross-cutting
#   title: one-line summary
#   resolved_on: date
#   resolved_by: "@handle" or "verdict synthesis (round 2)"
#   decision: short prose statement
#   rationale: why this choice; cite evidence
#   alternatives_rejected: list of alternatives considered and rejected
#   consequences: downstream effects this commits to
#   superseded_by: null or D{NN} reference

decisions:

  # ---- Trajectory-wide decisions (resolved during the verdict debate) ----

  - id: D01
    milestone: trajectory
    title: "Blend frame chosen over halt / customer-only / expand / audit-led"
    resolved_on: 2026-04-30
    resolved_by: "verdict synthesis (round 2)"
    decision: "Trajectory-3 follows a 50/30/20 customer-anchored / deepen-the-substrate / external-attestation blend rather than any of the four pure frames considered."
    rationale: "Pure customer-led ships a pilot on an unsupported substrate (CI bypass, advisory mutation gate, partial threat coverage). Pure halt-to-stabilize leaves Chio with no external user reference. Pure audit-led burns 10-12 months on vendor calendars while the codebase stays unanchored. Pure expand-distribution chases listings before any of them is differentiated. The blend lets M08/M09 sit on a stable substrate (M03/M04/M05) while a real customer (M01/M02) consumes it."
    alternatives_rejected:
      - "Halt-to-stabilize: 6-9 month freeze; no external evidence at close"
      - "Customer-only: pilot on unsupported substrate"
      - "Audit-led: 10-12 month vendor lane with no engineering output"
      - "Expand-distribution: three-cloud listing with no differentiation"
    consequences:
      - "Ten milestones, all trust-boundary, ~44-48 calendar weeks at 5 FTE eng + 1 PL + 0.5 SR."
      - "Vendor calendars (M08 + M09) start week 1, parallel to code waves."
    superseded_by: null

  - id: D02
    milestone: trajectory
    title: "HITRUST i1 replaces ISO 42001 for trajectory-3 external attestation"
    resolved_on: 2026-04-30
    resolved_by: "verdict synthesis (round 2)"
    decision: "M09 ships a HITRUST i1 assessment scoped to the Opus design-partner deployment. ISO 42001 is deferred to a post-trajectory-3 cycle."
    rationale: "Calendar lead-time for HITRUST i1 (12-36 weeks) fits the trajectory-3 window; ISO 42001 (12-18 months) does not. The Opus design partner asked for HITRUST i1 first as a procurement gate; that ask anchors the milestone."
    alternatives_rejected:
      - "ISO 42001 (lead time too long; not anchored to a specific design-partner ask)"
      - "SOC 2 Type 1 (Opus cluster already accepts existing SOC 2 from peer vendors; lower differentiation)"
      - "No external attestation in trajectory-3 (leaves trajectory close without the third leg of the blend frame)"
    consequences:
      - "M09 narrative is HITRUST-i1-specific; assessor portal + control mapping are HITRUST-shaped, not ISO-shaped."
      - "ISO 42001 work surfaces as a trajectory-4 candidate."
    superseded_by: null

  - id: D03
    milestone: M10
    title: "M10 descoped to AWS Bedrock + MCP only, not three clouds"
    resolved_on: 2026-04-30
    resolved_by: "verdict synthesis (round 2)"
    decision: "M10 ships exactly one cloud marketplace listing (AWS Bedrock) with one MCP-conformance entry. GCP / Azure listings are deferred."
    rationale: "Three half-listings beats one credible full listing on observable distribution metrics; AWS Bedrock has the design-partner pull (Opus cluster uses AWS) and the MCP project's conformance bench is the easiest third-party evidence to procure inside the trajectory window."
    alternatives_rejected:
      - "Three clouds (AWS + GCP + Azure) at half-depth"
      - "AWS only without MCP conformance (loses one of the two third-party evidence forms)"
      - "MCP conformance only without a cloud listing (loses distribution narrative)"
    consequences:
      - "M10 narrative names AWS Bedrock + MCP only; GCP / Azure surface as trajectory-4 candidates."
      - "AWS marketplace approval is one of the two third-party evidence forms for trajectory close."
    superseded_by: null

  - id: D04
    milestone: M06
    title: "M06 split: focused formal invariants only; full Apalache FSM deferred to trajectory-4"
    resolved_on: 2026-04-30
    resolved_by: "verdict synthesis (round 2) + M06 authoring agent"
    decision: "M06 ships 3-4 highest-leverage TLA+/Apalache invariants on a kernel-state subset. The full delegation FSM Apalache model is deferred to trajectory-4."
    rationale: "Full-FSM Apalache modelling is a 16-20 week effort under 0.5 SR; the highest-value invariants (delegation depth, revocation cut, async dispatch ordering) are 7-10 weeks and capture most of the formal value."
    alternatives_rejected:
      - "Full Apalache FSM (effort exceeds the trajectory-3 window without crowding M07)"
      - "No formal work in trajectory-3 (leaves the trajectory-2 quality-hawk debt unaddressed)"
    consequences:
      - "M06 narrative names exactly the 3-4 invariants that ship; trajectory-4 picks up the rest."
    superseded_by: null

  - id: D05
    milestone: M06
    title: "M06 split: API-tier + supply-chain only; full crate consolidation 88->70 deferred to trajectory-4"
    resolved_on: 2026-04-30
    resolved_by: "verdict synthesis (round 2) + M06 authoring agent"
    decision: "M06 ships cargo-vet adoption, SBOM publication, and CVE-monitoring on the existing 88-crate workspace. Crate consolidation (88 -> <=70) is deferred to trajectory-4."
    rationale: "Crate consolidation requires moving public symbols across crate boundaries, which would force breaking-change PRs across every downstream consumer; trajectory-3 cannot afford the churn. SBOM + cargo-vet land cleanly without re-shaping the workspace."
    alternatives_rejected:
      - "Full consolidation (breaking-change cascade)"
      - "Skip supply-chain entirely (leaves M09 HITRUST scope without an SBOM)"
    consequences:
      - "M06 narrative scopes to cargo-vet + SBOM + CVE alerting; consolidation is a trajectory-4 candidate."
      - "M09 HITRUST assessor consumes the SBOM produced by M06."
    superseded_by: null

  - id: D06
    milestone: trajectory
    title: "FTE assumption: 5 engineering + 1 program lead + 0.5 security reviewer"
    resolved_on: 2026-04-30
    resolved_by: "verdict synthesis (round 2)"
    decision: "Trajectory-3 assumes 5 FTE engineering, 1 program lead, and 0.5 security reviewer."
    rationale: "Effort estimates and parallel-wave concurrency caps depend on a fixed FTE count. 5 eng matches the trajectory-2 sustained throughput; the program lead is required by M01 / M02 / M09 customer / vendor coordination; the 0.5 SR is required by M06 / M08 trust-boundary review."
    alternatives_rejected:
      - "3 FTE engineering (trajectory close slips past 60 weeks)"
      - "8 FTE engineering (over-staffs Wave 3, M10 saturates earlier)"
    consequences:
      - "All wave concurrency caps assume this FTE profile; deviations require an amendment."
    superseded_by: null

  - id: D07
    milestone: trajectory
    title: "Vendor budget posture ~$350-450k for trajectory-3"
    resolved_on: 2026-04-30
    resolved_by: "verdict synthesis (round 2)"
    decision: "Trajectory-3 carries a vendor budget posture of approximately $350-450k spread across NCC Group or Trail of Bits review (M08, ~$150-250k), HITRUST i1 assessment (M09, ~$80-150k), AWS marketplace listing fees (M10, ~$10-20k), and Apalache contractor (M06, ~$40-60k)."
    rationale: "These are typical lead-time-anchored vendor quotes for the named external work. The blend frame requires the vendor lanes; the budget posture makes them legible."
    alternatives_rejected:
      - "Pro-bono / volunteer review (no vendor commits to the calendar without payment)"
    consequences:
      - "Each vendor-lane milestone audit doc records the actual quote received and the variance from the band."
    superseded_by: null

  - id: D08
    milestone: M04
    title: "Week-12 contingency: ship gate at honest threshold; do NOT slip M08"
    resolved_on: 2026-04-30
    resolved_by: "verdict synthesis (round 2) + M04 authoring agent"
    decision: "If M04 mutation kill-rate cannot reach 80% by week 12, the gate flips to the achieved threshold (target 80%, accept 65% as floor) and the M04 audit doc records the gap. M08 vendor lane does NOT slip to chase a higher threshold."
    rationale: "M08 vendor calendar is the long-clock dependency; slipping it costs 4-8 weeks of trajectory close. A 65%-floor gate flagged in the audit doc is honest; sandbagging to claim 80% is not."
    alternatives_rejected:
      - "Slip M08 to chase 80% (loses the third leg of the blend frame)"
      - "Skip the gate entirely if 80% not reached (regresses to advisory)"
    consequences:
      - "M04 P3.T1 ticket spec carries the floor-vs-target rule explicitly."
      - "Vendor calendar slip > 25% is a halt trigger (15 in AUTONOMOUS-PROMPT)."
    superseded_by: null

  - id: D09
    milestone: M01
    title: "Opus cluster is the M01 design partner; in-house but real workload"
    resolved_on: 2026-04-30
    resolved_by: "verdict synthesis (round 2) + M01 authoring agent"
    decision: "M01 design partner is the Opus cluster (Backbay healthcare; in-house, real workload). The 30-day bounded-operational-profile observation runs on the Opus tenant ops review."
    rationale: "Opus cluster is real production workload run by a separate ops team; the in-house relationship makes onboarding tractable inside the trajectory window. External-customer relationships have lead times that do not fit Wave 1."
    alternatives_rejected:
      - "External healthcare customer (lead time too long)"
      - "Internal-only synthetic workload (would not satisfy BOUNDED_OPERATIONAL_PROFILE release gate)"
    consequences:
      - "M09 HITRUST assessment is scoped to the Opus deployment."
      - "M07 chio-kernel-mobile MVP design partner is the Opus mobile patient-app extension."
    superseded_by: null

  - id: D10
    milestone: M02
    title: "M02 design partner picked in week 1: Anthropic, METR, or Apollo Research"
    resolved_on: 2026-04-30
    resolved_by: "verdict synthesis (round 2) + M02 authoring agent"
    decision: "M02 enters week 1 with a shortlist of three AI-lab evaluation teams (Anthropic evaluations, METR, Apollo Research). One is contracted by end of week 1; the others remain in the audit doc as fallback partners."
    rationale: "These three teams run tool-use evaluation pipelines that fit the verdict-evidence-substrate ask; named candidates rather than abstract 'an AI lab' make the milestone executable."
    alternatives_rejected:
      - "Build the beachhead without a contracted partner"
      - "Single named partner with no fallback (binary risk)"
    consequences:
      - "M02 P0 includes a vendor / partner contract ticket."
      - "If all three withdraw, halt trigger 12 fires."
    superseded_by: null

  - id: D11
    milestone: M07
    title: "Mobile attestation: Apple App Attest + Android Play Integrity (no custom HSM lane)"
    resolved_on: 2026-04-30
    resolved_by: "M07 authoring agent"
    decision: "M07 ships device attestation via Apple App Attest and Android Play Integrity APIs only. A custom HSM-backed attestation lane is deferred."
    rationale: "App Attest and Play Integrity are the platform-native paths; their issuance IS the third-party evidence per the verdict's per-milestone external evidence column. A custom lane duplicates effort with marginal gain."
    alternatives_rejected:
      - "Custom HSM-backed attestation lane (duplicates effort)"
      - "iOS only, deferring Android (loses Android half of mobile market)"
    consequences:
      - "M07 narrative pins the App Attest + Play Integrity vendor surfaces as load-bearing."
    superseded_by: null

  - id: D12
    milestone: M08
    title: "M08 vendor shortlist: NCC Group or Trail of Bits; final choice in week 5"
    resolved_on: 2026-04-30
    resolved_by: "verdict synthesis (round 2) + M08 authoring agent"
    decision: "M08 RFP goes to NCC Group and Trail of Bits in weeks 1-5. Final vendor is selected by end of week 5 based on quote, calendar fit, and prior-engagement coverage of the protocol surface."
    rationale: "Both vendors have a track record on protocol / crypto reviews matching Chio's surface; the choice is calendar- and quote-driven rather than capability-driven."
    alternatives_rejected:
      - "Single-vendor RFP (loses negotiating leverage)"
      - "Three-vendor RFP (slows the calendar)"
    consequences:
      - "If both vendors decline or quote outside the D07 budget band, halt trigger 13 fires; user picks substitute or descope."
    superseded_by: null

  - id: D13
    milestone: M03
    title: "Hosted CI runner choice: GitHub Actions hosted (ubuntu-24.04); reproducible-build verifier is third party"
    resolved_on: 2026-04-30
    resolved_by: "M03 authoring agent"
    decision: "M03 restores hosted CI on GitHub Actions hosted runners (ubuntu-24.04 + macos-14). The reproducible-build verifier is a separate third party (e.g. an independent contributor or a sister team) running the rebuild and confirming hash match."
    rationale: "Hosted runners are the lowest-friction restoration path; the inherited trajectory-2 workflows already target them. Reproducible-build verification by a third party is the load-bearing evidence; self-rebuilding is not."
    alternatives_rejected:
      - "Self-hosted runners (operations cost during a customer pilot)"
      - "First-party rebuild only (no external evidence)"
    consequences:
      - "M03 P5 audit doc records the third-party rebuilder identity and the matched hash."
    superseded_by: null

  - id: D14
    milestone: M05
    title: "Threat-coverage closure scope: weights_hash_spoof + dispatch_allow + M06 placeholder; remaining advisory threats classified"
    resolved_on: 2026-04-30
    resolved_by: "M05 authoring agent"
    decision: "M05 closes exactly the three named carry-forward gaps from trajectory-2 (weights_hash_spoof partial->passing, dispatch_allow placeholder replaced, M06 placeholder evicted) and classifies remaining advisory threats. New threat IDs introduced by trajectory-3 milestones (M07 mobile, M10 distribution) are out of scope for M05."
    rationale: "Bounded scope; chasing every advisory threat would balloon M05 past its 3-5 week window."
    alternatives_rejected:
      - "Close all advisory threats (scope creep)"
      - "Defer the named gaps to trajectory-4 (leaves M08 reviewer cross-check unanchored)"
    consequences:
      - "M07 / M10 threat-ID introductions land under those milestones with their own coverage rows."
    superseded_by: null

  - id: D15
    milestone: trajectory
    title: "Customer evidence freshness: 7-day record window; design-partner withdrawal halts the affected milestone"
    resolved_on: 2026-04-30
    resolved_by: "verdict synthesis (round 2)"
    decision: "Customer-anchored milestone audit docs (M01, M02) record customer review receipts within 7 days of the touched ticket merging. Design-partner withdrawal triggers halt 12; M09 dependent tickets pause until a substitute is named."
    rationale: "Stale customer evidence is worse than no customer evidence; the 7-day window forces the review loop to run concurrently with the engineering loop. Withdrawal halt prevents the orchestrator from continuing to produce evidence for a customer that no longer exists."
    alternatives_rejected:
      - "30-day window (too loose; customer signal would lag the engineering signal)"
      - "No window (silently widens the customer evidence claim)"
    consequences:
      - "M01 + M02 audit docs carry per-receipt date stamps; CI checks the freshness."
    superseded_by: null
