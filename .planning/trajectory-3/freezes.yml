# trajectory-3 freeze register.
#
# Trust-boundary milestones impose path-scoped freezes during their pivot
# phases. While a freeze is active, only its owning milestone may write
# to the listed paths. All other PRs touching the paths are auto-rejected
# by the trajectory-3 orchestrator and the `m{nn}-freeze-guard` GitHub
# required-check.
#
# All ten trajectory-3 milestones are trust-boundary; only those with
# concrete code path overlaps register freezes here. Vendor-calendar
# milestones (M08, M09) carry no code freeze; they freeze evidence
# documents under `.planning/trajectory-3/audits/` instead, enforced by
# the orchestrator's audit-doc lane rule.
#
# Audit-document handoff freezes are registered explicitly when a
# downstream milestone consumes another milestone's audit doc as a
# load-bearing input (per README invariants table). Currently:
# m01-m07-audit-handoff and m01-m09-audit-handoff. M08's audit doc is
# self-owned (no upstream milestone freezes it) and other inter-milestone
# audit references are read-only cross-refs that do not require freeze
# coordination.
#
# Hot-fix bypass: branches matching `hotfix/*` with the `[trajectory-3]`
# label may merge with a documented single-reviewer override.
#
# Schema (informal):
#   id: stable freeze id
#   milestone: M{NN}
#   phases: list of phase ids that scope the freeze window
#   path_globs: list of paths the freeze covers
#   start_trigger: ticket id whose merge opens the freeze
#   end_trigger: ticket id whose merge closes the freeze
#   trust_boundary: boolean
#   guard_check: GitHub required-check name
#   bypass_lane: branch pattern + label combination

freezes:

  - id: m04-mutation-gate-pivot
    milestone: M04
    phases: [P3, P4, P5]
    path_globs:
      - .cargo/mutants.toml
      - mutants-baseline.toml
      - .github/workflows/mutation-coverage.yml
      - .github/workflows/verdict-matrix.yml
      - crates/chio-conformance/verdict_matrix/**
    start_trigger: M04.P3.T1
    end_trigger: M04.P5.T3
    trust_boundary: true
    guard_check: m04-freeze-guard
    bypass_lane: "hotfix/* + [trajectory-3]"
    rationale: "Gate flip from advisory to required must land atomically with the verdict-matrix non-Rust driver promotion."

  - id: m05-threat-coverage-pivot
    milestone: M05
    phases: [P1, P2, P3, P4]
    path_globs:
      - spec/security/chio-threat-model.v1.json
      - crates/chio-conformance/tests/threats/**
      - crates/chio-attest-verify/src/policy.rs
      - crates/chio-kernel/benches/dispatch_allow.rs
      - crates/chio-kernel/benches/dispatch_allow_dhat.rs
      - docs/security/threat-coverage.md
    start_trigger: M05.P1.T1
    end_trigger: M05.P4.T3
    trust_boundary: true
    guard_check: m05-freeze-guard
    bypass_lane: "hotfix/* + [trajectory-3]"
    rationale: "weights_hash_spoof partial->passing + dispatch_allow placeholder eviction land as one trust-boundary closure; P0 reconciled the live placeholders to chio-kernel benches."

  - id: m06-supply-chain-pivot
    milestone: M06
    phases: [P2, P3, P4]
    path_globs:
      - supply-chain/**
      - .github/workflows/sbom.yml
      - .github/workflows/cargo-vet.yml
      - .github/workflows/cve-monitor.yml
      - deny.toml
    start_trigger: M06.P2.T1
    end_trigger: M06.P4.T5
    trust_boundary: true
    guard_check: m06-freeze-guard
    bypass_lane: "hotfix/* + [trajectory-3]"
    rationale: "cargo-vet adoption + SBOM publication + CVE monitoring land as one supply-chain closure."

  - id: m06-revocation-oracle-pivot
    milestone: M06
    phases: [P1, P2]
    path_globs:
      - crates/chio-revocation-oracle/**
      - formal/tla/**
      - formal/apalache/**
    start_trigger: M06.P1.T1
    end_trigger: M06.P2.T5
    trust_boundary: true
    guard_check: m06-freeze-guard
    bypass_lane: "hotfix/* + [trajectory-3]"
    rationale: "Apalache focused-invariant model + TLA+ spec edits land coherent with the chio-revocation-oracle source under model."

  - id: m07-kernel-mobile-pivot
    milestone: M07
    phases: [P1, P2, P3, P4]
    path_globs:
      - crates/chio-kernel-mobile/**
      - sdks/swift/**
      - sdks/kotlin/**
      - crates/chio-custody-hw/src/attestation/**
    start_trigger: M07.P1.T1
    end_trigger: M07.P4.T4
    trust_boundary: true
    guard_check: m07-freeze-guard
    bypass_lane: "hotfix/* + [trajectory-3]"
    rationale: "Kernel C-ABI surface + iOS framework + Android AAR + App Attest / Play Integrity wiring land as one mobile-MVP closure."

  - id: m10-bedrock-listing-pivot
    milestone: M10
    phases: [P3, P4]
    path_globs:
      - integrations/aws-bedrock/**
      - integrations/mcp-adapter/**
      - sdks/python/packages/chio-bedrock/**
    start_trigger: M10.P3.T1
    end_trigger: M10.P4.T5
    trust_boundary: true
    guard_check: m10-freeze-guard
    bypass_lane: "hotfix/* + [trajectory-3]"
    rationale: "AWS marketplace package + MCP adapter must publish coherent."

  - id: m04-m05-attest-verify-coupling
    milestone: M04
    phases: [P3, P4, P5]
    path_globs:
      - crates/chio-attest-verify/src/**
    start_trigger: M04.P3.T1
    end_trigger: M04.P5.T3
    trust_boundary: true
    guard_check: m04-freeze-guard
    bypass_lane: "hotfix/* + [trajectory-3]"
    rationale: "OWNERS.toml [overlaps] declares crates/chio-attest-verify/src/ shared by M04 + M05. M04.P3 close is a precondition for M05 starting dispatch_allow.rs work; this freeze sequences the trust-boundary handoff so the mutation-gate flip lands before threat-coverage source edits begin."

  - id: m02-m04-verdict-matrix-coupling
    milestone: M02
    phases: [P2, P3]
    path_globs:
      - crates/chio-conformance/verdict_matrix/**
    start_trigger: M02.P2.T1
    end_trigger: M02.P3.T5
    trust_boundary: true
    guard_check: m02-freeze-guard
    bypass_lane: "hotfix/* + [trajectory-3]"
    rationale: "OWNERS.toml [overlaps] declares crates/chio-conformance/verdict_matrix/ shared by M02 + M04. M02 P2 (Python driver) and P3 (Go driver) must close before M04.P3 (mutation-gate freeze) opens, so the verdict-matrix non-Rust drivers reach passing before they are gated."

  - id: m01-m07-audit-handoff
    milestone: M01
    phases: [P5]
    path_globs:
      - .planning/trajectory-3/audits/M01-healthcare-pilot.md
    start_trigger: M01.P5.T1
    end_trigger: M01.P5.T5
    trust_boundary: true
    guard_check: m01-audit-handoff-guard
    bypass_lane: "hotfix/* + [trajectory-3]"
    rationale: "M07 mobile patient-app extension consumes the M01 design-partner tenant runbook + log-export schema as load-bearing inputs (per README invariants table). M01 P5 closure freezes the audit doc so M07 has a stable reference point during its own design-partner work."

  - id: m01-m09-audit-handoff
    milestone: M01
    phases: [P3, P4, P5]
    path_globs:
      - spec/audit-log/export-schema.v1.json
      - .planning/trajectory-3/audits/M01-healthcare-pilot.md
    start_trigger: M01.P3.T1
    end_trigger: M01.P5.T5
    trust_boundary: true
    guard_check: m01-audit-handoff-guard
    bypass_lane: "hotfix/* + [trajectory-3]"
    rationale: "M09 HITRUST assessor consumes the M01 audit-log export schema v1 + operator runbook (per README invariants table). The schema and audit-doc evidence are frozen from M01.P3 (schema negotiation) through M01.P5 (ops sign-off) so the M09 evidence package builds on a stable M01 surface."

# Cross-freeze ordering invariants:
#
#   - m04-m05-attest-verify-coupling enforces the M04 -> M05 sequencing:
#     M04.P3 close (mutation-gate flip on chio-attest-verify) is a
#     precondition for M05 opening dispatch_allow.rs work in
#     m05-threat-coverage-pivot. M05.P4 soft_dep in the per-phase ticket
#     file documents the dependency.
#   - m02-m04-verdict-matrix-coupling enforces the M02 -> M04 sequencing:
#     M02 P2 (Python driver) and P3 (Go driver) must close before
#     m04-mutation-gate-pivot opens, so the non-Rust drivers reach
#     `passing` before the verdict-matrix gate flips advisory -> required.
#   - m06-revocation-oracle-pivot's `formal/tla/**` overlaps with any
#     trajectory-2 trajectory-2 carry-forward freezes that touched the
#     directory; trajectory-2 freezes are inactive on `main` post-merge,
#     so no live overlap exists.
#   - m07-kernel-mobile-pivot's `crates/chio-custody-hw/src/attestation/**`
#     overlaps with the trajectory-2 m10-custody-issuer-pivot path. The
#     trajectory-2 freeze is closed; trajectory-3 m07 is the active owner
#     of the attestation subdirectory.
