# M04 Phase 4 - Verdict-matrix Python + Go drivers flip to required.
# Source of truth: .planning/trajectory-3/04-mutation-and-verdict-matrix-promotion.md
# Phase P4 ("Verdict-matrix Python + Go drivers flip to required"). Wave 1.
#
# T1 edits .github/workflows/verdict-matrix.yml to add new required
# matrix entries for python-sdk and go-http-sdk asserting zero
# divergence vs the rust-kernel reference. Pattern mirrors the existing
# deployment-shape-smoke required job. The freeze m04-mutation-gate-pivot
# covers verdict-matrix.yml during P3-P5; P4 is the only window allowed
# to edit it.
#
# Two-consecutive-green prerequisite from M04.P2.T3 must be in the
# audit doc before T1 opens. The fail-closed semantics in
# crates/chio-conformance/verdict_matrix/src/cross_language.rs are
# already in place (any emitting driver disagreeing fails); T1 makes
# the contract load-bearing on Python and Go.

