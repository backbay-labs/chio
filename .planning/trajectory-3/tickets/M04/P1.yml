# M04 Phase 1 - Mutant survivor sweep on lagging crates.
# Source of truth: .planning/trajectory-3/04-mutation-and-verdict-matrix-promotion.md
# Phase P1 ("Mutant survivor sweep on lagging crates"). Wave 1.
#
# Tickets ordered by slope (cheapest closure first). chio-attest-verify
# is the priority gate-flip blocker (0% kill in trajectory-2 closeout;
# 80% unreachable in 9wk per research). T4 carries the longest single-
# crate effort. Each crate's targeted test work consumes the missed-
# mutant inventory captured at P0.T1.
#
# Per-crate mutants.toml skip-list edits land here. Each new skip MUST
# cite a real coverage source (integration test or fuzz target) per
# scripts/check-mutants-rationale.sh; CODEOWNERS gate enforces review.
# Gaming the skip list to "achieve" the threshold defeats the M08
# reviewer audit (Risk 6).
#
# CROSS-MILESTONE NOTE: T4 (chio-attest-verify) writes to
# crates/chio-attest-verify/{src,tests}/. The freeze
# m04-m05-attest-verify-coupling does not open until M04.P3.T1, so
# chio-attest-verify edits are unrestricted during P1.

