# M04 Phase 3 - Mutation lane flip to required.
# Source of truth: .planning/trajectory-3/04-mutation-and-verdict-matrix-promotion.md
# Phase P3 ("Mutation lane flip to required"). Wave 1.
#
# T1 is the gate-flip PR. The freeze m04-mutation-gate-pivot
# (.planning/trajectory-3/freezes.yml lines 39-53) opens with T1 and
# covers .cargo/mutants.toml, mutants-baseline.toml,
# .github/workflows/mutation-coverage.yml (file-of-record name; live
# path is .github/workflows/mutants.yml),
# .github/workflows/verdict-matrix.yml, and
# crates/chio-conformance/verdict_matrix/** through P5. The freeze
# m04-m05-attest-verify-coupling also opens here and gates M05 source
# edits in dispatch_allow.rs.
#
# T1 carries the D08 floor-vs-target rule explicitly: any crate below
# 80% target but at or above 65% honest floor is recorded in the
# activation_evidence YAML block; the gate uses the achieved per-crate
# floor. The new scalar releases.toml field
# activation_threshold_percent_per_crate is what scripts/mutants-gate.sh
# actually compares against post-flip; target_catch_ratio_percent stays
# 80 (do NOT downgrade the documented target).
#
# T2 dry-runs the override / rollback recipe so the rollback path is
# proven before the flip lands (Risk 4 in the milestone narrative).

