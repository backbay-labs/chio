# M02 Phase 5 - Partner-signed conformance memo received.
# Source of truth: .planning/trajectory-3/02-ai-lab-evaluation-beachhead.md
# (Phase P5 section). Wave 1.
#
# P5 produces the draft memo, hands to partner, receives signed memo,
# fills audit doc closure block, and ships the partnership-note PR.
#
# D15 freshness: partner-signed memo receipt date must be within 7
# days of the merge timestamp of M02.P5.T2 (the commit that lands
# the signed memo).

- id: M02.P5.T1
  milestone: M02
  phase: 5
  title: Draft 1-page partner-facing memo per RESEARCH.md template and hand to partner
  status: pending
  effort_days: 1.0
  owner_glob:
    - .planning/trajectory-3/research/m02/M02-MEMO-DRAFT.md
  shared_paths: []
  depends_on:
    - M02.P4.T4
  soft_deps:
    - ".planning/trajectory-3/research/m02/RESEARCH.md section 'External evidence shape: 1-page conformance memo template' is the canonical template"
    - "Memo asserts conformance against a specific git sha; v1.1 fixes are a separate engagement"
  gate_check:
    cmd: "test -f .planning/trajectory-3/research/m02/M02-MEMO-DRAFT.md && grep -q 'Chio Receipt Conformance Memo' .planning/trajectory-3/research/m02/M02-MEMO-DRAFT.md && grep -q 'chio.eval-report.bundle.v1' .planning/trajectory-3/research/m02/M02-MEMO-DRAFT.md"
    timeout_seconds: 60
  worktree_branch: wave/W1/m02/p5.t1-memo-draft
  agent_role: customer-coord
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

- id: M02.P5.T2
  milestone: M02
  phase: 5
  title: Receive signed memo and signature; verify locally; commit to audits
  status: pending
  effort_days: 1.0
  owner_glob:
    - .planning/trajectory-3/audits/M02-memo.md
    - .planning/trajectory-3/audits/M02-memo.sig
  shared_paths: []
  depends_on:
    - M02.P5.T1
  soft_deps:
    - "Signature scheme is cosign + GitHub OIDC by default; PGP detached fallback if partner cannot use cosign"
    - "If signature does not verify, do NOT commit; back-channel to partner for re-sign"
    - "D15: receipt date within 7 days of merge"
  gate_check:
    cmd: "test -f .planning/trajectory-3/audits/M02-memo.md && test -f .planning/trajectory-3/audits/M02-memo.sig && cargo run -p chio-eval-receipt --bin chio-eval-receipt -- verify-memo .planning/trajectory-3/audits/M02-memo.md .planning/trajectory-3/audits/M02-memo.sig"
    timeout_seconds: 600
  worktree_branch: wave/W1/m02/p5.t2-receive-signed-memo
  agent_role: customer-coord
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

- id: M02.P5.T3
  milestone: M02
  phase: 5
  title: Fill audit doc closure attestations and flip M02 status to closed
  status: pending
  effort_days: 0.5
  owner_glob:
    - .planning/trajectory-3/audits/M02-ai-lab.md
  shared_paths: []
  depends_on:
    - M02.P5.T2
  soft_deps:
    - "Closure block records: memo path, sha256, signature path, signer identity, commit SHA, receipt date"
  gate_check:
    cmd: "grep -q 'Status:.*closed' .planning/trajectory-3/audits/M02-ai-lab.md && grep -q 'M02-memo.md' .planning/trajectory-3/audits/M02-ai-lab.md && grep -q 'Cosign signer identity' .planning/trajectory-3/audits/M02-ai-lab.md"
    timeout_seconds: 60
  worktree_branch: wave/W1/m02/p5.t3-fill-closure-attestations
  agent_role: customer-coord
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

- id: M02.P5.T4
  milestone: M02
  phase: 5
  title: Wave-closer publish partnership-note PR and record URL in audit doc
  status: pending
  effort_days: 0.75
  owner_glob:
    - README.md
    - .planning/trajectory-3/audits/M02-ai-lab.md
  shared_paths: []
  depends_on:
    - M02.P5.T3
  soft_deps:
    - "Partnership-note path: README entry mandatory; blog post on chio-protocol.dev optional"
    - "Wave-closer for M02; M04 P3 may proceed with driver-promotion freeze opening"
  gate_check:
    cmd: "grep -q 'Public partnership note URL' .planning/trajectory-3/audits/M02-ai-lab.md && grep -qE '(eval-report|AI lab|partner)' README.md"
    timeout_seconds: 60
  worktree_branch: wave/W1/m02/p5.t4-publish-partnership-note
  agent_role: customer-coord
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null
