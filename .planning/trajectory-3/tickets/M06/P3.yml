# M06 Phase 3 - SBOM generation pipeline + per-release publication.
# Source of truth: .planning/trajectory-3/06-focused-formal-and-supply-chain.md
# (Phases section, P3 bullets). Wave: W2.
#
# P3 adds standalone .github/workflows/sbom.yml emitting both source-tree
# and per-target binary SBOMs at supply-chain/sbom/v{tag}/. Reuses the
# existing cosign keyless identity from release-binaries.yml. Hard-deps
# on M03.P2.T* (reproducible-build workflow scaffold) at the soft-dep
# level; M06 SBOM still publishes if M03 lags, but the M03 hash chain
# only completes once both land.
#
# m06-supply-chain-pivot freeze stays open through P3.

- id: M06.P3.T1
  milestone: M06
  phase: 3
  title: Add .github/workflows/sbom.yml as standalone tag-triggered plus weekly-cron workflow emitting source-tree and per-target binary SBOMs at supply-chain/sbom/v{tag}/ with determinism probe
  status: pending
  effort_days: 1.5
  owner_glob:
    - .github/workflows/sbom.yml
  shared_paths: []
  depends_on:
    - M06.P0.T1
  soft_deps:
    - "trajectory-2 .github/workflows/release-binaries.yml already pins syft 1.18.1 and emits a binary CycloneDX 1.6 SBOM; M06 adds source-tree scanning as a sibling artifact"
    - "M03.P2.T* (hosted CI restoration) creates .github/workflows/reproducible-build.yml; M06 SBOM publishes via M03's release flow once M03 lands"
    - "determinism probe runs syft twice on the same source tree and asserts byte-equal output so M03's third-party rebuilder verifies the SBOM hash without a separate builder"
    - "OWNERS.toml [milestones.M06] owner_globs names .github/workflows/sbom.yml as M06-owned"
  gate_check:
    cmd: "test -f .github/workflows/sbom.yml && grep -q 'syft' .github/workflows/sbom.yml && grep -q '1.18.1' .github/workflows/sbom.yml && grep -q 'cyclonedx' .github/workflows/sbom.yml && grep -q 'supply-chain/sbom' .github/workflows/sbom.yml && grep -q 'determinism' .github/workflows/sbom.yml"
    timeout_seconds: 60
  worktree_branch: wave/W2/m06/p3.t1-standalone-sbom-workflow
  agent_role: infra-yaml
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

