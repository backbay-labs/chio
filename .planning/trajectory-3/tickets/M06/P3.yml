    cmd: "grep -q 'cosign sign-blob' .github/workflows/sbom.yml && grep -q 'id-token: write' .github/workflows/sbom.yml && grep -q 'cyclonedx.json' .github/workflows/sbom.yml"
    timeout_seconds: 60
  worktree_branch: wave/W2/m06/p3.t4-cosign-sign-sbom-files
  agent_role: infra-yaml
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

