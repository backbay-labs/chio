    timeout_seconds: 60
  worktree_branch: wave/W2/m06/p3.t2-syft-source-tree-config
  agent_role: infra-yaml
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

