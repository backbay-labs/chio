# M06 Phase 2 - cargo-vet config + workspace import audit.
# Source of truth: .planning/trajectory-3/06-focused-formal-and-supply-chain.md
# (Phases section, P2 bullets). Wave: W2.
#
# P2 extends supply-chain/audits.toml (26 first-party rows today) with
# top-50 transitive dep certifications across async-runtime, serde,
# crypto, and tracing families. Adds standalone .github/workflows/cargo-vet.yml
# (today vet runs only inside ci.yml). Refreshes supply-chain/imports.lock.
# Chases the 891-row exemption baseline DOWN by 50-100 rows; do not
# chase zero per the milestone narrative.
#
# m06-supply-chain-pivot freeze opens at M06.P2.T1.

- id: M06.P2.T1
  milestone: M06
  phase: 2
  title: Seed cargo-vet certifications for top-50 transitive deps from M06.P0.T2 in supply-chain/audits.toml across async-runtime, serde, crypto, and tracing families
  status: pending
  effort_days: 2.0
  owner_glob:
    - supply-chain/audits.toml
  shared_paths: []
  depends_on:
    - M06.P0.T2
  soft_deps:
    - "trajectory-2 supply-chain/audits.toml carries 26 first-party safe-to-deploy rows signed @bb-connor; M06.P2 extends without deleting"
    - "candidate dep families: tokio + futures + tower + hyper + rustls (async runtime), serde + serde_json + serde_derive, ed25519-dalek + sha2 + subtle + zeroize (crypto), tracing + tracing-subscriber + tracing-log"
  gate_check:
    cmd: "cargo vet --locked 2>&1 | tee /tmp/m06-vet.txt; ROWS=$(grep -c 'who = \"@bb-connor\"' supply-chain/audits.toml); test \"$ROWS\" -gt 26"
    timeout_seconds: 600
  worktree_branch: wave/W2/m06/p2.t1-top-50-cargo-vet-seed
  agent_role: supply-chain
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

- id: M06.P2.T2
  milestone: M06
  phase: 2
  title: Refresh upstream cargo-vet imports via cargo vet regenerate imports and commit diff to supply-chain/imports.lock
  status: pending
  effort_days: 0.5
  owner_glob:
    - supply-chain/imports.lock
  shared_paths: []
  depends_on:
    - M06.P2.T1
  soft_deps:
    - "trajectory-2 supply-chain/config.toml lists 4 import feeds: bytecode-alliance, google, mozilla, zcash"
    - "cargo-vet 0.10.2 already pinned via .github/workflows/ci.yml; reuse the pin"
  gate_check:
    cmd: "cargo vet regenerate imports 2>&1 | tee /tmp/m06-imports.txt; test -f supply-chain/imports.lock && cargo vet --locked"
    timeout_seconds: 600
  worktree_branch: wave/W2/m06/p2.t2-regenerate-imports-lock
  agent_role: supply-chain
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

- id: M06.P2.T3
  milestone: M06
  phase: 2
  title: Add standalone .github/workflows/cargo-vet.yml running cargo vet --locked on every PR (cargo-vet 0.10.2 pinned; duplicate of in-ci.yml job for signal redundancy)
  status: pending
  effort_days: 0.5
  owner_glob:
    - .github/workflows/cargo-vet.yml
  shared_paths: []
  depends_on:
    - M06.P0.T1
  soft_deps:
    - "trajectory-2 .github/workflows/ci.yml line 302 already runs cargo vet --locked with cargo-vet 0.10.2; M06 adds a standalone workflow alongside"
    - "OWNERS.toml [milestones.M06] owner_globs names .github/workflows/cargo-vet.yml as M06-owned"
    - "duplication is intentional so the cargo-vet signal does not vanish if ci.yml drifts"
  gate_check:
    cmd: "test -f .github/workflows/cargo-vet.yml && grep -q 'cargo vet --locked' .github/workflows/cargo-vet.yml && grep -q '0.10.2' .github/workflows/cargo-vet.yml && grep -q 'ubuntu-24.04' .github/workflows/cargo-vet.yml"
    timeout_seconds: 60
  worktree_branch: wave/W2/m06/p2.t3-standalone-cargo-vet-workflow
  agent_role: infra-yaml
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

- id: M06.P2.T4
  milestone: M06
  phase: 2
  title: Chase 891-row exemption baseline DOWN by 50-100 rows in supply-chain/config.toml (target 791-841 remaining; do not chase zero)
  status: pending
  effort_days: 2.0
  owner_glob:
    - supply-chain/config.toml
  shared_paths:
    - supply-chain/audits.toml
  depends_on:
    - M06.P2.T1
  soft_deps:
    - "milestone narrative says explicitly do not chase zero; the 891-row exemption baseline accepts a documented threshold of audit-this-later rows"
    - "each removed row is either certified via an audits.toml row added in M06.P2.T1 or upgraded to a violation surfaced in CI"
  gate_check:
    cmd: "ROWS=$(grep -c '\\[\\[exemptions\\.' supply-chain/config.toml); test \"$ROWS\" -ge 791 && test \"$ROWS\" -le 841 && cargo vet --locked"
    timeout_seconds: 600
  worktree_branch: wave/W2/m06/p2.t4-exemption-chase-down
  agent_role: supply-chain
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

