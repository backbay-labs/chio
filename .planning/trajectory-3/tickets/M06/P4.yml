# M06 Phase 4 - CVE-alert workflow.
# Source of truth: .planning/trajectory-3/06-focused-formal-and-supply-chain.md
# (Phases section, P4 bullets). Wave: W2.
#
# P4 adds standalone .github/workflows/cve-monitor.yml with cargo-audit
# (Rust primary) and osv-scanner (Python, JS secondary) lanes; nightly
# cron plus on-PR triggers. GitHub Issues auto-file routes to @bb-connor
# on advisory hit; severity filter at >= medium for issue creation,
# lower severities go to a weekly digest issue. P4.T4 refreshes the 10
# deny.toml advisory ignores (close by upstream bump preferred,
# re-justify with last-checked date stamp otherwise).
#
# m06-supply-chain-pivot freeze closes at M06.P4.T5 (along with M06.P2.T5 + M06.P3.T5).

- id: M06.P4.T1
  milestone: M06
  phase: 4
  title: Add .github/workflows/cve-monitor.yml running cargo-audit on every PR plus nightly cron with block-on-new-advisory and pinned cargo-audit version
  status: pending
  effort_days: 0.75
  owner_glob:
    - .github/workflows/cve-monitor.yml
  shared_paths: []
  depends_on:
    - M06.P0.T4
  soft_deps:
    - "trajectory-2 advisory-db monitoring is on-pull only via cargo-deny inside ci.yml; M06 adds the synchronous cargo-audit gate the M09 HITRUST control map demands"
    - "OWNERS.toml [milestones.M06] owner_globs names .github/workflows/cve-monitor.yml as M06-owned"
    - "cargo-audit pinned to latest tagged release at workflow-merge time"
  gate_check:
    cmd: "test -f .github/workflows/cve-monitor.yml && grep -q 'cargo audit\\|cargo-audit' .github/workflows/cve-monitor.yml && grep -q 'schedule:' .github/workflows/cve-monitor.yml && grep -q 'pull_request' .github/workflows/cve-monitor.yml"
    timeout_seconds: 60
  worktree_branch: wave/W2/m06/p4.t1-cargo-audit-cve-monitor
  agent_role: infra-yaml
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

