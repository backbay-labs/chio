# M06 Phase 1 - Apalache spec for kernel-state subset (4 invariants).
# Source of truth: .planning/trajectory-3/06-focused-formal-and-supply-chain.md
# (Phases section, P1 bullets). Wave: W2.
#
# P1 creates formal/apalache/ from scratch (the directory does not
# exist today). Common.tla carries the type annotations and bounded
# sets shared across the 4 invariant specs. Each invariant lands as
# its own .tla + MC*.cfg pair under formal/apalache/. The CI lane in
# .github/workflows/apalache-nightly.yml runs apalache-mc check
# against each MC*.cfg and the RevocationEventuallySeen liveness check
# via --temporal=. Bounded sets: Authorities = 1..3, CapSet = 1..6,
# EpochMax = 4 (smaller than the TLC bounds in MCRevocationPropagation.cfg
# to fit the SMT envelope).
#
# m06-revocation-oracle-pivot freeze opens at M06.P1.T1.

- id: M06.P1.T1
  milestone: M06
  phase: 1
  title: Scaffold formal/apalache/ with README.md, Common.tla type annotations, and bounded-set parameters (Authorities = 1..3, CapSet = 1..6, EpochMax = 4)
  status: pending
  effort_days: 1.0
  owner_glob:
    - formal/apalache/README.md
    - formal/apalache/Common.tla
  shared_paths:
    - formal/MAPPING.md
  depends_on:
    - M06.P0.T1
  soft_deps:
    - "trajectory-2 formal/tla/RevocationPropagation.tla and DelegationDepthBound.tla provide the kernel-state shape; Apalache annotation comments are added to subset variables"
    - "research/m06/RESEARCH.md section 'Apalache scope reduction (D04)' enumerates the state-variable subset and transition subset"
  gate_check:
    cmd: "test -d formal/apalache && test -f formal/apalache/README.md && test -f formal/apalache/Common.tla && grep -q '@type:' formal/apalache/Common.tla && grep -q 'Authorities' formal/apalache/Common.tla && grep -q 'CapSet' formal/apalache/Common.tla && grep -q 'EpochMax' formal/apalache/Common.tla"
    timeout_seconds: 60
  worktree_branch: wave/W2/m06/p1.t1-apalache-scaffold-and-common
  agent_role: formal-tla
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

