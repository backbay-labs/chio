# P5 closes the audit doc and emits the M08 cross-ref hook. The post-flip CI
# run from M05.P4.T3 is the load-bearing evidence the M08 reviewer cites.

- id: M05.P5.T1
  milestone: M05
  phase: 5
  title: Regenerate docs/security/threat-coverage.md so Partial heading is empty and verify zero-partial JSON state
  status: pending
  effort_days: 0.5
  owner_glob:
    - docs/security/threat-coverage.md
  shared_paths: []
  depends_on:
    - M05.P4.T3
  soft_deps:
    - "doc generator at chio-spec-codegen --threat-model emits the regenerated markdown"
  gate_check:
    cmd: "test -f docs/security/threat-coverage.md && ! grep -E '^## Partial' docs/security/threat-coverage.md && python3 -c \"import json; d=json.load(open('spec/security/chio-threat-model.v1.json')); partial=[t['id'] for t in d['threats'] if t.get('coverage_state')=='partial']; assert not partial, f'partial rows remain: {partial}'\""
    timeout_seconds: 300
  worktree_branch: wave/W1/m05/p5.t1-regenerate-coverage-doc-zero-partial
  agent_role: spec-rust
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

