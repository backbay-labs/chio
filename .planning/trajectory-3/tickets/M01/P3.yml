# M01 Phase 3 - Audit-log export schema v1 negotiated with Opus team.
# Source of truth: .planning/trajectory-3/01-opus-design-partner-pilot.md
# (section "Phases" P3) + .planning/trajectory-3/research/m01/RESEARCH.md.
#
# Five tickets ship spec/audit-log/export-schema.v1.json with field
# mapping for OCSF / CEF / LEEF / Splunk-HEC plus a CEF emitter at
# crates/chio-siem/src/exporters/cef.rs. M01.P3.T1 OPENS the
# m01-m09-audit-handoff freeze (freezes.yml lines 166-177); freeze
# closes at M01.P5.T5.
#
# FREEZE TRIGGER: M01.P3.T1 merge opens m01-m09-audit-handoff on
# spec/audit-log/export-schema.v1.json + .planning/trajectory-3/audits/
# M01-opus-pilot.md. While active, only M01 may write to those paths.

- id: M01.P3.T1
  milestone: M01
  phase: 3
  title: Open spec/audit-log/export-schema.v1.json (JSON Schema 2020-12) and trigger m01-m09-audit-handoff freeze
  status: pending
  effort_days: 1.5
  owner_glob:
    - spec/audit-log/export-schema.v1.json
  shared_paths: []
  depends_on:
    - M01.P0.T1
  soft_deps:
    - "crates/chio-siem/src/ocsf.rs already ships the OCSF 1.3.0 Authorization mapper (OCSF_CLASS_UID 3002, OCSF_CATEGORY_UID 3); the schema's OCSF section cites lines 8-32 verbatim"
    - "freezes.yml m01-m09-audit-handoff opens at this ticket merge; closes at M01.P5.T5"
    - "M03 hosted CI is a soft prerequisite per RESEARCH.md cross-milestone notes; M01 P3 may run on best-effort CI"
  gate_check:
    cmd: "test -f spec/audit-log/export-schema.v1.json && python3 -c 'import json; s=json.load(open(\"spec/audit-log/export-schema.v1.json\")); assert s.get(\"$schema\",\"\").startswith(\"https://json-schema.org/draft/2020-12\"), s.get(\"$schema\")' && grep -q 'OCSF' spec/audit-log/export-schema.v1.json && grep -qE 'CEF|LEEF' spec/audit-log/export-schema.v1.json"
    timeout_seconds: 300
  worktree_branch: wave/W1/m01/p3.t1-export-schema-v1-open
  agent_role: spec-rust
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

- id: M01.P3.T2
  milestone: M01
  phase: 3
  title: Add CEF emitter at crates/chio-siem/src/exporters/cef.rs (or LEEF if Opus SOC is QRadar-shaped)
  status: pending
  effort_days: 1.5
  owner_glob:
    - crates/chio-siem/src/exporters/cef.rs
    - crates/chio-siem/src/exporters/mod.rs
    - crates/chio-siem/src/lib.rs
    - crates/chio-siem/tests/cef_emitter.rs
    - crates/chio-siem/src/exporters/cef.golden.txt
  shared_paths: []
  depends_on:
    - M01.P3.T1
  soft_deps:
    - "verified absent today: grep -rln 'CEF' crates/chio-siem returns nothing; this ticket adds the missing surface"
    - "RESEARCH.md audit-log export schema research recommends shipping one of CEF/LEEF in v1; CEF is the higher-leverage default"
    - "crates/chio-siem/src/exporters/{splunk,elastic,datadog,sumo_logic,webhook}.rs are the existing transport siblings; cef.rs follows the same shape"
  gate_check:
    cmd: "cargo test -p chio-siem --test cef_emitter --quiet && cargo clippy -p chio-siem -- -D warnings && test -f crates/chio-siem/src/exporters/cef.rs && grep -q 'CEF' crates/chio-siem/src/exporters/cef.rs && grep -q 'CefExporter\\|LeefExporter' crates/chio-siem/src/lib.rs"
    timeout_seconds: 600
  worktree_branch: wave/W1/m01/p3.t2-cef-emitter
  agent_role: kernel-rust
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

