# (section "Phases" P4) + .planning/trajectory-3/research/m01/RESEARCH.md.
#
# Six tickets. Calendar-driven phase. Window starts no later than week
# 8 of W1 per risk 3 in the narrative. Four weekly reviews at 0.5 days
# each, one rollup, and one bounded-profile-hold attestation.
#
# All P4 tickets write to the audit doc. m01-m09-audit-handoff freeze
# is active throughout P4 (open at M01.P3.T1, closes at M01.P5.T5).

