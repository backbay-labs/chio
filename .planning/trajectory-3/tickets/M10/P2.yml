- id: M10.P2.T3
  milestone: M10
  phase: 2
  title: Run MCP conformance suite at pinned commit hash and record pass plus skip count
  status: pending
  effort_days: 1.0
  owner_glob:
    - integrations/mcp-adapter/tests/conformance_suite.rs
    - .planning/trajectory-3/audits/M10-bedrock-mcp.md
  shared_paths: []
  depends_on:
    - M10.P2.T2
  soft_deps:
    - "Pinned hash from P0.T6; closure clause text 'Chio MCP server passes draft conformance suite vN at hash X; N tests pass, M tests skipped' is recorded in section 6 of the audit doc"
    - "Failure halts the phase; the moving-target risk (RESEARCH risk #2) is bounded by pinning the hash, not by chasing suite head"
  gate_check:
    cmd: >-
      cargo test -p chio-mcp-adapter-integration --test conformance_suite --quiet && grep -qE 'P2.T3 conformance run \| [0-9]{4}-[0-9]{2}-[0-9]{2}' .planning/trajectory-3/audits/M10-bedrock-mcp.md
    timeout_seconds: 1200
  worktree_branch: wave/W3/m10/p2.t3-run-mcp-conformance-suite-at-pinned-hash
  agent_role: provider-rust
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

