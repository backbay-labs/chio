# M10 Phase 2 - MCP adapter authored against conformance bench.
# Source of truth: .planning/trajectory-3/10-aws-bedrock-mcp-conformance.md
# (Phase P2 section). Wave 3 (distribution).
#
# CROSS-MILESTONE NOTE: trajectory-1 chio-mcp-edge is the substrate.
# M10 P2 extends the crate with Streamable HTTP transport plus
# OAuth 2.1 + PKCE per RFC9728 (Protected Resource Metadata) and
# adds the Chio-side audit-log + policy-enforcement hooks per the
# MCP April 2026 roadmap.
#
# Conformance suite is roadmap-status as of April 2026. P2.T3 runs
# the suite at the P0.T6-pinned hash and records pass + skip + hash
# in the audit doc. Failure halts the phase.
#
# Regenerate the manifest after edits: cargo xtask trajectory regen-manifest.

- id: M10.P2.T1
  milestone: M10
  phase: 2
  title: Create integrations/mcp-adapter/ extending chio-mcp-edge with Streamable HTTP transport
  status: pending
  effort_days: 2.0
  owner_glob:
    - integrations/mcp-adapter/Cargo.toml
    - integrations/mcp-adapter/src/lib.rs
    - integrations/mcp-adapter/src/transport.rs
    - integrations/mcp-adapter/src/receipt_emit.rs
    - integrations/mcp-adapter/tests/transport_round_trip.rs
  shared_paths:
    - Cargo.toml
    - Cargo.lock
  depends_on:
    - M10.P0.T6
  soft_deps:
    - "trajectory-1 crates/chio-mcp-edge/ is preserved; this milestone extends rather than refactors"
    - "trajectory-2 receipt format spec governs every tools/call receipt; M02 eval-receipt format is consumed for evaluation-driven tools"
    - "chio-openapi-mcp-bridge is a useful adjacency for AgentCore Gateway integration tests but is not republished as part of M10"
  gate_check:
    cmd: >-
      cargo test -p chio-mcp-adapter-integration --quiet && cargo clippy -p chio-mcp-adapter-integration -- -D warnings
    timeout_seconds: 900
  worktree_branch: wave/W3/m10/p2.t1-mcp-adapter-streamable-http-transport
  agent_role: provider-rust
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

