# M03 Phase 3 - Reproducible-build pipeline scaffold (Linux x86_64).
# Source of truth: .planning/trajectory-3/03-hosted-ci-truth-and-reproducible-builds.md
# (section "Phases" P3).
#
# Milestone scope (from .planning/trajectory-3/03-...md): P3 lands the
# reproducible-build workflow plus the determinism dampeners. Two
# parallel ubuntu-24.04 builders consume SOURCE_DATE_EPOCH from the tag
# commit time, run the same `cargo build --release -p chio-cli` against
# a pinned rust-toolchain.toml, and a third gate job downloads both
# artifact sets and diffs sha256. Mismatch fails the workflow.
# Reproducibility is scoped to Linux x86_64 only for v3.18 per P0.T4
# carve-out; macOS and Windows non-determinism (codesign timestamps,
# PE COFF timestamps) is documented out of scope.
#
# CROSS-MILESTONE GATE: P3 outputs (rust-toolchain.toml,
# [profile.release] block, reproducible-build.yml) are inputs to P4
# (SLSA attestation end-to-end + checksum index publication). The two-
# builder hash compare gate must be green on a probe tag before P4
# starts; otherwise the checksum index would be witnessing a
# non-reproducible artifact.
#
# Regenerate the manifest after edits: `cargo xtask trajectory regen-manifest`.

- id: M03.P3.T1
  milestone: M03
  phase: 3
  title: Pin [profile.release] block in workspace Cargo.toml (codegen-units=1, lto=fat, strip=symbols, panic=abort)
  status: merged
  effort_days: 0.5
  owner_glob:
    - Cargo.toml
  shared_paths:
    - Cargo.toml
    - Cargo.lock
  depends_on:
    - M03.P1.T1
  soft_deps:
    - "determinism dampener; not a reproducibility silver bullet but removes the largest sources of drift per RESEARCH.md section 'Reproducible-build readiness'"
    - "panic=abort is already the workspace release setting; verify before re-asserting"
  gate_check:
    cmd: "grep -A6 '\\[profile.release\\]' Cargo.toml | grep -q 'codegen-units = 1' && grep -A6 '\\[profile.release\\]' Cargo.toml | grep -qE 'lto = (\"fat\"|true)' && grep -A6 '\\[profile.release\\]' Cargo.toml | grep -qE 'strip' && cargo build --workspace --release --quiet"
    timeout_seconds: 1800
  worktree_branch: wave/W1/m03/p3.t1-pin-profile-release
  agent_role: dx-rust
  review_required:
    - "@bb-connor"
  first_commit_sha: 290a76a58179ed1b111525d586e63ae0598e03cc
  merged_sha: 290a76a58179ed1b111525d586e63ae0598e03cc
  opened_ts: "2026-05-02T04:27:45Z"
  merged_ts: "2026-05-02T04:27:45Z"

- id: M03.P3.T2
  milestone: M03
  phase: 3
  title: Land rust-toolchain.toml at workspace root pinning channel to exact version (1.85.0 for v3.18); update ci.yml to honour it
  status: merged
  effort_days: 0.5
  owner_glob:
    - rust-toolchain.toml
    - .github/workflows/ci.yml
  shared_paths:
    - .github/workflows/ci.yml
  depends_on:
    - M03.P3.T1
  soft_deps:
    - "today ci.yml runs `rustup toolchain install stable --profile minimal --component rustfmt --component clippy` which floats; rust-toolchain.toml is authoritative once committed"
    - "PR-tier ergonomics preserved: contributors get the pinned toolchain on first build; reproducible-build.yml reads the same file"
  gate_check:
    cmd: "test -f rust-toolchain.toml && grep -qE 'channel = \"1\\.[0-9]+\\.[0-9]+\"' rust-toolchain.toml && cargo --version | grep -qE '^cargo 1\\.[0-9]+'"
    timeout_seconds: 600
  worktree_branch: wave/W1/m03/p3.t2-pin-rustc-toolchain
  agent_role: dx-rust
  review_required:
    - "@bb-connor"
  first_commit_sha: 218bf9e1ce518d5b1f2034b3de6f1fc5c3a5f6ba
  merged_sha: 218bf9e1ce518d5b1f2034b3de6f1fc5c3a5f6ba
  opened_ts: "2026-05-02T04:27:45Z"
  merged_ts: "2026-05-02T04:27:45Z"

- id: M03.P3.T3
  milestone: M03
  phase: 3
  title: Author .github/workflows/reproducible-build.yml with builder-a and builder-b on independent ubuntu-24.04 instances (SOURCE_DATE_EPOCH from tag commit time)
  status: merged
  effort_days: 1.5
  owner_glob:
    - .github/workflows/reproducible-build.yml
  shared_paths: []
  depends_on:
    - M03.P3.T2
  soft_deps:
    - "trigger is the same v*.*.* tag push as release-binaries.yml plus workflow_dispatch; SOURCE_DATE_EPOCH derived from `git log -1 --format=%ct refs/tags/${tag}`"
    - "scope is `cargo build --release -p chio-cli` on Linux x86_64 only; macOS / Windows out of scope per P0.T4 carve-out"
    - "actions/* dependencies SHA-pinned matching ci.yml and release-binaries.yml conventions"
  gate_check:
    cmd: "test -f .github/workflows/reproducible-build.yml && grep -q 'SOURCE_DATE_EPOCH' .github/workflows/reproducible-build.yml && grep -qE 'builder-a|builder_a' .github/workflows/reproducible-build.yml && grep -qE 'builder-b|builder_b' .github/workflows/reproducible-build.yml && grep -q 'ubuntu-24.04' .github/workflows/reproducible-build.yml"
    timeout_seconds: 600
  worktree_branch: wave/W1/m03/p3.t3-reproducible-build-workflow
  agent_role: infra-yaml
  review_required:
    - "@bb-connor"
  first_commit_sha: 566f10c9bbee224d0f018667ffd776c68d6a188e
  merged_sha: 566f10c9bbee224d0f018667ffd776c68d6a188e
  opened_ts: "2026-05-02T04:27:45Z"
  merged_ts: "2026-05-02T04:27:45Z"

- id: M03.P3.T4
  milestone: M03
  phase: 3
  title: Author reproducibility-gate job in reproducible-build.yml that diffs sha256 of every chio-cli binary across the two builders; fails on mismatch
  status: merged
  effort_days: 1
  owner_glob:
    - .github/workflows/reproducible-build.yml
  shared_paths:
    - .github/workflows/reproducible-build.yml
  depends_on:
    - M03.P3.T3
  soft_deps:
    - "gate job runs `needs: [builder-a, builder-b]`; uses actions/download-artifact (SHA-pinned matching slsa.yml) to fetch both sets; emits per-binary digest pair into the run log on mismatch"
    - "mismatch surface is a precondition for P4; without a green gate the checksum index witnesses a non-reproducible artifact"
  gate_check:
    cmd: "grep -A2 'reproducibility-gate' .github/workflows/reproducible-build.yml | grep -qE 'needs:' && grep -qE 'sha256sum|shasum' .github/workflows/reproducible-build.yml && grep -qE 'diff|cmp' .github/workflows/reproducible-build.yml"
    timeout_seconds: 300
  worktree_branch: wave/W1/m03/p3.t4-repro-hash-compare-gate
  agent_role: infra-yaml
  review_required:
    - "@bb-connor"
  first_commit_sha: 566f10c9bbee224d0f018667ffd776c68d6a188e
  merged_sha: 566f10c9bbee224d0f018667ffd776c68d6a188e
  opened_ts: "2026-05-02T04:27:45Z"
  merged_ts: "2026-05-02T04:27:45Z"

