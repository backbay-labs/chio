# M03 Phase 5 - Third-party rebuild reproduction + v3.18 retroactive certification.
# Source of truth: .planning/trajectory-3/03-hosted-ci-truth-and-reproducible-builds.md
# (section "Phases" P5).
#
# Milestone scope (from .planning/trajectory-3/03-...md): P5 closes the
# milestone. Hosted CI re-runs against the v3.18 release commit; the
# named third-party rebuilder runs scripts/rebuild-from-source.sh against
# v3.18; matched hashes plus a signed authorship attestation land in the
# audit doc. Per D13, the rebuilder is independent of the chio core team
# and named in P0.T3 (lead-time bottleneck on this engagement is the
# reason P0 pre-names them).
#
# CROSS-MILESTONE GATE: P5 closure attestations populate audit-doc
# section 4 (hosted CI run URL, reproducible-build hash, SLSA L3
# provenance file URL, third-party rebuilder identity, matched hash,
# date). Once filled, the M08 vendor-evidence reviewer and M09 HITRUST
# i1 assessor can cite these artifacts directly. M01 production cut for
# the M01 design-partner pilot is unblocked.
#
# T2.a is a 0.25-day vendor-evidence-shaped ticket per the trajectory-3
# style guide: low-effort paperwork capturing the calendar dependency on
# the rebuilder's response without implying engineering work.
#
# Regenerate the manifest after edits: `cargo xtask trajectory regen-manifest`.

- id: M03.P5.T1
  milestone: M03
  phase: 5
  title: Re-run hosted CI on v3.18 release SHA; record run URL in audit-doc closure attestation section 4
  status: pending
  effort_days: 0.5
  owner_glob:
    - .planning/trajectory-3/audits/M03-ci-restoration.md
  shared_paths: []
  depends_on:
    - M03.P4.T5
  soft_deps:
    - "v3.18 release SHA is an open question per RESEARCH.md section 'Open questions for IMPLEMENT phase'; pin the SHA in P0.T1 audit doc baseline before P5 starts"
    - "expected workflows: ci.yml (six required checks), release-binaries.yml (five-target matrix), slsa.yml (SLSA L3 attestation), reproducible-build.yml (two-builder hash compare)"
  gate_check:
    cmd: "grep -A3 'closure attestations' .planning/trajectory-3/audits/M03-ci-restoration.md | grep -qE 'https://github.com/[^[:space:]]*/actions/runs/[0-9]+'"
    timeout_seconds: 300
  worktree_branch: wave/W1/m03/p5.t1-rerun-ci-on-v318
  agent_role: infra-yaml
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

