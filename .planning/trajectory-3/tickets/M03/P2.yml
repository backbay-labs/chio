# M03 Phase 2 - Admin-merge bypass scope inventory and silent regression triage.
# Source of truth: .planning/trajectory-3/03-hosted-ci-truth-and-reproducible-builds.md
# (section "Phases" P2).
#
# Milestone scope (from .planning/trajectory-3/03-...md): P2 takes the 118
# PRs in #306-#425 that merged via admin override after every required
# check came back red, runs CI on each merge commit, and answers the one
# question that matters: which of the 118 would have failed CI on a
# working runner? Approach per RESEARCH.md "Admin-merge bypass inventory
# and bisect plan": re-run CI on main HEAD first; if green, the 118 are
# merge-clean by accident. If red, bisect via workflow_dispatch with
# explicit ref against the 118 merge commits in binary-search order, with
# the m{nn}-freeze-guard sentinels run first as a quick screen.
#
# CROSS-MILESTONE GATE: P2.T3 surfaced regressions are routed to their
# owning milestones (M04 / M05 / M06 / M07 etc.) as new tickets. M03
# does NOT fix bypass-hidden regressions; M03 triages and refers. The
# escalation cap is 5 surfaced failures; above 5 the canonical
# halt-trigger fires (regression cascade exceeds budget).
#
# Regenerate the manifest after edits: `cargo xtask trajectory regen-manifest`.

- id: M03.P2.T1
  milestone: M03
  phase: 2
  title: Author scripts/bisect-bypass.sh that dispatches CI workflow_dispatch against each of the 118 PR SHAs in #306-#425
  status: merged
  effort_days: 1
  owner_glob:
    - scripts/bisect-bypass.sh
  shared_paths: []
  depends_on:
    - M03.P1.T1
  soft_deps:
    - "gh run rerun --commit <sha> is not a real flag per RESEARCH.md; the supported approach is workflow_dispatch with explicit ref or a probe branch at the commit SHA"
    - "script is idempotent and safe to re-run; output CSV under .planning/trajectory-3/audits/M03-bypass-bisect.csv with one row per PR (number, merge_sha, dispatch_run_id, conclusion, owning_milestone)"
  gate_check:
    cmd: "test -x scripts/bisect-bypass.sh && bash -n scripts/bisect-bypass.sh && grep -q 'workflow_dispatch' scripts/bisect-bypass.sh && grep -qE '306|425' scripts/bisect-bypass.sh"
    timeout_seconds: 300
  worktree_branch: wave/W1/m03/p2.t1-bisect-bypass-script
  agent_role: infra-yaml
  review_required:
    - "@bb-connor"
  first_commit_sha: 69495c84d1426de726cdcc066b939f0623abf87e
  merged_sha: 69495c84d1426de726cdcc066b939f0623abf87e
  opened_ts: "2026-05-02T03:51:15Z"
  merged_ts: "2026-05-02T03:51:15Z"

