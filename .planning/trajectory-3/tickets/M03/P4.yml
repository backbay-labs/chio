# M03 Phase 4 - SLSA L3 attestation end-to-end + public checksum index.
# Source of truth: .planning/trajectory-3/03-hosted-ci-truth-and-reproducible-builds.md
# (section "Phases" P4).
#
# Milestone scope (from .planning/trajectory-3/03-...md): P4 verifies the
# SLSA L3 generator at .github/workflows/slsa.yml runs end-to-end
# (it has never been exercised against a real tag because billing has
# been failing since before the first scheduled release), and lands the
# public checksum index that the M08 reviewer and M09 HITRUST assessor
# cite. The index lives at supply-chain/checksums/v<tag>.txt, is
# cosign-signed, and cites the Rekor UUID emitted by the
# slsa-github-generator reusable workflow as the witness.
#
# CROSS-MILESTONE GATE: P4 outputs are read by M08 (vendor-evidence
# RELEASE_AUDIT memo cites reproducible-build hash and SLSA provenance)
# and by M09 (HITRUST i1 assessor expects SLSA evidence on v3.18). M03
# does not move until both files exist on the v3.18 release.
#
# slsa.yml is owned by M09 per OWNERS.toml workflow lane; this phase
# coordinates with M09 on any pin updates rather than forking the
# generator workflow.
#
# Regenerate the manifest after edits: `cargo xtask trajectory regen-manifest`.

- id: M03.P4.T1
  milestone: M03
  phase: 4
  title: Verify slsa.yml end-to-end against probe tag v0.0.0-m03-probe; record Rekor UUID in audit doc
  status: pending
  effort_days: 1
  owner_glob:
    - .planning/trajectory-3/audits/M03-ci-restoration.md
  shared_paths: []
  depends_on:
    - M03.P3.T4
  soft_deps:
    - "slsa.yml is owned by M09 per OWNERS.toml; M03 verifies it runs end-to-end without modifying its pin (slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a)"
    - "expected output: chio-<source_sha>.intoto.jsonl uploaded to the probe tag's GitHub Release; Rekor UUID emitted by the reusable generator and surfaced in the run log"
    - "slsa.yml's release-vs-non-release branching reads release-metadata.json from release-binaries.yml; both must run for the chain to complete"
  gate_check:
    cmd: "grep -qE 'rekor.*[0-9a-f]{40,}|tlog' .planning/trajectory-3/audits/M03-ci-restoration.md && grep -q 'intoto.jsonl' .planning/trajectory-3/audits/M03-ci-restoration.md"
    timeout_seconds: 300
  worktree_branch: wave/W1/m03/p4.t1-slsa-end-to-end-probe
  agent_role: supply-chain
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

- id: M03.P4.T2
  milestone: M03
  phase: 4
  title: Extend release-binaries.yml to write supply-chain/checksums/v<tag>.txt after the matrix completes; auto-PR against main
  status: pending
  effort_days: 1.5
  owner_glob:
    - .github/workflows/release-binaries.yml
    - supply-chain/checksums/README.md
  shared_paths:
    - .github/workflows/release-binaries.yml
  depends_on:
    - M03.P4.T1
  soft_deps:
    - "format is one line per artifact, `<sha256>  <filename>`; matches `sha256sum --check` so reviewers can verify with stock tools"
    - "auto-PR is titled `chore(release): publish v<tag> checksum index`; triggered after the matrix completes via a follow-on job in the same workflow"
    - "supply-chain/checksums/README.md documents format and verification steps for external reviewers"
  gate_check:
    cmd: "grep -qE 'supply-chain/checksums' .github/workflows/release-binaries.yml && grep -qE 'sha256sum|shasum' .github/workflows/release-binaries.yml && test -f supply-chain/checksums/README.md"
    timeout_seconds: 300
  worktree_branch: wave/W1/m03/p4.t2-checksum-index-publication
  agent_role: supply-chain
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

- id: M03.P4.T3
  milestone: M03
  phase: 4
  title: cosign-sign supply-chain/checksums/v<tag>.txt; emit v<tag>.txt.sig and v<tag>.txt.pem alongside
  status: pending
  effort_days: 0.5
  owner_glob:
    - .github/workflows/release-binaries.yml
  shared_paths:
    - .github/workflows/release-binaries.yml
  depends_on:
    - M03.P4.T2
  soft_deps:
    - "cosign is already used by release-binaries.yml for *.tar.gz / *.zip blob signing; reuse the existing OIDC token exchange (`id-token: write`) rather than introducing a new signing identity"
    - "the .sig + .pem pair lets reviewers verify with `cosign verify-blob --certificate v<tag>.txt.pem --signature v<tag>.txt.sig v<tag>.txt`"
  gate_check:
    cmd: "grep -A5 'checksums/v.*\\.txt' .github/workflows/release-binaries.yml | grep -qE 'cosign sign-blob' && grep -qE 'v.*\\.txt\\.sig' .github/workflows/release-binaries.yml"
    timeout_seconds: 300
  worktree_branch: wave/W1/m03/p4.t3-cosign-sign-checksum-index
  agent_role: supply-chain
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

- id: M03.P4.T4
  milestone: M03
  phase: 4
  title: Cite Rekor UUID inside v<tag>.txt as comment header so the in-repo index is the index and Rekor is the witness
  status: pending
  effort_days: 0.5
  owner_glob:
    - .github/workflows/release-binaries.yml
  shared_paths:
    - .github/workflows/release-binaries.yml
  depends_on:
    - M03.P4.T3
  soft_deps:
    - "Rekor entry is emitted indirectly by the slsa-github-generator reusable workflow; release-binaries.yml reads the UUID from the workflow_run output of slsa.yml or queries Rekor directly by digest"
    - "tampering with the in-repo file without also re-Rekoring is detectable; reviewers cross-check the file against Rekor by UUID"
  gate_check:
    cmd: "grep -qE 'rekor|tlog' .github/workflows/release-binaries.yml && grep -qE 'cat.*v.*\\.txt|tee.*v.*\\.txt' .github/workflows/release-binaries.yml"
    timeout_seconds: 300
  worktree_branch: wave/W1/m03/p4.t4-rekor-citation-header
  agent_role: supply-chain
  review_required:
    - "@bb-connor"
  first_commit_sha: null
  merged_sha: null
  opened_ts: null
  merged_ts: null

