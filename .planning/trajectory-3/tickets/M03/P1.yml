# M03 Phase 1 - Hosted CI workflows re-enabled + spending cap pinned.
# Source of truth: .planning/trajectory-3/03-hosted-ci-truth-and-reproducible-builds.md
# (section "Phases" P1).
#
# Milestone scope (from .planning/trajectory-3/03-...md): P1 is the single
# highest-leverage phase in trajectory-3. Restoring hosted CI billing
# unblocks every other trajectory-3 milestone whose required-checks lane
# depends on a green hosted-runner signal: M02 verdict-matrix and
# conformance-matrix; M04 mutation-gate flip nightly; M05 threat-coverage
# closure; M06 cargo-vet / SBOM; M08 vendor-evidence cite of CI artifacts;
# M09 HITRUST evidence; M10 Bedrock marketplace conformance.
#
# CROSS-MILESTONE GATE: P1.T1 closure is the precondition for M02-M10
# Wave-1 starts; pin the audit-doc URL of the first green main run on
# all six required checks before declaring P1.T1 merged.
#
# Regenerate the manifest after edits: `cargo xtask trajectory regen-manifest`.

- id: M03.P1.T1
  milestone: M03
  phase: 1
  title: Confirm GitHub Actions billing restored; record green run URLs for the six required-check job names on main
  status: merged
  effort_days: 0.5
  owner_glob:
    - .planning/trajectory-3/audits/M03-ci-restoration.md
  shared_paths: []
  depends_on:
    - M03.P0.T2
  soft_deps:
    - "required-check job names per ci.yml header comment: 'Build, lint, test', 'MSRV build and test', 'cargo-vet (supply-chain audit)', 'cargo-deny (supply-chain bans/advisories/licenses)', 'freeze-guard' (m05-freeze-guard.yml), 'bench-regression' (bench-regression.yml)"
    - "ticket is operational, not code; gate-check is presence of six run URLs in the audit doc"
  gate_check:
    cmd: "grep -cE 'https://github.com/[^[:space:]]*/runs/[0-9]+' .planning/trajectory-3/audits/M03-ci-restoration.md | (read n; test \"$n\" -ge 6)"
    timeout_seconds: 300
  worktree_branch: wave/W1/m03/p1.t1-restore-billing-record-green-runs
  agent_role: infra-yaml
  review_required:
    - "@bb-connor"
  first_commit_sha: bcbad7bc7896ed49f6ab3f296ce6b5ec838ecdfa
  merged_sha: bcbad7bc7896ed49f6ab3f296ce6b5ec838ecdfa
  opened_ts: "2026-05-02T03:40:01Z"
  merged_ts: "2026-05-02T03:40:01Z"

- id: M03.P1.T2
  milestone: M03
  phase: 1
  title: Pin GitHub Actions spending cap above rolling burn plus 50% headroom; document cap value and 80% alert in ci-billing runbook
  status: merged
  effort_days: 0.5
  owner_glob:
    - docs/runbooks/ci-billing.md
  shared_paths: []
  depends_on:
    - M03.P1.T1
  soft_deps:
    - "rolling burn rate observed across one week of restored CI is the cap floor; trajectory-3 cadence baseline is $30-$50/day"
    - "billing trip on 2026-04-26T23:00Z is exactly the failure mode this cap is meant to prevent; cap must not be set so low that an organic surge re-trips it silently"
  gate_check:
    cmd: "grep -qE 'spending cap|spending limit' docs/runbooks/ci-billing.md && grep -qE '80%|0\\.8' docs/runbooks/ci-billing.md && grep -qE 'cap.*\\$|\\$.*cap|cap value' docs/runbooks/ci-billing.md"
    timeout_seconds: 300
  worktree_branch: wave/W1/m03/p1.t2-pin-spending-cap
  agent_role: infra-yaml
  review_required:
    - "@bb-connor"
  first_commit_sha: 7eaf20558c0359a9dea7c8747eb270ea9982ac5a
  merged_sha: 7eaf20558c0359a9dea7c8747eb270ea9982ac5a
  opened_ts: "2026-05-02T03:40:01Z"
  merged_ts: "2026-05-02T03:40:01Z"

