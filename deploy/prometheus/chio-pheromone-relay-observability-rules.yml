groups:
  - name: chio-pheromone-relay-observability
    rules:
      - alert: ChioPheromoneRelayDeadLetters
        expr: chio_pheromone_relay_queue_depth{status="dead_letter"} > 0
        for: 5m
        labels:
          severity: p2
          service: chio-pheromone-relay
          notification_route: pagerduty-primary
          opsgenie: relay-oncall
        annotations:
          summary: Chio pheromone relay has dead-lettered batches
          runbook: docs/release/CHIO_PHEROMONE_RELAY_RUNBOOK.md

      - alert: ChioPheromoneRelayRetryPressure
        expr: chio_pheromone_relay_queue_depth{status="retry"} > 100
        for: 10m
        labels:
          severity: p2
          service: chio-pheromone-relay
          notification_route: slack-ops-digest
          opsgenie: relay-oncall
        annotations:
          summary: Chio pheromone relay retry queue is elevated
          runbook: docs/release/CHIO_PHEROMONE_RELAY_RUNBOOK.md

      - alert: ChioPheromoneRelayStaleLeases
        expr: chio_pheromone_relay_stale_leases > 0
        for: 5m
        labels:
          severity: p2
          service: chio-pheromone-relay
          notification_route: slack-ops-digest
          opsgenie: relay-oncall
        annotations:
          summary: Chio pheromone relay has stale scheduler leases
          runbook: docs/release/CHIO_PHEROMONE_RELAY_RUNBOOK.md

      - alert: ChioPheromoneRelayReplayStorm
        expr: increase(chio_pheromone_relay_rejections_total{reason="relay_nonce_replay"}[5m]) > 10
        for: 2m
        labels:
          severity: p1
          service: chio-pheromone-relay
          notification_route: opsgenie-auth-watch
          opsgenie: relay-security
        annotations:
          summary: Chio pheromone relay is rejecting replayed relay nonces
          runbook: docs/release/CHIO_PHEROMONE_RELAY_RUNBOOK.md
