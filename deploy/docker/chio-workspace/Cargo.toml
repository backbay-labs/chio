# Generated by deploy/docker/chio-workspace/regenerate.sh.
# Docker uses this manifest to build chio-cli without copying non-product workspace roots.

[workspace]
resolver = "2"
members = ["crates/products/chio-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/backbay-labs/chio"

[workspace.metadata.chio]
rust_public_entrypoints = [
    "chio-api-protect",
    "chio-cli",
    "chio-conformance",
    "chio-control-plane",
    "chio-core",
    "chio-guards",
    "chio-hosted-mcp",
    "chio-kernel",
    "chio-manifest",
    "chio-mcp-adapter",
    "chio-mcp-edge",
    "chio-mcp-remote",
    "chio-policy",
    "chio-proof-room",
    "chio-wall",
]
rust_registry_public_crates = []

[workspace.metadata.cargo-vet]

[workspace.metadata.cargo-auditable]
# release-binaries.yml wraps every release build with `cargo auditable build`,
# embedding the workspace dependency graph (per RFC at
# github.com/rust-secure-code/cargo-auditable) into each published binary.
# Downstream consumers can extract the manifest with `cargo audit -f <binary>`
# to scan for known vulnerabilities without needing the source tree.

# Canonical workspace lint policy. Every member crate inherits this block via
# `[lints]\nworkspace = true` in its own manifest rather than hand-copying the
# denies, so the policy lives in exactly one place. When tightening the policy
# (for example adding `panic = "deny"`), edit it here only.
#
# `unwrap_used` / `expect_used` are denied because this is a fail-closed
# security kernel: an unhandled `Option`/`Result` panic in a guard or receipt
# path is an availability fault, not an acceptable shortcut. Crates that need a
# narrow, reviewed exception annotate the specific call site with
# `#[allow(clippy::unwrap_used)]` instead of opting the whole crate out.
#
# No `[workspace.lints.rust]` floor is defined: the only per-crate rust-lint
# usage today is bespoke `unexpected_cfgs` check-cfg registration (kani / loom /
# dhat) that cannot be hoisted, so those stay as local `[lints.rust]` tables.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
panic = "abort"

[profile.docker-release]
inherits = "release"
codegen-units = 16
lto = "thin"

# Dev/test debuginfo is disabled to keep `target/` from exploding. With ~130+
# workspace members, the default `debug = 2` made a full `cargo test --workspace`
# materialise ~130G+ of debuginfo and exhaust the disk mid-run. `debug = 0` cuts
# dev/test artifacts by well over half. Trade-off: backtraces lose file:line.
# Bump to `debug = 1` (line tables only) if you need them and have disk headroom.
# Debug-assertions and overflow-checks are unaffected (still on), so test
# behaviour is unchanged.
[profile.dev]
debug = 0
split-debuginfo = "off"

[profile.test]
debug = 0
split-debuginfo = "off"

[workspace.dependencies]
async-trait = "0.1"
aws-sdk-bedrockruntime = { version = "1.130.0", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-marketplaceentitlement = { version = "1", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-marketplacemetering = { version = "1", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip keeps f64 parsing exact so signed credentials persisted to
# JSON re-verify: canonical signing bytes are reproducible only if a reloaded
# float yields the exact bits that were signed.
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml = "0.9"
serde_yml = "0.0.12"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
miette = { version = "7.6.0", features = ["fancy"] }
chrono = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
fips204 = { version = "0.4.6", default-features = false, features = ["ml-dsa-65"] }
sev = { version = "7.1.0", default-features = false, features = ["snp", "crypto_nossl"] }
coset = { version = "0.4.2", default-features = false }
x509-parser = "0.16"
der = "0.7"
jsonwebtoken = "9"
rand_core = { version = "0.6", features = ["getrandom"] }
rand = "0.8"
rand_chacha = "0.3"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
hex = "0.4"
base64 = "0.22"
base64ct = "=1.8.3"
hmac = "0.12"
bs58 = "0.5"
chacha20poly1305 = "0.10"
ryu = "1"
sha2 = "0.10"
reqwest = { version = "0.13.2", default-features = false }
rusqlite = { version = "0.39", features = ["bundled"] }
rs_merkle = "1.5"
uuid = "1"
url = "2"
webauthn-rs = "=0.5.2"
webauthn-rs-proto = "=0.5.2"
proptest = "1.10"
criterion = "0.5"
dhat = "0.3"
tempfile = "3"
wiremock = "0.6"
testcontainers = { version = "0.27.3", default-features = false }
jsonschema = { version = "0.46", default-features = false, features = ["resolve-file"] }
# Pin concurrency primitives + tower feature set in the workspace so member
# crates can share resolved versions.
dashmap = "6"
arc-swap = "1"
loom = "0.7"
parking_lot = "0.12"
tower = { version = "0.5", features = ["util", "make", "buffer", "timeout", "load-shed", "limit", "retry"] }
tower-lsp = "0.20.0"
lsp-types = "0.95.1"
notify = "6.1.1"
opentelemetry-semantic-conventions = { version = "=0.29.0", default-features = false, features = ["semconv_experimental"] }
zeroize = "1.8"
# Workspace metric registry. Surfaced through workspace.dependencies so edge
# crates plus chio-wasm-guards consume the registry by
# `chio-metrics-spec = { workspace = true }` rather than each carrying its own
# `path = "..."` redeclaration.
chio-metrics-spec = { path = "crates/observability/chio-metrics-spec" }

# Internal Chio crates centralized here (Phase 2). Each member consumes them as
# `chio-x = { workspace = true }` (plus per-member features / default-features /
# optional / package-rename) instead of a scattered `path = "../chio-x"`. Paths
# point at the crates' CURRENT locations; the later folder move edits only this
# block. Entries are path-only on purpose: the same crate is consumed with
# differing default-features by different members, so feature/default-features
# selection must stay on the member side.
chio-a2a-adapter = { path = "crates/protocol/chio-a2a-adapter" }
chio-a2a-edge = { path = "crates/protocol/chio-a2a-edge" }
chio-acp-edge = { path = "crates/protocol/chio-acp-edge" }
