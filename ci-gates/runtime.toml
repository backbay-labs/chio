# ci-gates/runtime.toml
# Single source of truth for the chio-runtime fixture-and-schema gate cluster,
# the consolidated replacement for runtime fixture gates. Consumed by
# `cargo xtask check fixtures <runtime-facet>`. Fail-closed:
# this file MUST enumerate exactly the eight runtime facets; an unknown facet on
# the CLI is an error, and the xtask test `runtime_manifest_enumerates_all`
# rejects a short manifest.
#
# Only the tabular per-facet data lives here (schema/document validate pairs,
# cargo-test argv tails). The imperative per-facet steps the manifest cannot
# express (multi-step CLI admission/orchestration/ops pipelines, derived-fixture
# generation, report-content assertions, the cross-script recursion the scripts
# performed) live in typed Rust handlers keyed by `kind` in
# `xtask/src/fixtures_runtime.rs`.
#
# `validate` pairs name a schema and a committed document. A schema or document
# value containing a slash is resolved root-relative (e.g. an attest or
# federation schema, or the runtime-spine fixture tree); a bare filename for the
# schema lives in `schema_dir`.

schema_dir = "spec/schemas/chio-runtime/v1"

[[facet]]
name = "runtime-spine-fixtures"
kind = "spine_fixtures"
fixture_dir = "examples/chio-3vendor/fixtures/runtime-spine"
# These are the static schema-only validations the spine-fixtures script runs
# against committed fixtures (the signed-body and scenario derivations the
# script builds at runtime live in the handler).
validate = [
  { schema = "admission-profile.schema.json", doc = "examples/chio-3vendor/fixtures/runtime-spine/profile.json" },
  { schema = "admission-bundle.schema.json", doc = "examples/chio-3vendor/fixtures/runtime-spine/bundle.json" },
  { schema = "verifier-trust-bundle.schema.json", doc = "examples/chio-3vendor/fixtures/runtime-spine/runtime-trust-schema-only.json" },
  { schema = "trusted-verifiers.schema.json", doc = "examples/chio-3vendor/fixtures/runtime-spine/trusted-verifiers-schema-only.json" },
  { schema = "spec/schemas/chio-pheromone/v1/query-report.schema.json", doc = "examples/chio-3vendor/fixtures/runtime-spine/pheromone-query-report.json" },
  { schema = "step-evidence.schema.json", doc = "examples/chio-3vendor/fixtures/runtime-spine/runtime-step-evidence.json" },
  { schema = "evidence-manifest.schema.json", doc = "examples/chio-3vendor/fixtures/runtime-spine/runtime-evidence-manifest.json" },
  { schema = "proof-regeneration-input.schema.json", doc = "examples/chio-3vendor/fixtures/runtime-spine/runtime-proof-regeneration-input.json" },
  { schema = "proof-regeneration-report.schema.json", doc = "examples/chio-3vendor/fixtures/runtime-spine/runtime-proof-regeneration-report.json" },
  { schema = "proof-parity-report.schema.json", doc = "examples/chio-3vendor/fixtures/runtime-spine/runtime-proof-parity-report.json" },
]

[[facet]]
name = "runtime-spine"
kind = "spine"
fixture_dir = "examples/chio-3vendor/fixtures/runtime-spine"
# The spine schema-only block runs the spine-fixtures facet first, then validates
# the two attest fixtures below (handled by the spine_fixtures recursion in the
# handler). The full admission pipeline and its negative assertions are imperative.
validate = [
  { schema = "spec/schemas/chio-attest/v1/proof-package.schema.json", doc = "examples/chio-3vendor/fixtures/buyer-auditor-proof-package.json" },
  { schema = "spec/schemas/chio-attest/v1/verifier-report.schema.json", doc = "examples/chio-3vendor/fixtures/verifier-report.json" },
]
cargo_tests = [
  ["-p", "chio-runtime-core", "--tests"],
]

[[facet]]
name = "runtime-proof-parity"
kind = "proof_parity"
fixture_dir = "examples/chio-3vendor/fixtures/runtime-spine"
cargo_tests = [
  ["-p", "chio-runtime-core", "runtime_workflow_report"],
  ["-p", "chio-runtime-core", "proof_regeneration_report"],
  ["-p", "chio-runtime-core", "runtime_proof_regeneration"],
  ["-p", "chio-cli", "chio_runtime", "--bin", "chio"],
]

[[facet]]
name = "runtime-policy"
kind = "policy"
fixture_dir = "examples/chio-3vendor/fixtures/runtime-spine"
cargo_tests = [
  ["-p", "chio-runtime-core", "chio_native_runtime_policy_material_emits_chio_decision", "--test", "runtime_pheromone_policy"],
  ["-p", "chio-runtime-core", "runtime_trust_floor", "--test", "runtime_trust"],
  ["-p", "chio-cli", "chio_runtime", "--bin", "chio"],
]

[[facet]]
name = "runtime-ops-hardening"
kind = "ops_hardening"
fixture_dir = "examples/chio-3vendor/fixtures/runtime-spine"
cargo_tests = [
  ["-p", "chio-runtime-core", "runtime_ops"],
  ["-p", "chio-cli", "--bin", "chio", "chio_native_runtime_surface_parses"],
]

[[facet]]
name = "runtime-orchestration"
kind = "orchestration"
fixture_dir = "examples/chio-3vendor/fixtures/runtime-spine"
cargo_tests = [
  ["-p", "chio-runtime-core", "runtime_orchestration"],
  ["-p", "chio-runtime-core", "runtime_proof_drift"],
  ["-p", "chio-cli", "--bin", "chio", "chio_native_runtime_surface_parses"],
]

[[facet]]
name = "runtime-attack-simulation"
kind = "attack_simulation"
fixture_dir = "fixtures/proof-room/runtime-security/valid-side-effecting-call"
validate = [
  { schema = "attack-simulation-report.schema.json", doc = "attack-simulation-confused-deputy-route-metadata.json" },
  { schema = "attack-simulation-report.schema.json", doc = "attack-simulation-replayed-continuation-token.json" },
  { schema = "attack-simulation-report.schema.json", doc = "attack-simulation-stale-revocation-epoch.json" },
  { schema = "attack-simulation-report.schema.json", doc = "attack-simulation-policy-hot-reload-widening.json" },
  { schema = "attack-simulation-report.schema.json", doc = "attack-simulation-advisory-evidence-laundering.json" },
  { schema = "attack-simulation-report.schema.json", doc = "attack-simulation-external-payment-success-laundering.json" },
  { schema = "attack-simulation-report.schema.json", doc = "attack-simulation-route-plan-registry-downgrade.json" },
  { schema = "attack-simulation-report.schema.json", doc = "attack-simulation-tool-server-bypass-without-kernel-allow.json" },
  { schema = "attack-simulation-report.schema.json", doc = "attack-simulation-missing-denial-receipt.json" },
  { schema = "attack-simulation-report.schema.json", doc = "attack-simulation-sandbox-profile-mismatch.json" },
]
cargo_tests = [
  ["-p", "chio-control-plane", "--test", "runtime_security_passport", "side_effecting_runtime_claim_rejects_failed_attack_simulation_report"],
  ["-p", "chio-cli", "--test", "proof_cli_contract", "proof_fixture_list_reports_proof_fixtures"],
]

[[facet]]
name = "runtime-chaos"
kind = "chaos"
fixture_dir = "fixtures/proof-room/runtime-security/valid-side-effecting-call"
validate = [
  { schema = "chaos-run-report.schema.json", doc = "chaos-run-revocation-oracle-unavailable.json" },
  { schema = "chaos-run-report.schema.json", doc = "chaos-run-receipt-log-unavailable.json" },
  { schema = "chaos-run-report.schema.json", doc = "chaos-run-policy-reload-during-dispatch.json" },
  { schema = "chaos-run-report.schema.json", doc = "chaos-run-duplicate-nonce-race.json" },
  { schema = "chaos-run-report.schema.json", doc = "chaos-run-tool-restart-lost-lease-cache.json" },
  { schema = "chaos-run-report.schema.json", doc = "chaos-run-registry-split-brain.json" },
  { schema = "chaos-run-report.schema.json", doc = "chaos-run-clock-skew-expiry-bypass.json" },
  { schema = "chaos-run-report.schema.json", doc = "chaos-run-sandbox-profile-drift.json" },
]
cargo_tests = [
  ["-p", "chio-control-plane", "--test", "runtime_security_passport", "side_effecting_runtime_claim_rejects_failed_chaos_run_report"],
  ["-p", "chio-cli", "--test", "proof_cli_contract", "proof_fixture_list_reports_proof_fixtures"],
]
