# ci-gates/pheromone.toml
# Single source of truth for the pheromone fixture-and-schema gate cluster.
# Consumed by `cargo xtask check fixtures <facet>`. Fail-closed: this file MUST
# enumerate all 15 facets; an unknown facet on the CLI is an error, and the
# xtask test `manifest_enumerates_all_known_facets` rejects a short manifest.
#
# Per-facet imperative steps (CLI orchestration, fixture regen, npm, retired
# marker guards) live in typed Rust handlers selected by `kind`; this file only
# carries the tabular data those handlers and the generic handler consume.
#
# `schema_check` records the schema-shape assertion each facet's original gate
# made: "strict-object" requires `type=="object"` and `additionalProperties==false`;
# "frozen-object" requires `type=="object"` and a present `$id`.

schema_dir = "spec/schemas/chio-pheromone/v1"
schema_registry = "spec/schemas/registry.json"

[[facet]]
name = "directory-lifecycle"
kind = "directory_lifecycle"
schema_check = "strict-object"
fixture_dir = "examples/chio-3vendor/fixtures/pheromone/relay"
schemas = [
  { id = "chio.pheromone.peer-directory-state.v1", file = "peer-directory-state.schema.json" },
  { id = "chio.pheromone.peer-directory-rotation-report.v1", file = "peer-directory-rotation-report.schema.json" },
  { id = "chio.pheromone.relay-supervisor-profile.v1", file = "relay-supervisor-profile.schema.json" },
  { id = "chio.pheromone.relay-drill-report.v1", file = "relay-drill-report.schema.json" },
]
validate = [
  { schema = "peer-directory.schema.json", doc = "peer-directory.json" },
  { schema = "peer-directory-bundle.schema.json", doc = "peer-directory-bundle.json" },
  { schema = "peer-directory-bundle.schema.json", doc = "peer-directory-candidate.json" },
  { schema = "peer-directory-state.schema.json", doc = "peer-directory-state.json" },
  { schema = "peer-directory-rotation-report.schema.json", doc = "peer-directory-rotation-report.json" },
  { schema = "relay-supervisor-profile.schema.json", doc = "relay-supervisor-profile.json" },
  { schema = "relay-drill-report.schema.json", doc = "relay-drill-report.json" },
  { schema = "relay-negative-fixture-corpus.schema.json", doc = "negative-cases.json" },
]
cargo_tests = [
  ["-p", "chio-pheromone-relay", "directory"],
  ["-p", "chio-cli", "--bin", "chio", "chio_pheromone"],
]
recurse = [
  { facet = "relay-ops", mode = "schema-only" },
]

