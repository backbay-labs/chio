# Threat-model coverage map.
#
# Source of truth: spec/security/chio-threat-model.v1.json.
# File shape pinned by trajectory-2 M05 P5.T1 (chio-threat-model.schema.json
# coverage_state enum = {covered, partial, pending}).
#
# CI gate: scripts/check-threat-coverage.sh treats `covered` as PASS,
# fails on `partial`, and accepts `pending` only with a non-empty
# `deferred_to` field.
#
# Each entry records the threat ID, its coverage_state, the milestone
# that handed it to coverage, and the in-tree backing tests / fixtures
# the operator can grep to verify the claim.

schema: chio.security.coverage/v1
updated_at: "2026-04-30"

threats:
  # Trajectory-1 register (six initial IDs) is owned by M05 P5.T3 test
  # bodies and is not surfaced here until the chio-conformance threat
  # tests land. The gate evaluates any ID present in the threat-model
  # JSON; missing entries surface as `pending` without `deferred_to`
  # which fails the gate closed by design.

  # M10 P2 closes passkey_credential_theft via:
  #   - crates/chio-custody-hw/src/verifier.rs (PasskeyVerifier)
  #   - crates/chio-custody-hw/src/nonce_store.rs (replay-resistant store)
  #   - crates/chio-custody-hw/src/revocation.rs (M04 oracle cascade)
  #   - crates/chio-custody-hw/tests/replay_resistance.rs
  #   - crates/chio-custody-hw/tests/revocation_cascade.rs
  #   - crates/chio-custody-hw/tests/end_to_end.rs (M10.P2.T6)
  - id: passkey_credential_theft
    coverage_state: covered
    owned_by: M10
    closed_by: M10.P2.T6
    backing_evidence:
      - crates/chio-custody-hw/src/verifier.rs
      - crates/chio-custody-hw/src/nonce_store.rs
      - crates/chio-custody-hw/src/revocation.rs
      - crates/chio-custody-hw/tests/replay_resistance.rs
      - crates/chio-custody-hw/tests/revocation_cascade.rs
      - crates/chio-custody-hw/tests/end_to_end.rs

  # M10 P2.T4 audience-confusion property test exercises bit-flips on
  # the audience field of every minted PasskeyCapability and asserts
  # cross-audience presentation rejects fail-closed.
  - id: audience_confusion
    coverage_state: covered
    owned_by: M10
    closed_by: M10.P2.T4
    backing_evidence:
      - crates/chio-custody-hw/src/capability.rs
      - crates/chio-custody-hw/tests/audience_confusion.rs

  # M05 P1 closes weights_hash_spoof by adding a loaded-weight digest
  # surface to the provider conformance contract. Local providers can
  # recompute the digest from loaded bytes; hosted APIs and protocol
  # bridges return LoadedWeightsUnavailable, which the kernel binding
  # helper rejects fail-closed before provider bind succeeds.
  - id: weights_hash_spoof
    coverage_state: covered
    owned_by: M05
    closed_by: M05.P1.T3
    backing_evidence:
      - crates/chio-core-types/src/loaded_weights.rs
      - crates/chio-provider-conformance/src/loaded_weights.rs
      - crates/chio-weights/src/card.rs
      - crates/chio-weights/src/bundle.rs
      - crates/chio-kernel/src/weights_binding.rs
      - crates/chio-kernel/tests/weights_binding.rs
      - crates/chio-policy/src/weights.rs
      - crates/chio-cli/src/commands/bind.rs
      - crates/chio-conformance/tests/threats/weights_hash_spoof.rs
      - crates/chio-weights/tests/lineage_anchor.rs
      - crates/chio-weights/tests/equivalence.rs

  - id: pq_signature_downgrade
    coverage_state: covered
    owned_by: M05
    closed_by: M05.P4.T1
    backing_evidence:
      - crates/chio-attest-verify/tests/migration.rs
      - crates/chio-attest-verify/tests/v318_migration.rs
      - crates/chio-kernel/tests/pq_key_load_after_self_quote.rs
      - crates/chio-kernel/tests/hybrid_receipt_sign.rs
      - crates/chio-conformance/tests/threats/pq_signature_downgrade.rs

  - id: tee_quote_forgery
    coverage_state: covered
    owned_by: M05
    closed_by: M05.P4.T1
    backing_evidence:
      - crates/chio-attest-verify/tests/cross_backend_conformance.rs
      - crates/chio-attest-verify/tests/expect_report_data.rs
      - crates/chio-attest-verify/tests/tdx_integration.rs
      - crates/chio-attest-verify/tests/sev_snp_integration.rs
      - crates/chio-attest-verify/tests/nitro_unit.rs
      - crates/chio-attest-verify/tests/nitro_root_rotation.rs
      - crates/chio-kernel/tests/pq_key_load_after_self_quote.rs
      - crates/chio-conformance/tests/threats/tee_quote_forgery.rs

  - id: mobile_attestation_replay
    coverage_state: pending
    deferred_to: trajectory-4.M07.real-attestation
    owned_by: trajectory-4
    deferred_reason: "No conformance threat test exists for replayed App Attest assertions or Play Integrity tokens; mobile C-ABI entry points still return AttestationUnavailable."

  - id: device_key_extraction
    coverage_state: pending
    deferred_to: trajectory-4.M07.real-attestation
    owned_by: trajectory-4
    deferred_reason: "No conformance threat test proves hardware-bound mobile key custody; real-device attestation and receipt validation are deferred."

  - id: play_integrity_token_replay
    coverage_state: pending
    deferred_to: trajectory-4.M07.real-attestation
    owned_by: trajectory-4
    deferred_reason: "No conformance threat test proves Play Integrity nonce consumption or stale-token rejection; Google JWKS validation is deferred."

  - id: ssrf_via_http_substrate
    coverage_state: pending
    deferred_to: trajectory-4.hosted-http-egress-hardening
    owned_by: trajectory-4
    deferred_reason: "Deployment-specific HTTP egress hardening needs live hosted-substrate policy and redirect controls."

  - id: pii_phi_exposure
    coverage_state: pending
    deferred_to: trajectory-4.healthcare-phi-data-guard-validation
    owned_by: trajectory-4
    deferred_reason: "Regex guard coverage exists, but healthcare PHI validation requires deployment-specific patterns and binary response scope."

  - id: agent_velocity_abuse
    coverage_state: pending
    deferred_to: trajectory-4.distributed-rate-limit-store
    owned_by: trajectory-4
    deferred_reason: "Process-local rate limits do not close multi-identity or distributed quota abuse."

  - id: cumulative_data_exfiltration
    coverage_state: pending
    deferred_to: trajectory-4.cross-session-data-flow-accounting
    owned_by: trajectory-4
    deferred_reason: "Cross-session and semantic information-density accounting are outside the trajectory-3 threat closure."

  - id: behavioral_sequence_attack
    coverage_state: pending
    deferred_to: trajectory-4.behavioral-policy-compiler
    owned_by: trajectory-4
    deferred_reason: "Deployment-specific forbidden-transition policies need a policy compiler and non-adjacent sequence coverage."

  - id: wasm_guard_resource_exhaustion
    coverage_state: pending
    deferred_to: trajectory-4.wasm-runtime-quota-hardening
    owned_by: trajectory-4
    deferred_reason: "Fuel metering exists, but compile-time CPU and linear-memory pressure need runtime quota hardening."
