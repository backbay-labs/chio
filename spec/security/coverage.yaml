# Threat-model coverage map.
#
# Source of truth: spec/security/chio-threat-model.v1.json.
# File shape pinned by trajectory-2 M05 P5.T1 (chio-threat-model.schema.json
# coverage_state enum = {covered, partial, pending}).
#
# CI gate: trajectory-2 M05 P5.T4 (scripts/check-threat-coverage.sh) treats
# `covered` and `partial` as PASS; `pending` requires an explicit
# `deferred_to` field, otherwise the gate fails closed. See trajectory-2
# EXECUTION-BOARD.md section 9.
#
# Each entry records the threat ID, its coverage_state, the milestone
# that handed it to coverage, and the in-tree backing tests / fixtures
# the operator can grep to verify the claim.

schema: chio.security.coverage/v1
updated_at: "2026-04-30"

threats:
  # Trajectory-1 register (six initial IDs) is owned by M05 P5.T3 test
  # bodies and is not surfaced here until the chio-conformance threat
  # tests land. The gate evaluates any ID present in the threat-model
  # JSON; missing entries surface as `pending` without `deferred_to`
  # which fails the gate closed by design.

  # M10 P2 closes passkey_credential_theft via:
  #   - crates/chio-custody-hw/src/verifier.rs (PasskeyVerifier)
  #   - crates/chio-custody-hw/src/nonce_store.rs (replay-resistant store)
  #   - crates/chio-custody-hw/src/revocation.rs (M04 oracle cascade)
  #   - crates/chio-custody-hw/tests/replay_resistance.rs
  #   - crates/chio-custody-hw/tests/revocation_cascade.rs
  #   - crates/chio-custody-hw/tests/end_to_end.rs (M10.P2.T6)
  - id: passkey_credential_theft
    coverage_state: covered
    owned_by: M10
    closed_by: M10.P2.T6
    backing_evidence:
      - crates/chio-custody-hw/src/verifier.rs
      - crates/chio-custody-hw/src/nonce_store.rs
      - crates/chio-custody-hw/src/revocation.rs
      - crates/chio-custody-hw/tests/replay_resistance.rs
      - crates/chio-custody-hw/tests/revocation_cascade.rs
      - crates/chio-custody-hw/tests/end_to_end.rs

  # M10 P2.T4 audience-confusion property test exercises bit-flips on
  # the audience field of every minted PasskeyCapability and asserts
  # cross-audience presentation rejects fail-closed.
  - id: audience_confusion
    coverage_state: covered
    owned_by: M10
    closed_by: M10.P2.T4
    backing_evidence:
      - crates/chio-custody-hw/src/capability.rs
      - crates/chio-custody-hw/tests/audience_confusion.rs

  # M05 P1 closes weights_hash_spoof by adding a loaded-weight digest
  # surface to the provider conformance contract. Local providers can
  # recompute the digest from loaded bytes; hosted APIs and protocol
  # bridges return LoadedWeightsUnavailable, which the kernel binding
  # helper rejects fail-closed before provider bind succeeds.
  - id: weights_hash_spoof
    coverage_state: covered
    owned_by: M05
    closed_by: M05.P1.T3
    backing_evidence:
      - crates/chio-core-types/src/loaded_weights.rs
      - crates/chio-provider-conformance/src/loaded_weights.rs
      - crates/chio-weights/src/card.rs
      - crates/chio-weights/src/bundle.rs
      - crates/chio-kernel/src/weights_binding.rs
      - crates/chio-kernel/tests/weights_binding.rs
      - crates/chio-policy/src/weights.rs
      - crates/chio-cli/src/commands/bind.rs
      - crates/chio-conformance/tests/threats/weights_hash_spoof.rs
      - crates/chio-weights/tests/lineage_anchor.rs
      - crates/chio-weights/tests/equivalence.rs
