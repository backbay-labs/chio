# osv-scanner advisory exceptions for the CVE monitor (.github/workflows/cve-monitor.yml).
#
# Scope: every entry below is a TRANSITIVE npm dependency in the scanned
# TypeScript example, conformance, or SDK development lockfiles, not a bundled
# dependency of a shipped runtime SDK. The Rust supply-chain gate (cargo-audit,
# plus cargo-deny in ci.yml) is unaffected and stays fully blocking.
#
# Why these are suppressed rather than bumped: either no compatible patched
# release exists, or the patched dependency line is outside the peer-test
# package's supported range. These entries are intentionally narrow (by
# advisory id) so a new, unrelated advisory still blocks. Revisit each entry
# when its upstream dependency publishes a compatible fix.

