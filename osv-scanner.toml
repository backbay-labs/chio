# osv-scanner advisory exceptions for the CVE monitor (.github/workflows/cve-monitor.yml).
#
# Scope: every entry below is a TRANSITIVE npm dependency in the scanned
# TypeScript example, conformance, or SDK development lockfiles, not a bundled
# dependency of a shipped runtime SDK. The Rust supply-chain gate (cargo-audit,
# plus cargo-deny in ci.yml) is unaffected and stays fully blocking.
#
# Why these are suppressed rather than bumped: patched releases exist within the
# current semver ranges, but the example packages depend on unpublished local
# @chio-protocol/* workspace packages, so npm cannot regenerate their lockfiles
# in isolation (it fails resolving the workspace deps). These entries are
# intentionally narrow (by advisory id) so a new, unrelated advisory still
# blocks. Revisit and remove once the lockfiles can be refreshed against the
# full workspace install.

