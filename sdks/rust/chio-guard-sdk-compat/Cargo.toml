[package]
name = "chio-guard-sdk-compat"
description = "Rust compatibility package for the chio:guard@0.2.0 guest SDK"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/backbay-labs/chio"
publish = false

[lib]
name = "chio_guard_sdk"

[dependencies]
chio_guard_sdk_workspace = { package = "chio-guard-sdk", path = "../../../crates/chio-guard-sdk" }

# This compatibility package lives inside the repo tree but is intentionally not
# a member of the root workspace. The empty table makes it its own standalone
# workspace so `cargo build --manifest-path ...` works without the root
# workspace trying to adopt it.
[workspace]
