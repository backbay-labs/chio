[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chio-sdk-python"
version = "0.1.0"
description = "Python SDK for the Chio protocol -- thin HTTP client to the Chio sidecar kernel"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Backbay Labs", email = "security@backbay.io" },
]
keywords = ["chio", "capability", "security", "agent", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "respx>=0.21,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chio_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
