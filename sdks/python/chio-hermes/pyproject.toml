[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chio-hermes"
version = "0.1.1"
description = "Hermes Agent plugin for the Chio protocol - capability-scoped file/shell/git tools, signed receipts, policy enforcement via pre_tool_call hook"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Backbay Labs", email = "security@backbay.io" },
]
keywords = ["chio", "hermes", "hermes-agent", "agent", "tool", "security", "capability", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# Hermes Agent (`hermes-agent`) is intentionally NOT listed here. It is
# not distributed via PyPI; install it separately with the upstream
# curl-installer or `pip install --upgrade git+https://github.com/NousResearch/hermes-agent.git`.
# The plugin only uses the `ctx` object passed into `register(ctx)` and
# never imports `hermes_agent` at module load.
dependencies = [
    "chio-adapter-base>=0.2.0,<0.3",
    "chio-sdk-python>=0.1.0",
    "chio-code-agent>=0.1.0",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<6",
    "httpx>=0.27,<1",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML>=6",
]
# NOTE: Hermes itself is NOT declared as an extra here. PyPI rejects
# distributions that carry direct URL `Requires-Dist` markers (which a
# `git+...` extra would emit), so packaging this convenience would
# block `pip install chio-hermes` at upload time. Install Hermes
# separately per the README / HERMES.md install steps.

[project.entry-points."hermes_agent.plugins"]
chio = "chio_hermes"

[tool.uv.sources]
chio-adapter-base = { path = "../chio-adapter-base" }
chio-sdk-python = { path = "../chio-sdk-python" }
chio-code-agent = { path = "../chio-code-agent" }

[tool.hatch.build.targets.wheel]
packages = ["src/chio_hermes"]

[tool.hatch.build.targets.wheel.force-include]
"plugin.yaml" = "chio_hermes/plugin.yaml"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_return_any = false
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
