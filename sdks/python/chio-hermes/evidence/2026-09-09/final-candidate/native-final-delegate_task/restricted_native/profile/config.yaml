{
  "model": {
    "provider": "custom",
    "default": "boundary-probe",
    "api_mode": "chat_completions",
    "base_url": "http://127.0.0.1:50176/v1"
  },
  "terminal": {
    "backend": "local",
    "cwd": "/private/tmp/chio-hermes-20260909/native-final-delegate_task/restricted_native/workspace"
  },
  "plugins": {
    "enabled": []
  },
  "display": {
    "interface": "cli"
  },
  "compression": {
    "enabled": false
  },
  "agent": {
    "max_turns": 3
  },
  "mcp_servers": {
    "chio": {
      "command": "/opt/homebrew/bin/node",
      "args": [
        "/private/tmp/chio-hermes-20260909/final-bridge-consumer/node_modules/@chio/bridge/dist/gateway.js",
        "/private/tmp/chio-hermes-20260909/native-final-delegate_task-private.json"
      ],
      "tools": {
        "include": [
          "read_text_file",
          "write_file",
          "edit_file",
          "list_directory"
        ]
      },
      "timeout": 45,
      "connect_timeout": 15,
      "lazy": false
    }
  },
  "tools": {
    "tool_search": {
      "enabled": "off"
    }
  }
}
