name: chio
version: 0.1.0
description: >-
  Chio capability-scoped file, shell, and git tools with signed receipts.
  Routes every Hermes tool call through the Chio sidecar kernel for
  policy enforcement and append-only audit.
author: Backbay Labs
kind: standalone

# Dict-form requires_env so `hermes setup` can prompt with masking on
# the secret. The generic loader (hermes_cli/plugins.py _parse_manifest)
# reads `requires_env` only; `optional_env` is silently dropped for
# kind: standalone plugins, so optional knobs (CHIO_POLICY_FILE,
# CHIO_RECEIPT_BUFFER_MAX) are documented in the README instead.
requires_env:
  - name: CHIO_SIDECAR_URL
    description: "URL of the Chio sidecar (e.g. http://127.0.0.1:9090)"
    prompt: "Chio sidecar URL"
    password: false
  - name: CHIO_CAPABILITY_ID
    description: "Capability id issued by `hermes chio issue`"
    prompt: "Chio capability id"
    password: true

provides_tools:
  - chio_file_read
  - chio_file_write
  - chio_file_edit
  - chio_file_list
  - chio_file_search
  - chio_shell_run
  - chio_git_status
  - chio_git_diff
  - chio_git_log
  - chio_git_add
  - chio_git_commit
  - chio_git_run

provides_hooks:
  - pre_tool_call
  - post_tool_call
  - on_session_start
  - on_session_end
