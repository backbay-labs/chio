[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chio-langchain"
version = "0.1.1"
description = "LangChain integration for Chio protocol tools with conformance tests"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Backbay Labs", email = "security@backbay.io" },
]
keywords = ["chio", "langchain", "agent", "tool", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "chio-sdk-python>=0.1.0",
    "chio-adapter-base>=0.2.0,<0.3",
    "langchain-core>=0.2,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.27,<1",
    "respx>=0.21,<1",
    "fastapi>=0.100",
    "chio-fastapi>=0.1.0",
]

[tool.uv.sources]
chio-sdk-python = { path = "../chio-sdk-python" }
chio-adapter-base = { path = "../chio-adapter-base" }
chio-fastapi = { path = "../chio-fastapi" }

[tool.hatch.build.targets.wheel]
packages = ["src/chio_langchain"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
