[project]
name = "fastapi-langchain-template"
version = "0.1.0"
description = "Chio template: FastAPI + LangChain agent + static receipts viewer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "pydantic>=2.6,<3",
    # The Chio Python SDK is consumed via path during local development;
    # create-chio-app rewrites this to the published release line at
    # scaffold time.
]

[project.optional-dependencies]
langchain = [
    "langchain>=0.2,<1",
    "langchain-core>=0.2,<1",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
