[workspace]

[package]
name = "chio-herdr"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Operate a Chio Megastart mission through Herdr"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ratatui = "0.29"
crossterm = "0.28"
fs2 = "0.4"
libc = "0.2"
