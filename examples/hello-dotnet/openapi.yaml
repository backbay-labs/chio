openapi: 3.1.0
info:
  title: hello-dotnet
  version: 0.1.0
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        "200":
          description: Health check
  /hello:
    get:
      operationId: hello
      responses:
        "200":
          description: Greeting
  /echo:
    post:
      operationId: echo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              additionalProperties: false
              properties:
                message:
                  type: string
                  minLength: 1
                count:
                  type: integer
                  minimum: 1
                  default: 1
      responses:
        "200":
          description: Echo payload
        "400":
          description: Invalid echo payload
