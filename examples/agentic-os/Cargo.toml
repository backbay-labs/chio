[workspace]
resolver = "2"
members = ["shared", "mission-host", "knowledge-network", "worker-fleet", "software-factory", "research-swarm", "personal-network", "cooperative", "cognition-marketplace", "operations", "incident-response", "suite", "launcher"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
chio-core = { package = "chio-core-types", path = "../../crates/core/chio-core-types" }
chio-kernel = { path = "../../crates/kernel/chio-kernel" }
chio-store-sqlite = { path = "../../crates/platform/chio-store-sqlite" }
chio-control-plane = { path = "../../crates/platform/chio-control-plane" }
chio-swarm-authority = { path = "../../crates/kernel/chio-swarm-authority" }
chio-runtime-core = { path = "../../crates/kernel/chio-runtime-core" }
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "io-util", "io-std"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.dev]
debug = 0
incremental = false
