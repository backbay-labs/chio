<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chio application</title>
<style>
:root{color-scheme:dark;font:16px/1.6 system-ui;background:#11120f;color:#edece5}*{box-sizing:border-box}[hidden]{display:none!important}body{max-width:1360px;margin:auto;padding:36px 24px}header{border-bottom:1px solid #34372f;padding-bottom:28px;margin-bottom:28px}.brand,.eyebrow{font:12px ui-monospace;color:#d7bd7e;letter-spacing:.1em}h1{font-size:clamp(30px,4vw,49px);line-height:1.12;letter-spacing:-.04em;margin:16px 0;max-width:23ch}p{color:#b9bcb0;max-width:70ch}main{display:grid;grid-template-columns:minmax(270px,.8fr) minmax(0,1.6fr);gap:36px}h2{font-size:20px;letter-spacing:-.02em;margin:0 0 16px}h3{font-size:23px;letter-spacing:-.025em;line-height:1.3}label{display:block;font-size:14px;font-weight:600;margin:0 0 8px}input,select,textarea{font:14px/1.65 ui-monospace;width:100%;background:#1a1c17;color:#e5e6df;border:1px solid #484c40;border-radius:5px;padding:11px;min-width:0}textarea{min-height:140px;resize:vertical}input[type=checkbox]{width:auto;accent-color:#d7bd7e;margin-right:10px}.field{margin:0 0 20px}.hint{display:block;font-size:12px;color:#a7aa9f;margin-top:6px}fieldset{border:0;margin:0;padding:0;min-width:0}button,a.download{font:600 14px system-ui;cursor:pointer;background:#d7bd7e;color:#171a12;border:1px solid transparent;padding:12px 17px;border-radius:5px}button.secondary{background:transparent;color:#dbdccf;border-color:#484c40}button:disabled{opacity:.5;cursor:default}a{color:#dbc587}:focus-visible{outline:2px solid #e0c683;outline-offset:3px}.actions{display:flex;gap:10px;flex-wrap:wrap}#status{min-height:28px;font-size:14px;color:#d7c58e}.state{border-bottom:1px solid #34372f;margin-bottom:24px}details{border-bottom:1px solid #34372f;padding:14px 0}summary{cursor:pointer;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.7 ui-monospace;color:#d0d4c5;margin:12px 0}pre.patch{white-space:pre;overflow:auto;max-height:560px;overflow-wrap:normal;padding:18px;background:#080a07;border:1px solid #34372f}.tag{font:11px ui-monospace;color:#afb39e;margin-right:10px}a.download{display:inline-block;text-decoration:none}.error{color:#ffc1a9}.result{padding:0 0 24px}.metric{border-top:1px solid #404536;padding:15px 0;margin:16px 0;display:flex;justify-content:space-between;gap:16px}.metric strong{font:36px/1.1 ui-monospace;color:#e0c683}.row{border-top:1px solid #34372f;padding:14px 0;display:flex;gap:18px;align-items:baseline}.row span{color:#bfc3b0}.row strong{min-width:0;overflow-wrap:anywhere}blockquote{border-left:2px solid #a29368;padding-left:18px;margin:16px 0;color:#d7dbcd}.event-list{max-height:650px;overflow:auto;border-top:1px solid #34372f}.sections{display:flex;gap:18px;margin-bottom:24px;border-bottom:1px solid #34372f}.sections button{border-radius:0;background:transparent;color:#b9bcae;padding:12px 0;border:0;border-bottom:2px solid transparent}.sections button[aria-selected=true]{border-bottom-color:#d7bd7e;color:#fff}#result:empty::after{content:'Run the application to produce a result.';color:#a6ab9c}.file-note{font:12px ui-monospace;color:#b6baa9;overflow-wrap:anywhere}@media(max-width:760px){main{grid-template-columns:1fr}body{padding:24px 18px}.inputs{border-bottom:1px solid #34372f;padding-bottom:24px}.row{flex-wrap:wrap}}
</style>
<body><header><span class="brand">CHIO / AGENTIC OS</span><h1 id="title"></h1><p id="description"></p><span class="eyebrow">LOCAL EXECUTION · YOUR PROJECT · RETAINED RECEIPTS</span></header>
<main><section class="inputs"><form id="form"><div class="actions" style="justify-content:space-between;margin-bottom:24px"><h2>Your inputs</h2><button type="button" class="secondary" id="reset">Reset</button></div><fieldset id="fields"></fieldset><div class="actions"><button id="run" type="submit">Run application ↗</button><button id="stop" type="button" class="secondary" hidden>Stop</button><button id="reconnect" type="button" class="secondary">Reconnect</button></div></form><p class="hint">Runs and application identities stay in the local runs directory. Model mode uses the model credentials configured on this host.</p><p class="error" id="error" role="alert"></p><a id="download" class="download" hidden>Download run</a></section>
<section><div class="state"><p id="status" role="status">Ready to run locally.</p></div><div class="sections" role="tablist" aria-label="Run inspection"><button role="tab" aria-selected="true" aria-controls="result-panel" id="result-tab">Result</button><button role="tab" aria-selected="false" aria-controls="activity-panel" id="activity-tab" tabindex="-1">Activity & receipts</button></div><div id="result-panel" role="tabpanel" aria-labelledby="result-tab"><div id="result" class="result"></div></div><div id="activity-panel" role="tabpanel" aria-labelledby="activity-tab" hidden><div id="events" class="event-list"></div></div></section></main>
<script>
const application=__APPLICATION__,el=id=>document.getElementById(id),node=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n;};
el('title').textContent=application.title;document.title=application.title+' · Chio';el('description').textContent=application.description;
const labels={document:'Your document',question:'Question to investigate',issue:'Issue to repair',mode:'Worker mode',allowance:'Shared work allowance',concurrency:'Concurrent workers',member_budget:'Member resource allowance',member_accepts:'Member approves work within its allowance',approve_repair:'Provider may approve only the inspected rule repair',approve_publication:'Release owner may publish the exact tested candidate',exercise_denials:'Exercise refused operations',exercise_lifecycle:'Exercise peer removal and recovery',exercise:'Failure to introduce',customer_records:'Private customer observations',backend_failed:'Keep a separate backend failure after the rule repair',price:'Seller price in local credit units',max_price:'Maximum buyer price',observer_weight:'Receiver trust in this observer',query_after_seconds:'Read observations this many seconds later',observation_age_seconds:'Age of each admitted observation',sources:'Research sources',sections:'Requested report sections',lose_ack_index:'Report whose response is lost',restart:'Restart the authority before reconciliation',relay:'Use the Iroh relay',values:'Samples for the shared computation',caller:'Caller role',remove_worker:'Worker grant to remove'};
const choices={caller:['support','engineer'],exercise:['worker-crash-before-dispatch','host-crash-during-report','cancel-running-report','expired-authority','lost-acknowledgement','budget-exhaustion','peer-removal']};
if(application.id==='cooperative'&&!application.sample.mode)application.sample.mode='bilateral';
function fields(){el('fields').replaceChildren();for(const[key,value]of Object.entries(application.sample)){const wrapper=node('div',null,'field'),label=node('label',labels[key]||key.replaceAll('_',' '));let input;let options=choices[key];if(key==='mode')options=application.id==='cooperative'?['bilateral','threshold']:application.id==='knowledge-network'?['retrieve','model']:application.id==='mission-host'?['analyze','model']:application.id==='cognition-marketplace'?['supplied','model']:['deterministic','model'];if(options){input=node('select');for(const option of options){const opt=node('option',option.replaceAll('-',' '));opt.value=option;input.append(opt);}input.value=value;}else if(typeof value==='boolean'){input=node('input');input.type='checkbox';input.checked=value;}else if(typeof value==='number'){input=node('input');input.type='number';input.value=value;input.min=0;input.max=key==='observer_weight'?1:key.includes('seconds')?3600:450;input.step=key==='observer_weight'?.1:1;}else if(typeof value==='object'||['document','customer_records','issue'].includes(key)){input=node('textarea');input.value=typeof value==='object'?JSON.stringify(value,null,2):value;input.dataset.json=String(typeof value==='object');}else{input=node('input');input.type='text';input.value=value??'';}input.id='field-'+key;input.name=key;label.htmlFor=input.id;if(input.type==='checkbox'){label.prepend(input);wrapper.append(label);}else wrapper.append(label,input);el('fields').append(wrapper);}}
fields();el('reset').onclick=fields;
function inputValue(){const input={};for(const element of el('fields').querySelectorAll('input,textarea,select')){input[element.name]=element.type==='checkbox'?element.checked:element.type==='number'?Number(element.value):element.dataset.json==='true'?JSON.parse(element.value):element.value;}return input;}
let objectUrl=null,current=null,polling=false,generation=0,lastOutput='';
function detail(label,value){const d=node('details'),s=node('summary',label),p=node('pre',JSON.stringify(value,null,2));p.tabIndex=0;d.append(s,p);return d;}
function metric(label,value){const n=node('div',null,'metric');n.append(node('span',label),node('strong',String(value)));return n;}
function row(label,value){const n=node('div',null,'row');n.append(node('strong',label),node('span',String(value)));return n;}
function result(run){const out=run.output;if(!out)return;const root=el('result');root.replaceChildren();const title=t=>root.append(node('h3',t));
 switch(run.application){
 case 'mission-host':title('One document, joined worker results');if(out.answer)root.append(node('p',out.answer.answer||out.answer));root.append(detail('Document analysis and joined results',out));break;
 case 'knowledge-network':title(out.question);if(out.answer?.answer)root.append(node('p',out.answer.answer));for(const passage of out.answer?.passages||out.evidence||[]){root.append(node('span',passage.source_id,'eyebrow'),node('blockquote',passage.text),detail('Exact source version and range',passage));}break;
 case 'software-factory':title(out.published?'Reviewed candidate published':out.tests?.passed?'Candidate passes the focused tests':'Candidate inspection');if(out.diff)root.append(node('pre',out.diff,'patch'));if(out.tests)root.append(node('pre',out.tests.stderr||out.tests.stdout));if(out.approval){const actions=node('div',null,'actions');for(const decision of ['approve','reject']){const b=node('button',decision==='approve'?'Publish this candidate':'Reject candidate',decision==='reject'?'secondary':null);b.onclick=()=>start({...out.approval,action:'decide',decision},false);actions.append(b);}root.append(node('p','This decision applies only to candidate '+out.approval.candidate_sha256+'.'),actions);}break;
 case 'worker-fleet':title('Report queue and recovery');for(const job of out.jobs||[])root.append(row(job.section||job.operation_id,job.state||job.status));root.append(detail('Authoritative accounting',out.accounting||out));break;
 case 'research-swarm':title(out.question);for(const [i,job]of(out.order||[]).entries())root.append(row(String(i+1).padStart(2,'0')+' '+job,'Assignment priority'));root.append(detail('Observed workload comparison',{adaptive:out.adaptive,baseline:out.baseline}));break;
 case 'cooperative':case 'personal-network':title(out.status==='denied'?'Member policy refused the proposal':'Independently governed work');const value=out.computation?.output;if(value?.mean!=null)root.append(metric('Computed mean',value.mean));if(out.state?.credits)root.append(detail('Retained local credit balances',out.state));for(const member of out.decisions||[])root.append(row(member.member,member.accepted?'Approved':'Refused'));break;
 case 'incident-response':title(out.resolved?'Service recovered':'Incident remains open');root.append(metric('Observed service status',out.postcheck?.output?.http_status||'Unknown'),node('p',out.diagnosis?.output?.explanation||''),detail('Exact repair proposal',out.proposal));break;
 case 'cognition-marketplace':title(out.status==='completed'?'Purchased repair passes in the customer project':'Purchase refused');if(out.purchase?.patch)root.append(node('pre',out.purchase.patch,'patch'));if(out.customer)root.append(row('Before purchase',out.customer.before.passed?'Passing':'Failing'),row('After applying the delivery',out.customer.after.passed?'Passing':'Failing'));break;
 case 'operations':title('Recover from '+out.exercise.replaceAll('-',' '));root.append(node('p',out.recovery||'Inspect the retained effect and authority records.'),detail('Recovery result',out.resolution||out));break;
 case 'suite':title(out.published?'Research-to-repair mission completed':'Inspect the pending mission');for(const step of ['knowledge','research','cooperative','factory','publication'])if(out[step])root.append(detail(step[0].toUpperCase()+step.slice(1),out[step]));break;
 }
 root.append(detail('Complete application result',out));}
function render(run){current=run;el('status').textContent=run.status==='running'?'Running locally · '+run.events.length+' retained events':run.status==='completed'?'Completed · '+run.events.length+' retained events':'Run stopped · inspect retained work before retrying';const list=el('events');for(const event of run.events.slice(list.children.length)){const d=detail(String(event.sequence).padStart(2,'0')+' · '+event.title,event.data);d.querySelector('summary').append(node('span',' / '+event.actor,'tag'));list.append(d);}const serialized=JSON.stringify(run.output);if(serialized!==lastOutput){result(run);lastOutput=serialized;}if(run.error)el('error').textContent=run.error;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(new Blob([JSON.stringify(run,null,2)],{type:'application/json'}));el('download').href=objectUrl;el('download').download=run.id+'.json';el('download').hidden=false;}
async function read(response){const value=await response.json();if(!response.ok)throw Error(value.error||'Request failed');return value;}
function busy(value){polling=value;el('run').disabled=value;el('fields').disabled=value;el('reset').disabled=value;el('stop').hidden=!value;el('reconnect').disabled=value;}
async function follow(id){const own=++generation;busy(true);try{for(;;){const run=await read(await fetch('/api/runs/'+id));if(own!==generation)return;render(run);if(run.status!=='running'){localStorage.removeItem('chio-active:'+application.id);break;}await new Promise(resolve=>setTimeout(resolve,800));}}catch(error){el('error').textContent=error.message+' Reconnect to read this same run.';}finally{if(own===generation)busy(false);}}
async function start(input,clear=true){if(polling)return;el('error').textContent='';el('events').replaceChildren();lastOutput='';if(clear)el('result').replaceChildren();busy(true);try{const started=await read(await fetch('/api/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(input)}));localStorage.setItem('chio-active:'+application.id,started.id);await follow(started.id);}catch(error){el('error').textContent=error.message;busy(false);}}
el('form').onsubmit=event=>{event.preventDefault();try{void start(inputValue());}catch(error){el('error').textContent='Check the JSON input: '+error.message;}};
el('reconnect').onclick=()=>{const id=localStorage.getItem('chio-active:'+application.id);if(id)void follow(id);else el('error').textContent='No unfinished run is saved for this application.';};
el('stop').onclick=async()=>{try{await read(await fetch('/api/runs/'+current.id,{method:'DELETE'}));}catch(error){el('error').textContent=error.message;}};
for(const [index,id]of['result','activity'].entries()){const button=el(id+'-tab');const select=()=>{for(const other of ['result','activity']){el(other+'-tab').setAttribute('aria-selected',String(id===other));el(other+'-tab').tabIndex=id===other?0:-1;el(other+'-panel').hidden=id!==other;}};button.onclick=select;button.onkeydown=event=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();const next=event.key==='Home'?'result':event.key==='End'?'activity':index===0?'activity':'result';el(next+'-tab').click();el(next+'-tab').focus();}};}
</script></body></html>
