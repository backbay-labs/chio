# Evaluate every protected request, including requests with missing credentials.
# /healthz is the workload's explicit liveness route.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: chio-tool-authorization
  namespace: agent-tools
spec:
  selector:
    matchLabels:
      chio.world/secured: "true"
  action: CUSTOM
  provider:
    name: chio-ext-authz
  rules:
    - to:
        - operation:
            notPaths: ["/healthz"]
