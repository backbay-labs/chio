# Deployable resources are generated by deploy.py from your deployment.json.
# This avoids installing a placeholder image, made-up signing key, or localhost
# authority URL into a cluster. Required values:
#   image: your built image selected by digest
#   authority_url: the operator's reachable Chio HTTP authority origin
#   trusted_kernel_key: the independently selected kernel public key
#
# python3 examples/istio-ext-authz/deploy.py deployment.json > chio-ext-authz.json
# kubectl apply -f chio-ext-authz.json
#
# The output includes Namespace, ConfigMap, Deployment, and Service. It mounts
# only the public key, runs unprivileged, uses a read-only root filesystem, and
# exposes gRPC :9091 plus liveness/readiness on :9092.
