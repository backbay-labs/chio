# Merge this provider into your installation's existing extensionProviders.
# gRPC providers do not support the HTTP provider's header allowlist fields.
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
spec:
  meshConfig:
    extensionProviders:
      - name: chio-ext-authz
        envoyExtAuthzGrpc:
          service: chio-sidecar.chio-system.svc.cluster.local
          port: 9091
          timeout: 3s
          failOpen: false
          clearRouteCache: false
          statusOnError: "503"
          includeRequestBodyInCheck:
            maxRequestBytes: 65536
            allowPartialMessage: false
            packAsBytes: true
