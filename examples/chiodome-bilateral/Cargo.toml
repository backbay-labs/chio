[package]
name = "chiodome-bilateral-example"
description = "Cross-org bilateral co-signed invocation under DSSE plus a KB MCP integration scaffold"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "chiodome-bilateral-demo"
path = "src/main.rs"

# This example consumes (NOT bypasses) four primitives:
#   * chio-kernel async ToolServerConnection (downstream of the receipt
#     produced here when the runner is wired to a kernel).
#   * receipt v2 fail-closed under negotiated v2 (we sign v1 receipts as
#     the underlying subject; the bilateral envelope is independent of
#     receipt-version negotiation).
#   * anchor-batch async-only when require_public_witness=true (consumed
#     via the Web3CheckpointStatement we emit alongside the envelope; the
#     synchronous-anchor path is intentionally NOT used).
#   * chio-federation::bilateral_dsse (LOAD-BEARING in this demo: the
#     cross-org cosignature is produced via
#     `bilateral_dsse::sign_dsse_envelope`, NOT the legacy
#     `CoSigningBody` path).
[dependencies]
chio-core = { package = "chio-core-types", path = "../../crates/chio-core-types" }
chio-federation = { path = "../../crates/chio-federation" }
chio-web3 = { path = "../../crates/chio-web3" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
