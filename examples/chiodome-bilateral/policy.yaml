# Policy for `chio mcp serve --policy examples/chiodome-bilateral/policy.yaml`
#
# Wraps the local KB MCP (the one served at :8111/mcp/ from
# `ops/knowledge-base/`) so that every `tools/call` it observes is gated by
# the chio kernel's verdict path. The default replay check writes mediation
# transcripts and wrapper attestations. Kernel-signed receipts are asserted
# only by the documented `--full` path against a configured SQLite receipt DB.
#
# Bounded scope: this is a demo policy. It allow-lists a small KB tool
# surface and denies write/exec by default. Production deployments should
# narrow `allow:` further and reintroduce a `forbidden_paths` block once
# the wrapped KB MCP gains filesystem-touching tools.

hushspec: "0.1.0"
name: chiodome-bilateral-demo
description: |
  Chiodome demo policy. Wraps the local KB MCP via `mcp-remote`.
  Read-only KB tools are allow-listed; everything else falls through to the
  default-block. The default replay check records mediation transcripts;
  signed receipts require the documented `--full` receipt DB path.

rules:
  # Default-block any tool not explicitly allow-listed below. The KB MCP
  # tool surface is small and read-only by design; expanding `allow`
  # without a chio-policy review is a cluster-policy regression.
  tool_access:
    enabled: true
    default: block
    allow:
      # KB MCP read-only surface (matches the tools the bridge advertises
      # against ops/knowledge-base/). Keep this list narrow.
      - kb.search
      - kb.fetch
      - kb.list
      - kb.describe
      - knowledge_base.search
      - knowledge_base.fetch

  # Secret-pattern guard stays on for the bridge's outputs. KB articles
  # that quote tokens or keys (e.g. example snippets) get redacted before
  # the wrapper records its replay transcript or the full path emits a receipt.
  secret_patterns:
    enabled: true

  # No write/patch/exec rules are configured: the KB MCP surface here is
  # read-only. Re-enable `path_allowlist` and `shell_commands` if the
  # wrapped server starts exposing filesystem or subprocess tools.

  # Velocity / spend gates left commented; the KB MCP surface in this
  # demo doesn't carry pricing.
  # velocity:
  #   enabled: true
  #   max_invocations_per_window: 60
  #   window_secs: 60
  #   burst_factor: 1.0
