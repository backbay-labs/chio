[package]
name = "chiodos-three-vendor-example"
description = "Deterministic Chiodos three-vendor buyer and auditor proof package"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chiodos_three_vendor_example"

[[bin]]
name = "generate-chiodos-proof-package"
path = "src/main.rs"

[dependencies]
chio-core-types = { version = "0.1.0", path = "../../crates/chio-core-types" }
chio-federation = { version = "0.1.0", path = "../../crates/chio-federation" }
chio-governance = { version = "0.1.0", path = "../../crates/chio-governance" }
chio-selective-disclosure = { version = "0.1.0", path = "../../crates/chio-selective-disclosure", features = ["bbs"] }
chio-workflow = { version = "0.1.0", path = "../../crates/chio-workflow" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
