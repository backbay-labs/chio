    "crates/trust/chio-credentials/src/lib.rs",
    "crates/trust/chio-credentials/src/trust_tier.rs",

    # chio-attest-verify - Sigstore verification boundary.
    "crates/trust/chio-attest-verify/src/lib.rs",
