# Workspace-wide skip list. Pure plumbing, generated code, test/bench
# scaffolding, formal-methods harnesses (Aeneas / Kani), platform clock /
# rng adapters, and libFuzzer entry points.
exclude_globs = [
    # rationale: tests, benches, build scripts, and fuzz targets are verification
    # scaffolding or generated entry points rather than production decision code.
    "**/tests.rs", # rationale: excluded helper or verification surface.
    "**/test_*.rs", # rationale: excluded helper or verification surface.
    "**/*_test.rs", # rationale: excluded helper or verification surface.
    "**/tests/**", # rationale: excluded helper or verification surface.
    "**/benches/**", # rationale: excluded helper or verification surface.
    "**/build.rs", # rationale: excluded helper or verification surface.
    "**/fuzz.rs", # rationale: excluded helper or verification surface.
    # chio-kernel-core: platform adapters + formal-methods scaffolding.
    # rationale: platform clocks, RNG adapters, and formal harnesses are covered
    # by dedicated deterministic and verification lanes, not mutation scoring.
    "crates/kernel/chio-kernel-core/src/clock.rs", # rationale: excluded helper or verification surface.
    "crates/kernel/chio-kernel-core/src/rng.rs", # rationale: excluded helper or verification surface.
    "crates/kernel/chio-kernel-core/src/formal_aeneas.rs", # rationale: excluded helper or verification surface.
    "crates/kernel/chio-kernel-core/src/formal_core.rs", # rationale: excluded helper or verification surface.
    "crates/kernel/chio-kernel-core/src/kani_harnesses.rs", # rationale: excluded helper or verification surface.
    "crates/kernel/chio-kernel-core/src/kani_public_harnesses.rs", # rationale: excluded helper or verification surface.
    # chio-policy: pure data + version constants + embedded YAML rulesets.
    # rationale: pure models, constants, and embedded ruleset data are exercised
    # through evaluator/compiler mutations and schema validation lanes.
    "crates/guards/chio-policy/src/models.rs", # rationale: excluded helper or verification surface.
    "crates/guards/chio-policy/src/version.rs", # rationale: excluded helper or verification surface.
    "crates/guards/chio-policy/src/rulesets/**", # rationale: excluded helper or verification surface.
    # chio-guards: pure types, advisory-by-design guards, and the external/
    # adapter tree (remote-process bridges, integration-tested rather than
    # mutation-tested). text_utils.rs and embedding_anomaly.rs are intentionally
    # not excluded because they feed or emit deny decisions.
    # rationale: these remaining files are helper, advisory, or process-bridge
    # surfaces with better coverage from integration and adapter tests than
    # mutants.
    "crates/guards/chio-guards/src/action.rs", # rationale: excluded helper or verification surface.
    "crates/guards/chio-guards/src/advisory.rs", # rationale: excluded helper or verification surface.
    "crates/guards/chio-guards/src/external/**", # rationale: excluded helper or verification surface.
    # chio-anchor: fuzz harness is covered by the fuzz lane.
    # rationale: fuzz harness code is the oracle input surface, not the target
    # production anchor implementation under mutation.
    "crates/economy/chio-anchor/src/fuzz.rs", # rationale: excluded helper or verification surface.
]
