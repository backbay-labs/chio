id = "chio"
name = "Chio"
description = "Chio language support: chio.yaml, manifests, and guard DSL diagnostics powered by chio-lsp."
version = "0.1.0"
schema_version = 1
authors = ["Backbay <chio@chio.world>"]
repository = "https://github.com/backbay-labs/chio"

[language_servers.chio-lsp]
name = "Chio Language Server"
languages = ["Chio"]

[languages.chio]
path = "languages/chio"

[grammars.chio]
# Chio reuses the YAML tree-sitter grammar at runtime; the language
# bundle scopes it to .chio-* file extensions and chio.yaml.
repository = "https://github.com/ikatyang/tree-sitter-yaml"
commit = "0e36bed171768908f331ff7dff9d956bae016efb"
