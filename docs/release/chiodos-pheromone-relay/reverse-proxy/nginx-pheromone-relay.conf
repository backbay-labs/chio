server {
    listen 443 ssl http2;
    server_name relay.example.test;

    ssl_certificate /etc/ssl/chio/relay.example.test.crt;
    ssl_certificate_key /etc/ssl/chio/relay.example.test.key;

    client_max_body_size 256k;
    proxy_request_buffering on;
    proxy_redirect off;

    location = /v1/chiodos/pheromone/batches {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:18080/v1/chiodos/pheromone/batches;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /v1/chiodos/pheromone/catchup {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:18080/v1/chiodos/pheromone/catchup;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /v1/chiodos/pheromone/health {
        proxy_pass http://127.0.0.1:18080/v1/chiodos/pheromone/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /v1/chiodos/pheromone/ready {
        proxy_pass http://127.0.0.1:18080/v1/chiodos/pheromone/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /v1/chiodos/pheromone/observability {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18080/v1/chiodos/pheromone/observability;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /v1/chiodos/pheromone/metrics {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18080/v1/chiodos/pheromone/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
