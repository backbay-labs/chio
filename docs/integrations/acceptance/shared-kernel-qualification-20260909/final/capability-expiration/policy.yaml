kernel:
  max_capability_ttl: 3600
  delegation_depth_limit: 0
  durable_admission_mode: all
guards:
  forbidden_path:
    enabled: true
    additional_patterns: ["**/forbidden.txt", "**/secret.txt"]
capabilities:
  default:
    tools:
      - {server: fs, tool: read_text_file, operations: [invoke], ttl: 4}
      - {server: fs, tool: write_file, operations: [invoke], ttl: 4}
      - {server: fs, tool: edit_file, operations: [invoke], ttl: 4}
      - {server: fs, tool: list_directory, operations: [invoke], ttl: 4}
