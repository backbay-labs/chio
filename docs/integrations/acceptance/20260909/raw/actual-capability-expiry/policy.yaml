kernel:
  max_capability_ttl: 10
  delegation_depth_limit: 0
  durable_admission_mode: all

guards:
  forbidden_path:
    enabled: true
    additional_patterns:
      - "**/forbidden.txt"
      - "**/secret.txt"
      - "**/.env*"
      - "**/.git/**"
      - "**/.ssh/**"
  secret_patterns:
    enabled: true

capabilities:
  default:
    tools:
      - server: "fs"
        # One grant shares a finite invocation counter across the gateway's four tools.
        # The gateway's immutable allowlist suppresses every other server tool.
        tool: "*"
        operations: [invoke]
        ttl: 10
        max_invocations: 64
