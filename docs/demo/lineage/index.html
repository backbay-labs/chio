<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chio Lineage Viewer</title>
    <link rel="stylesheet" href="./lineage.css" />
  </head>
  <body>
    <header>
      <h1>Chio Lineage Viewer</h1>
      <p class="schema-pin">schema: chio.lineage.graph/v1</p>
    </header>
    <section class="controls">
      <label>
        Lineage JSON dump:
        <input type="file" id="file-input" accept="application/json" />
      </label>
      <button id="load-sample" type="button">Load sample</button>
    </section>
    <section class="summary" aria-live="polite">
      <p id="status">No graph loaded.</p>
    </section>
    <section class="tables">
      <h2>Nodes</h2>
      <table id="nodes-table">
        <thead>
          <tr>
            <th>id</th>
            <th>kind</th>
            <th>evidence</th>
            <th>tenant</th>
            <th>label</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <h2>Edges</h2>
      <table id="edges-table">
        <thead>
          <tr>
            <th>from</th>
            <th>to</th>
            <th>kind</th>
            <th>evidence</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
    <script type="module" src="./lineage.js"></script>
  </body>
</html>
