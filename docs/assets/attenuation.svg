<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Delegation in Chio only narrows: an orchestrator with four tools, a five dollar budget and a sixty minute expiry delegates to a planner with two tools, one dollar and thirty minutes, which delegates to a worker with one tool, twenty cents and ten minutes. A sub-worker token that tries to add the shell tool back is refused because it is not a subset of its parent.">
