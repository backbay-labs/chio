  <path d="M1095 264 l-4 -7 h8 z" fill="#b08d5b" fill-opacity="0.85"/>
  <rect x="176" y="266" width="706" height="34" rx="8" fill="#1a130d" stroke="#b08d5b" stroke-opacity="0.3"/>
  <text x="529.0" y="287" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#d3cabb">a deny at any of these stops the call and still becomes a signed receipt</text>
  <rect x="1033" y="266" width="124" height="34" rx="8" fill="#1a130d" stroke="#b08d5b" stroke-opacity="0.4"/>
