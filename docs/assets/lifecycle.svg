  <text x="600.0" y="370" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" font-style="italic" fill="#d8cfc0" fill-opacity="0.75">Every outcome (allow, deny, cancelled, incomplete) becomes a signed receipt.</text>
