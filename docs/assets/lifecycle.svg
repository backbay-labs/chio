<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Life of a tool call in Chio: present the token, verify it, hold the budget, guard the input, dispatch, guard the output, meter and sign, then commit the receipt to the Merkle log. A deny at verify, budget, or either guard stops the call and still produces a signed receipt.">
<defs>
    <linearGradient id="lc-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#130d0a"/><stop offset="1" stop-color="#1b140d"/></linearGradient>
    <radialGradient id="lc-glow" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="#8f7ff2" stop-opacity="0.16"/><stop offset="0.5" stop-color="#8f7ff2" stop-opacity="0.04"/><stop offset="1" stop-color="#8f7ff2" stop-opacity="0"/></radialGradient>
    <pattern id="lc-field" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="6" cy="9" r="0.9" fill="#ab8a52" fill-opacity="0.16"/><circle cx="23" cy="24" r="0.6" fill="#ab8a52" fill-opacity="0.10"/></pattern>
    <radialGradient id="lc-fade" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="lc-mask"><rect width="1000" height="320" fill="url(#lc-fade)"/></mask>
  </defs>
  <rect width="1000" height="320" rx="10" fill="url(#lc-bg)"/>
  <rect width="1000" height="320" rx="10" fill="none" stroke="#ab8a52" stroke-opacity="0.14"/>
  <text x="40" y="34" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="1.7" fill="#8c8172">life of a tool call &#183; fs.read src/main.rs</text>
  <text x="960" y="34" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" letter-spacing="1.4" fill="#8c8172">one request, eight stations</text>
  <line x1="70.0" y1="104" x2="929.6" y2="104" stroke="#8f7ff2" stroke-opacity="0.35" stroke-width="1"/>
  <circle cx="70.0" cy="104" r="15" fill="#16101c" stroke="#8f7ff2" stroke-opacity="0.8" stroke-width="1.2"/>
  <text x="70.0" y="108" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#c3b6ff">01</text>
  <text x="70.0" y="144" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#d8cfc0">Present</text>
  <text x="70.0" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#8c8172">token did:chio:7f3a&#8230;</text>
  <text x="70.0" y="178" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#8c8172">scope fs.read</text>
  <circle cx="192.8" cy="104" r="15" fill="#16101c" stroke="#8f7ff2" stroke-opacity="0.8" stroke-width="1.2"/>
  <text x="192.8" y="108" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#c3b6ff">02</text>
  <text x="192.8" y="144" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#d8cfc0">Verify</text>
  <text x="192.8" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#8c8172">sig &#10003; expiry &#10003;</text>
  <text x="192.8" y="178" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#8c8172">&#8834; parent &#10003; live &#10003;</text>
  <line x1="192.8" y1="200" x2="192.8" y2="244" stroke="#c95a52" stroke-opacity="0.6" stroke-width="1.1" stroke-dasharray="3 4"/>
  <path d="M192.8 244 L189.3 237 L196.3 237 Z" fill="#c95a52" fill-opacity="0.6"/>
  <circle cx="315.6" cy="104" r="15" fill="#16101c" stroke="#8f7ff2" stroke-opacity="0.8" stroke-width="1.2"/>
  <text x="315.6" y="108" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#c3b6ff">03</text>
  <text x="315.6" y="144" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#d8cfc0">Budget</text>
  <text x="315.6" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#ab8a52">hold $0.50</text>
  <text x="315.6" y="178" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#ab8a52">cap $0.50</text>
  <line x1="315.6" y1="200" x2="315.6" y2="244" stroke="#c95a52" stroke-opacity="0.6" stroke-width="1.1" stroke-dasharray="3 4"/>
  <path d="M315.6 244 L312.1 237 L319.1 237 Z" fill="#c95a52" fill-opacity="0.6"/>
  <circle cx="438.4" cy="104" r="15" fill="#16101c" stroke="#8f7ff2" stroke-opacity="0.8" stroke-width="1.2"/>
  <text x="438.4" y="108" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#c3b6ff">04</text>
  <text x="438.4" y="144" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#d8cfc0">Guard in</text>
  <text x="438.4" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#8c8172">path allowed</text>
  <text x="438.4" y="178" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#8c8172">no secrets</text>
  <line x1="438.4" y1="200" x2="438.4" y2="244" stroke="#c95a52" stroke-opacity="0.6" stroke-width="1.1" stroke-dasharray="3 4"/>
  <path d="M438.4 244 L434.9 237 L441.9 237 Z" fill="#c95a52" fill-opacity="0.6"/>
  <circle cx="561.2" cy="104" r="15" fill="#16101c" stroke="#8f7ff2" stroke-opacity="0.8" stroke-width="1.2"/>
  <text x="561.2" y="108" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#c3b6ff">05</text>
  <text x="561.2" y="144" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#d8cfc0">Dispatch</text>
  <text x="561.2" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#8c8172">fs &#8594; src/main.rs</text>
  <text x="561.2" y="178" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#8c8172">14 ms</text>
  <circle cx="684.0" cy="104" r="15" fill="#16101c" stroke="#8f7ff2" stroke-opacity="0.8" stroke-width="1.2"/>
  <text x="684.0" y="108" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#c3b6ff">06</text>
  <text x="684.0" y="144" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#d8cfc0">Guard out</text>
  <text x="684.0" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#8c8172">2 PII fields</text>
  <text x="684.0" y="178" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#8c8172">redacted</text>
  <line x1="684.0" y1="200" x2="684.0" y2="244" stroke="#c95a52" stroke-opacity="0.6" stroke-width="1.1" stroke-dasharray="3 4"/>
  <path d="M684.0 244 L680.5 237 L687.5 237 Z" fill="#c95a52" fill-opacity="0.6"/>
  <circle cx="806.8" cy="104" r="15" fill="#16101c" stroke="#8f7ff2" stroke-opacity="0.8" stroke-width="1.2"/>
  <text x="806.8" y="108" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#c3b6ff">07</text>
  <text x="806.8" y="144" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#d8cfc0">Meter + sign</text>
  <text x="806.8" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#ab8a52">$0.03 metered</text>
  <text x="806.8" y="178" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#ab8a52">ed25519 &#10003;</text>
  <circle cx="929.6" cy="104" r="15" fill="#16101c" stroke="#8f7ff2" stroke-opacity="0.8" stroke-width="1.2"/>
  <text x="929.6" y="108" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#c3b6ff">08</text>
  <text x="929.6" y="144" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#d8cfc0">Commit</text>
  <text x="929.6" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#8c8172">sha256:9c1e&#8230;</text>
  <text x="929.6" y="178" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#8c8172">merkle ckpt #4812</text>
  <rect x="132.8" y="248" width="611.2" height="32" rx="6" fill="#1a1010" fill-opacity="0.9" stroke="#c95a52" stroke-opacity="0.5" stroke-width="1"/>
  <text x="438.4" y="268" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#c95a52">any deny stops here and still produces a signed receipt &#183; verdict deny &#183; ed25519 &#10003;</text>
  <line x1="929.6" y1="200" x2="929.6" y2="244" stroke="#ab8a52" stroke-opacity="0.7" stroke-width="1.1"/>
  <path d="M929.6 244 L926.1 237 L933.1 237 Z" fill="#ab8a52" fill-opacity="0.7"/>
  <text x="929.6" y="268" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#d4b06a">receipt &#183; allow</text>
  <text x="500" y="302" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#8c8172">a call the kernel cannot sign does not run</text>

</svg>
