  <text x="105" y="202" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#9a8f7e">token did:chio:7f3a&#8230;</text>
  <text x="105" y="216" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#9a8f7e">scope fs.read</text>
  <text x="246" y="202" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#9a8f7e">signature &#183; expiry</text>
  <text x="246" y="216" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#9a8f7e">&#8834; parent &#183; not revoked</text>
  <path d="M246 226 V258" stroke="#8f7ff2" stroke-opacity="0.5" stroke-width="1.2" stroke-dasharray="1.5 4"/>
  <path d="M246 264 l-4 -7 h8 z" fill="#8f7ff2" fill-opacity="0.7"/>
  <text x="388" y="202" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#c8a86f">hold $0.50</text>
  <text x="388" y="216" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#c8a86f">against a $0.50 cap</text>
  <path d="M388 226 V258" stroke="#8f7ff2" stroke-opacity="0.5" stroke-width="1.2" stroke-dasharray="1.5 4"/>
  <path d="M388 264 l-4 -7 h8 z" fill="#8f7ff2" fill-opacity="0.7"/>
  <text x="529" y="202" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#9a8f7e">path allowed</text>
  <text x="529" y="216" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#9a8f7e">no secrets in params</text>
  <path d="M529 226 V258" stroke="#8f7ff2" stroke-opacity="0.5" stroke-width="1.2" stroke-dasharray="1.5 4"/>
  <path d="M529 264 l-4 -7 h8 z" fill="#8f7ff2" fill-opacity="0.7"/>
  <text x="671" y="202" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#9a8f7e">fs &#8594; src/main.rs</text>
  <text x="671" y="216" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#9a8f7e">14 ms</text>
  <text x="812" y="202" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#9a8f7e">2 PII fields</text>
  <text x="812" y="216" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#9a8f7e">redacted</text>
  <path d="M812 226 V258" stroke="#8f7ff2" stroke-opacity="0.5" stroke-width="1.2" stroke-dasharray="1.5 4"/>
  <path d="M812 264 l-4 -7 h8 z" fill="#8f7ff2" fill-opacity="0.7"/>
  <text x="954" y="202" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#c8a86f">$0.03 metered</text>
  <text x="954" y="216" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#c8a86f">ed25519 signed</text>
  <text x="1095" y="202" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#9a8f7e">sha256:9c1e&#8230;</text>
  <text x="1095" y="216" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#9a8f7e">Merkle checkpoint</text>
