  <path d="M90 140 H1110" stroke="#b08d5b" stroke-opacity="0.28" stroke-width="1"/>
  <g fill="none" stroke="#8f7ff2" stroke-opacity="0.45" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M172 135 L179 140 L172 145"/><path d="M314 135 L320 140 L314 145"/><path d="M455 135 L462 140 L455 145"/><path d="M596 135 L604 140 L596 145"/><path d="M738 135 L745 140 L738 145"/><path d="M880 135 L886 140 L880 145"/><path d="M1021 135 L1028 140 L1021 145"/></g>
  <circle cx="105" cy="140" r="30" fill="url(#lcglow)"/>
