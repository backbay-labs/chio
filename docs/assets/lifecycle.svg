  <g text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" letter-spacing="2" fill="#b08d5b"><text x="105" y="108">01</text><text x="246" y="108">02</text><text x="388" y="108">03</text><text x="529" y="108">04</text><text x="671" y="108">05</text><text x="812" y="108">06</text><text x="954" y="108">07</text><text x="1095" y="108">08</text></g>
