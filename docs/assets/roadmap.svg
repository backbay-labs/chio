<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Chio roadmap timeline: a monthly sprint from August 2026 to March 2027 (Q1 2027), culminating in Chiodos: sovereign agent economies">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#130d0a"/>
      <stop offset="1" stop-color="#1b140d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8f7ff2" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#8f7ff2" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#8f7ff2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowStrong" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a99bff" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#8f7ff2" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8f7ff2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <g stroke="#b08d5b" stroke-opacity="0.35" stroke-width="1">
    <path d="M30 38 H42 M36 32 V44"/>
    <path d="M1158 38 H1170 M1164 32 V44"/>
    <path d="M30 382 H42 M36 376 V388"/>
    <path d="M1158 382 H1170 M1164 376 V388"/>
  </g>

  <text x="600" y="46" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" letter-spacing="4" fill="#d8cfc0" fill-opacity="0.55">THE ROAD AHEAD &#183; SHIPPING MONTHLY</text>

  <!-- year boundary + bands -->
  <path d="M699 92 V330" stroke="#b08d5b" stroke-opacity="0.13" stroke-width="1" stroke-dasharray="3 5"/>
  <g text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" letter-spacing="3" fill="#b08d5b" fill-opacity="0.55">
    <text x="394" y="402">2026</text>
    <text x="890" y="402">2027</text>
  </g>

  <!-- axis -->
  <path d="M70 210 H1130" stroke="#b08d5b" stroke-opacity="0.32" stroke-width="1"/>
  <path d="M1116 205 L1126 210 L1116 215" fill="none" stroke="#b08d5b" stroke-opacity="0.5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- glows -->
  <g>
    <circle cx="140" cy="210" r="22" fill="url(#glow)"/>
    <circle cx="264" cy="210" r="22" fill="url(#glow)"/>
    <circle cx="389" cy="210" r="22" fill="url(#glow)"/>
    <circle cx="513" cy="210" r="22" fill="url(#glow)"/>
    <circle cx="637" cy="210" r="22" fill="url(#glow)"/>
    <circle cx="761" cy="210" r="22" fill="url(#glow)"/>
    <circle cx="886" cy="210" r="22" fill="url(#glow)"/>
    <circle cx="1010" cy="210" r="34" fill="url(#glowStrong)"/>
  </g>

  <!-- connectors -->
  <g stroke="#8f7ff2" stroke-opacity="0.4" stroke-width="1">
    <path d="M140 204 V156"/>
    <path d="M264 216 V262"/>
    <path d="M389 204 V156"/>
    <path d="M513 216 V262"/>
    <path d="M637 204 V156"/>
    <path d="M761 216 V262"/>
    <path d="M886 204 V156"/>
    <path d="M1010 216 V262"/>
  </g>

  <!-- nodes -->
  <g fill="#16101c" stroke="#8f7ff2" stroke-opacity="0.7" stroke-width="1.2">
    <circle cx="140" cy="210" r="6"/><circle cx="264" cy="210" r="6"/><circle cx="389" cy="210" r="6"/>
    <circle cx="513" cy="210" r="6"/><circle cx="637" cy="210" r="6"/><circle cx="761" cy="210" r="6"/><circle cx="886" cy="210" r="6"/>
  </g>
  <g fill="#a99bff">
    <circle cx="140" cy="210" r="2.4"/><circle cx="264" cy="210" r="2.4"/><circle cx="389" cy="210" r="2.4"/>
    <circle cx="513" cy="210" r="2.4"/><circle cx="637" cy="210" r="2.4"/><circle cx="761" cy="210" r="2.4"/><circle cx="886" cy="210" r="2.4"/>
  </g>
  <circle cx="1010" cy="210" r="10" fill="#1b1330" stroke="#a99bff" stroke-opacity="0.9" stroke-width="1.4"/>
  <circle cx="1010" cy="210" r="4.2" fill="#c3b6ff"/>

  <!-- above-axis labels -->
  <g text-anchor="middle">
    <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#c8a86f">
      <text x="140" y="132">AUG</text>
      <text x="389" y="132">OCT</text>
      <text x="637" y="132">DEC</text>
      <text x="886" y="132">FEB</text>
    </g>
    <g font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#e7ded0">
      <text x="140" y="150">Open authority standard</text>
      <text x="389" y="150">Global receipt commons</text>
      <text x="637" y="150">Zero-knowledge compliance</text>
      <text x="886" y="150">Swarm immunity</text>
    </g>
  </g>

  <!-- below-axis labels -->
  <g text-anchor="middle">
    <g font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#e7ded0">
      <text x="264" y="280">Machine-checked kernel</text>
      <text x="513" y="280">Proof-carrying money</text>
      <text x="761" y="280">Autonomous risk markets</text>
    </g>
    <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#c8a86f">
      <text x="264" y="297">SEP</text>
      <text x="513" y="297">NOV</text>
      <text x="761" y="297">JAN</text>
    </g>
  </g>

  <!-- capstone -->
  <text x="1010" y="280" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#c9bcff">Chiodos</text>
  <text x="1010" y="298" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#c8a86f">MAR 2027 &#183; Q1</text>
  <text x="1010" y="314" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#9a8f7e">sovereign agent economies</text>
</svg>
