<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="One swarm verified before any child runs: an orchestrator delegates to a researcher and a writer, each with a narrower scope, a route plan, a budget allocation, and a continuation token bound to the signed task graph. The swarm authority verifies the bundle, then rejects a cycle, a hidden hop, an oversubscribed budget pool, and a revoked task.">
