<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Chio's three pillars: Proofs, Governance, and Economic Protocol, on a signed-receipt spine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#130d0a"/>
      <stop offset="1" stop-color="#1b140d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8f7ff2" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#8f7ff2" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#8f7ff2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>

  <!-- corner ticks -->
  <g stroke="#b08d5b" stroke-opacity="0.35" stroke-width="1">
    <path d="M38 44 H50 M44 38 V50"/>
    <path d="M1150 44 H1162 M1156 38 V50"/>
    <path d="M38 296 H50 M44 290 V302"/>
    <path d="M1150 296 H1162 M1156 290 V302"/>
  </g>

  <!-- kicker -->
  <text x="600" y="46" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" letter-spacing="4" fill="#d8cfc0" fill-opacity="0.55">PROOF-CARRYING AUTONOMY</text>

  <!-- between-column hairlines -->
  <g stroke="#b08d5b" stroke-opacity="0.12" stroke-width="1">
    <path d="M420 92 V272"/>
    <path d="M780 92 V272"/>
  </g>

  <!-- ============ Pillar 01 : Proofs (cx=240) ============ -->
  <circle cx="240" cy="134" r="56" fill="url(#glow)"/>
  <circle cx="240" cy="134" r="40" fill="#16101c" fill-opacity="0.55" stroke="#8f7ff2" stroke-opacity="0.55" stroke-width="1.2"/>
  <g transform="translate(240,134) scale(1.4)" fill="none" stroke="#c3b6ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -14 L12 -9 L12 1 C12 9 6 14 0 16 C-6 14 -12 9 -12 1 L-12 -9 Z"/>
    <path d="M-5 0 L-1 5 L6 -5" stroke="#f2eadc" stroke-width="2.2"/>
  </g>
  <text x="240" y="202" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#b08d5b">01</text>
  <text x="240" y="234" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="29" fill="#efe7db">Proofs</text>
  <text x="240" y="260" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#b3a99b">Capabilities in. Receipts out.</text>

  <!-- ============ Pillar 02 : Governance (cx=600) ============ -->
  <circle cx="600" cy="134" r="56" fill="url(#glow)"/>
  <circle cx="600" cy="134" r="40" fill="#16101c" fill-opacity="0.55" stroke="#8f7ff2" stroke-opacity="0.55" stroke-width="1.2"/>
  <g transform="translate(600,134) scale(1.4)" fill="none" stroke="#c3b6ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-12 -6 H12"/>
    <path d="M0 -6 V10"/>
    <path d="M-7 10 H7"/>
    <circle cx="0" cy="-9" r="2"/>
    <path d="M-12 -6 V-1"/><circle cx="-12" cy="1.5" r="3.2"/>
    <path d="M12 -6 V-1"/><circle cx="12" cy="1.5" r="3.2"/>
  </g>
  <text x="600" y="202" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#b08d5b">02</text>
  <text x="600" y="234" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="29" fill="#efe7db">Governance</text>
  <text x="600" y="260" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#b3a99b">Identity, policy, delegated authority.</text>

  <!-- ============ Pillar 03 : Economic Protocol (cx=960) ============ -->
  <circle cx="960" cy="134" r="56" fill="url(#glow)"/>
  <circle cx="960" cy="134" r="40" fill="#16101c" fill-opacity="0.55" stroke="#8f7ff2" stroke-opacity="0.55" stroke-width="1.2"/>
  <g transform="translate(960,134) scale(1.4)" fill="none" stroke="#c3b6ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="0" r="11"/>
    <path d="M0 -5 L5 0 L0 5 L-5 0 Z" stroke="#f2eadc"/>
  </g>
  <text x="960" y="202" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#b08d5b">03</text>
  <text x="960" y="234" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="29" fill="#efe7db">Economic Protocol</text>
  <text x="960" y="260" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#b3a99b">Metered, budgeted, settled.</text>

  <!-- spine -->
  <path d="M150 302 H1050" stroke="#b08d5b" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="594" y="296" width="12" height="12" transform="rotate(45 600 302)" fill="#1b140d" stroke="#b08d5b" stroke-opacity="0.7"/>
  <text x="600" y="328" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14.5" fill="#d8cfc0" fill-opacity="0.75">Every decision leaves one signed receipt.</text>
</svg>
