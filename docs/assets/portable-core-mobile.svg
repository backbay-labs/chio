<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" role="img" aria-label="chio-kernel-core and its three hosts, stacked for small screens.">
<defs>
    <linearGradient id="pcm-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#130d0a"/><stop offset="1" stop-color="#1b140d"/></linearGradient>
    <radialGradient id="pcm-glow" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="#8f7ff2" stop-opacity="0.16"/><stop offset="0.5" stop-color="#8f7ff2" stop-opacity="0.04"/><stop offset="1" stop-color="#8f7ff2" stop-opacity="0"/></radialGradient>
    <pattern id="pcm-field" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="6" cy="9" r="0.9" fill="#ab8a52" fill-opacity="0.16"/><circle cx="23" cy="24" r="0.6" fill="#ab8a52" fill-opacity="0.10"/></pattern>
    <radialGradient id="pcm-fade" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="pcm-mask"><rect width="480" height="330" fill="url(#pcm-fade)"/></mask>
  </defs>
  <rect width="480" height="330" rx="10" fill="url(#pcm-bg)"/>
  <rect width="480" height="330" rx="10" fill="none" stroke="#ab8a52" stroke-opacity="0.14"/>
  <text x="24" y="30" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#8c8172">one core &#183; three hosts</text>
  <rect x="24" y="46" width="432" height="56" rx="8" fill="#16101c" fill-opacity="0.8" stroke="#8f7ff2" stroke-opacity="0.9" stroke-width="1.4"/>
  <text x="240" y="68" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#c3b6ff">chio-kernel-core</text>
  <text x="240" y="88" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#8c8172">no_std + alloc &#183; Clock and Rng as traits</text>
  <line x1="240" y1="102" x2="240" y2="128" stroke="#ab8a52" stroke-opacity="0.5" stroke-width="1"/>
  <rect x="24" y="128" width="432" height="50" rx="6" fill="#16101c" fill-opacity="0.5" stroke="#ab8a52" stroke-opacity="0.6" stroke-width="1.2"/>
  <text x="40" y="148" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#d4b06a">chio-kernel</text>
  <text x="40" y="166" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#8c8172">native sidecar &#183; servers, CLIs, desktop</text>
  <line x1="240" y1="170" x2="240" y2="196" stroke="#ab8a52" stroke-opacity="0.5" stroke-width="1"/>
  <rect x="24" y="196" width="432" height="50" rx="6" fill="#16101c" fill-opacity="0.5" stroke="#ab8a52" stroke-opacity="0.6" stroke-width="1.2"/>
  <text x="40" y="216" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#d4b06a">chio-kernel-browser</text>
  <text x="40" y="234" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#8c8172">wasm32 &#183; wasm-bindgen &#183; browser JS and TS</text>
  <line x1="240" y1="238" x2="240" y2="264" stroke="#ab8a52" stroke-opacity="0.5" stroke-width="1"/>
  <rect x="24" y="264" width="432" height="50" rx="6" fill="#16101c" fill-opacity="0.5" stroke="#ab8a52" stroke-opacity="0.6" stroke-width="1.2"/>
  <text x="40" y="284" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#d4b06a">chio-kernel-mobile</text>
  <text x="40" y="302" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#8c8172">UniFFI &#183; C ABI &#183; Swift on iOS, Kotlin on Android</text>

</svg>
