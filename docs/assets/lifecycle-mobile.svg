<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 498" width="480" height="498" role="img" aria-label="Life of a tool call in Chio, stacked for small screens.">
<defs>
    <linearGradient id="lcm-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#130d0a"/><stop offset="1" stop-color="#1b140d"/></linearGradient>
    <radialGradient id="lcm-glow" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="#8f7ff2" stop-opacity="0.16"/><stop offset="0.5" stop-color="#8f7ff2" stop-opacity="0.04"/><stop offset="1" stop-color="#8f7ff2" stop-opacity="0"/></radialGradient>
    <pattern id="lcm-field" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="6" cy="9" r="0.9" fill="#ab8a52" fill-opacity="0.16"/><circle cx="23" cy="24" r="0.6" fill="#ab8a52" fill-opacity="0.10"/></pattern>
    <radialGradient id="lcm-fade" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="lcm-mask"><rect width="480" height="498" fill="url(#lcm-fade)"/></mask>
  </defs>
  <rect width="480" height="498" rx="10" fill="url(#lcm-bg)"/>
  <rect width="480" height="498" rx="10" fill="none" stroke="#ab8a52" stroke-opacity="0.14"/>
  <text x="24" y="30" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#8c8172">life of a tool call &#183; fs.read</text>
  <line x1="44" y1="60" x2="44" y2="382" stroke="#8f7ff2" stroke-opacity="0.35" stroke-width="1"/>
  <circle cx="44" cy="60" r="13" fill="#16101c" stroke="#8f7ff2" stroke-opacity="0.8" stroke-width="1.2"/>
  <text x="44" y="63.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#c3b6ff">01</text>
  <text x="72" y="58" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#d8cfc0">Present</text>
  <text x="72" y="73" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#8c8172">token did:chio:7f3a&#8230; &#183; scope fs.read</text>
  <circle cx="44" cy="106" r="13" fill="#16101c" stroke="#8f7ff2" stroke-opacity="0.8" stroke-width="1.2"/>
  <text x="44" y="109.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#c3b6ff">02</text>
  <text x="72" y="104" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#d8cfc0">Verify</text>
  <text x="72" y="119" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#8c8172">sig &#10003; expiry &#10003; &#183; &#8834; parent &#10003; live &#10003;</text>
  <text x="456" y="110" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#c95a52" fill-opacity="0.8">deny &#10007;</text>
  <circle cx="44" cy="152" r="13" fill="#16101c" stroke="#8f7ff2" stroke-opacity="0.8" stroke-width="1.2"/>
  <text x="44" y="155.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#c3b6ff">03</text>
  <text x="72" y="150" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#d8cfc0">Budget</text>
  <text x="72" y="165" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#ab8a52">hold $0.50 &#183; cap $0.50</text>
  <text x="456" y="156" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#c95a52" fill-opacity="0.8">deny &#10007;</text>
  <circle cx="44" cy="198" r="13" fill="#16101c" stroke="#8f7ff2" stroke-opacity="0.8" stroke-width="1.2"/>
  <text x="44" y="201.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#c3b6ff">04</text>
  <text x="72" y="196" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#d8cfc0">Guard in</text>
  <text x="72" y="211" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#8c8172">path allowed &#183; no secrets</text>
  <text x="456" y="202" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#c95a52" fill-opacity="0.8">deny &#10007;</text>
  <circle cx="44" cy="244" r="13" fill="#16101c" stroke="#8f7ff2" stroke-opacity="0.8" stroke-width="1.2"/>
  <text x="44" y="247.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#c3b6ff">05</text>
  <text x="72" y="242" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#d8cfc0">Dispatch</text>
  <text x="72" y="257" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#8c8172">fs &#8594; src/main.rs &#183; 14 ms</text>
  <circle cx="44" cy="290" r="13" fill="#16101c" stroke="#8f7ff2" stroke-opacity="0.8" stroke-width="1.2"/>
  <text x="44" y="293.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#c3b6ff">06</text>
  <text x="72" y="288" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#d8cfc0">Guard out</text>
  <text x="72" y="303" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#8c8172">2 PII fields &#183; redacted</text>
  <text x="456" y="294" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#c95a52" fill-opacity="0.8">deny &#10007;</text>
  <circle cx="44" cy="336" r="13" fill="#16101c" stroke="#8f7ff2" stroke-opacity="0.8" stroke-width="1.2"/>
  <text x="44" y="339.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#c3b6ff">07</text>
  <text x="72" y="334" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#d8cfc0">Meter + sign</text>
  <text x="72" y="349" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#ab8a52">$0.03 metered &#183; ed25519 &#10003;</text>
  <circle cx="44" cy="382" r="13" fill="#16101c" stroke="#8f7ff2" stroke-opacity="0.8" stroke-width="1.2"/>
  <text x="44" y="385.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#c3b6ff">08</text>
  <text x="72" y="380" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#d8cfc0">Commit</text>
  <text x="72" y="395" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#8c8172">sha256:9c1e&#8230; &#183; merkle ckpt #4812</text>
  <text x="240" y="432" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#c95a52">any deny still produces a signed receipt</text>
  <text x="240" y="450" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#8c8172">a call the kernel cannot sign does not run</text>

</svg>
