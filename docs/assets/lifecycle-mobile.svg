<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 740" width="480" height="740" role="img" aria-label="Life of a tool call in Chio, stacked for small screens.">
  <defs>
    <linearGradient id="lcmbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#130d0a"/><stop offset="1" stop-color="#1b140d"/></linearGradient>
    <radialGradient id="lcmglow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8f7ff2" stop-opacity="0.32"/><stop offset="0.6" stop-color="#8f7ff2" stop-opacity="0.07"/><stop offset="1" stop-color="#8f7ff2" stop-opacity="0"/></radialGradient>
    <radialGradient id="lcmkglow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8f7ff2" stop-opacity="0.28"/><stop offset="0.65" stop-color="#8f7ff2" stop-opacity="0.06"/><stop offset="1" stop-color="#8f7ff2" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="480" height="740" fill="url(#lcmbg)"/>
  <text x="240.0" y="38" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2.5" fill="#d8cfc0" fill-opacity="0.55">LIFE OF A TOOL CALL</text>
  <path d="M64 80 V598" stroke="#b08d5b" stroke-opacity="0.28" stroke-width="1"/>
  <circle cx="64" cy="80" r="26" fill="url(#lcmglow)"/>
  <circle cx="64" cy="154" r="26" fill="url(#lcmglow)"/>
  <circle cx="64" cy="228" r="26" fill="url(#lcmglow)"/>
  <circle cx="64" cy="302" r="26" fill="url(#lcmglow)"/>
  <circle cx="64" cy="376" r="26" fill="url(#lcmglow)"/>
  <circle cx="64" cy="450" r="26" fill="url(#lcmglow)"/>
  <circle cx="64" cy="524" r="26" fill="url(#lcmglow)"/>
  <circle cx="64" cy="598" r="26" fill="url(#lcmglow)"/>
  <g fill="#16101c" stroke="#8f7ff2" stroke-opacity="0.6" stroke-width="1.2"><circle cx="64" cy="80" r="18"/><circle cx="64" cy="154" r="18"/><circle cx="64" cy="228" r="18"/><circle cx="64" cy="302" r="18"/><circle cx="64" cy="376" r="18"/><circle cx="64" cy="450" r="18"/><circle cx="64" cy="524" r="18"/><circle cx="64" cy="598" r="18"/></g>
  <g fill="none" stroke="#c3b6ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(64,80)"><rect x="-8" y="-6" width="16" height="12" rx="2"/><path d="M-4 -1 H4"/></g><g transform="translate(64,154)"><path d="M-6 0 L-2 5 L7 -6"/></g><g transform="translate(64,228)"><circle cx="0" cy="0" r="7"/><path d="M0 -4 L4 0 L0 4 L-4 0 Z" stroke-width="1.2"/></g><g transform="translate(64,302)"><path d="M0 -8 L7 -5 L7 1 C7 6 4 9 0 10 C-4 9 -7 6 -7 1 L-7 -5 Z"/></g><g transform="translate(64,376)"><path d="M-7 0 H6"/><path d="M2 -4 L7 0 L2 4"/></g><g transform="translate(64,450)"><path d="M-7 -6 H7 L2 1 V7 L-2 5 V1 Z"/></g><g transform="translate(64,524)"><circle cx="0" cy="0" r="6.5"/><path d="M-3 0 L-1 2.5 L3.5 -3" stroke="#f2eadc"/></g><g transform="translate(64,598)"><ellipse cx="0" cy="-5" rx="6" ry="2.2"/><path d="M-6 -5 V5"/><path d="M6 -5 V5"/><path d="M-6 5 C-6 7.2 6 7.2 6 5"/></g></g>
  <text x="104" y="72" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" letter-spacing="2" fill="#b08d5b">01</text>
  <text x="130" y="76" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#d3cabb">Present</text>
  <text x="104" y="94" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#9a8f7e">token did:chio:7f3a&#8230; &#183; scope fs.read</text>
  <text x="104" y="146" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" letter-spacing="2" fill="#b08d5b">02</text>
  <text x="130" y="150" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#d3cabb">Verify</text>
  <text x="104" y="168" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#9a8f7e">signature &#183; expiry &#183; &#8834; parent &#183; not revoked</text>
  <text x="450" y="150" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#c3b6ff">may deny</text>
  <text x="104" y="220" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" letter-spacing="2" fill="#b08d5b">03</text>
  <text x="130" y="224" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#d3cabb">Budget</text>
  <text x="104" y="242" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#c8a86f">hold $0.50 &#183; against a $0.50 cap</text>
  <text x="450" y="224" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#c3b6ff">may deny</text>
  <text x="104" y="294" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" letter-spacing="2" fill="#b08d5b">04</text>
  <text x="130" y="298" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#d3cabb">Guard in</text>
  <text x="104" y="316" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#9a8f7e">path allowed &#183; no secrets in params</text>
  <text x="450" y="298" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#c3b6ff">may deny</text>
  <text x="104" y="368" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" letter-spacing="2" fill="#b08d5b">05</text>
  <text x="130" y="372" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#d3cabb">Dispatch</text>
  <text x="104" y="390" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#9a8f7e">fs &#8594; src/main.rs &#183; 14 ms</text>
  <text x="104" y="442" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" letter-spacing="2" fill="#b08d5b">06</text>
  <text x="130" y="446" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#d3cabb">Guard out</text>
  <text x="104" y="464" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#9a8f7e">2 PII fields &#183; redacted</text>
  <text x="450" y="446" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#c3b6ff">may deny</text>
  <text x="104" y="516" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" letter-spacing="2" fill="#b08d5b">07</text>
  <text x="130" y="520" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#d3cabb">Meter + sign</text>
  <text x="104" y="538" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#c8a86f">$0.03 metered &#183; ed25519 signed</text>
  <text x="104" y="590" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" letter-spacing="2" fill="#b08d5b">08</text>
  <text x="130" y="594" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#d3cabb">Commit</text>
  <text x="104" y="612" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#9a8f7e">sha256:9c1e&#8230; &#183; Merkle checkpoint</text>
  <path d="M90.0 686 H390.0" stroke="#b08d5b" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="234.0" y="680" width="12" height="12" transform="rotate(45 240.0 686)" fill="#1b140d" stroke="#b08d5b" stroke-opacity="0.7"/>
  <text x="240.0" y="716" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" font-style="italic" fill="#d8cfc0" fill-opacity="0.75">Every outcome becomes a signed receipt.</text>
</svg>
