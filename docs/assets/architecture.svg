<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Chio system map: an untrusted agent and untrusted tool servers around a single trusted Runtime Kernel that verifies, guards, dispatches, and signs; receipts feed the trust and economy planes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#130d0a"/>
      <stop offset="1" stop-color="#1b140d"/>
    </linearGradient>
    <radialGradient id="kglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8f7ff2" stop-opacity="0.28"/>
      <stop offset="0.65" stop-color="#8f7ff2" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#8f7ff2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <g stroke="#b08d5b" stroke-opacity="0.35" stroke-width="1">
    <path d="M30 40 H42 M36 34 V46"/>
    <path d="M1158 40 H1170 M1164 34 V46"/>
    <path d="M30 560 H42 M36 554 V566"/>
    <path d="M1158 560 H1170 M1164 554 V566"/>
  </g>
  <text x="600" y="48" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" letter-spacing="4" fill="#d8cfc0" fill-opacity="0.55">THE SYSTEM</text>

  <!-- ===== connectors (drawn under boxes) ===== -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#c8a86f" text-anchor="middle">
    <!-- control inputs (dotted) -->
    <g stroke="#8f7ff2" stroke-opacity="0.5" stroke-width="1.2" fill="none" stroke-dasharray="1.5 4">
      <path d="M410 146 L505 236"/>
      <path d="M790 146 L695 236"/>
    </g>
    <g fill="#8f7ff2" fill-opacity="0.7"><path d="M505 236 l-6 -2 l3 6 z"/><path d="M695 236 l6 -2 l-3 6 z"/></g>
    <rect x="360" y="182" width="86" height="16" rx="3" fill="#130d0a" fill-opacity="0.85"/><text x="403" y="194">capabilities</text>
    <rect x="740" y="182" width="60" height="16" rx="3" fill="#130d0a" fill-opacity="0.85"/><text x="770" y="194">guards</text>

    <!-- data flow (solid gold) -->
    <g stroke="#b08d5b" stroke-opacity="0.6" stroke-width="1.3" fill="none" stroke-linecap="round">
      <path d="M290 306 H392"/>
      <path d="M800 292 H902"/>
      <path d="M902 328 H800"/>
      <path d="M600 392 V444"/>
      <path d="M470 486 H332"/>
      <path d="M730 486 H868"/>
    </g>
    <g fill="#b08d5b" fill-opacity="0.85">
      <path d="M392 306 l-7 -4 v8 z"/>
      <path d="M902 292 l-7 -4 v8 z"/>
      <path d="M800 328 l7 -4 v8 z"/>
      <path d="M600 444 l-4 -7 h8 z"/>
      <path d="M332 486 l7 -4 v8 z"/>
      <path d="M868 486 l-7 -4 v8 z"/>
    </g>
    <rect x="298" y="288" width="94" height="16" rx="3" fill="#130d0a" fill-opacity="0.85"/><text x="345" y="300">capability token</text>
    <rect x="806" y="274" width="88" height="16" rx="3" fill="#130d0a" fill-opacity="0.85"/><text x="850" y="286">governed call</text>
    <rect x="820" y="332" width="46" height="16" rx="3" fill="#130d0a" fill-opacity="0.85"/><text x="843" y="344">result</text>
    <rect x="606" y="410" width="86" height="16" rx="3" fill="#130d0a" fill-opacity="0.85"/><text x="649" y="422">signs receipt</text>
    <rect x="352" y="466" width="62" height="16" rx="3" fill="#130d0a" fill-opacity="0.85"/><text x="383" y="478">evidence</text>
    <rect x="786" y="466" width="78" height="16" rx="3" fill="#130d0a" fill-opacity="0.85"/><text x="825" y="478">settlement</text>
  </g>

  <!-- ===== supporting boxes ===== -->
  <g>
    <!-- capability authority -->
    <rect x="300" y="90" width="220" height="56" rx="8" fill="#1a130d" stroke="#b08d5b" stroke-opacity="0.4"/>
    <text x="410" y="114" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#e7ded0">Capability Authority</text>
    <text x="410" y="132" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#9a8f7e">issues + revokes tokens</text>
    <!-- policy -->
    <rect x="680" y="90" width="220" height="56" rx="8" fill="#1a130d" stroke="#b08d5b" stroke-opacity="0.4"/>
    <text x="790" y="114" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#e7ded0">HushSpec policy</text>
    <text x="790" y="132" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#9a8f7e">compiles to guards</text>

    <!-- agent (untrusted) -->
    <rect x="80" y="272" width="210" height="76" rx="8" fill="#17110d" stroke="#9a8b76" stroke-opacity="0.55" stroke-dasharray="4 4"/>
    <text x="185" y="305" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#e7ded0">Agent</text>
    <text x="185" y="324" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#9a8f7e">LLM process &#183; untrusted</text>
    <!-- tool servers (untrusted) -->
    <rect x="910" y="272" width="210" height="76" rx="8" fill="#17110d" stroke="#9a8b76" stroke-opacity="0.55" stroke-dasharray="4 4"/>
    <text x="1015" y="305" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#e7ded0">Tool Servers</text>
    <text x="1015" y="324" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#9a8f7e">sandboxed &#183; untrusted</text>

    <!-- receipt log -->
    <rect x="470" y="450" width="260" height="70" rx="8" fill="#1a130d" stroke="#b08d5b" stroke-opacity="0.4"/>
    <text x="600" y="481" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#e7ded0">Receipt Log</text>
    <text x="600" y="500" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#9a8f7e">content-addressed &#183; Merkle</text>
    <!-- trust plane -->
    <rect x="80" y="452" width="252" height="66" rx="8" fill="#1a130d" stroke="#b08d5b" stroke-opacity="0.4"/>
    <text x="206" y="481" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#e7ded0">Trust plane</text>
    <text x="206" y="499" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#9a8f7e">identity &#183; federation &#183; governance</text>
    <!-- economy plane -->
    <rect x="868" y="452" width="252" height="66" rx="8" fill="#1a130d" stroke="#b08d5b" stroke-opacity="0.4"/>
    <text x="994" y="481" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#e7ded0">Economy plane</text>
    <text x="994" y="499" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#9a8f7e">metering &#183; budgets &#183; settlement</text>
  </g>

  <!-- ===== the kernel (the trusted core) ===== -->
  <circle cx="600" cy="310" r="150" fill="url(#kglow)"/>
  <rect x="400" y="240" width="400" height="150" rx="12" fill="#191026" stroke="#8f7ff2" stroke-opacity="0.8" stroke-width="1.6"/>
  <text x="600" y="273" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#f0eadd">Runtime Kernel</text>
  <text x="600" y="293" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="0.5" fill="#c3b6ff">the only trusted component &#183; TCB</text>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#d7ccf5" text-anchor="middle">
    <rect x="420" y="342" width="82" height="28" rx="14" fill="#241a3a" stroke="#8f7ff2" stroke-opacity="0.5"/><text x="461" y="360">Verify</text>
    <rect x="512" y="342" width="82" height="28" rx="14" fill="#241a3a" stroke="#8f7ff2" stroke-opacity="0.5"/><text x="553" y="360">Guard</text>
    <rect x="604" y="342" width="82" height="28" rx="14" fill="#241a3a" stroke="#8f7ff2" stroke-opacity="0.5"/><text x="645" y="360">Dispatch</text>
    <rect x="696" y="342" width="82" height="28" rx="14" fill="#241a3a" stroke="#8f7ff2" stroke-opacity="0.5"/><text x="737" y="360">Sign</text>
  </g>
</svg>
