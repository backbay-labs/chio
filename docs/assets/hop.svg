<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 636" width="1200" height="636" role="img" aria-label="Inside one delegation hop from planner to worker: the signed delegation link, the attenuation proof whose parent scope hash must equal the last chain link, the basis-point budget split checked against siblings, the caveats, and the revocation epoch. The kernel rechecks all of it on every call.">
  <defs>
    <linearGradient id="hpbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#130d0a"/><stop offset="1" stop-color="#1b140d"/></linearGradient>
    <radialGradient id="hpglow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8f7ff2" stop-opacity="0.32"/><stop offset="0.6" stop-color="#8f7ff2" stop-opacity="0.07"/><stop offset="1" stop-color="#8f7ff2" stop-opacity="0"/></radialGradient>
    <radialGradient id="hpkglow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8f7ff2" stop-opacity="0.28"/><stop offset="0.65" stop-color="#8f7ff2" stop-opacity="0.06"/><stop offset="1" stop-color="#8f7ff2" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="636" fill="url(#hpbg)"/>
  <g stroke="#b08d5b" stroke-opacity="0.35" stroke-width="1">
    <path d="M30 40 H42 M36 34 V46"/><path d="M1158 40 H1170 M1164 34 V46"/>
    <path d="M30 596 H42 M36 590 V602"/><path d="M1158 596 H1170 M1164 590 V602"/>
  </g>
  <text x="600.0" y="48" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" letter-spacing="4" fill="#d8cfc0" fill-opacity="0.55">INSIDE ONE HOP</text>
  <rect x="300" y="84" width="220" height="66" rx="8" fill="#1a130d" stroke="#b08d5b" stroke-opacity="0.4"/>
  <text x="410" y="110" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#e7ded0">Planner</text>
  <text x="410" y="132" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#9a8f7e">delegator &#183; $1.00 &#183; 30m</text>
  <rect x="680" y="84" width="220" height="66" rx="8" fill="#1a130d" stroke="#b08d5b" stroke-opacity="0.4"/>
  <text x="790" y="110" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#e7ded0">Worker</text>
  <text x="790" y="132" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#9a8f7e">delegatee &#183; $0.20 &#183; 10m</text>
  <path d="M522 117 L678 117" stroke="#b08d5b" stroke-opacity="0.6" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <path d="M678 117 L671.9 120.4 L671.9 113.6 Z" fill="#b08d5b" fill-opacity="0.85"/>
  <rect x="565.1" y="91" width="69.8" height="16" rx="3" fill="#130d0a" fill-opacity="0.85"/>
  <text x="600" y="103" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#c8a86f">delegates</text>
  <path d="M600 124 V176" stroke="#b08d5b" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="1.5 5"/>
  <text x="612" y="160" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#9a8f7e">what the link carries</text>
  <rect x="240" y="180" width="720" height="58" rx="8" fill="#1a130d" stroke="#b08d5b" stroke-opacity="0.4"/>
  <text x="258" y="206" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#e7ded0">Delegation link</text>
  <text x="942" y="206" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#c3b6ff">signed by the planner &#183; ed25519 &#10003;</text>
  <text x="258" y="226" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#d3cabb">planner &#8594; worker</text>
  <text x="390" y="226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#d3cabb">scope sha256:7e21&#8230;</text>
  <text x="580" y="226" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#d3cabb">drops git.diff &#183; budget 2,000 bps &#183; expiry 10m</text>
  <rect x="240" y="250" width="720" height="58" rx="8" fill="#1a130d" stroke="#b08d5b" stroke-opacity="0.4"/>
  <text x="258" y="276" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#e7ded0">Attenuation proof</text>
  <text x="942" y="276" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#c3b6ff">witness recomputed on every call</text>
  <text x="258" y="296" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#d3cabb">parent sha256:7e21&#8230; = last link &#10003;</text>
  <text x="540" y="296" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#d3cabb">tools &#8834; &#183; budget &#8804; &#183; expiry &#8804; &#10003;</text>
  <text x="942" y="296" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9a8f7e">attenuation.witness_soundness</text>
  <rect x="240" y="320" width="720" height="74" rx="8" fill="#1a130d" stroke="#b08d5b" stroke-opacity="0.4"/>
  <text x="258" y="346" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#e7ded0">Budget split</text>
  <text x="942" y="346" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#c3b6ff">per-parent registry &#183; siblings summed</text>
  <rect x="258" y="360" width="684" height="10" rx="5" fill="#1b140d" stroke="#b08d5b" stroke-opacity="0.35"/>
  <rect x="258" y="360" width="136.8" height="10" rx="5" fill="#8f7ff2" fill-opacity="0.6"/>
  <rect x="394.8" y="360" width="102.6" height="10" fill="#8f7ff2" fill-opacity="0.25"/>
  <text x="258" y="384" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#c3b6ff">worker 2,000 bps</text>
  <text x="400.8" y="384" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9a8f7e">reviewer 1,500 bps</text>
  <text x="942" y="384" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#c8a86f">3,500 of 10,000 bps &#10003;</text>
  <rect x="240" y="406" width="720" height="74" rx="8" fill="#1a130d" stroke="#b08d5b" stroke-opacity="0.4"/>
  <text x="258" y="432" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#e7ded0">Caveats</text>
  <text x="942" y="432" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#c3b6ff">signed into the token</text>
  <rect x="258" y="442" width="95.19999999999999" height="26" rx="13.0" fill="#241a3a" stroke="#8f7ff2" stroke-opacity="0.5"/>
  <text x="305.6" y="458.8" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#d7ccf5">bind_session</text>
  <rect x="363.2" y="442" width="128.2" height="26" rx="13.0" fill="#241a3a" stroke="#8f7ff2" stroke-opacity="0.5"/>
  <text x="427.29999999999995" y="458.8" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#d7ccf5">restrict_audience</text>
  <rect x="501.4" y="442" width="148.0" height="26" rx="13.0" fill="#241a3a" stroke="#8f7ff2" stroke-opacity="0.5"/>
  <text x="575.4" y="458.8" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#d7ccf5">restrict_time_window</text>
  <rect x="659.4" y="442" width="95.19999999999999" height="26" rx="13.0" fill="#241a3a" stroke="#8f7ff2" stroke-opacity="0.5"/>
  <text x="707.0" y="458.8" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#d7ccf5">restrict_geo</text>
  <rect x="240" y="492" width="720" height="58" rx="8" fill="#1a130d" stroke="#b08d5b" stroke-opacity="0.4"/>
  <text x="258" y="518" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#e7ded0">Revocation</text>
  <text x="942" y="518" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#c3b6ff">Merkle oracle &#183; signed epoch root</text>
  <text x="258" y="538" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#d3cabb">epoch #4812</text>
  <text x="390" y="538" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#d3cabb">root sha256:c3a0&#8230;</text>
  <text x="580" y="538" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#d3cabb">orchestrator &#10003; &#183; planner &#10003; &#183; no ancestor revoked</text>
  <path d="M150.0 584 H1050.0" stroke="#b08d5b" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="594.0" y="578" width="12" height="12" transform="rotate(45 600.0 584)" fill="#1b140d" stroke="#b08d5b" stroke-opacity="0.7"/>
  <text x="600.0" y="614" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" font-style="italic" fill="#d8cfc0" fill-opacity="0.75">The kernel rechecks every card on every call the worker makes.</text>
</svg>
