  <text x="100" y="268" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#c3b6ff">verify &#10003;</text>
  <rect x="178" y="250" width="120" height="28" rx="14" fill="#8f7ff2" fill-opacity="0.10" stroke="#8f7ff2" stroke-opacity="0.55" stroke-width="1"/>
  <text x="238" y="268" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#c3b6ff">guard in &#10003;</text>
  <rect x="316" y="250" width="120" height="28" rx="14" fill="#8f7ff2" fill-opacity="0.10" stroke="#8f7ff2" stroke-opacity="0.55" stroke-width="1"/>
  <text x="376" y="268" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#c3b6ff">dispatch &#8594;</text>
  <rect x="40" y="288" width="120" height="28" rx="14" fill="#8f7ff2" fill-opacity="0.10" stroke="#8f7ff2" stroke-opacity="0.55" stroke-width="1"/>
  <text x="100" y="306" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#c3b6ff">guard out &#10003;</text>
  <rect x="178" y="288" width="120" height="28" rx="14" fill="#8f7ff2" fill-opacity="0.10" stroke="#8f7ff2" stroke-opacity="0.55" stroke-width="1"/>
  <text x="238" y="306" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#c3b6ff">sign &#10003;</text>
  <text x="240" y="340" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#ab8a52">budget hold $0.50 taken before dispatch</text>
  <line x1="240" y1="360" x2="240" y2="384" stroke="#ab8a52" stroke-opacity="0.7" stroke-width="1.2"/><path d="M240 384 L237.4 378.6 L242.6 378.6 Z" fill="#ab8a52" fill-opacity="0.7"/>
  <text x="254" y="376" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#ab8a52">governed call</text>
  <rect x="24" y="386" width="432" height="70" rx="8" fill="#16101c" fill-opacity="0.25" stroke="#d8cfc0" stroke-opacity="0.32" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="240" y="408" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="2" fill="#d8cfc0">TOOL SERVER &#183; fs &#183; sandboxed</text>
  <text x="240" y="430" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#8c8172">read src/main.rs &#183; 2.1 kB &#183; 14 ms</text>
  <line x1="240" y1="458" x2="240" y2="484" stroke="#ab8a52" stroke-opacity="0.8" stroke-width="1.2"/><path d="M240 484 L237.4 478.6 L242.6 478.6 Z" fill="#ab8a52" fill-opacity="0.8"/>
  <text x="254" y="476" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#ab8a52">signs receipt</text>
  <rect x="24" y="486" width="208" height="118" rx="6" fill="#1a140f" fill-opacity="0.9" stroke="#ab8a52" stroke-opacity="0.75" stroke-width="1.2"/>
  <text x="36" y="506" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" letter-spacing="1.2" fill="#d4b06a">receipt</text>
  <text x="36" y="526" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#8c8172">id</text>
  <text x="96" y="526" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#d8cfc0">sha256:9c1e&#8230;</text>
  <text x="36" y="544" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#8c8172">verdict</text>
  <text x="96" y="544" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#c3b6ff">allow</text>
  <text x="36" y="562" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#8c8172">cost</text>
  <text x="96" y="562" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#d8cfc0">$0.03</text>
  <text x="36" y="580" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#8c8172">signed</text>
  <text x="96" y="580" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#d8cfc0">ed25519 &#10003;</text>
  <rect x="248" y="486" width="208" height="118" rx="6" fill="#1a1010" fill-opacity="0.85" stroke="#c95a52" stroke-opacity="0.55" stroke-width="1.2"/>
  <text x="260" y="506" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" letter-spacing="1" fill="#d4b06a">receipt &#183; expired token</text>
  <text x="260" y="526" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#8c8172">id</text>
  <text x="320" y="526" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#d8cfc0">sha256:41d0&#8230;</text>
  <text x="260" y="544" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#8c8172">verdict</text>
  <text x="320" y="544" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#c95a52">deny</text>
  <text x="260" y="562" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#8c8172">reason</text>
  <text x="320" y="562" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#d8cfc0">expired</text>
  <text x="260" y="580" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#8c8172">signed</text>
  <text x="320" y="580" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#d8cfc0">ed25519 &#10003;</text>
  <text x="240" y="640" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#8c8172">every outcome is a signed receipt</text>
  <text x="240" y="658" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#8c8172">allow &#183; deny &#183; cancelled &#183; incomplete</text>

</svg>
