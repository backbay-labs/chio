  <text x="240" y="230" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#c3b6ff">KERNEL &#183; the only trusted component</text>
