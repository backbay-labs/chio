<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 680" width="480" height="680" role="img" aria-label="One tool call through Chio, stacked for small screens.">
<defs>
    <linearGradient id="ocm-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#130d0a"/><stop offset="1" stop-color="#1b140d"/></linearGradient>
    <radialGradient id="ocm-glow" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="#8f7ff2" stop-opacity="0.16"/><stop offset="0.5" stop-color="#8f7ff2" stop-opacity="0.04"/><stop offset="1" stop-color="#8f7ff2" stop-opacity="0"/></radialGradient>
    <pattern id="ocm-field" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="6" cy="9" r="0.9" fill="#ab8a52" fill-opacity="0.16"/><circle cx="23" cy="24" r="0.6" fill="#ab8a52" fill-opacity="0.10"/></pattern>
    <radialGradient id="ocm-fade" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="ocm-mask"><rect width="480" height="680" fill="url(#ocm-fade)"/></mask>
  </defs>
  <rect width="480" height="680" rx="10" fill="url(#ocm-bg)"/>
  <rect width="480" height="680" rx="10" fill="none" stroke="#ab8a52" stroke-opacity="0.14"/>
  <text x="24" y="30" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#8c8172">one call &#183; fs.read</text>
  <rect x="24" y="50" width="432" height="130" rx="8" fill="#16101c" fill-opacity="0.25" stroke="#d8cfc0" stroke-opacity="0.32" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="240" y="72" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="2" fill="#d8cfc0">AGENT &#183; untrusted</text>
  <rect x="140" y="84" width="200" height="86" rx="6" fill="#16101c" fill-opacity="0.7" stroke="#8f7ff2" stroke-opacity="0.55" stroke-width="1.2"/>
  <text x="152" y="102" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#8c8172">who</text>
  <text x="212" y="102" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#d8cfc0">did:chio:7f3a&#8230;</text>
  <text x="152" y="119" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#8c8172">call</text>
  <text x="212" y="119" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#d8cfc0">fs.read</text>
  <text x="152" y="136" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#8c8172">budget</text>
  <text x="212" y="136" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#d8cfc0">$0.50</text>
  <text x="152" y="153" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#8c8172">expires</text>
  <text x="212" y="153" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#d8cfc0">15m</text>
  <line x1="240" y1="182" x2="240" y2="206" stroke="#ab8a52" stroke-opacity="0.7" stroke-width="1.2"/><path d="M240 206 L237.4 200.6 L242.6 200.6 Z" fill="#ab8a52" fill-opacity="0.7"/>
  <text x="254" y="198" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#ab8a52">presents token</text>
