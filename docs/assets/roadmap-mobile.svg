<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 700" width="480" height="700" role="img" aria-label="Chio roadmap: a monthly sprint from August 2026 to March 2027, culminating in Chiodos: sovereign agent economies">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#130d0a"/>
      <stop offset="1" stop-color="#1b140d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8f7ff2" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#8f7ff2" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#8f7ff2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowStrong" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a99bff" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#8f7ff2" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8f7ff2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="700" fill="url(#bg)"/>

  <text x="240" y="40" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2.5" fill="#d8cfc0" fill-opacity="0.55">THE ROAD AHEAD</text>

  <!-- vertical timeline -->
  <path d="M64 88 V620" stroke="#b08d5b" stroke-opacity="0.3" stroke-width="1"/>

  <!-- glows -->
  <g>
    <circle cx="64" cy="88" r="20" fill="url(#glow)"/><circle cx="64" cy="164" r="20" fill="url(#glow)"/>
    <circle cx="64" cy="240" r="20" fill="url(#glow)"/><circle cx="64" cy="316" r="20" fill="url(#glow)"/>
    <circle cx="64" cy="392" r="20" fill="url(#glow)"/><circle cx="64" cy="468" r="20" fill="url(#glow)"/>
    <circle cx="64" cy="544" r="20" fill="url(#glow)"/><circle cx="64" cy="620" r="32" fill="url(#glowStrong)"/>
  </g>
  <!-- nodes -->
  <g fill="#16101c" stroke="#8f7ff2" stroke-opacity="0.7" stroke-width="1.2">
    <circle cx="64" cy="88" r="6"/><circle cx="64" cy="164" r="6"/><circle cx="64" cy="240" r="6"/>
    <circle cx="64" cy="316" r="6"/><circle cx="64" cy="392" r="6"/><circle cx="64" cy="468" r="6"/><circle cx="64" cy="544" r="6"/>
  </g>
  <g fill="#a99bff">
    <circle cx="64" cy="88" r="2.4"/><circle cx="64" cy="164" r="2.4"/><circle cx="64" cy="240" r="2.4"/>
    <circle cx="64" cy="316" r="2.4"/><circle cx="64" cy="392" r="2.4"/><circle cx="64" cy="468" r="2.4"/><circle cx="64" cy="544" r="2.4"/>
  </g>
  <circle cx="64" cy="620" r="10" fill="#1b1330" stroke="#a99bff" stroke-opacity="0.9" stroke-width="1.4"/>
  <circle cx="64" cy="620" r="4.2" fill="#c3b6ff"/>

  <!-- dates -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" letter-spacing="1.5" fill="#c8a86f">
    <text x="100" y="78">AUG 2026</text><text x="100" y="154">SEP 2026</text><text x="100" y="230">OCT 2026</text><text x="100" y="306">NOV 2026</text>
    <text x="100" y="382">DEC 2026</text><text x="100" y="458">JAN 2027</text><text x="100" y="534">FEB 2027</text><text x="100" y="610">MAR 2027</text>
  </g>
  <!-- titles -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#e7ded0">
    <text x="100" y="96">Open authority standard</text><text x="100" y="172">Machine-checked kernel</text>
    <text x="100" y="248">Global receipt commons</text><text x="100" y="324">Proof-carrying money</text>
    <text x="100" y="400">Zero-knowledge compliance</text><text x="100" y="476">Autonomous risk markets</text>
    <text x="100" y="552">Swarm immunity</text>
  </g>
  <!-- capstone -->
  <text x="100" y="628" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#c9bcff">Chiodos</text>
  <text x="100" y="648" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#9a8f7e">sovereign agent economies</text>
</svg>
