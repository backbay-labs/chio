  <text x="600" y="148" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="0.5" fill="#c3b6ff">the only trusted component &#183; TCB</text>
