  <rect x="564" y="176" width="68" height="28" rx="14.0" fill="#241a3a" stroke="#8f7ff2" stroke-opacity="0.5"/>
  <text x="598.0" y="193.8" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#d7ccf5">Dispatch</text>
  <rect x="639" y="176" width="68" height="28" rx="14.0" fill="#241a3a" stroke="#8f7ff2" stroke-opacity="0.5"/>
  <text x="673.0" y="193.8" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#d7ccf5">Guard out</text>
  <rect x="714" y="176" width="68" height="28" rx="14.0" fill="#241a3a" stroke="#8f7ff2" stroke-opacity="0.5"/>
  <text x="748.0" y="193.8" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#d7ccf5">Sign</text>
  <text x="600" y="236" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#9a8f7e">checks the token, screens the request and the result, runs the call</text>
  <text x="600" y="256" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#c8a86f">budget hold of $0.50 taken before dispatch, reconciled to $0.03 after</text>
  <text x="600" y="284" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#9a8f7e">refuses any call it cannot authorize and any result it cannot sign</text>
