# Workspace-wide cargo-deny configuration.
# Changes to this file require CODEOWNERS review.

[graph]
all-features = true
no-default-features = false

# cargo-deny ^0.16 rejects `[output] feedback-level` and the `unmaintained` /
# `notice` keys under `[advisories]` (severity is now implicit); none are set
# here.
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Each ignore below is individually dated and justified (see the per-entry
# `last-checked` notes). Keep this list small: every entry must be one of an
# unmaintained build-time/test-only transitive, an ecosystem migration that
# needs a coordinated upstream bump, or one RSA advisory with no upstream fix.
# rustls-webpki advisories are not ignored.
# Last full refresh: 2026-05-05.
ignore = [
    # --- unmaintained / unsound clusters: each requires a dep migration. ---
    # last-checked = 2026-05-02; bincode 1.3.3 unmaintained (RUSTSEC-2025-0141). Pulled by uniffi 0.28.x build deps;
    # only used in chio-kernel-mobile codegen, not at runtime. Migrate uniffi or accept.
    "RUSTSEC-2025-0141",
    # last-checked = 2026-05-02; paste 1.0.15 unmaintained (RUSTSEC-2024-0436). Pulled transitively by alloy and
    # wasmtime. No runtime risk (proc-macro). Replace once `pastey` is widely adopted.
    "RUSTSEC-2024-0436",
    # last-checked = 2026-05-02; rustls-pemfile unmaintained (RUSTSEC-2025-0134). Pull a maintained replacement
    # in the rustls bump ticket; functionality is PEM parsing, not crypto.
    "RUSTSEC-2025-0134",
    # last-checked = 2026-05-02; serde_yml unsound and unmaintained (RUSTSEC-2025-0068). Migration to serde_yaml_ng
    # or hand-rolled config is tracked alongside the dep-bump batch.
    "RUSTSEC-2025-0068",
    # last-checked = 2026-05-02; rand 0.8 unsound when paired with a custom logger using rng() (RUSTSEC-2026-0097).
    # We do not register a custom global logger that calls rand::rng(); risk is latent.
    # Clears with the rand-family unification ticket already noted in [bans.skip].
    "RUSTSEC-2026-0097",
    # last-checked = 2026-05-05; RSA Marvin attack timing sidechannel (RUSTSEC-2023-0071). Production uses RSA
    # only for public-key verification of OIDC/JWKS and platform attestations;
    # private-key signing is confined to tests. No upstream fix yet (tracked
    # in rsa#19).
    "RUSTSEC-2023-0071",
    # last-checked = 2026-07-10; atomic-polyfill 1.0.3 is unmaintained (superseded by portable-atomic).
    # It is pulled only transitively through heapless and ships no code Chio calls directly. Clears when
    # the heapless chain migrates to portable-atomic.
    "RUSTSEC-2023-0089",
    # last-checked = 2026-05-02; ansi_term is pulled only by dudect-bencher's legacy clap 2 harness for
    # local timing experiments. It is not linked into production binaries.
    "RUSTSEC-2021-0139",
    # last-checked = 2026-05-02; atty is the same dudect-bencher -> clap 2 test harness transitive.
    # Production CLI paths use the clap 4 stack.
    "RUSTSEC-2024-0375",
    # last-checked = 2026-05-02; proc-macro-error is a compile-time transitive of sigstore 0.13 through
    # json-syntax/locspan-derive. No runtime code is shipped from this crate.
    "RUSTSEC-2024-0370",
    # last-checked = 2026-06-08; proc-macro-error2 is unmaintained (RUSTSEC-2026-0173). It is a compile-time
    # transitive through alloy-sol-macro and sigstore/oci-spec codegen. No runtime code is shipped from this crate.
    "RUSTSEC-2026-0173",
    # last-checked = 2026-07-03; quick-xml 0.39.4 unbounded-allocation memory-exhaustion DoS
    # (RUSTSEC-2026-0194 entity expansion, RUSTSEC-2026-0195 NsReader namespace declarations).
    # Pulled only transitively via iroh -> netwatch -> netdev -> plist for local network-interface
    # discovery; the parsed XML is the host's own Apple property lists, not attacker-controlled
    # input, so the DoS vector is unreachable. The fix needs quick-xml >=0.41.0, outside the ^0.39
    # range pinned through the iroh chain; no semver-compatible bump exists and we do not edit iroh
    # crate versions. Clears when the iroh/plist chain updates quick-xml upstream.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

# cargo-deny 0.16 enforces an explicit allow-list only: unlisted licenses are
# denied by default, and the `unlicensed`, `copyleft`, `allow-osi-fsf-free`,
# and `default` keys are not accepted.
[licenses]
confidence-threshold = 0.93
# Workspace-wide allow-list. Strictly permissive: no GPL / AGPL / LGPL /
# EUPL or other strong copyleft, and MPL-2.0 is NOT in the global list.
# MPL-2.0 is file-level (weak) copyleft - it does not infect statically-linked
# consumers - but admitting it globally would silently green-light any
# new MPL-2.0 dependency without explicit review. Instead the uniffi
# family (which is the only legitimate consumer in the graph today) is
# pinned via per-crate `[[licenses.exceptions]]` entries below; new MPL
# transitives must add a similar pinned exception.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MIT-0",
    "CC0-1.0",
    "Zlib",
]

# Workspace-internal crates (notably examples/guards/{tool-gate,enriched-inspector})
# are marked `publish = false` and intentionally omit a `license` field
# because they are never distributed to crates.io. `ignore = true` here
# tells cargo-deny to skip license enforcement for those private workspace
# members. Public/published crates remain bound by the allow-list above.
# Ref: https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html#the-private-field
[licenses.private]
ignore = true

[[licenses.exceptions]]
# `ring` ships under a bespoke license that is OpenSSL-derived but not
# OSI-approved. It is the de-facto Rust crypto primitive and the rustls
# stack depends on it transitively. Tracked: ring#2746.
name = "ring"
allow = ["OpenSSL", "ISC", "MIT"]

[[licenses.exceptions]]
# `webpki-roots` (both 0.26.x and 1.x are present in the lockfile) carries
# the Mozilla CA bundle. The crate's `license` field declares
# `CDLA-Permissive-2.0` (Linux Foundation Community Data License Agreement,
# Permissive 2.0). It is OSI-permissive but uncommon, so we pin the
# exception to this crate rather than widen the workspace allow-list.
# Source: https://crates.io/crates/webpki-roots (Cargo.toml `license` field).
name = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[[licenses.exceptions]]
# `webpki-root-certs` is the sibling crate to `webpki-roots` (raw DER bytes
# instead of pre-parsed TrustAnchors). Same Mozilla bundle, same
# `CDLA-Permissive-2.0` license, same pinning rationale. Pulled transitively
# via reqwest -> rustls-platform-verifier in the alloy stack.
# Source: https://crates.io/crates/webpki-root-certs (Cargo.toml `license` field).
name = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

# uniffi family: weak-copyleft MPL-2.0. Pinned per crate instead of
# widening the global allow list. Each crate is named below
# (cargo-deny does not support glob `name` matchers for exceptions). Add
# a sibling block for any new uniffi sub-crate that lands; do not move
# MPL-2.0 back into [licenses].allow without CODEOWNERS sign-off.
[[licenses.exceptions]]
name = "uniffi"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
name = "uniffi_bindgen"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
name = "uniffi_build"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
name = "uniffi_checksum_derive"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
name = "uniffi_core"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
name = "uniffi_macros"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
name = "uniffi_meta"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
name = "uniffi_testing"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
name = "uniffi_udl"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
# Pins WebAuthn crates for passkey-backed custody. Both crates are
# MPL-2.0 weak copyleft, so keep the exception pinned to the exact crate names
# instead of widening the workspace allow-list.
name = "webauthn-rs"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "webauthn-rs-proto"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
# last-checked = 2026-05-02. webauthn-rs-core is part of the same
# WebAuthn passkey custody stack as webauthn-rs and webauthn-rs-proto.
# Keep the MPL-2.0 exception pinned to this crate name.
name = "webauthn-rs-core"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
# last-checked = 2026-05-02. webauthn-attestation-ca provides
# passkey attestation certificate parsing for the custody stack.
name = "webauthn-attestation-ca"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
# last-checked = 2026-05-02. base64urlsafedata is a WebAuthn
# support crate pulled only through webauthn-attestation-ca.
name = "base64urlsafedata"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
# `option-ext` is an MPL-2.0 helper pulled by dirs -> sev ->
# chio-attest-verify. Keep the approval local to the crate instead of
# widening the workspace MPL policy.
name = "option-ext"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
# Wasmtime 43 pulls `wasm-compose`, which depends on these persistent-data
# structure crates. They are MPL-2.0 weak copyleft, so keep the exception
# pinned to the exact crate names instead of widening the global allow-list.
name = "bitmaps"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "im-rc"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
# `minicbor` is pulled by aws-smithy-cbor through the AWS Marketplace
# entitlement client. BlueOak-1.0.0 is OSI-approved and permissive, but keep
# it pinned to this crate instead of widening the workspace allow-list.
name = "minicbor"
allow = ["BlueOak-1.0.0"]

[[licenses.exceptions]]
name = "sized-chunks"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
# last-checked = 2026-07-10. These Unlicense crates are pulled only through
# the iroh relay websocket stack. Keep the approval pinned to exact crate names
# instead of widening the workspace allow-list.
name = "async_io_stream"
allow = ["Unlicense"]

[[licenses.exceptions]]
name = "pharos"
allow = ["Unlicense"]

[[licenses.exceptions]]
name = "ws_stream_wasm"
allow = ["Unlicense"]

# Duplicate-version policy.
#
# `multiple-versions = "deny"` is the gate: any NEW duplicated crate name fails
# `cargo deny check bans` until it is either resolved or consciously waived
# here. The `[[bans.skip]]` entries below are transitive ecosystem splits that
# exist in `Cargo.lock` and cannot be flattened without forcing an upstream
# major bump on wasmtime, tonic, the rand/getrandom family, the RustCrypto
# stack, or alloy.
#
# Every entry has been verified against `cargo tree -d --workspace
# --all-features --target all` to be a genuine current duplicate (the
# cross-target view matters: the windows_*, jni, hermit-abi, r-efi, and redox
# crates only duplicate on their own platforms and do not appear in a
# host-only tree). When an upstream convergence lands, re-run that command and
# delete the entries that no longer appear.
[bans]
multiple-versions = "deny"
# cargo-deny treats local path dependencies without an explicit version as
# wildcards. CI blocks external registry wildcards separately via
# scripts/check-external-wildcard-deps.py so workspace-internal path deps do
# not force noisy version churn across every crate.
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[[bans.deny]]
# `time` 0.1 is unmaintained and depends on a soundness-bug-prone localtime
# call. Use `time` >= 0.3 or `chrono` >= 0.4.31.
name = "time"
version = "<0.3"

[[bans.deny]]
# `chrono` 0.4.0..=0.4.30 has a localtime soundness bug. Pin newer.
name = "chrono"
version = "<0.4.31"

[[bans.skip]]
# `windows-sys` ships v0.52 (pulled by ring, socket2, tonic) and v0.59
# (pulled by rustix/wasmtime). Cannot be flattened without forking the
# wasmtime or rustls stacks. Tracked weekly via Renovate; revisit when
# wasmtime and the rustls/ring family converge on a single major.
name = "windows-sys"

[[bans.skip]]
# `mio` resolves to 0.8 (pulled by `notify` 6.x for filesystem watching) and
# 1.x (pulled by tokio). Cannot be flattened without bumping `notify` to 7.x;
# revisit when `notify` moves onto mio 1.x.
name = "mio"

[[bans.skip]]
# `windows-targets` duplicates as a direct consequence of the windows-sys
# 0.52 vs 0.59 split above. The eight `windows_<arch>_<abi>` platform
# sub-crates (gnu/gnullvm/msvc across aarch64/i686/x86_64, plus
# aarch64-gnullvm) duplicate in lockstep and are listed individually at the
# end of this block so `cargo deny check bans` stays green on every target;
# they all clear together once the windows-sys major split resolves upstream.
name = "windows-targets"

[[bans.skip]]
# last-checked = 2026-07-10. `core-foundation` resolves to 0.9.x through
# iroh -> hickory-resolver -> system-configuration and 0.10.x through
# alloy/reqwest -> rustls-platform-verifier. This is an upstream macOS
# platform dependency split.
name = "core-foundation"

[[bans.skip]]
# `hashbrown` resolves to 0.12 (tonic 0.12 -> tower 0.4 -> indexmap 1),
# 0.14 (wasmtime/cranelift 29.x), and 0.15/0.16 (everything else). Cannot
# unify without bumping tonic or wasmtime, both gated on separate roadmap
# items. Revisit when chio-envoy-ext-authz moves to tonic 0.13+.
name = "hashbrown"

[[bans.skip]]
# `getrandom` cascades through the `rand` family: 0.2 (rand 0.8 consumers),
# 0.3 (rand 0.9), 0.4 (rand 0.10). The rand ecosystem is mid-migration;
# pinning to a single major would force a fork of rcgen, ring, or wasmtime.
name = "getrandom"

[[bans.skip]]
# `rand` 0.8 (chio-guards/internal), 0.9 (transitive through alloy), and
