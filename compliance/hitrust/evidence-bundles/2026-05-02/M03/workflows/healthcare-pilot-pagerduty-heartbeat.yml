name: healthcare-pilot-pagerduty-heartbeat

on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    name: PagerDuty heartbeat
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PAGERDUTY_ENDPOINT: https://events.pagerduty.com/v2/enqueue
      PAGERDUTY_ROUTING_KEY: ${{ secrets.CHIO_HEALTHCARE_PILOT_PAGERDUTY_ROUTING_KEY }}
    steps:
      - name: Validate routing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PAGERDUTY_ROUTING_KEY:-}"

      - name: Send synthetic heartbeat
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg routing_key "$PAGERDUTY_ROUTING_KEY" \
            --arg dedup_key "chio-healthcare-pilot-prod-weekly-heartbeat" \
            '{
              routing_key: $routing_key,
              event_action: "trigger",
              dedup_key: $dedup_key,
              payload: {
                summary: "Chio healthcare pilot weekly heartbeat",
                source: "chio.kernel",
                severity: "info",
                component: "healthcare-pilot-sidecar",
                group: "healthcare-design-partner",
                class: "heartbeat",
                custom_details: {
                  synthetic: true,
                  contains_phi: false,
                  runbook: "docs/operator-runbook/pagerduty.md"
                }
              }
            }')"
          curl --fail-with-body \
            --retry 2 \
            --retry-delay 5 \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$PAGERDUTY_ENDPOINT"
