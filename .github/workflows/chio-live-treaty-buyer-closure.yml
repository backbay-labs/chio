name: Chio Live Treaty Buyer Closure

on:
  pull_request:
    paths:
      - "crates/chio-attest-buyer/**"
      - "crates/chio-attest-buyer-core/**"
      - "crates/chio-runtime-core/**"
      - "crates/chio-runtime-harness/**"
      - "crates/chio-attest-loopback/**"
      - "crates/chio-cli/**"
      - "crates/chio-federation/**"
      - "crates/chio-kernel/**"
      - "crates/chio-runtime/**"
      - "examples/chio-3vendor/**"
      - "scripts/check-chio-live-treaty-buyer-closure.sh"
      - "scripts/check-chio-runtime-spine-fixtures.sh"
      - "scripts/check-chio-treaty-buyer-hero-loop.sh"
      - "spec/PROTOCOL.md"
      - "spec/schemas/chio-attest/**"
      - "spec/schemas/chio-federation/**"
      - "spec/schemas/chio-runtime/**"
      - "spec/schemas/**"
      - "spec/schemas/registry.json"
      - "spec/schemas/MANIFEST.sha256"
      - ".github/workflows/chio-live-treaty-buyer-closure.yml"
  push:
    branches: ["main"]
    paths:
      - "crates/chio-attest-buyer/**"
      - "crates/chio-attest-buyer-core/**"
      - "crates/chio-runtime-core/**"
      - "crates/chio-runtime-harness/**"
      - "crates/chio-attest-loopback/**"
      - "crates/chio-cli/**"
      - "crates/chio-federation/**"
      - "crates/chio-kernel/**"
      - "crates/chio-runtime/**"
      - "examples/chio-3vendor/**"
      - "scripts/check-chio-live-treaty-buyer-closure.sh"
      - "scripts/check-chio-runtime-spine-fixtures.sh"
      - "scripts/check-chio-treaty-buyer-hero-loop.sh"
      - "spec/PROTOCOL.md"
      - "spec/schemas/chio-attest/**"
      - "spec/schemas/chio-federation/**"
      - "spec/schemas/chio-runtime/**"
      - "spec/schemas/**"
      - "spec/schemas/registry.json"
      - "spec/schemas/MANIFEST.sha256"
      - ".github/workflows/chio-live-treaty-buyer-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chio-live-treaty-buyer-closure-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  live-treaty-buyer-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run live treaty buyer closure gate
        run: bash scripts/check-chio-live-treaty-buyer-closure.sh
