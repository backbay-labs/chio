name: Chio Live Treaty Buyer Closure

on:
  pull_request:
    paths:
      - "crates/trust/chio-attest-buyer/**"
      - "crates/trust/chio-attest-buyer-core/**"
      - "crates/kernel/chio-runtime-core/**"
      - "crates/kernel/chio-runtime-harness/**"
      - "crates/trust/chio-attest-loopback/**"
      - "crates/products/chio-cli/**"
      - "crates/trust/chio-federation/**"
      - "crates/kernel/chio-kernel/**"
      - "crates/kernel/chio-runtime/**"
      - "examples/chio-3vendor/**"
      - "scripts/check-chio-live-treaty-buyer-closure.sh"
      - "scripts/check-chio-runtime-spine-fixtures.sh"
      - "scripts/check-chio-treaty-buyer-hero-loop.sh"
      - "spec/PROTOCOL.md"
      - "spec/schemas/chio-attest/**"
      - "spec/schemas/chio-federation/**"
      - "spec/schemas/chio-runtime/**"
      - "spec/schemas/registry.json"
      - "spec/schemas/MANIFEST.sha256"
      - ".github/workflows/chio-live-treaty-buyer-closure.yml"
  push:
    branches: ["main"]
    paths:
      - "crates/trust/chio-attest-buyer/**"
      - "crates/trust/chio-attest-buyer-core/**"
      - "crates/kernel/chio-runtime-core/**"
      - "crates/kernel/chio-runtime-harness/**"
      - "crates/trust/chio-attest-loopback/**"
      - "crates/products/chio-cli/**"
      - "crates/trust/chio-federation/**"
      - "crates/kernel/chio-kernel/**"
      - "crates/kernel/chio-runtime/**"
      - "examples/chio-3vendor/**"
      - "scripts/check-chio-live-treaty-buyer-closure.sh"
      - "scripts/check-chio-runtime-spine-fixtures.sh"
      - "scripts/check-chio-treaty-buyer-hero-loop.sh"
      - "spec/PROTOCOL.md"
      - "spec/schemas/chio-attest/**"
      - "spec/schemas/chio-federation/**"
      - "spec/schemas/chio-runtime/**"
      - "spec/schemas/registry.json"
      - "spec/schemas/MANIFEST.sha256"
      - ".github/workflows/chio-live-treaty-buyer-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chio-live-treaty-buyer-closure-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  live-treaty-buyer-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Run live treaty buyer closure gate
        run: bash scripts/check-chio-live-treaty-buyer-closure.sh
