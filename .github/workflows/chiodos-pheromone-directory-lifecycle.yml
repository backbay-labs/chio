name: Chiodos Pheromone Directory Lifecycle

on:
  pull_request:
    paths:
      - "crates/chio-pheromone-relay/**"
      - "crates/chio-cli/**"
      - "examples/chiodos-3vendor/**"
      - "docs/release/CHIODOS_PHEROMONE_RELAY_RUNBOOK.md"
      - "docs/release/chiodos-pheromone-relay/**"
      - "spec/schemas/chio-pheromone/**"
      - "spec/schemas/registry.json"
      - "scripts/check-chiodos-pheromone-directory-lifecycle.sh"
      - ".github/workflows/chiodos-pheromone-directory-lifecycle.yml"
  push:
    branches: [main]
    paths:
      - "crates/chio-pheromone-relay/**"
      - "crates/chio-cli/**"
      - "examples/chiodos-3vendor/**"
      - "docs/release/CHIODOS_PHEROMONE_RELAY_RUNBOOK.md"
      - "docs/release/chiodos-pheromone-relay/**"
      - "spec/schemas/chio-pheromone/**"
      - "spec/schemas/registry.json"
      - "scripts/check-chiodos-pheromone-directory-lifecycle.sh"
      - ".github/workflows/chiodos-pheromone-directory-lifecycle.yml"

jobs:
  chiodos-pheromone-directory-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Chiodos pheromone directory lifecycle
        run: bash scripts/check-chiodos-pheromone-directory-lifecycle.sh
