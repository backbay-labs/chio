name: proof-mutants

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/proof-mutants.yml"
      - ".cargo/config.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/core/chio-core-types/**"
      - "crates/kernel/chio-kernel-core/**"
      - "formal/rust-verification/formal-mutants.toml"
      - "formal/lean4/lean-mutants-allowlist.toml"
      - "formal/lean4/Chio/**"
      - "scripts/file-mutation-survivors.py"
      - "scripts/lean-mutants.py"
      - "scripts/check-kani-core.sh"
      - "scripts/kani-mutant-killer.sh"
      - "scripts/proof-mutants.py"
      - "scripts/proof-mutants.sh"
      - "scripts/tests/proof-mutants.test.sh"
      - "scripts/tests/file-mutation-survivors.test.sh"
      - "scripts/tests/lean-mutants.test.sh"
      - "rust-toolchain.toml"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-proof-mutants', github.ref) || format('proof-mutants-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CHIO_KANI_VERSION: 0.67.0
  CHIO_ELAN_VERSION: v4.2.1
  CHIO_ELAN_TARBALL_SHA256: 4e717523217af592fa2d7b9c479410a31816c065d66ccbf0c2149337cfec0f5c

jobs:
  controls:
    name: proof-mutants-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Check mutation orchestration
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/tests/file-mutation-survivors.test.sh
          ./scripts/tests/lean-mutants.test.sh
          ./scripts/tests/proof-mutants.test.sh

  lean-mutants:
    name: lean-mutants
    if: github.event_name != 'pull_request'
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
    env:
      CHIO_MUTATION_SAMPLE_EPOCH: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Lean toolchain manager
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/elan.tar.gz"
          curl -fsSL \
            "https://github.com/leanprover/elan/releases/download/${CHIO_ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz" \
            -o "${archive}"
          echo "${CHIO_ELAN_TARBALL_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/elan-init" -y --default-toolchain none
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"

      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(tr -d '\r\n' < formal/lean4/Chio/lean-toolchain)"
          elan toolchain install "${toolchain}"
          (
            cd formal/lean4/Chio
            lake --version
            lake build
          )

      - name: Score Lean model sample
        run: ./scripts/lean-mutants.py --sample-size 5

      - name: File surviving Lean mutation issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report="target/formal/lean-mutants/report.json"
          if [[ -f "${report}" ]]; then
            ./scripts/file-mutation-survivors.py "${report}"
          fi

      - name: Upload Lean mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lean-mutants-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/formal/lean-mutants
          if-no-files-found: error
          retention-days: 30

  proof-mutants:
    name: proof-mutants
    if: github.event_name != 'pull_request'
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      CHIO_MUTATION_SAMPLE_EPOCH: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(python3 - <<'PY'
          import tomllib
          with open("rust-toolchain.toml", "rb") as handle:
              print(tomllib.load(handle)["toolchain"]["channel"])
          PY
          )"
          rustup toolchain install "${toolchain}" --profile minimal
          rustc --version --verbose

      - name: Install protobuf compiler
        uses: ./.github/actions/apt-install
        with:
          packages: protobuf-compiler

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Check shared mutation budget
        env:
          GH_TOKEN: ${{ github.token }}
          GH_FUZZ_BUDGET_RATE_LIMIT_MODE: warn
          GH_FUZZ_BUDGET_CAP_MODE: warn
          GH_FUZZ_BUDGET_WORKFLOWS: mutants.yml,mutants-fuzz-cocoverage.yml,proof-mutants.yml
          GH_FUZZ_BUDGET_MINUTES: 48000
        run: ./scripts/check-fuzz-budget.sh "${{ github.repository }}"

      - name: Install pinned mutation and proof tools
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/chio-proof-mutant-tools
        run: |
          set -euo pipefail
          cargo install cargo-mutants --version 25.3.1 --locked
          cargo install kani-verifier --version "${CHIO_KANI_VERSION}" --locked
          cargo kani setup
          cargo mutants --version
          cargo kani --version

      - name: Settle focused cargo-mutants discovery
        shell: bash
        run: |
          set -euo pipefail
          cargo mutants \
            --config formal/rust-verification/formal-mutants.toml \
            --package chio-kernel-core \
            --list \
            --json > "${RUNNER_TEMP}/formal-mutants.json"
          python3 - "${RUNNER_TEMP}/formal-mutants.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          mutants = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          files = {mutant.get("file") for mutant in mutants}
          required = {
              "crates/kernel/chio-kernel-core/src/formal_core.rs",
              "crates/kernel/chio-kernel-core/src/formal_aeneas.rs",
              "src/formal_core.rs",
              "src/formal_aeneas.rs",
          }
          if not mutants:
              raise SystemExit("focused cargo-mutants discovery is empty")
          if not any(str(path).endswith("formal_core.rs") for path in files):
              raise SystemExit("formal_core.rs produced no mutants")
          if not any(str(path).endswith("formal_aeneas.rs") for path in files):
              raise SystemExit("formal_aeneas.rs produced no mutants")
          if not files.issubset(required):
              raise SystemExit(f"focused discovery escaped its files: {files - required}")
          PY

      - name: Score deterministic proof sample
        id: mutation_run
        continue-on-error: true
        env:
          CARGO_BUILD_JOBS: "1"
        run: ./scripts/proof-mutants.sh --sample-size 15 --activation-target 90

      - name: File surviving mutation issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report="target/formal/proof-mutants/outcomes.json"
          if [[ -f "${report}" ]]; then
            ./scripts/file-mutation-survivors.py "${report}"
          fi

      - name: Upload proof mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proof-mutants-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/formal/proof-mutants
          if-no-files-found: error
          retention-days: 30

      - name: Upload proof mutation scored report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proof-mutants-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/formal/proof-mutants/outcomes.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve mutation verdict
        if: always()
        shell: bash
        env:
          MUTATION_OUTCOME: ${{ steps.mutation_run.outcome }}
        run: |
          set -euo pipefail
          if [[ "${MUTATION_OUTCOME}" != "success" ]]; then
            echo "proof-mutants did not meet its activation target" >&2
            exit 1
          fi

      - name: Record proof mutation lane posture
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LANE_EXIT: ${{ job.status == 'success' && '0' || '1' }}
          LANE_GATE_RATE_LIMIT_MODE: warn
        run: |
          set -euo pipefail
          bash scripts/lane-gate.sh proof-mutants
          exit "${LANE_EXIT}"
