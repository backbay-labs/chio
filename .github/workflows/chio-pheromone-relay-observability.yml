
name: Chio Pheromone Relay Observability

on:
  pull_request:
    paths:
      - "crates/chio-pheromone-relay/**"
      - "crates/chio-cli/**"
      - "crates/chio-metrics-spec/**"
      - "examples/chio-3vendor/**"
      - "docs/release/CHIO_PHEROMONE_RELAY_RUNBOOK.md"
      - "docs/release/chio-pheromone-relay/**"
      - "deploy/prometheus/**"
      - "spec/schemas/chio-pheromone/**"
      - "spec/schemas/registry.json"
      - "scripts/check-chio-pheromone-relay-observability.sh"
      - "scripts/check-sre-metrics-registry.sh"
      - ".github/workflows/chio-pheromone-relay-observability.yml"
  push:
    branches: [main]
    paths:
      - "crates/chio-pheromone-relay/**"
      - "crates/chio-cli/**"
      - "crates/chio-metrics-spec/**"
      - "examples/chio-3vendor/**"
      - "docs/release/CHIO_PHEROMONE_RELAY_RUNBOOK.md"
      - "docs/release/chio-pheromone-relay/**"
      - "deploy/prometheus/**"
      - "spec/schemas/chio-pheromone/**"
      - "spec/schemas/registry.json"
      - "scripts/check-chio-pheromone-relay-observability.sh"
      - "scripts/check-sre-metrics-registry.sh"
      - ".github/workflows/chio-pheromone-relay-observability.yml"

jobs:
  chio-pheromone-relay-observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/chio-cli/dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
        working-directory: crates/chio-cli/dashboard
      - name: Check Chio pheromone relay observability
        run: bash scripts/check-chio-pheromone-relay-observability.sh
