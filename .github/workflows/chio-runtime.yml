name: Chio Runtime

# Consolidated runtime gate family. Each matrix leg runs one per-capability
# facet via `cargo xtask check fixtures runtime-<capability>` (manifest in
# ci-gates/runtime.toml, typed handlers in xtask/src/fixtures_runtime*.rs).
#
# The GitHub branch ruleset must require the matrix-leg check contexts (e.g.
# "Chio Runtime / runtime (spine)"), not a single top-level workflow check.
#
# Path-scoping trade-off: a single matrix workflow has one `on:` block and
# cannot express per-matrix-entry path filters, so the union `on.paths` below
# over-triggers - a change matching any one leg's paths runs all five legs,
# some redundantly. The pheromone workflows stay separate to avoid exactly this
# (see .github/workflows/README.md "Why not one matrix workflow"); the runtime
# family tolerates the redundant legs, which are cheap and fail-fast.

on:
  pull_request:
    paths:
      - "crates/trust/chio-attest-buyer/**"
      - "crates/trust/chio-attest-buyer-core/**"
      - "crates/trust/chio-attest-loopback/**"
      - "crates/kernel/chio-runtime-core/**"
      - "crates/kernel/chio-runtime-harness/**"
      - "crates/products/chio-cli/**"
      - "crates/trust/chio-federation/**"
      - "crates/kernel/chio-kernel/**"
      - "crates/kernel/chio-runtime/**"
      - "crates/tooling/chio-spec-validate/**"
      - "examples/chio-3vendor/**"
      - "fixtures/proof-room/catalog.json"
      - "fixtures/proof-room/runtime-security/**"
      - "spec/schemas/chio-attest/**"
      - "spec/schemas/chio-federation/**"
      - "spec/schemas/chio-runtime/**"
      - "spec/schemas/registry.json"
      - "spec/schemas/MANIFEST.sha256"
      - "scripts/check-chio-runtime-spine-fixtures.sh"
      - "scripts/check-chio-treaty-buyer-hero-loop.sh"
      - "ci-gates/runtime.toml"
      - "xtask/**"
      - ".github/workflows/chio-runtime.yml"
  push:
    branches: [main]
    paths:
      - "crates/trust/chio-attest-buyer/**"
      - "crates/trust/chio-attest-buyer-core/**"
      - "crates/trust/chio-attest-loopback/**"
      - "crates/kernel/chio-runtime-core/**"
      - "crates/kernel/chio-runtime-harness/**"
      - "crates/products/chio-cli/**"
      - "crates/trust/chio-federation/**"
      - "crates/kernel/chio-kernel/**"
      - "crates/kernel/chio-runtime/**"
      - "crates/tooling/chio-spec-validate/**"
      - "examples/chio-3vendor/**"
      - "fixtures/proof-room/catalog.json"
      - "fixtures/proof-room/runtime-security/**"
      - "spec/schemas/chio-attest/**"
      - "spec/schemas/chio-federation/**"
      - "spec/schemas/chio-runtime/**"
      - "spec/schemas/registry.json"
      - "spec/schemas/MANIFEST.sha256"
      - "scripts/check-chio-runtime-spine-fixtures.sh"
      - "scripts/check-chio-treaty-buyer-hero-loop.sh"
      - "ci-gates/runtime.toml"
      - "xtask/**"
      - ".github/workflows/chio-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chio-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  runtime:
    name: runtime (${{ matrix.capability }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        capability:
          - ops-hardening
          - orchestration
          - attack-simulation
          - chaos
          - policy
          - proof-parity
          - spine
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Run Chio runtime ${{ matrix.capability }} gate
        run: cargo xtask check fixtures runtime-${{ matrix.capability }}
