name: Reproducible Build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

env:
  BINARY_NAME: chio
  CARGO_INCREMENTAL: "0"
  CARGO_PACKAGE: chio-cli
  CARGO_TERM_COLOR: always
  CHIO_REPRO_RUSTFLAGS: "-C link-arg=-Wl,--threads=1 -C debuginfo=0"
  TARGET: x86_64-unknown-linux-gnu

jobs:
  builder-a:
    name: builder-a
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Resolve immutable tag input
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          semver_re='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?'
          if ! [[ "${tag}" =~ ^v${semver_re}$ ]]; then
            echo "::error::tag '${tag}' does not match v<semver>" >&2
            exit 1
          fi
          tag_sha="$(git rev-list -n 1 "refs/tags/${tag}")"
          source_date_epoch="$(git log -1 --format=%ct "${tag_sha}")"
          git checkout --detach "${tag_sha}"
          {
            echo "CHIO_REPRO_TAG=${tag}"
            echo "CHIO_REPRO_SHA=${tag_sha}"
            echo "SOURCE_DATE_EPOCH=${source_date_epoch}"
          } >> "${GITHUB_ENV}"

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install --profile minimal
          rustup target add "${TARGET}"
          rustup show active-toolchain

      - name: Install protobuf compiler
        uses: ./.github/actions/apt-install
        with:
          packages: protobuf-compiler

      - name: Build chio-cli release binary
        shell: bash
        env:
          RUSTFLAGS: ${{ env.CHIO_REPRO_RUSTFLAGS }}
        run: |
          set -euo pipefail
          cargo build --release --locked \
            --package "${CARGO_PACKAGE}" \
            --bin "${BINARY_NAME}" \
            --target "${TARGET}"
          out_dir="${RUNNER_TEMP}/repro-builder-a"
          mkdir -p "${out_dir}"
          cp "target/${TARGET}/release/${BINARY_NAME}" "${out_dir}/${BINARY_NAME}"
          (
            cd "${out_dir}"
            sha256sum "${BINARY_NAME}" > SHA256SUMS
            printf 'tag=%s\nsource_sha=%s\nsource_date_epoch=%s\n' \
              "${CHIO_REPRO_TAG}" "${CHIO_REPRO_SHA}" "${SOURCE_DATE_EPOCH}" \
              > build-metadata.env
          )

      - name: Upload builder-a artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reproducible-builder-a
          path: ${{ runner.temp }}/repro-builder-a
          retention-days: 21

  builder-b:
    name: builder-b
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Resolve immutable tag input
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          semver_re='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?'
          if ! [[ "${tag}" =~ ^v${semver_re}$ ]]; then
            echo "::error::tag '${tag}' does not match v<semver>" >&2
            exit 1
          fi
          tag_sha="$(git rev-list -n 1 "refs/tags/${tag}")"
          source_date_epoch="$(git log -1 --format=%ct "${tag_sha}")"
          git checkout --detach "${tag_sha}"
          {
            echo "CHIO_REPRO_TAG=${tag}"
            echo "CHIO_REPRO_SHA=${tag_sha}"
            echo "SOURCE_DATE_EPOCH=${source_date_epoch}"
          } >> "${GITHUB_ENV}"

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install --profile minimal
          rustup target add "${TARGET}"
          rustup show active-toolchain

      - name: Install protobuf compiler
        uses: ./.github/actions/apt-install
        with:
          packages: protobuf-compiler

      - name: Build chio-cli release binary
        shell: bash
        env:
          RUSTFLAGS: ${{ env.CHIO_REPRO_RUSTFLAGS }}
        run: |
          set -euo pipefail
          cargo build --release --locked \
            --package "${CARGO_PACKAGE}" \
            --bin "${BINARY_NAME}" \
            --target "${TARGET}"
          out_dir="${RUNNER_TEMP}/repro-builder-b"
          mkdir -p "${out_dir}"
          cp "target/${TARGET}/release/${BINARY_NAME}" "${out_dir}/${BINARY_NAME}"
          (
            cd "${out_dir}"
            sha256sum "${BINARY_NAME}" > SHA256SUMS
            printf 'tag=%s\nsource_sha=%s\nsource_date_epoch=%s\n' \
              "${CHIO_REPRO_TAG}" "${CHIO_REPRO_SHA}" "${SOURCE_DATE_EPOCH}" \
              > build-metadata.env
          )

      - name: Upload builder-b artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reproducible-builder-b
          path: ${{ runner.temp }}/repro-builder-b
          retention-days: 21

  reproducibility-gate:
    name: reproducibility-gate
    runs-on: ubuntu-24.04
    needs: [builder-a, builder-b]
    steps:
      - name: Download builder-a artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reproducible-builder-a
          path: artifacts/builder-a

      - name: Download builder-b artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reproducible-builder-b
          path: artifacts/builder-b

      - name: Compare sha256 manifests
        shell: bash
        run: |
          set -euo pipefail
          sort artifacts/builder-a/SHA256SUMS > builder-a.sha256
          sort artifacts/builder-b/SHA256SUMS > builder-b.sha256
          if ! diff -u builder-a.sha256 builder-b.sha256; then
            echo "::error::reproducible-build sha256 mismatch" >&2
            echo "builder-a:"
            cat builder-a.sha256
            echo "builder-b:"
            cat builder-b.sha256
            exit 1
          fi
          cmp -s artifacts/builder-a/chio artifacts/builder-b/chio
          cat builder-a.sha256
