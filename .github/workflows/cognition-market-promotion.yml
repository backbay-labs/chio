name: Cognition market production promotion

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cognition-market-production-promotion
  cancel-in-progress: false

jobs:
  qualify:
    name: Real KVM promotion qualification
    if: github.ref == 'refs/heads/main'
    environment:
      name: cognition-market-production
    runs-on: [self-hosted, linux, x64, kvm, cognition-market, ephemeral, attested]
    timeout-minutes: 180
    env:
      CHIO_KVM_RUNNER_IMAGE_SHA256: ${{ vars.CHIO_KVM_RUNNER_IMAGE_SHA256 }}
      CHIO_KVM_RUNNER_ATTESTATION_SHA256: ${{ vars.CHIO_KVM_RUNNER_ATTESTATION_SHA256 }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Require the exact default-branch candidate
        run: |
          git check-ref-format --branch "${DEFAULT_BRANCH}" >/dev/null
          git fetch --no-tags --force origin \
            "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          candidate_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          default_branch_sha="$(git rev-parse --verify "refs/remotes/origin/${DEFAULT_BRANCH}^{commit}")"
          test "${GITHUB_REF}" = "refs/heads/${DEFAULT_BRANCH}"
          test "${candidate_sha}" = "${GITHUB_SHA}"
          test "${candidate_sha}" = "${default_branch_sha}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "${GITHUB_RUN_ATTEMPT}" -ge 1
          test -n "${CHIO_KVM_RUNNER_IMAGE_SHA256}"
          test -n "${CHIO_KVM_RUNNER_ATTESTATION_SHA256}"
      - name: Qualify hosted cognition market on real KVM
        run: ./scripts/qualify-cognition-market-hosted.sh
      - name: Install cosign
        uses: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409
        with:
          cosign-release: v2.4.1
      - name: Recheck the default-branch head before signing
        run: |
          git fetch --no-tags --force origin \
            "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          default_branch_sha="$(git rev-parse --verify "refs/remotes/origin/${DEFAULT_BRANCH}^{commit}")"
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "${GITHUB_SHA}"
          test "${GITHUB_SHA}" = "${default_branch_sha}"
      - name: Sign and verify exact-candidate promotion evidence
        env:
          EXPECTED_WORKFLOW_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/cognition-market-promotion.yml@${{ github.ref }}
        run: |
          signature_root=target/release-qualification/cognition-market-promotion-sigstore
          mkdir -p "${signature_root}"
          for evidence in hosted kvm; do
            if test "${evidence}" = hosted; then
              manifest=target/release-qualification/cognition-market-hosted/artifact-manifest.signed.json
            else
              manifest=target/release-qualification/cognition-market-kvm/artifact-manifest.signed.json
            fi
            signature="${signature_root}/${evidence}.sig"
            certificate="${signature_root}/${evidence}.pem"
            test -s "${manifest}"
            cosign sign-blob --yes \
              --output-signature "${signature}" \
              --output-certificate "${certificate}" \
              "${manifest}"
            test -s "${signature}"
            test -s "${certificate}"
            cosign verify-blob \
              --certificate "${certificate}" \
              --signature "${signature}" \
              --certificate-identity "${EXPECTED_WORKFLOW_IDENTITY}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${manifest}"
          done
      - name: Upload promotion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cognition-market-promotion-${{ github.sha }}
          path: |
            target/release-qualification/cognition-market-hosted
            target/release-qualification/cognition-market-kvm
            target/release-qualification/cognition-market-promotion-sigstore
          if-no-files-found: error
          retention-days: 90
