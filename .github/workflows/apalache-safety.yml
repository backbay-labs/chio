name: apalache-safety

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"
  pull_request:
    paths:
      - "formal/apalache/**"
      - "formal/tla/**"
      - "scripts/check-apalache-formal-slice.py"
      - "tools/install-apalache.sh"
      - ".github/workflows/apalache-safety.yml"
      - ".github/workflows/apalache-temporal.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-apalache-safety', github.ref) || format('main-{0}-apalache-safety', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apalache-subset:
    name: apalache-subset
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Java runtime
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Apalache
        shell: bash
        run: |
          set -euo pipefail
          ./tools/install-apalache.sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Confirm Apalache
        shell: bash
        run: |
          set -euo pipefail
          command -v apalache-mc
          apalache-mc version || true

      - name: Formal slice contract checks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-apalache-formal-slice.py

      - name: Apalache safety checks
        shell: bash
        run: |
          set -euo pipefail
          while IFS="|" read -r cfg spec; do
            apalache-mc check \
              --length=6 \
              --config="${cfg}" \
              "${spec}"
          done <<'EOF'
          formal/apalache/MCMonotoneLogApalache.cfg|formal/apalache/MonotoneLogApalache.tla
          formal/apalache/MCRevocationCutCompleteness.cfg|formal/apalache/RevocationCutCompleteness.tla
          formal/apalache/MCReceiptBeforeAllow.cfg|formal/apalache/ReceiptBeforeAllow.tla
          formal/apalache/MCKernelTransitionCancelSafe.cfg|formal/apalache/KernelTransitionCancelSafe.tla
          formal/tla/MCRevocationPropagation.cfg|formal/tla/RevocationPropagation.tla
          formal/tla/MCDelegationDepthBound.cfg|formal/tla/DelegationDepthBound.tla
          EOF
