name: Chio Pheromone Transit

on:
  pull_request:
    paths:
      - ".github/workflows/chio-pheromone-transit.yml"
      - "crates/trust/chio-pheromone/**"
      - "crates/trust/chio-federation/src/pheromone_gossip.rs"
      - "crates/trust/chio-federation/tests/pheromone_gossip.rs"
      - "examples/chio-3vendor/**"
      - "spec/CHIO_PHEROMONE.md"
      - "spec/schemas/chio-pheromone/**"
      - "spec/schemas/registry.json"
      - "ci-gates/pheromone.toml"
      - "xtask/**"
  push:
    branches:
      - main
    paths:
      - "crates/trust/chio-pheromone/**"
      - "crates/trust/chio-federation/src/pheromone_gossip.rs"
      - "crates/trust/chio-federation/tests/pheromone_gossip.rs"
      - "examples/chio-3vendor/**"
      - "spec/CHIO_PHEROMONE.md"
      - "spec/schemas/chio-pheromone/**"
      - "spec/schemas/registry.json"
      - "ci-gates/pheromone.toml"
      - "xtask/**"
      - ".github/workflows/chio-pheromone-transit.yml"

jobs:
  chio-pheromone-transit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (pins to rust-toolchain.toml 1.93.0)
      - name: Run Chio pheromone transit gate
        run: cargo xtask check fixtures transit
