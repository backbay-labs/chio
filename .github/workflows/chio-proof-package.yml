name: Chio Proof Package

on:
  # Re-issues a federation authority bundle and compares it against the
  # committed examples/chio-3vendor proof package, verifier trust bundle, and
  # verification context.
  pull_request:
    paths:
      - "crates/chio-attest-*/**"
      - "crates/chio-federation*/**"
      - "examples/chio-3vendor/**"
      - "scripts/check-chio-proof-package.sh"
      - "spec/schemas/chio-attest/**"
      - "spec/schemas/chio-federation/**"
      - ".github/workflows/chio-proof-package.yml"
  push:
    branches: ["main"]
    paths:
      - "crates/chio-attest-*/**"
      - "crates/chio-federation*/**"
      - "examples/chio-3vendor/**"
      - "scripts/check-chio-proof-package.sh"
      - "spec/schemas/chio-attest/**"
      - "spec/schemas/chio-federation/**"
      - ".github/workflows/chio-proof-package.yml"
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chio-proof-package-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  proof-package-gate:
    name: proof-package-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Run Chio proof-package gate
        run: bash scripts/check-chio-proof-package.sh
