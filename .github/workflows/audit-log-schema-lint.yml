name: audit-log-schema-lint

on:
  pull_request:
    paths:
      - "spec/audit-log/export-schema.v1.json"
      - "crates/chio-siem/src/exporters/cef.rs"
      - "crates/chio-siem/src/exporters/cef.golden.txt"
      - "crates/chio-siem/tests/cef_emitter.rs"
      - ".github/workflows/audit-log-schema-lint.yml"
  push:
    branches: [main]
    paths:
      - "spec/audit-log/export-schema.v1.json"
      - "crates/chio-siem/src/exporters/cef.rs"
      - "crates/chio-siem/src/exporters/cef.golden.txt"
      - "crates/chio-siem/tests/cef_emitter.rs"
      - ".github/workflows/audit-log-schema-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-log-schema-lint:
    name: audit-log-schema-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate export-schema.v1.json
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          schema = json.load(open("spec/audit-log/export-schema.v1.json", encoding="utf-8"))
          assert schema["$schema"].startswith("https://json-schema.org/draft/2020-12")
          assert "ocsf" in schema["properties"]
          assert "cef" in schema["properties"]
          assert "OCSF" in json.dumps(schema)
          assert "CEF" in json.dumps(schema)
          PY

      - name: Validate CEF golden
        shell: bash
        run: |
          set -euo pipefail
          test -s crates/chio-siem/src/exporters/cef.golden.txt
          grep -q '^CEF:0|' crates/chio-siem/src/exporters/cef.golden.txt
          grep -q 'receipt_id' crates/chio-siem/src/exporters/cef.golden.txt
          grep -q 'redaction_status' crates/chio-siem/src/exporters/cef.golden.txt

      - name: Run CEF emitter test
        shell: bash
        run: cargo test -p chio-siem --test cef_emitter --quiet
