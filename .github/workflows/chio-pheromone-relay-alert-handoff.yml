name: Chio Pheromone Relay Alert Handoff

on:
  pull_request:
    paths:
      - "crates/chio-pheromone-relay/**"
      - "crates/chio-cli/**"
      - "crates/chio-metrics-spec/**"
      - "crates/chio-spec-validate/**"
      - "examples/chio-3vendor/fixtures/pheromone/relay/**"
      - "docs/release/CHIO_PHEROMONE_RELAY_RUNBOOK.md"
      - "docs/release/chio-pheromone-relay/**"
      - "deploy/prometheus/**"
      - "spec/schemas/chio-pheromone/v1/**"
      - "spec/schemas/registry.json"
      - "scripts/check-chio-pheromone-relay-alert-handoff.sh"
      - "scripts/check-chio-pheromone-relay-alert-routing.sh"
      - ".github/workflows/chio-pheromone-relay-alert-handoff.yml"
  push:
    branches: [main]
    paths:
      - "crates/chio-pheromone-relay/**"
      - "crates/chio-cli/**"
      - "crates/chio-metrics-spec/**"
      - "crates/chio-spec-validate/**"
      - "examples/chio-3vendor/fixtures/pheromone/relay/**"
      - "docs/release/CHIO_PHEROMONE_RELAY_RUNBOOK.md"
      - "docs/release/chio-pheromone-relay/**"
      - "deploy/prometheus/**"
      - "spec/schemas/chio-pheromone/v1/**"
      - "spec/schemas/registry.json"
      - "scripts/check-chio-pheromone-relay-alert-handoff.sh"
      - "scripts/check-chio-pheromone-relay-alert-routing.sh"
      - ".github/workflows/chio-pheromone-relay-alert-handoff.yml"

permissions:
  contents: read

jobs:
  chio-pheromone-relay-alert-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (pins to rust-toolchain.toml 1.93.0)
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/chio-cli/dashboard/package-lock.json
      - name: Install dashboard dependencies
        working-directory: crates/chio-cli/dashboard
        run: npm ci
      - name: Check Chio pheromone relay alert handoff
        run: bash scripts/check-chio-pheromone-relay-alert-handoff.sh
