name: Chio Pheromone Relay Alert Handoff

on:
  pull_request:
    paths:
      - "crates/trust/chio-pheromone-relay/**"
      - "crates/products/chio-cli/**"
      - "crates/observability/chio-metrics-spec/**"
      - "crates/tooling/chio-spec-validate/**"
      - "examples/chio-3vendor/fixtures/pheromone/relay/**"
      - "docs/release/CHIO_PHEROMONE_RELAY_RUNBOOK.md"
      - "docs/release/chio-pheromone-relay/**"
      - "deploy/prometheus/**"
      - "spec/schemas/chio-pheromone/v1/**"
      - "spec/schemas/registry.json"
      - "ci-gates/pheromone.toml"
      - "xtask/**"
      - ".github/workflows/chio-pheromone-relay-alert-handoff.yml"
  push:
    branches: [main]
    paths:
      - "crates/trust/chio-pheromone-relay/**"
      - "crates/products/chio-cli/**"
      - "crates/observability/chio-metrics-spec/**"
      - "crates/tooling/chio-spec-validate/**"
      - "examples/chio-3vendor/fixtures/pheromone/relay/**"
      - "docs/release/CHIO_PHEROMONE_RELAY_RUNBOOK.md"
      - "docs/release/chio-pheromone-relay/**"
      - "deploy/prometheus/**"
      - "spec/schemas/chio-pheromone/v1/**"
      - "spec/schemas/registry.json"
      - "ci-gates/pheromone.toml"
      - "xtask/**"
      - ".github/workflows/chio-pheromone-relay-alert-handoff.yml"

permissions:
  contents: read

jobs:
  chio-pheromone-relay-alert-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
      - uses: ./.github/actions/setup-node
        with:
          node-version: "24"
          cache-dependency-path: crates/products/chio-cli/dashboard/package-lock.json
          working-directory: crates/products/chio-cli/dashboard
      - name: Check Chio pheromone relay alert handoff
        run: cargo xtask check fixtures relay-alert-handoff
