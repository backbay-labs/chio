name: cargo-vet

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - "supply-chain/**"
      - ".github/workflows/cargo-vet.yml"
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - "supply-chain/**"
      - ".github/workflows/cargo-vet.yml"

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-cargo-vet', github.ref) || format('main-{0}-cargo-vet', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-vet:
    name: cargo-vet (locked supply-chain audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install --profile minimal
          rustup show active-toolchain

      - name: Install cargo-vet
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-vet --locked --version 0.10.2

      - name: Check cargo-vet exemptions do not increase
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git show "$BASE_SHA:supply-chain/config.toml" > "$RUNNER_TEMP/base-cargo-vet-config.toml"
          if python3 scripts/check-cargo-vet-exemptions.py \
            --base "$RUNNER_TEMP/base-cargo-vet-config.toml" \
            --head supply-chain/config.toml; then
            exit 0
          fi
          if gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate --jq '.[].body' \
            | grep -Eiq '^cargo-vet-exemption-justification:'; then
            echo "cargo-vet exemption increase accepted by explicit PR justification comment"
            exit 0
          fi
          {
            echo "Net-new cargo-vet exemptions require a reviewer comment that starts with:"
            echo
            echo "cargo-vet-exemption-justification: <reason>"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: cargo vet --locked
        shell: bash
        run: |
          set -euo pipefail
          cargo vet --locked
