name: cargo-vet

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - "supply-chain/**"
      - ".github/workflows/cargo-vet.yml"
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - "supply-chain/**"
      - ".github/workflows/cargo-vet.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-cargo-vet', github.ref) || format('main-{0}-cargo-vet', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-vet:
    name: cargo-vet (locked supply-chain audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install --profile minimal
          rustup show active-toolchain

      - name: Install cargo-vet
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-vet --locked --version 0.10.2

      - name: cargo vet --locked
        shell: bash
        run: |
          set -euo pipefail
          cargo vet --locked
