name: Legacy Chiodos Proof Package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-chiodos-proof-package-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  proof-package-gate:
    name: proof-package-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Run Chio proof-package gate
        run: bash scripts/check-chio-proof-package.sh
