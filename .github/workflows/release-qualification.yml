name: Release Qualification

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Pinned to match .github/workflows/ci.yml so the formal-proof gates
  # invoked through scripts/qualify-release.sh -> scripts/ci-workspace.sh
  # see the same Aeneas/Charon, Creusot, and Kani builds as the PR-tier
  # CI lane.
  CHIO_AENEAS_RELEASE_TAG: build-2026.04.22.215158-38d10a22642d75d051e14006cc6e45055381f10e
  CHIO_CREUSOT_REV: a12f3ac7f688c7b93cee2c2eb60282004a2bdb30
  CHIO_KANI_VERSION: 0.67.0

jobs:
  qualify:
    name: Release qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          android_sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -d "${android_sdk}" ]; then
            # Keep ${android_sdk}/ndk available for the cargo-ndk mobile lane.
            sudo rm -rf \
              "${android_sdk}/emulator" \
              "${android_sdk}/system-images" \
              "${android_sdk}/platforms" \
              "${android_sdk}/platform-tools" \
              "${android_sdk}/build-tools" \
              "${android_sdk}/cmdline-tools"
          fi
          sudo docker image prune --all --force
          df -h /

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Install MSRV toolchain
        run: rustup toolchain install 1.93.0 --profile minimal

      - name: Install Java runtime
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Apalache
        shell: bash
        run: |
          set -euo pipefail
          ./tools/install-apalache.sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Install Lean 4 toolchain
        shell: bash
        env:
          ELAN_VERSION: v4.2.1
          ELAN_TARBALL_SHA256: 4e717523217af592fa2d7b9c479410a31816c065d66ccbf0c2149337cfec0f5c
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz" \
            -o /tmp/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "${ELAN_TARBALL_SHA256}  /tmp/elan-x86_64-unknown-linux-gnu.tar.gz" | sha256sum -c -
          tar -xzf /tmp/elan-x86_64-unknown-linux-gnu.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "ELAN_HOME=$HOME/.elan" >> "$GITHUB_ENV"

      - name: Prime Lean 4 toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(tr -d '\r\n' < formal/lean4/Chio/lean-toolchain)"
          "$HOME/.elan/bin/elan" toolchain install "$toolchain"
          (
            cd formal/lean4/Chio
            "$HOME/.elan/bin/lake" --version
          )

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.3"

      - name: Enable pnpm
        run: corepack enable

      - name: Install web3 contract dependencies
        run: pnpm --dir contracts install --frozen-lockfile

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.23.0"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Install Aeneas and Charon
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/install-aeneas-toolchain.py
          architecture="$(uname -m)"
          [[ "${architecture}" == "arm64" ]] && architecture="aarch64"
          [[ "${architecture}" == "amd64" ]] && architecture="x86_64"
          echo "${GITHUB_WORKSPACE}/target/formal/aeneas-toolchain/${architecture}/bin" >> "${GITHUB_PATH}"

      - name: Install Rust verification tools
        shell: bash
        env:
          OPAMYES: "1"
          OPAMCONFIRMLEVEL: "unsafe-yes"
          CARGO_TARGET_DIR: ${{ runner.temp }}/chio-verification-tool-target
        run: |
          set -euo pipefail
          cargo install kani-verifier --locked --version "${CHIO_KANI_VERSION}"
          cargo kani setup
          sudo apt-get update
          sudo apt-get install -y opam
          opam init --disable-sandboxing --bare -y
          git clone https://github.com/creusot-rs/creusot "${RUNNER_TEMP}/creusot"
          git -C "${RUNNER_TEMP}/creusot" checkout "${CHIO_CREUSOT_REV}"
          (
            cd "${RUNNER_TEMP}/creusot"
            ./INSTALL
          )
          cargo creusot version
          cargo kani --version

      - name: Install portable qualification dependencies
        run: |
          cargo install wasm-pack --version "$(cat .tooling/wasm-pack.version)" --locked
          cargo install wasm-bindgen-cli --version "$(cat .tooling/wasm-bindgen.version)" --locked
          cargo install cargo-ndk --version "$(cat .tooling/cargo-ndk.version)" --locked
          rustup target add aarch64-linux-android
          sudo apt-get update
          if ! sudo apt-get install -y chromium-driver chromium libcurl4-openssl-dev; then
            sudo apt-get install -y chromium-driver chromium-browser libcurl4-openssl-dev
          fi

      - name: SDK parity contract lane
        run: ./scripts/check-sdk-parity.sh

      - name: Release qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/qualify-release.sh

      - name: Retain formal proof evidence
        if: always()
        run: |
          mkdir -p target/release-qualification/formal
          install -m 0644 \
            target/formal/proof-report.json \
            target/release-qualification/formal/proof-report.json
          install -m 0644 \
            target/formal/coverage.json \
            target/release-qualification/formal/coverage.json

      - name: Hosted web3 runtime qualification
        run: ./scripts/qualify-web3-runtime.sh

      - name: Hosted web3 promotion qualification
        run: ./scripts/qualify-web3-promotion.sh

      - name: Stage hosted web3 qualification artifacts
        if: always()
        run: ./scripts/stage-web3-release-artifacts.sh

      - name: MSRV workspace lane
        run: cargo +1.93.0 build --workspace && cargo +1.93.0 test --workspace

      - name: Upload qualification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-qualification
          path: target/release-qualification
          if-no-files-found: error
          retention-days: 21
