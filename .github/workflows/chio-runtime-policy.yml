name: Chio Runtime Policy

on:
  pull_request:
    paths:
      - "crates/chio-runtime-core/**"
      - "crates/chio-runtime-harness/**"
      - "crates/chio-attest-loopback/**"
      - "crates/chio-cli/**"
      - "crates/chio-kernel/**"
      - "crates/chio-runtime/**"
      - "scripts/check-chio-runtime-policy.sh"
      - "scripts/check-chio-runtime-spine.sh"
      - "scripts/check-chio-runtime-spine-fixtures.sh"
      - "scripts/check-chio-treaty-buyer-hero-loop.sh"
      - "spec/schemas/chio-runtime/**"
      - "spec/schemas/chio-attest/**"
      - "spec/schemas/chio-federation/**"
      - "spec/schemas/chio/**"
      - "spec/schemas/registry.json"
      - "spec/schemas/MANIFEST.sha256"
      - ".github/workflows/chio-runtime-policy.yml"
  push:
    branches: [main]
    paths:
      - "crates/chio-runtime-core/**"
      - "crates/chio-runtime-harness/**"
      - "crates/chio-attest-loopback/**"
      - "crates/chio-cli/**"
      - "crates/chio-kernel/**"
      - "crates/chio-runtime/**"
      - "scripts/check-chio-runtime-policy.sh"
      - "scripts/check-chio-runtime-spine.sh"
      - "scripts/check-chio-runtime-spine-fixtures.sh"
      - "scripts/check-chio-treaty-buyer-hero-loop.sh"
      - "spec/schemas/chio-runtime/**"
      - "spec/schemas/chio-attest/**"
      - "spec/schemas/chio-federation/**"
      - "spec/schemas/chio/**"
      - "spec/schemas/registry.json"
      - "spec/schemas/MANIFEST.sha256"
      - ".github/workflows/chio-runtime-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chio-runtime-policy-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  runtime-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Chio runtime policy gate
        run: bash scripts/check-chio-runtime-policy.sh
