name: apalache-temporal

# Advisory workflow: runs the legacy temporal liveness property
# RevocationEventuallySeen against formal/tla/RevocationPropagation.tla.
#
# This job is scheduled/manual only and is NOT a required PR gate while the
# trajectory-3.1 temporal lane gathers green history. Safety invariants for
# RevocationPropagation run in ci.yml with MCRevocationPropagation.cfg at the PR
# length bound. This workflow uses a temporal-only config so the advisory
# length-24 liveness check does not duplicate the safety sweep.
#
# Do not promote this workflow to a required check until the underlying
# property is fixed and the run is reliably green.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-apalache-temporal', github.ref) || format('main-{0}-apalache-temporal', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  revocation-eventually-seen:
    name: revocation-eventually-seen (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Java runtime
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Apalache
        shell: bash
        run: |
          set -euo pipefail
          ./tools/install-apalache.sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Confirm Apalache
        shell: bash
        run: |
          set -euo pipefail
          command -v apalache-mc
          apalache-mc version || true

      - name: RevocationEventuallySeen temporal check (advisory)
        shell: bash
        run: |
          set -euo pipefail
          apalache-mc check \
            --length=24 \
            --temporal=RevocationEventuallySeen \
            --config=formal/tla/MCRevocationPropagationTemporal.cfg \
            formal/tla/RevocationPropagation.tla
