name: apalache-temporal

# Scheduled/manual workflow: runs the legacy temporal liveness property
# RevocationEventuallySeen against formal/tla/RevocationPropagation.tla.
#
# This job is scheduled/manual only and is not a required PR gate while the
# temporal lane gathers green history. Safety invariants for
# RevocationPropagation run in apalache-safety.yml at the PR length bound.
# This length-24 temporal config keeps deep liveness coverage separate.
#
# Do not promote this workflow to a required check until the underlying
# property is fixed and the run is reliably green.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ format('{0}-{1}-apalache-temporal', github.event_name, github.sha) }}

jobs:
  revocation-eventually-seen:
    name: formal-tla-liveness
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Java runtime
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Apalache
        shell: bash
        run: |
          set -euo pipefail
          ./tools/install-apalache.sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Confirm Apalache
        shell: bash
        run: |
          set -euo pipefail
          command -v apalache-mc
          apalache-mc version || true

      - name: RevocationEventuallySeen temporal check
        shell: bash
        run: |
          set -euo pipefail
          apalache-mc check \
            --length=24 \
            --temporal=RevocationEventuallySeen \
            --config=formal/tla/MCRevocationPropagationTemporal.cfg \
            formal/tla/RevocationPropagation.tla
