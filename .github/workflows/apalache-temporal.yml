name: apalache-temporal

# Required nightly liveness workflow for RevocationEventuallySeen against
# formal/tla/RevocationPropagation.tla. Safety invariants for
# RevocationPropagation run in ci.yml at the PR length bound. This workflow
# stays scheduled/manual because the length-24 temporal check is too slow for
# the per-PR lane, but it fails closed when the property regresses.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-apalache-temporal', github.ref) || format('main-{0}-apalache-temporal', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  revocation-eventually-seen:
    name: formal-tla-liveness
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Java runtime
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Apalache
        shell: bash
        run: |
          set -euo pipefail
          ./tools/install-apalache.sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Confirm Apalache
        shell: bash
        run: |
          set -euo pipefail
          command -v apalache-mc
          apalache-mc version || true

      - name: RevocationEventuallySeen temporal check
        shell: bash
        run: |
          set -euo pipefail
          apalache-mc check \
            --length=24 \
            --temporal=RevocationEventuallySeen \
            --config=formal/tla/MCRevocationPropagationTemporal.cfg \
            formal/tla/RevocationPropagation.tla
