name: Legacy Chiodos Treaty-Bound Provenance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-chiodos-treaty-bound-provenance-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  treaty-bound-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Chio treaty-bound provenance gate
        run: bash scripts/check-chio-treaty-bound-provenance.sh
