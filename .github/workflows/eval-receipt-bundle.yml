name: eval-receipt-bundle

on:
  pull_request:
    paths:
      - "spec/eval/**"
      - "crates/chio-eval-receipt/**"
      - "tests/bindings/vectors/eval/**"
      - "tests/bindings/vectors/MANIFEST.sha256"
      - "xtask/src/eval_receipt_regen.rs"
      - ".github/workflows/eval-receipt-bundle.yml"
  push:
    branches:
      - main
    paths:
      - "spec/eval/**"
      - "crates/chio-eval-receipt/**"
      - "tests/bindings/vectors/eval/**"
      - "tests/bindings/vectors/MANIFEST.sha256"
      - "xtask/src/eval_receipt_regen.rs"
      - ".github/workflows/eval-receipt-bundle.yml"

permissions:
  contents: read

jobs:
  schema-lint:
    name: eval receipt schema lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Rust toolchain
        run: rustup show

      - name: Test schema linter
        run: cargo test -p chio-eval-receipt --test schema_lint --quiet

      - name: Check eval vector regeneration
        run: cargo run -p xtask -- eval-receipt-regen --check
