# conformance-matrix.yml - Nightly conformance and vector-freshness gates.
#
# Nightly/manual jobs:
#   - vectors-byte-stable: re-runs `cargo xtask freeze-vectors --check`
#     to catch vector drift introduced outside a PR.
#   - peer-lock-shape-check: validates the pre-release peer lockfile shape even
#     while all peer rows are `published = false`.
#   - external-consumer-smoke: release-blocking source-install consumer flow on
#     a fresh runner. It fails until at least one Python peer is published, then
#     fetches that peer and runs JSON-report scenarios against it.
# Pull requests run the vector and peer-lock shape gates only. They do not run
# external-consumer-smoke while the repo is pre-release and peer artifacts are
# intentionally unpublished.
#
# Alarm policy: 1 failed nightly opens an issue tagged `alarm:conformance-matrix`;
# 3 consecutive failures page the protocol owner.

name: conformance-matrix

on:
  pull_request:
    paths:
      - ".github/workflows/conformance-matrix.yml"
      - "crates/tooling/chio-conformance/**"
      - "crates/products/chio-cli/**"
      - "tests/conformance/**"
      - "docs/conformance.md"
  schedule:
    # 07:00 UTC nightly. Off the cron-storm minute and separate from
    # nightly.yml (04:23 UTC) and cflite_batch.yml (02:17 UTC) so the
    # three nightly lanes do not contend for runners.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: conformance-matrix-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  LC_ALL: C

jobs:
  vectors-byte-stable:
    name: vectors-byte-stable (freeze-vectors --check nightly)
    # owner: Chio maintainers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Install protobuf compiler
        uses: ./.github/actions/apt-install
        with:
          packages: protobuf-compiler

      - name: Run freeze-vectors --check
        run: cargo xtask freeze-vectors --check

      - name: Assert no drift in MANIFEST.sha256 or vectors tree
        run: |
          set -euo pipefail
          # Catches side-effect writes the per-lane `--check` does not (e.g.
          # trailing-newline normalisation from an editor plugin on a
          # re-committed manifest).
          git diff --exit-code \
            tests/bindings/vectors/MANIFEST.sha256 \
            tests/bindings/vectors

  peer-lock-shape-check:
    name: peer-lock-shape-check (pre-release fetch-peers --check)
    # owner: Chio maintainers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Install protobuf compiler
        uses: ./.github/actions/apt-install
        with:
          packages: protobuf-compiler

      - name: Verify peers.lock.toml shape (pre-release)
        run: cargo run -p chio-cli --bin chio -- conformance fetch-peers --check --allow-unpublished-only

  external-consumer-smoke:
    name: external-consumer-smoke (release-blocking python peer run)
    # owner: Chio maintainers
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Install protobuf compiler
        uses: ./.github/actions/apt-install
        with:
          packages: protobuf-compiler

      - name: Install chio-conformance (path install)
        # Once chio-conformance has a registry-public dependency closure, swap for:
        #   cargo install chio-conformance --version <pin>
        run: cargo install --path crates/tooling/chio-conformance --locked

      - name: Install chio CLI (provides `chio conformance` subcommands)
        # `chio conformance run` and `chio conformance fetch-peers` are
        # owned by the chio-cli crate; the source-install consumer also
        # installs both crates in sequence (see docs/conformance.md
        # "Standalone consumer" section).
        run: cargo install --path crates/products/chio-cli --locked

      - name: Detect published python peer
        id: python-peer
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          expected_target = "x86_64-unknown-linux-gnu"
          with open("crates/tooling/chio-conformance/peers.lock.toml", "rb") as fh:
              lock = tomllib.load(fh)
          selected = next(
              (
                  peer
                  for peer in lock.get("peer", [])
                  if (
                      peer.get("language") == "python"
                      and peer.get("target") == expected_target
                      and peer.get("published", True)
                  )
              ),
              None,
          )
          print(f"expected_target={expected_target}")
          print(f"published={'true' if selected else 'false'}")
          if selected:
              print(f"target={selected['target']}")
              print(f"binary={selected['binary']}")
          PY

      - name: Require published python peer
        if: steps.python-peer.outputs.published != 'true'
        run: |
          echo "external-consumer-smoke requires a python peer for ${{ steps.python-peer.outputs.expected_target }} with published = true in crates/tooling/chio-conformance/peers.lock.toml" >&2
          echo "The pre-release shape check is separate; this release-blocking smoke must not pass without fetching and running a real peer." >&2
          exit 1

      - name: Fetch python peer adapter binary
        run: chio conformance fetch-peers --language python --out ./.chio-peers

      - name: Run conformance scenarios against python peer (json report)
        run: >
          chio conformance run
          --peer python
          --peer-binary "./.chio-peers/python-${{ steps.python-peer.outputs.target }}/${{ steps.python-peer.outputs.binary }}"
          --report json
          --output /tmp/report.json

      - name: Upload conformance report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-consumer-smoke-report
          path: /tmp/report.json
          if-no-files-found: ignore

  notify-on-failure:
    name: notify-on-failure (alarm-policy issue opener)
    # owner: Chio maintainers
    needs: [vectors-byte-stable, peer-lock-shape-check, external-consumer-smoke]
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open conformance-matrix alarm issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `conformance-matrix nightly failed (run ${context.runId})`;
            const body = [
              `Nightly \`conformance-matrix\` workflow failed.`,
              ``,
              `Run: ${runUrl}`,
              `Triggered: ${context.payload.schedule || 'schedule'}`,
              ``,
              `Alarm policy: 1 failed nightly opens this issue; 3 consecutive failures`,
              `page the protocol owner. Check prior alarm issues under`,
              `label \`alarm:conformance-matrix\` to assess paging threshold.`,
            ].join('\n');
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'alarm:conformance-matrix',
              per_page: 100,
            });
            const existing = openIssues.find((issue) =>
              issue.title.startsWith('conformance-matrix nightly failed')
            );
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['alarm:conformance-matrix', 'ci-failure'],
              });
            }
