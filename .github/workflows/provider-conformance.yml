name: Provider conformance

on:
  pull_request:
    branches:
      - project/roadmap-04-25-2026
      - main
      - chio/autonomous-commerce-brainstorm
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/protocol/chio-provider-conformance/**
      - crates/protocol/chio-openai-adapter/**
      - crates/protocol/chio-tool-call-fabric/**
      - crates/protocol/chio-anthropic-tools-adapter/**
      - crates/protocol/chio-bedrock-converse-adapter/**
      - crates/protocol/chio-gemini-tools-adapter/**
      - crates/protocol/chio-mistral-tools-adapter/**
      - crates/protocol/chio-groq-tools-adapter/**
      - crates/protocol/chio-ollama-tools-adapter/**
      - crates/protocol/chio-cohere-tools-adapter/**
      - .github/workflows/provider-conformance.yml
  push:
    branches:
      - project/roadmap-04-25-2026
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/protocol/chio-provider-conformance/**
      - crates/protocol/chio-openai-adapter/**
      - crates/protocol/chio-tool-call-fabric/**
      - crates/protocol/chio-anthropic-tools-adapter/**
      - crates/protocol/chio-bedrock-converse-adapter/**
      - crates/protocol/chio-gemini-tools-adapter/**
      - crates/protocol/chio-mistral-tools-adapter/**
      - crates/protocol/chio-groq-tools-adapter/**
      - crates/protocol/chio-ollama-tools-adapter/**
      - crates/protocol/chio-cohere-tools-adapter/**
      - .github/workflows/provider-conformance.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  openai-fixtures:
    name: OpenAI provider replay fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Replay OpenAI provider fixtures
        run: cargo test -p chio-provider-conformance --features fixtures-openai

  openai-verdict-latency:
    name: OpenAI verdict latency budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Enforce OpenAI verdict latency budget
        run: cargo bench -p chio-openai-adapter --features provider-adapter --bench verdict_latency -- --test

  cross-provider-equality:
    name: Cross-provider verdict equality (8 providers, required-CI)
    # required: true: this job is required-CI on changes to any provider
    # adapter or fixture corpus. Eight providers share a single oracle
    # surface (no per-provider divergence allowed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Run 8-provider cross-provider verdict equality oracle
        run: |
          cargo test -p chio-provider-conformance \
            --features fixtures-openai \
            --features fixtures-anthropic \
            --features fixtures-bedrock \
            --features fixtures-gemini \
            --features fixtures-mistral \
            --features fixtures-groq \
            --features fixtures-ollama \
            --features fixtures-cohere \
            --test cross_provider_equality

  new-provider-corpora:
    name: New-provider replay corpora
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Replay new-provider fixture corpora
        run: |
          cargo test -p chio-provider-conformance \
            --features fixtures-gemini,fixtures-mistral,fixtures-groq,fixtures-ollama,fixtures-cohere \
            --test replay_gemini \
            --test replay_mistral \
            --test replay_groq \
            --test replay_ollama \
            --test replay_cohere

  ollama-localhost-replay:
    name: Ollama localhost integration replay
    runs-on: ubuntu-latest
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    env:
      OLLAMA_HOST: http://localhost:11434
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Pre-pull small model
        run: |
          curl -s -X POST http://localhost:11434/api/pull -d '{"model":"llama3.2:1b"}' || true
      - name: Run Ollama localhost replay
        run: cargo test -p chio-ollama-tools-adapter --test localhost_replay
