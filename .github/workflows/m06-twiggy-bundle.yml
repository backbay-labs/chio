name: m06-twiggy-bundle

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: m06-twiggy-bundle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  browser-kernel-twiggy:
    name: Browser kernel twiggy bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUNDLE_OUT: target/m06-twiggy-browser-kernel
      CARGO_TERM_COLOR: always
      TWIGGY_VERSION: "0.8.0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack (pinned)
        run: cargo install wasm-pack --version "$(cat .tooling/wasm-pack.version)" --locked

      - name: Install wasm-bindgen-cli (pinned)
        run: cargo install wasm-bindgen-cli --version "$(cat .tooling/wasm-bindgen.version)" --locked

      - name: Install twiggy (pinned)
        run: cargo install twiggy --version "${TWIGGY_VERSION}" --locked

      - name: Build browser kernel wasm bundle
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_TARGET_DIR: ${{ runner.temp }}/m06-twiggy-target
        run: |
          set -euo pipefail
          bash sdks/typescript/scripts/build-wasm.sh --package browser --target web

      - name: Capture twiggy report and bundle summary
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          wasm_path="sdks/typescript/packages/browser/pkg/chio_kernel_browser_bg.wasm"
          if [ ! -f "${wasm_path}" ]; then
            echo "::error::browser kernel wasm bundle missing at ${wasm_path}" >&2
            exit 1
          fi

          mkdir -p "${BUNDLE_OUT}/browser-kernel-pkg"
          cp -R sdks/typescript/packages/browser/pkg/. "${BUNDLE_OUT}/browser-kernel-pkg/"

          twiggy top "${wasm_path}" > "${BUNDLE_OUT}/twiggy-top.txt"

          wasm_bytes="$(wc -c < "${wasm_path}" | tr -d '[:space:]')"
          wasm_gzip_bytes="$(gzip -c "${wasm_path}" | wc -c | tr -d '[:space:]')"
          wasm_sha256="$(sha256sum "${wasm_path}" | awk '{print $1}')"
          pr_number="${PR_NUMBER:-manual}"

          {
            echo "# Chio browser kernel bundle"
            echo
            echo "- commit: ${COMMIT_SHA}"
            echo "- pull_request: ${pr_number}"
            echo "- wasm_path: ${wasm_path}"
            echo "- wasm_bytes: ${wasm_bytes}"
            echo "- wasm_gzip_bytes: ${wasm_gzip_bytes}"
            echo "- wasm_sha256: ${wasm_sha256}"
            echo "- twiggy_report: twiggy-top.txt"
            echo "- budget_enforcement: deferred-to-m07"
          } > "${BUNDLE_OUT}/bundle-summary.md"

          cat > "${BUNDLE_OUT}/manifest.json" <<EOF
          {
            "schema": "chio.m06.browser-kernel-twiggy.v1",
            "commit": "${COMMIT_SHA}",
            "pull_request": "${pr_number}",
            "wasm_path": "${wasm_path}",
            "wasm_bytes": ${wasm_bytes},
            "wasm_gzip_bytes": ${wasm_gzip_bytes},
            "wasm_sha256": "${wasm_sha256}",
            "budget_enforcement": "deferred-to-m07"
          }
          EOF

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat "${BUNDLE_OUT}/bundle-summary.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m06-twiggy-browser-kernel-${{ github.event.pull_request.number || github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: target/m06-twiggy-browser-kernel/
