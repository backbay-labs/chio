name: Chio Pheromone Relay

on:
  pull_request:
    paths:
      - "crates/trust/chio-pheromone-relay/**"
      - "crates/trust/chio-pheromone-runtime/**"
      - "crates/trust/chio-pheromone/**"
      - "crates/trust/chio-federation/**"
      - "crates/products/chio-cli/**"
      - "examples/chio-3vendor/**"
      - "spec/CHIO_PHEROMONE.md"
      - "spec/schemas/chio-pheromone/**"
      - "spec/schemas/registry.json"
      - "ci-gates/pheromone.toml"
      - "xtask/**"
      - ".github/workflows/chio-pheromone-relay.yml"
  push:
    branches: [main]
    paths:
      - "crates/trust/chio-pheromone-relay/**"
      - "crates/trust/chio-pheromone-runtime/**"
      - "crates/trust/chio-pheromone/**"
      - "crates/trust/chio-federation/**"
      - "crates/products/chio-cli/**"
      - "examples/chio-3vendor/**"
      - "spec/CHIO_PHEROMONE.md"
      - "spec/schemas/chio-pheromone/**"
      - "spec/schemas/registry.json"
      - "ci-gates/pheromone.toml"
      - "xtask/**"
      - ".github/workflows/chio-pheromone-relay.yml"

jobs:
  chio-pheromone-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (pins to rust-toolchain.toml 1.94.1)
      - name: Check Chio pheromone relay
        run: cargo xtask check fixtures relay
