# nightly.yml - Long-running QA jobs that the PR lane skips.

name: nightly

on:
  schedule:
    # 04:23 UTC nightly (off the cron-storm minute, separate from
    # cflite_batch's 02:17 UTC).
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CHIO_CI_RUSTFLAGS: "-D warnings -C link-arg=-Wl,--threads=1"
  # Nightly-tier proptest case count; the PR-tier (256) lives in ci.yml.
  PROPTEST_CASES: "4096"
  # These pins must agree with formal-pr-smoke.yml.
  CHIO_KANI_VERSION: 0.67.0
  CHIO_ELAN_VERSION: v4.2.1
  CHIO_ELAN_TARBALL_SHA256: 4e717523217af592fa2d7b9c479410a31816c065d66ccbf0c2149337cfec0f5c
  CHIO_AENEAS_RELEASE_TAG: build-2026.04.22.215158-38d10a22642d75d051e14006cc6e45055381f10e
  CHIO_CREUSOT_REV: a12f3ac7f688c7b93cee2c2eb60282004a2bdb30

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proptest-nightly:
    name: proptest (nightly tier)
    # owner: Chio maintainers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup show active-toolchain

      - name: Install protobuf compiler
        uses: ./.github/actions/apt-install
        with:
          packages: protobuf-compiler

      - name: Run proptest invariants (nightly case count)
        env:
          PROPTEST_CASES: ${{ env.PROPTEST_CASES }}
        run: |
          set -euo pipefail
          cargo test -p chio-core-types --test property_capability_algebra -- --nocapture
          cargo test -p chio-kernel-core --test property_evaluate -- --nocapture
          cargo test -p chio-kernel --test property_budget_store -- --nocapture
          PROPTEST_CASES=10000 cargo test -p chio-kernel --test property_reservation_ledger -- --nocapture
          cargo test -p chio-credentials --test property_passport -- --nocapture
          cargo test -p chio-policy --test property_evaluate -- --nocapture

  fuzz-corpus-smoke:
    name: fuzz corpus smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup show active-toolchain

      - name: Install protobuf compiler
        uses: ./.github/actions/apt-install
        with:
          packages: protobuf-compiler

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: fuzz -> target

      - name: Replay fuzz corpora
        working-directory: fuzz
        run: cargo test --locked

      - name: Record fuzz corpus lane posture
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          LANE_EXIT: ${{ job.status == 'success' && '0' || '1' }}
          LANE_GATE_RATE_LIMIT_MODE: warn
        run: bash scripts/lane-gate.sh fuzz-corpus-smoke-nightly

  loom-nightly:
    name: loom-nightly (bounded abstract models)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup show active-toolchain

      - name: Install protobuf compiler
        uses: ./.github/actions/apt-install
        with:
          packages: protobuf-compiler

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Run registered Loom models
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: bash scripts/run-loom-manifest.sh --lane nightly

      - name: Upload Loom timings and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: loom-nightly
          path: target/loom
          if-no-files-found: warn
          retention-days: 21

      - name: Record Loom lane posture
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          LANE_EXIT: ${{ job.status == 'success' && '0' || '1' }}
          LANE_GATE_RATE_LIMIT_MODE: warn
        run: bash scripts/lane-gate.sh loom-nightly

  dst-nightly:
    name: dst-nightly (10k real-kernel episodes)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup show active-toolchain

      - name: Install protobuf compiler
        uses: ./.github/actions/apt-install
        with:
          packages: protobuf-compiler

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Run deterministic simulation sweep
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: bash scripts/run-dst.sh --lane nightly

      - name: Upload DST timings and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dst-nightly
          path: target/dst
          if-no-files-found: error
          retention-days: 21

      - name: Record DST lane posture
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          LANE_EXIT: ${{ job.status == 'success' && '0' || '1' }}
          LANE_GATE_RATE_LIMIT_MODE: warn
        run: bash scripts/lane-gate.sh dst-nightly

  # The nightly RevocationEventuallySeen liveness check runs in the dedicated
  # fail-closed apalache-temporal.yml workflow at length=24. Keeping it in a
  # separate scheduled workflow avoids duplicating the safety sweep here while
  # preserving the formal OWNERS nightly-liveness obligation.

  # Nightly Kani lane: runs the union of `lanes.pr` and `lanes.nightly_only`
  # from formal/rust-verification/kani-public-harnesses.toml. The PR job in
  # formal-pr-smoke.yml runs only `lanes.pr`; nightly runs everything so
  # harnesses in `lanes.nightly_only` still get daily coverage.
  kani-public-nightly:
    name: kani-public-nightly (lanes.pr + lanes.nightly_only)
    # owner: Chio maintainers
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('pr-{0}-kani-public-nightly', github.ref) || format('main-{0}-kani-public-nightly', github.sha) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup show active-toolchain

      - name: Install protobuf compiler
        uses: ./.github/actions/apt-install
        with:
          packages: protobuf-compiler

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Install cargo-kani
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/chio-kani-tool-target
        run: |
          set -euo pipefail
          cargo install kani-verifier --locked --version "${CHIO_KANI_VERSION}"
          cargo kani setup
          cargo kani --version

      - name: Run chio-kernel-core lanes.pr + lanes.nightly_only Kani harnesses
        shell: bash
        env:
          CARGO_BUILD_JOBS: "1"
        run: |
          set -euo pipefail
          bash scripts/check-kani-public-core.sh --lane all

      # Multi-crate manifest sweep (Kani multi-crate manifest). Picks up every
      # `[[harness]]` entry in `.kani/harnesses.toml` whose `lane = "pr"`
      # or `lane = "nightly"`, excluding chio-kernel-core (handled
      # above). When more crates land Kani harnesses they appear here
      # automatically without another workflow edit.
      - name: Run other-crate manifest sweep (lanes pr + nightly)
        shell: bash
        env:
          CARGO_BUILD_JOBS: "1"
        run: |
          set -euo pipefail
          for lane in pr nightly; do
            echo "::group::run-kani-manifest.sh --list --lane ${lane}"
            bash scripts/run-kani-manifest.sh --lane "${lane}" \
              --exclude-crate chio-kernel-core --list
            echo "::endgroup::"
            bash scripts/run-kani-manifest.sh --lane "${lane}" \
              --exclude-crate chio-kernel-core --allow-empty
          done

      - name: Record nightly Kani lane posture
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          LANE_EXIT: ${{ job.status == 'success' && '0' || '1' }}
          LANE_GATE_RATE_LIMIT_MODE: warn
        run: bash scripts/lane-gate.sh kani-public-nightly

  # Formal proof report plus portable (browser/mobile) and polyglot SDK
  # qualification. The toolchain install (Lean 4, Aeneas / Charon, Creusot,
  # wasm-pack, cargo-ndk, chromium) dominates the runtime.
  formal-qualification:
    name: formal-qualification (proof report + portable + SDK parity)
    # owner: Chio maintainers
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal --component rustfmt --component clippy
          rustup show active-toolchain

      - name: Install protobuf compiler
        uses: ./.github/actions/apt-install
        with:
          packages: protobuf-compiler

      - name: Restore Lean 4 toolchain cache
        id: elan-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ env.CHIO_ELAN_VERSION }}-${{ env.CHIO_ELAN_TARBALL_SHA256 }}-${{ hashFiles('formal/lean4/Chio/lean-toolchain') }}

      - name: Install Lean 4 toolchain
        if: steps.elan-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/leanprover/elan/releases/download/${CHIO_ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz" \
            -o /tmp/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "${CHIO_ELAN_TARBALL_SHA256}  /tmp/elan-x86_64-unknown-linux-gnu.tar.gz" | sha256sum -c -
          tar -xzf /tmp/elan-x86_64-unknown-linux-gnu.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain none

      - name: Configure Lean 4 toolchain path
        shell: bash
        run: |
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "ELAN_HOME=$HOME/.elan" >> "$GITHUB_ENV"

      - name: Prime Lean 4 toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(tr -d '\r\n' < formal/lean4/Chio/lean-toolchain)"
          if ! "$HOME/.elan/bin/elan" toolchain list | tr -d '\r' | grep -Fq "$toolchain"; then
            for attempt in 1 2 3 4 5; do
              if "$HOME/.elan/bin/elan" toolchain install "$toolchain"; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi
          (
            cd formal/lean4/Chio
            "$HOME/.elan/bin/lake" --version
          )

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.3"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Java runtime for Apalache
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Apalache
        shell: bash
        run: |
          set -euo pipefail
          ./tools/install-apalache.sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/apalache-mc" version

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.23.0"

      - name: Install Aeneas and Charon
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/install-aeneas-toolchain.py
          architecture="$(uname -m)"
          [[ "${architecture}" == "arm64" ]] && architecture="aarch64"
          [[ "${architecture}" == "amd64" ]] && architecture="x86_64"
          echo "${GITHUB_WORKSPACE}/target/formal/aeneas-toolchain/${architecture}/bin" >> "${GITHUB_PATH}"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Install Rust verification tools
        shell: bash
        env:
          OPAMYES: "1"
          OPAMCONFIRMLEVEL: "unsafe-yes"
          CARGO_TARGET_DIR: ${{ runner.temp }}/chio-verification-tool-target
        run: |
          set -euo pipefail
          cargo install kani-verifier --locked --version "${CHIO_KANI_VERSION}"
          cargo kani setup
          sudo apt-get update
          sudo apt-get install -y opam
          opam init --disable-sandboxing --bare -y
          git clone https://github.com/creusot-rs/creusot "${RUNNER_TEMP}/creusot"
          git -C "${RUNNER_TEMP}/creusot" checkout "${CHIO_CREUSOT_REV}"
          (
            cd "${RUNNER_TEMP}/creusot"
            ./INSTALL
          )
          cargo creusot version
          cargo kani --version

      - name: Install portable qualification dependencies
        run: |
          cargo install wasm-pack --version "$(cat .tooling/wasm-pack.version)" --locked
          cargo install cargo-ndk --version "$(cat .tooling/cargo-ndk.version)" --locked
          rustup target add aarch64-linux-android
          sudo apt-get update
          if ! sudo apt-get install -y chromium-driver chromium libcurl4-openssl-dev; then
            sudo apt-get install -y chromium-driver chromium-browser libcurl4-openssl-dev
          fi

      - name: Workspace proof report
        id: proof_report
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: |
          set -euo pipefail
          unset CHIO_RUST_VERIFICATION_METADATA_ONLY
          ./scripts/generate-proof-report.sh
          ./scripts/check-proof-report.sh --require-strict
          mode="$(python3 -c 'import json; from pathlib import Path; print(json.loads(Path("target/formal/proof-report.json").read_text(encoding="utf-8"))["mode"])')"
          if [[ "${mode}" != "strict" ]]; then
            echo "Formal qualification requires a strict proof report, got: ${mode}" >&2
            exit 1
          fi
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Formal proof report"
            echo
            echo "Mode: \`${mode}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload formal proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formal-proof-report-${{ steps.proof_report.outputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/formal/proof-report.json
            target/formal/coverage.json
            target/formal/trace-validation.json
            target/formal/receipt-trace
          if-no-files-found: error
          retention-days: 21

      - name: Portable browser qualification
        env:
          CARGO_BUILD_JOBS: "1"
        run: ./scripts/qualify-portable-browser.sh

      - name: Portable mobile qualification
        env:
          CARGO_BUILD_JOBS: "1"
        run: ./scripts/qualify-mobile-kernel.sh

      - name: SDK parity contract lane
        env:
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }}"
        run: ./scripts/check-sdk-parity.sh

      - name: Record formal qualification posture
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          LANE_EXIT: ${{ job.status == 'success' && '0' || '1' }}
          LANE_STRICT_MODE: ${{ steps.proof_report.outputs.mode }}
          LANE_GATE_RATE_LIMIT_MODE: warn
        run: bash scripts/lane-gate.sh formal-qualification

  # Workspace coverage. Advisory (continue-on-error) and slow.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup show active-toolchain

      - name: Install protobuf compiler
        uses: ./.github/actions/apt-install
        with:
          packages: protobuf-compiler

      - name: Install cargo-tarpaulin
        # Install tarpaulin on the host so run-coverage.sh takes the
        # local branch instead of falling back to the
        # `xd009642/tarpaulin` docker image (which has no protoc and
        # therefore breaks chio-envoy-ext-authz's tonic-build).
        run: cargo install cargo-tarpaulin --locked --version 0.31.2

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Coverage lane
        id: coverage_lane
        continue-on-error: true
        env:
          COVERAGE_FAIL_UNDER: "65"
          COVERAGE_ROOT: ${{ runner.temp }}/chio-coverage
          TARPAULIN_TARGET_DIR: ${{ runner.temp }}/chio-tarpaulin-target
          TARPAULIN_LOCAL_LLVM_PROFILE_FILE: ${{ runner.temp }}/chio-tarpaulin-target/build_rs_cov-%p-%m.profraw
          CARGO_BUILD_JOBS: "1"
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: ./scripts/run-coverage.sh

      - name: Report advisory coverage failure
        if: steps.coverage_lane.outcome == 'failure'
        run: |
          {
            echo "### Coverage advisory failed"
            echo
            echo "The coverage lane is advisory. See the uploaded coverage artifact for tarpaulin output."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage
          path: ${{ runner.temp }}/chio-coverage
          retention-days: 21
