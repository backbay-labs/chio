# mutants.yml - cargo-mutants measurement lanes.
#
# Two jobs:
#   mutants-pr      - path-scoped pull-request job; runs
#                     `cargo mutants --in-diff`
#                     against the PR base ref, six crates in parallel,
#                     posts a Markdown summary for same-repository PRs,
#                     and consults scripts/mutants-gate.sh for advisory-vs-blocking
#                     posture (driven by releases.toml cycle_end_tag).
#                     Wall budget: <= 30 min per crate.
#
#   mutants-nightly - schedule trigger (05:00 UTC); full-workspace sweep with
#                     no --in-diff scope. Wall budget: <= 4 h per crate.
#                     Uploads mutants.out/ as a workflow artifact.
#
# Both jobs share the 1,800 GHA runner-min/30d cap with the fuzz lanes.
# The PR job treats the cap as a hard halt; the nightly lane keeps an
# advisory posture so dashboard evidence continues flowing.
#
# Cutover rule:
#   The lane flips after two consecutive nightly runs report >= 80 caught
#   ratio on every trust-boundary crate: chio-policy, chio-credentials,
#   chio-attest-verify, chio-kernel-core, chio-guards, and chio-anchor.
#
# continue-on-error policy:
#   - mutants-pr: NOT set, so the gate script's exit code propagates.
#     scripts/mutants-gate.sh reads releases.toml: cycle_end_tag empty ->
#     advisory (exit 0); cycle_end_tag populated plus two recorded
#     successful nightly runs at >= 80% -> blocking (exit 1 below target).
#   - mutants-nightly: continue-on-error: true. Dashboard-only; never
#     gates a PR merge.
#
# Override paths:
#   1. Title-based (preferred): PR title includes `mutants-gate-override`
#      and clears cycle_end_tag in releases.toml (CODEOWNERS review required).
#   2. Env-var escape hatch: set MUTANTS_GATE_OVERRIDE_REASON=<reason>; the
#      gate script downgrades a blocking-fail to a loud advisory pass. See
#      docs/fuzzing/mutants.md "Override paths".

name: mutants

on:
  # PR runs are scoped to trust-boundary source and mutation-control changes.
  # Untouched matrix packages stop before installing Rust or cargo-mutants.
  pull_request:
    paths:
      - ".cargo/mutants.toml"
      - ".github/workflows/mutants.yml"
      - "crates/kernel/chio-kernel-core/mutants.toml"
      - "crates/kernel/chio-kernel-core/src/**"
      - "crates/guards/chio-guards/mutants.toml"
      - "crates/guards/chio-guards/src/**"
      - "crates/guards/chio-policy/mutants.toml"
      - "crates/guards/chio-policy/src/**"
      - "crates/trust/chio-attest-verify/mutants.toml"
      - "crates/trust/chio-attest-verify/src/**"
      - "crates/trust/chio-credentials/mutants.toml"
      - "crates/trust/chio-credentials/src/**"
      - "crates/economy/chio-anchor/mutants.toml"
      - "crates/economy/chio-anchor/src/**"
      - "releases.toml"
      - "scripts/check-fuzz-budget.sh"
      - "scripts/check-mutants-rationale.sh"
      - "scripts/mutants-*.sh"
  schedule:
    # 05:00 UTC nightly. Sits after fuzz.yml (03:23) and the existing
    # nightly proptest lane (04:23) so the GHA runner pool is not
    # over-subscribed.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      package:
        description: "Force a single crate (default: full matrix)"
        required: false
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

concurrency:
  # PR runs collapse on push; scheduled and dispatch runs do not collapse
  # against each other so a manual sweep can race a cron sweep without
  # cancellation surprises.
  group: mutants-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutants-pr:
    name: mutants-pr (${{ matrix.package }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # continue-on-error is intentionally absent: the lane's advisory-vs-
    # blocking posture is driven by scripts/mutants-gate.sh (which reads
    # releases.toml). Setting it here would mask a non-zero gate exit and
    # silently keep the lane advisory after the release-cycle flip.
    strategy:
      fail-fast: false
      matrix:
        package:
          - chio-kernel-core
          - chio-policy
          - chio-guards
          - chio-credentials
          - chio-attest-verify
          - chio-anchor
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Select changed package
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FORCED_PACKAGE: ${{ inputs.package || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MATRIX_PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          if [[ -n "${FORCED_PACKAGE}" && "${FORCED_PACKAGE}" != "${MATRIX_PACKAGE}" ]]; then
            echo "selected=false" >> "${GITHUB_OUTPUT}"
            echo "skipping ${MATRIX_PACKAGE} (forced=${FORCED_PACKAGE})"
            exit 0
          fi

          case "${MATRIX_PACKAGE}" in
            chio-kernel-core) crate_path="crates/kernel/chio-kernel-core" ;;
            chio-policy) crate_path="crates/guards/chio-policy" ;;
            chio-guards) crate_path="crates/guards/chio-guards" ;;
            chio-credentials) crate_path="crates/trust/chio-credentials" ;;
            chio-attest-verify) crate_path="crates/trust/chio-attest-verify" ;;
            chio-anchor) crate_path="crates/economy/chio-anchor" ;;
            *)
              echo "unknown mutation package: ${MATRIX_PACKAGE}" >&2
              exit 1
              ;;
          esac
          echo "crate_path=${crate_path}" >> "${GITHUB_OUTPUT}"

          changed="${RUNNER_TEMP}/mutants-pr-paths.txt"
          merge_base="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")"
          git diff --name-only "${merge_base}" "${HEAD_SHA}" > "${changed}"
          global='^(\.cargo/mutants\.toml|\.github/workflows/mutants\.yml|releases\.toml|scripts/(check-fuzz-budget\.sh|check-mutants-rationale\.sh|mutants-.*\.sh))$'
          if grep -Eq "${global}|^${crate_path}/(src/|mutants\.toml$)" "${changed}"; then
            echo "selected=true" >> "${GITHUB_OUTPUT}"
          else
            echo "selected=false" >> "${GITHUB_OUTPUT}"
            echo "no mutation-relevant changes for ${MATRIX_PACKAGE}"
          fi

      - name: Install Rust toolchain
        if: steps.select.outputs.selected == 'true'
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-mutants 25.x
        if: steps.select.outputs.selected == 'true'
        run: |
          set -euo pipefail
          # Keep cargo-mutants on the 25.x line; do not float to the next major.
          cargo install cargo-mutants --version '~25' --locked

      - name: Check mutation skip rationales
        if: steps.select.outputs.selected == 'true'
        run: |
          set -euo pipefail
          bash scripts/check-mutants-rationale.sh

      - name: Verify shared 30-day fuzz/mutants budget
        if: steps.select.outputs.selected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_FUZZ_BUDGET_RATE_LIMIT_MODE: warn
          GH_FUZZ_BUDGET_CAP_MODE: fail
          GH_FUZZ_BUDGET_WORKFLOWS: mutants.yml,mutants-fuzz-cocoverage.yml,proof-mutants.yml
          GH_FUZZ_BUDGET_MINUTES: 48000
        run: |
          set -euo pipefail
          # Mutation runs share the 1,800 min/30d envelope with fuzz.
          # PR runs use --in-diff scoping but are release qualification
          # gates when triggered, so over-cap usage is a hard halt.
          # Full nightly sweeps keep their advisory measurement posture.
          if [[ -x scripts/check-fuzz-budget.sh ]]; then
            scripts/check-fuzz-budget.sh "${{ github.repository }}"
          else
            echo "scripts/check-fuzz-budget.sh missing or non-executable" >&2
            exit 2
          fi

      - name: Capture PR diff for --in-diff scoping
        id: diff
        if: steps.select.outputs.selected == 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          set -euo pipefail
          # cargo-mutants --in-diff expects a unified-diff TEXT FILE PATH,
          # not a git ref. Capture the PR's three-dot diff against the base
          # ref into a workspace-local file and forward the path.
          # fetch-depth: 0 in the checkout above guarantees both refs are
          # present locally for the diff.
          diff_file="${RUNNER_TEMP}/mutants-pr-${{ matrix.package }}.diff"
          git fetch --quiet origin "${BASE_REF}"
          git diff "origin/${BASE_REF}...HEAD" > "${diff_file}"
          wc -l "${diff_file}" || true
          echo "diff_file=${diff_file}" >> "${GITHUB_OUTPUT}"

      - name: Run cargo-mutants --in-diff against PR base
        id: mutate
        if: steps.select.outputs.selected == 'true'
        run: |
          set -euo pipefail
          mkdir -p mutants-out/${{ matrix.package }}
          # --in-diff scopes mutation generation to lines changed against
          # the PR base ref. cargo-mutants 25.x reads the supplied path as
          # a unified-diff text file (not a git ref). --no-shuffle keeps
          # reproducibility across runs; --timeout leaves enough room for
          # cold trust-boundary crate builds while the job timeout stays the
          # outer wall-time cap. Load the focused per-crate config and keep
          # the test scope crate-local for PR lanes; the workspace-root config
          # is for nightly full sweeps and adds a full-workspace baseline
          # before any scoped mutants run.
          mutants_exit=0
          cargo mutants \
            --config "${{ steps.select.outputs.crate_path }}/mutants.toml" \
            --package "${{ matrix.package }}" \
            --test-workspace false \
            --in-diff "${{ steps.diff.outputs.diff_file }}" \
            --no-shuffle \
            --timeout 300 \
            --jobs 2 \
            --output mutants-out/${{ matrix.package }} \
            --json \
            || mutants_exit=$?
          echo "exit=${mutants_exit}" >> "${GITHUB_OUTPUT}"
          ls -la mutants-out/${{ matrix.package }} || true

      - name: Read survivor issue budget
        id: survivor-cap
        if: steps.select.outputs.selected == 'true'
        run: |
          set -euo pipefail
          cap="$(awk -F '=' '
            $1 ~ /^[[:space:]]*pr_survivor_issue_budget[[:space:]]*$/ {
              value = $2
              gsub(/[[:space:]]/, "", value)
              print value
              exit
            }
          ' releases.toml)"
          if [[ -z "${cap}" || ! "${cap}" =~ ^[0-9]+$ ]]; then
            echo "::error::invalid or missing pr_survivor_issue_budget in releases.toml" >&2
            exit 1
          fi
          echo "cap=${cap}" >> "${GITHUB_OUTPUT}"

      - name: Apply gate posture (advisory or blocking per releases.toml)
        id: gate
        if: steps.select.outputs.selected == 'true'
        continue-on-error: true
        env:
          MUTANTS_PACKAGE: ${{ matrix.package }}
          MUTANTS_OUTPUT_DIR: mutants-out/${{ matrix.package }}
          MUTANTS_EXIT: ${{ steps.mutate.outputs.exit }}
          # Env-var override (single CI run). Setting this variable downgrades
          # a blocking-fail to a loud advisory pass. Title-based override is
          # preferred; this env-var is for in-flight CI runs only.
          MUTANTS_GATE_OVERRIDE_REASON: ${{ vars.MUTANTS_GATE_OVERRIDE_REASON }}
          GITHUB_ACTOR: ${{ github.actor }}
          CHIO_MUTANTS_GATE: blocking
        run: |
          set -euo pipefail
          # mutants-gate.sh reads releases.toml and decides advisory
          # (exit 0) or blocking (exit 1). The result is enforced after
          # comment and issue filing so triage evidence is preserved even
          # when blocking mode fails.
          bash scripts/mutants-gate.sh

      - name: Post mutation summary as PR comment
        if: always() && steps.select.outputs.selected == 'true' && github.event.pull_request.number != '' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          MUTANTS_PACKAGE: ${{ matrix.package }}
          MUTANTS_OUTPUT_DIR: mutants-out/${{ matrix.package }}
          CHIO_MUTANTS_GATE: blocking
          MUTANTS_PR_SURVIVOR_CAP: ${{ steps.survivor-cap.outputs.cap }}
        run: |
          set -euo pipefail
          bash scripts/mutants-comment.sh \
            "${{ github.event.pull_request.number }}" \
            "mutants-out/${{ matrix.package }}"

      - name: File survivor issues beyond PR cap
        if: always() && steps.select.outputs.selected == 'true' && github.event.pull_request.number != '' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          MUTANTS_PACKAGE: ${{ matrix.package }}
          MUTANTS_PR_SURVIVOR_CAP: ${{ steps.survivor-cap.outputs.cap }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          bash scripts/mutants-autofile-issue.sh \
            "${{ github.event.pull_request.number }}" \
            "mutants-out/${{ matrix.package }}"

      - name: Enforce mutation gate result
        if: always() && steps.select.outputs.selected == 'true' && steps.gate.outcome == 'failure'
        run: |
          echo "::error::mutants gate failed after triage output was preserved" >&2
          exit 1

      - name: Upload mutation report
        if: always() && steps.select.outputs.selected == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutants-pr-${{ matrix.package }}
          path: mutants-out/${{ matrix.package }}
          if-no-files-found: ignore
          retention-days: 14

  mutants-nightly:
    name: mutants-nightly (${{ matrix.package }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The per-crate budget is 4 hours; GitHub-hosted runners cap at 6 h.
    # 240 min keeps headroom for setup steps.
    timeout-minutes: 240
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        package:
          - chio-kernel-core
          - chio-policy
          - chio-guards
          - chio-credentials
          - chio-attest-verify
          - chio-anchor
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Skip when forced package does not match
        id: forced
        env:
          FORCED_PACKAGE: ${{ inputs.package || '' }}
          MATRIX_PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          forced="${FORCED_PACKAGE}"
          if [[ -n "${forced}" && "${forced}" != "${MATRIX_PACKAGE}" ]]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "skipping ${MATRIX_PACKAGE} (forced=${forced})"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install Rust toolchain
        if: steps.forced.outputs.skip == 'false'
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-mutants 25.x
        if: steps.forced.outputs.skip == 'false'
        run: |
          set -euo pipefail
          cargo install cargo-mutants --version '~25' --locked

      - name: Check mutation skip rationales
        if: steps.forced.outputs.skip == 'false'
        run: |
          set -euo pipefail
          bash scripts/check-mutants-rationale.sh

      - name: Verify shared 30-day fuzz/mutants budget
        if: steps.forced.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_FUZZ_BUDGET_RATE_LIMIT_MODE: warn
          # Hosted nightly sweeps share the 1,800 min/30d envelope with the
          # fuzz lanes. When the cap is hit the sweep must still run so that
          # measurement keeps flowing into the dashboard (continue-on-error
          # is already true at job level). Treat the cap as advisory here.
          GH_FUZZ_BUDGET_CAP_MODE: warn
        run: |
          set -euo pipefail
          if [[ -x scripts/check-fuzz-budget.sh ]]; then
            scripts/check-fuzz-budget.sh "${{ github.repository }}"
          else
            echo "scripts/check-fuzz-budget.sh missing or non-executable" >&2
            exit 2
          fi

      - name: Run cargo-mutants full-workspace sweep
        id: mutate
        if: steps.forced.outputs.skip == 'false'
        run: |
          set -euo pipefail
          mkdir -p mutants-out/${{ matrix.package }}
          # Full sweep, no --in-diff. examine_globs from .cargo/mutants.toml
          # plus per-crate mutants.toml narrow scope to trust-boundary
          # modules. --timeout 600 caps any single mutant at 10 minutes;
          # the workspace timeout_multiplier = 3.0 still applies.
          cargo mutants \
            --package "${{ matrix.package }}" \
            --no-shuffle \
            --timeout 600 \
            --jobs 2 \
            --output mutants-out/${{ matrix.package }} \
            --json \
            || mutants_exit=$?
          echo "exit=${mutants_exit:-0}" >> "${GITHUB_OUTPUT}"
          ls -la mutants-out/${{ matrix.package }} || true

      - name: Apply gate posture (advisory or blocking per releases.toml)
        if: steps.forced.outputs.skip == 'false'
        env:
          MUTANTS_PACKAGE: ${{ matrix.package }}
          MUTANTS_OUTPUT_DIR: mutants-out/${{ matrix.package }}
          MUTANTS_EXIT: ${{ steps.mutate.outputs.exit }}
          # Env-var override (nightly). Forward when the repository variable
          # is set; the gate script downgrades a blocking-fail to advisory-pass
          # for this run only.
          MUTANTS_GATE_OVERRIDE_REASON: ${{ vars.MUTANTS_GATE_OVERRIDE_REASON }}
          GITHUB_ACTOR: ${{ github.actor }}
          CHIO_MUTANTS_GATE: blocking
        run: |
          set -euo pipefail
          bash scripts/mutants-gate.sh

      - name: Upload mutation report
        if: always() && steps.forced.outputs.skip == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutants-nightly-${{ matrix.package }}-${{ github.run_id }}
          path: mutants-out/${{ matrix.package }}
          if-no-files-found: ignore
          retention-days: 30
