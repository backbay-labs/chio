# schema-breaking-change.yml - Advisory PR bot for spec/schemas drift.
#
# When a PR touches `spec/schemas/**/*.json`, runs a schema compatibility diff for
# each changed schema (PR merge-base vs. PR head) and posts a sticky comment
# summarising any breaking changes detected. Advisory only: does NOT block
# merge.
#
# Tooling: `json-schema-diff-validator` compares JSON document structure
# without rejecting Chio's draft-2020-12 dialect declaration. The repository
# classifier gives breaking changes and tool failures distinct exit codes.
#
# Comment shape: a single sticky comment with marker
# `<!-- chio:schema-breaking-change -->` is created/updated on each push,
# so the PR conversation does not accumulate one comment per push. On a
# clean push (no breaking changes), an existing sticky is rewritten to a
# resolved/all-clear message rather than left in place with stale warnings.

name: schema-breaking-change

on:
  pull_request:
    paths:
      - '.github/workflows/schema-breaking-change.yml'
      - 'scripts/classify-schema-compatibility.sh'
      - 'scripts/tests/schema-breaking-change-workflow.test.sh'
      - 'spec/schemas/**/*.json'
      # The registry is an index of artifact records, not a constraint schema.
      # Feeding it to the compatibility classifier produces a tool error on
      # every PR that registers a new artifact.
      - '!spec/schemas/registry.json'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: schema-breaking-change-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  schema-breaking-change-advisory:
    name: schema-breaking-change-advisory (compatibility vs merge-base)
    # owner: Chio maintainers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head with full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Test schema compatibility workflow contract
        run: bash scripts/tests/schema-breaking-change-workflow.test.sh

      - name: Install schema compatibility CLI
        # This structural diff accepts draft-2020-12 schema documents. The
        # repository classifier distinguishes an incompatibility from a parser,
        # invocation, or package failure. Pin exactly to prevent behavior drift.
        run: npm install -g json-schema-diff-validator@0.4.2

      - name: Compute merge-base for PR diff scope
        id: mergebase
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Resolve the merge-base so we only inspect schema changes the
          # PR actually authored. Diffing against `BASE_SHA` directly
          # would also pick up files that moved on the target branch
          # while the PR was open, leading to false-positive advisories.
          merge_base=$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")
          echo "merge_base=${merge_base}" >> "${GITHUB_OUTPUT}"
          echo "Merge-base: ${merge_base}"

      - name: Compute changed schema files (merge-base vs. head)
        id: changed
        env:
          MERGE_BASE: ${{ steps.mergebase.outputs.merge_base }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # `--name-status` carries rename records (R<score>) so we can
          # resolve the old path when reading the base blob; without it
          # `--name-only` would emit only the destination, and rename-only
          # or rename-plus-edit changes would be silently misclassified
          # as new schemas.
          #
          # The pathspec uses `:(glob)` magic so `**` matches recursively
          # under `spec/schemas/`; without `:(glob)`, git treats `**` as
          # a literal path segment and the filter matches nothing.
          status_file="$(mktemp)"
          git diff --name-status --diff-filter=AMRD \
            "${MERGE_BASE}" "${HEAD_SHA}" -- ':(glob)spec/schemas/**/*.json' \
            ':(exclude)spec/schemas/registry.json' \
            > "${status_file}"
          echo "Raw diff name-status:"
          cat "${status_file}"
          # Hand the raw status records to the next step; one record per
          # line in `<status>\t<old>[\t<new>]` form. Use a random delimiter
          # to avoid heredoc collisions if any path ever contains `EOF`.
          delim="CHIO_$(openssl rand -hex 8)"
          {
            echo "status<<${delim}"
            cat "${status_file}"
            echo "${delim}"
          } >> "${GITHUB_OUTPUT}"
          if [ -s "${status_file}" ]; then
            echo "has_changes=1" >> "${GITHUB_OUTPUT}"
          else
            echo "has_changes=0" >> "${GITHUB_OUTPUT}"
          fi

      - name: Run compatibility diff over each changed schema
        id: diff
        if: steps.changed.outputs.has_changes == '1'
        env:
          MERGE_BASE: ${{ steps.mergebase.outputs.merge_base }}
          STATUS_RECORDS: ${{ steps.changed.outputs.status }}
        run: |
          set -uo pipefail
          tmpdir=$(mktemp -d)
          summary_file="${tmpdir}/summary.md"
          : > "${summary_file}"
          breaking_count=0
          tool_error_count=0
          # Walk the name-status records line by line. Each line is
          # tab-separated: `A\t<path>`, `M\t<path>`, `D\t<path>`, or `R<score>\t<old>\t<new>`.
          while IFS=$'\t' read -r status old new; do
            [ -z "${status:-}" ] && continue
            case "${status}" in
              R*)
                base_path="${old}"
                head_path="${new}"
                ;;
              A|M|D)
                base_path="${old}"
                head_path="${old}"
                ;;
              *)
                echo "skip ${status} ${old:-?}: unhandled status"
                continue
                ;;
            esac
            safe="$(printf '%s' "${head_path}" | tr '/' '_')"
            base_blob="${tmpdir}/base-${safe}"
            if [ "${status}" = "D" ]; then
              echo "breaking ${base_path}: deleted schema"
              breaking_count=$((breaking_count + 1))
              # shellcheck disable=SC2016
              printf -- '- `%s`: BREAKING. Schema was deleted from `spec/schemas/`.\n\n' \
                "${base_path}" >> "${summary_file}"
              continue
            fi
            # `A` (added) records have no base blob to diff against;
            # additions alone are not breaking under compatibility-diff
            # semantics, so skip them.
            if [ "${status}" = "A" ]; then
              echo "skip ${head_path}: added (non-breaking)"
              continue
            fi
            if ! git show "${MERGE_BASE}:${base_path}" > "${base_blob}" 2>/dev/null; then
              echo "skip ${head_path}: base blob ${base_path} unreadable"
              continue
            fi
            report="${tmpdir}/report-${safe}.txt"
            if scripts/classify-schema-compatibility.sh \
              "${base_blob}" "${head_path}" "${report}"; then
              diff_status=0
            else
              diff_status=$?
            fi
            if [ "${diff_status}" -eq 0 ]; then
              echo "ok ${head_path}: no breaking change"
            elif [ "${diff_status}" -eq 10 ]; then
              breaking_count=$((breaking_count + 1))
              # Trim the compatibility report so we can embed it in PR comments
              # without exceeding the 65535-byte body cap.
              snippet=$(head -c 2000 "${report}" || true)
              # Append directly with explicit newlines so closing code
              # fences are not glued to the next list item by command-
              # substitution stripping trailing newlines.
              # shellcheck disable=SC2016
              {
                if [ "${status:0:1}" = "R" ]; then
                  printf -- '- `%s` (renamed from `%s`): BREAKING. Compatibility report excerpt:\n' \
                    "${head_path}" "${base_path}"
                else
                  printf -- '- `%s`: BREAKING. Compatibility report excerpt:\n' "${head_path}"
                fi
                printf -- '```text\n'
                printf '%s\n' "${snippet}"
                printf -- '```\n'
                printf '\n'
              } >> "${summary_file}"
            else
              tool_error_count=$((tool_error_count + 1))
              echo "schema compatibility tool error for ${head_path}:" >&2
              cat "${report}" >&2
            fi
          done < <(printf '%s\n' "${STATUS_RECORDS}")

          echo "breaking_count=${breaking_count}" >> "${GITHUB_OUTPUT}"
          echo "tool_error_count=${tool_error_count}" >> "${GITHUB_OUTPUT}"
          # Emit the markdown summary with a randomized heredoc delimiter so
          # any literal delimiter string inside report excerpts cannot
          # terminate the multiline value early and leak subsequent content
          # as new output keys.
          delim="CHIO_$(openssl rand -hex 8)"
          {
            echo "summary<<${delim}"
            cat "${summary_file}"
            echo "${delim}"
          } >> "${GITHUB_OUTPUT}"
          if [ "${tool_error_count}" -ne 0 ]; then
            echo "schema compatibility analysis failed for ${tool_error_count} schema(s)" >&2
            exit 1
          fi

      - name: Post or update sticky advisory PR comment
        # Always run when the diff step ran (regardless of breaking_count)
        # so a clean push rewrites a stale sticky to an all-clear message
        # rather than leaving the previous warning in place.
        if: always() && (steps.diff.outcome == 'success' || steps.diff.outcome == 'failure')
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          SUMMARY_MD: ${{ steps.diff.outputs.summary }}
          BREAKING_COUNT: ${{ steps.diff.outputs.breaking_count }}
          TOOL_ERROR_COUNT: ${{ steps.diff.outputs.tool_error_count }}
        with:
          script: |
            const marker = '<!-- chio:schema-breaking-change -->';
            const summary = process.env.SUMMARY_MD || '';
            const count = parseInt(process.env.BREAKING_COUNT || '0', 10);
            const toolErrors = parseInt(process.env.TOOL_ERROR_COUNT || '0', 10);
            const baseRef = context.payload.pull_request.base.ref;
            const lines = [marker, '## Schema-breaking-change advisory', ''];
            if (count > 0) {
              lines.push(
                `The compatibility diff flagged ${count} schema(s) under \`spec/schemas/\` as backwards-incompatible against \`${baseRef}\`:`,
                '',
                summary,
                'This check is **advisory only** and does not block merge. Tag the PR title with `BREAKING:` to acknowledge an intentional wire-break; the gate flips to blocking once that convention lands in CONTRIBUTING.md.',
              );
            } else if (toolErrors > 0) {
              lines.push(
                `\`json-schema-diff\` reports no breaking changes under \`spec/schemas/\` against \`${baseRef}\`, but failed to run on ${toolErrors} file(s):`,
                '',
                summary,
                'A tool error is not a compatibility verdict. Those files were not checked.',
              );
            } else {
              lines.push(
                `The compatibility diff reports no breaking changes under \`spec/schemas/\` against \`${baseRef}\`.`,
                '',
                'This check is **advisory only**.',
              );
            }
            lines.push('', `_Posted by \`${context.workflow}\` workflow run #${context.runId}._`);
            const body = lines.join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const transientStatuses = new Set([502, 503, 504]);
            const withRetry = async (label, operation) => {
              const maxAttempts = 4;
              for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
                try {
                  return await operation();
                } catch (error) {
                  const status = Number(error.status || error.response?.status || 0);
                  if (!transientStatuses.has(status) || attempt === maxAttempts) {
                    throw error;
                  }
                  const delayMs = 1000 * (2 ** (attempt - 1));
                  core.warning(
                    `${label} returned HTTP ${status}; retrying in ${delayMs}ms ` +
                    `(attempt ${attempt + 1}/${maxAttempts})`,
                  );
                  await new Promise(resolve => setTimeout(resolve, delayMs));
                }
              }
              throw new Error(`${label} exhausted its retry loop`);
            };
            const existing = await withRetry('list PR comments', () =>
              github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number, per_page: 100 },
              ),
            );
            const prior = existing.find(c => c.body && c.body.includes(marker));
            // On a clean run with no prior sticky, do nothing: there is
            // nothing to update and we do not want to spam green PRs.
            if (!prior && count === 0 && toolErrors === 0) {
              core.info('No breaking changes and no prior sticky comment; nothing to post.');
              return;
            }
            if (prior) {
              await withRetry('update sticky PR comment', () =>
                github.rest.issues.updateComment({
                  owner, repo, comment_id: prior.id, body,
                }),
              );
            } else {
              await withRetry('create sticky PR comment', () =>
                github.rest.issues.createComment({
                  owner, repo, issue_number, body,
                }),
              );
            }
