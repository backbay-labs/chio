name: demo-pages

# Build and deploy docs/demo/ to GitHub Pages.
#
# Triggers on push to main touching docs/demo/** or wasm-producing paths.
# Downloads wasm-artifacts from the latest successful web-sdk.yml run on main,
# copies the browser dist/web/ output into docs/demo/dist/, then deploys.

on:
  push:
    branches: [main]
    paths:
      - 'docs/demo/**'
      - 'crates/chio-kernel-browser/**'
      - 'sdks/typescript/packages/browser/**'
      - 'sdks/typescript/scripts/build-wasm.sh'
      - '.github/workflows/demo-pages.yml'
  workflow_dispatch: {}

concurrency:
  group: demo-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build docs/demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.3'

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      # Build the browser wasm artifact in-place rather than downloading it
      # from web-sdk.yml. This decouples demo-pages from upstream artifact
      # availability (web-sdk's path filter does not match every push that
      # rebuilds Pages) and guarantees the docs-demo Vite build can resolve
      # `@chio-protocol/browser/pkg/chio_kernel_browser.js`.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: wasm32-unknown-unknown

      - name: Ensure wasm32 target on pinned toolchain
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack (pinned)
        run: cargo install wasm-pack --version "$(cat .tooling/wasm-pack.version)" --locked

      - name: Install wasm-bindgen-cli (pinned)
        run: cargo install wasm-bindgen-cli --version "$(cat .tooling/wasm-bindgen.version)" --locked

      - name: Build browser wasm bundle
        run: bash sdks/typescript/scripts/build-wasm.sh --package browser --target web

      - name: Build docs-demo
        run: bun run --filter docs-demo build

      - name: Add Pages metadata to dist
        run: |
          set -eu
          touch docs/demo/dist/.nojekyll
          ls -la docs/demo/dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ./docs/demo/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
