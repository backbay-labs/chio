# TTFRH (time-to-first-receipt-happy-path) gate.
#
# This lane is a required CI check on changes under
# sdks/typescript/templates/** or bench/ttfrh/**. The
# in-process Rust path runs on every PR; the container lane runs on a
# self-hosted reference 4-core Linux runner once the path filter
# matches. A grep gate asserts the
# `required: true` marker on the line below stays in tree.
# required: true

name: ttfrh

on:
  pull_request:
    paths:
      - 'sdks/typescript/templates/**'
      - 'sdks/typescript/packages/create-chio-app/**'
      - 'bench/ttfrh/**'
      - '.github/workflows/ttfrh.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  in-process-bench:
    name: ttfrh-bench (in-process p99 budget)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Cache cargo target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ttfrh-bench-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Run TTFRH bench
        run: |
          cargo run -p ttfrh-bench --release -- --all --p99-budget-ms 60000

  container-lane:
    name: ttfrh-container (clean-machine timing)
    # Clean-machine p99 timing is only meaningful on a dedicated reference
    # runner. Shared PR runners cannot provide that, and the from-scratch
    # container build is wasteful per PR, so this lane runs on push and manual
    # dispatch only. The in-process smoke above is the per-PR gate.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    needs: in-process-bench
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Run container TTFRH bench
        run: |
          set -euo pipefail
          docker run --rm \
            --cpus=4 \
            -v "${PWD}:/workspace" \
            -w /workspace \
            -e CARGO_HOME=/tmp/cargo \
            -e CARGO_TARGET_DIR=/tmp/chio-target \
            rust:1.93-bookworm \
            bash -c 'cargo run -p ttfrh-bench --release -- --all --p99-budget-ms 60000'
