# Generate provenance in the original tagged release workflow context.
name: slsa

on:
  workflow_call:

permissions:
  id-token: write
  contents: write
  actions: read

jobs:
  collect-digests:
    name: Collect binary digests from release-binaries
    # owner: Chio maintainers
    runs-on: ubuntu-latest
    outputs:
      subjects: ${{ steps.compute.outputs.subjects }}
      release_tag: ${{ steps.compute.outputs.release_tag }}
      source_sha: ${{ steps.compute.outputs.source_sha }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout original release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
      - name: Download this run's release matrix artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: chio-*-*-*
          path: artifacts/
      - name: Bind all subjects to the original release context
        id: compute
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "push" && "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            echo "::error::provenance requires the original push or dispatch release context" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "::error::provenance requires the original release tag context" >&2
            exit 1
          fi
          python3 scripts/verify-release-provenance.py subjects \
            --artifacts artifacts --repository "${GITHUB_REPOSITORY}" --tag "${GITHUB_REF_NAME}" \
            --source-sha "${GITHUB_SHA}" --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --report subjects.json --github-output "${GITHUB_OUTPUT}"
          tag_core="${GITHUB_REF_NAME%%+*}"
          if [[ "${tag_core}" == *-* ]]; then
            draft_state="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)"
            if [[ "${draft_state}" != "true" ]]; then
              echo "::error::candidate provenance requires an existing draft; never reopen a published release" >&2
              exit 1
            fi
          fi
      - name: Retain provenance subject binding
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-provenance-subjects-${{ github.run_attempt }}
          path: subjects.json
          if-no-files-found: error


  provenance:
    name: SLSA L2 provenance
    # owner: Chio maintainers
    needs: [collect-digests]
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a
    with:
      base64-subjects: ${{ needs.collect-digests.outputs.subjects }}
      provenance-name: chio-${{ needs.collect-digests.outputs.source_sha }}.intoto.jsonl
      # The supported source-build mode accepts the immutable workflow SHA.
      compile-generator: true
      # Verify the authenticated source/builder policy before attaching the bundle.
      upload-assets: false

  verify-and-attach:
    name: Verify pinned provenance before attachment
    needs: [collect-digests, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout original release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
      - name: Install supported cryptographic verifier
        uses: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409
        with:
          cosign-release: v2.4.1
      - name: Download this run's release matrix artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: chio-*-*-*
          path: artifacts/
      - name: Download signed provenance from the isolated generator
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: chio-${{ github.sha }}.intoto.jsonl
          path: provenance/
      - name: Verify exact artifact, builder, source and caller identities
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-release-provenance.py subjects \
            --artifacts artifacts --repository "${GITHUB_REPOSITORY}" --tag "${GITHUB_REF_NAME}" \
            --source-sha "${GITHUB_SHA}" --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --report subjects.json
          mapfile -t archives < <(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) | sort)
          python3 scripts/verify-release-provenance.py verify \
            --bundle "provenance/chio-${GITHUB_SHA}.intoto.jsonl" --evidence verification-evidence \
            --repository "${GITHUB_REPOSITORY}" --tag "${GITHUB_REF_NAME}" --source-sha "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}" "${archives[@]}" \
            >provenance-verification.stdout 2> >(tee provenance-verification.stderr >&2)
      - name: Attach verified provenance without changing release state or replacing bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_core="${GITHUB_REF_NAME%%+*}"
          if [[ "${tag_core}" == *-* ]]; then
            draft_state="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)"
            if [[ "${draft_state}" != "true" ]]; then
              echo "::error::refusing to attach candidate provenance after publication" >&2
              exit 1
            fi
          fi
          # No --clobber: an existing immutable provenance asset must not be replaced.
          gh release upload "${GITHUB_REF_NAME}" "provenance/chio-${GITHUB_SHA}.intoto.jsonl" \
            --repo "${GITHUB_REPOSITORY}"
      - name: Retain provenance verification evidence on success or refusal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-provenance-verification-${{ github.run_attempt }}
          path: |
            subjects.json
            provenance/
            verification-evidence/
            provenance-verification.stdout
            provenance-verification.stderr
          if-no-files-found: error
          retention-days: 90
