# chio-arena-determinism.yml - Multi-agent arena determinism gate.
#
# Runs the chio-arena determinism gate on every PR and on push to main /
# project/* branches. The gate runs the three reference scenarios twice and
# asserts byte equality on the arena's deterministic outputs (witness,
# schedule, RNG snapshots, virtual clock progression, verdict trace).
#
# Determinism contract: LC_ALL=C and LANG=C are pinned so receipt
# serialisation and sort orderings are reproducible. CARGO_INCREMENTAL=0
# prevents incremental codegen from contributing host-specific state to the
# bytes the gate compares.
#
# Linux-only: macOS smoke runs are read-only and live in chio-replay-gate.
# This mirrors the trajectory-1 M04 platform pinning rule and the M08 P2
# narrative requirement that the determinism gate be Linux-only.

name: chio-arena-determinism

on:
  pull_request:
  push:
    branches:
      - main
      - 'project/**'

concurrency:
  group: chio-arena-determinism-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Determinism pins: arena byte-equivalence depends on a stable locale
  # (string sort orders, number formatting) and a non-incremental codegen
  # path. These match the chio-replay-gate workflow.
  LC_ALL: C
  LANG: C
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  arena-determinism:
    name: arena-determinism (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install protobuf compiler
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          for attempt in 1 2 3; do
            if timeout 180s sudo apt-get update \
                && timeout 180s sudo apt-get install -y protobuf-compiler; then
              exit 0
            fi
            echo "protobuf compiler install attempt ${attempt} failed; retrying" >&2
            sleep $((attempt * 10))
          done
          echo "protobuf compiler install failed after retries" >&2
          exit 1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Verify reference scenarios are present
        # Defence in depth: the determinism_gate test references these by
        # path, but a missing scenario would surface as a less-readable I/O
        # error. Surface it here with a clear message before any compilation.
        run: |
          set -euo pipefail
          for scenario in \
            arena/scenarios/walking_skeleton.toml \
            arena/scenarios/multi/two_agent_tool_exchange.toml \
            arena/scenarios/multi/three_agent_triangular_delegation.toml; do
            if [ ! -f "${scenario}" ]; then
              echo "ERROR: ${scenario} is missing." >&2
              exit 1
            fi
          done

      - name: Run arena determinism gate
        run: cargo test -p chio-arena --test determinism_gate -- --nocapture

      - name: Run multi-agent reference scenarios
        # Re-run as a redundancy check: the determinism gate already drives
        # both reference scenarios, but the dedicated test surfaces failures
        # earlier with a tighter scope.
        run: cargo test -p chio-arena --test multi_agent_reference

      - name: Run scheduler determinism unit suite
        run: cargo test -p chio-arena --test scheduler_determinism

      - name: Run RNG determinism unit suite
        run: cargo test -p chio-arena --test rng_determinism

      - name: Run virtual clock determinism unit suite
        run: cargo test -p chio-arena --test virtual_clock

      - name: Run multi-kernel routing unit suite
        run: cargo test -p chio-arena --test multi_kernel_routing
