name: sustained-p99-nightly

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sustained-p99-nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CHIO_SUSTAINED_P99_SECONDS: "1800"

jobs:
  sustained-p99:
    name: sustained p99
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable

      - name: Build sustained gate binary
        env:
          CARGO_BUILD_JOBS: "4"
        run: cargo build -p chio-loadgen --release --bin sustained

      - name: Run sustained kernel p99 lane
        run: cargo run -p chio-loadgen --release --bin sustained

      - name: Run store write throughput bench smoke
        run: cargo bench -p chio-store-sqlite --bench store_receipt_write_throughput -- --test

      - name: Run Wasm guard-pool checkout bench smoke
        run: cargo bench -p chio-wasm-guards --features wasmtime-runtime --bench guard_pool_checkout_p99 -- --test
