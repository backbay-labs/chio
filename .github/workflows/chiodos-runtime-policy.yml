name: Legacy Chiodos Runtime Policy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-chiodos-runtime-policy-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  legacy-runtime-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Chio runtime policy gate
        run: bash scripts/check-chio-runtime-policy.sh
