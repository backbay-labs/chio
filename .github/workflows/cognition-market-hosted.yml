name: Cognition market hosted

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/platform/chio-finding-market-store-postgres/**"
      - "crates/platform/chio-finding-hosted-edge/**"
      - "crates/platform/chio-finding-worker/**"
      - "crates/platform/chio-control-plane/**"
      - "crates/platform/chio-store-sqlite/**"
      - "crates/products/chio-finding-worker/**"
      - "crates/products/chio-finding-market-migrator/**"
      - "crates/trust/chio-signing-remote/**"
      - "crates/trust/chio-finding-challenge/**"
      - "crates/economy/chio-finding/**"
      - "crates/economy/chio-settle/**"
      - "scripts/qualify-cognition-market-hosted.sh"
      - "scripts/qualify-cognition-market-kvm.sh"
      - ".github/workflows/cognition-market-hosted.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main]
    paths:
      - "crates/platform/chio-finding-market-store-postgres/**"
      - "crates/platform/chio-finding-hosted-edge/**"
      - "crates/platform/chio-finding-worker/**"
      - "crates/platform/chio-control-plane/**"
      - "crates/platform/chio-store-sqlite/**"
      - "crates/products/chio-finding-worker/**"
      - "crates/products/chio-finding-market-migrator/**"
      - "crates/trust/chio-signing-remote/**"
      - "crates/trust/chio-finding-challenge/**"
      - "crates/economy/chio-finding/**"
      - "crates/economy/chio-settle/**"
      - "scripts/qualify-cognition-market-hosted.sh"
      - "scripts/qualify-cognition-market-kvm.sh"
      - ".github/workflows/cognition-market-hosted.yml"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

jobs:
  postgres-store:
    name: Cognition market PostgreSQL isolation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: chio
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CHIO_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/chio?sslmode=disable
      CHIO_TEST_POSTGRES_MIGRATOR_URL: postgres://chio_market_migrator_test:test-only-password@127.0.0.1:5432/chio?sslmode=disable
      CHIO_TEST_POSTGRES_RUNTIME_URL: postgres://chio_market_runtime_test:test-only-password@127.0.0.1:5432/chio?sslmode=disable
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Install cargo-vet
        run: cargo install cargo-vet --locked --version 0.10.2
      - name: Qualify hosted cognition market
        run: ./scripts/qualify-cognition-market-hosted.sh --code-only
      - name: Upload hosted qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cognition-market-hosted-code-${{ github.sha }}
          path: target/release-qualification/cognition-market-hosted
          if-no-files-found: error
          retention-days: 21
