      - "Cargo.lock"

permissions:
  contents: read

jobs:
  postgres-store:
    name: Cognition market PostgreSQL isolation
    runs-on: ubuntu-latest
    # Cold Rust qualification plus evidence and cache upload can exceed 30 minutes.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: chio
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CHIO_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/chio?sslmode=disable
      CHIO_TEST_POSTGRES_MIGRATOR_URL: postgres://chio_market_migrator_test:test-only-password@127.0.0.1:5432/chio?sslmode=disable
      CHIO_TEST_POSTGRES_RUNTIME_URL: postgres://chio_market_runtime_test:test-only-password@127.0.0.1:5432/chio?sslmode=disable
      CHIO_TEST_POSTGRES_RETENTION_URL: postgres://chio_market_retention_test:test-only-password@127.0.0.1:5432/chio?sslmode=disable
      CHIO_TEST_POSTGRES_WORKER_URL: postgres://chio_market_worker_test:test-only-password@127.0.0.1:5432/chio?sslmode=disable
      CHIO_TEST_POSTGRES_REPLICATOR_URL: postgres://chio_market_replicator_test:test-only-password@127.0.0.1:5432/chio?sslmode=disable
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal --component rustfmt --component clippy
      - name: Install uv (Python codegen toolchain runner)
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Install cargo-vet
        run: cargo install cargo-vet --locked --version 0.10.2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.4
      - name: Qualify hosted cognition market
        run: ./scripts/qualify-cognition-market-hosted.sh --code-only
      - name: Require bounded code-only claims
        shell: bash
        run: |
          python3 - target/release-qualification/cognition-market-hosted/qualification.json <<'PY'
          import json
          from pathlib import Path
          import sys

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "schema": "chio.finding.hosted-qualification.v1",
              "mode": "code-only",
              "decision": "qualified-code-boundary",
              "codeQualified": True,
              "kvmQualified": False,
              "networkQualified": False,
              "productionReady": False,
              "promotionReady": False,
              "kvmEvidenceSha256": None,
          }
          for field, value in expected.items():
              if report.get(field) != value:
                  raise SystemExit(
                      f"hosted code report has unsafe {field}: {report.get(field)!r}"
                  )
          PY
      - name: Upload hosted qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cognition-market-hosted-code-${{ github.sha }}
          path: target/release-qualification/cognition-market-hosted
          if-no-files-found: error
          retention-days: 21
