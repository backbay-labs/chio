name: Cognition market hosted

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/platform/chio-finding-market-store-postgres/**"
      - "crates/platform/chio-finding-worker/**"
      - "crates/products/chio-finding-worker/**"
      - "crates/trust/chio-signing-remote/**"
      - ".github/workflows/cognition-market-hosted.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main]
    paths:
      - "crates/platform/chio-finding-market-store-postgres/**"
      - "crates/platform/chio-finding-worker/**"
      - "crates/products/chio-finding-worker/**"
      - "crates/trust/chio-signing-remote/**"
      - ".github/workflows/cognition-market-hosted.yml"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

jobs:
  postgres-store:
    name: Cognition market PostgreSQL isolation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: chio
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CHIO_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/chio?sslmode=disable
      CHIO_TEST_POSTGRES_RUNTIME_URL: postgres://chio_market_runtime_test:test-only-password@127.0.0.1:5432/chio?sslmode=disable
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint hosted store
        run: cargo clippy -p chio-finding-market-store-postgres -p chio-finding-worker -p chio-signing-remote --all-targets --features chio-finding-market-store-postgres/postgres-integration -- -D warnings
      - name: Test remote custody and isolated worker
        run: cargo test -p chio-signing-remote -p chio-finding-worker -p chio-finding-worker-daemon
      - name: Exercise PostgreSQL tenant isolation and leases
        run: cargo test -p chio-finding-market-store-postgres --features postgres-integration --test postgres_store -- --test-threads=1
