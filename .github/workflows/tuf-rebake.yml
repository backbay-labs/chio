# tuf-rebake.yml - Quarterly TUF trust-root re-bake.

name: tuf-rebake

on:
  schedule:
    # 03:11 UTC on the 1st of every 3rd month (Jan/Apr/Jul/Oct).
    - cron: "11 3 1 */3 *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tuf-rebake
  cancel-in-progress: false

jobs:
  rebake:
    name: tuf-rebake
    # owner: Chio maintainers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Re-bake Sigstore TUF root
        run: |
          set -euo pipefail
          scripts/tuf-rebake.sh --write
          scripts/tuf-rebake.sh --check
      - name: Verify embedded trust root still constructs
        run: |
          set -euo pipefail
          cargo test -p chio-attest-verify --test integration constructor_loads_embedded_trust_root -- --exact
      - name: Fail closed on uncommitted trust-root drift
        run: |
          set -euo pipefail
          git diff -- crates/chio-attest-verify/sigstore-root
          git diff --exit-code -- crates/chio-attest-verify/sigstore-root
