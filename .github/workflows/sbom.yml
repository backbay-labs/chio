name: SBOM

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish SBOMs for, such as v0.1.0"
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"
  schedule:
    - cron: "17 8 * * 1"
  workflow_run:
    workflows:
      - Release Binaries
    types:
      - completed

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.event_name == 'workflow_run' && format('workflow-run-{0}-sbom', github.event.workflow_run.id) || format('ref-{0}-sbom', github.ref) }}
  cancel-in-progress: false

jobs:
  publish-sbom:
    name: publish source and binary SBOMs
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SYFT_VERSION: "1.51.1"
      SYFT_LINUX_AMD64_SHA256: "8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch)
              tag="${INPUT_TAG}"
              ;;
            push)
              tag="${GITHUB_REF_NAME}"
              ;;
            schedule)
              tag="$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)"
              ;;
            workflow_run)
              tag="$(git tag --points-at "${WORKFLOW_RUN_HEAD_SHA}" | grep -E '^v[0-9]' | sort -V | tail -n 1)"
              ;;
            *)
              echo "::error::unsupported event ${GITHUB_EVENT_NAME}" >&2
              exit 1
              ;;
          esac
          semver_re='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?'
          if ! [[ "${tag}" =~ ^v${semver_re}$ ]]; then
            echo "::error::resolved tag '${tag}' does not match v<semver>" >&2
            exit 1
          fi
          source_sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" && "${source_sha}" != "${WORKFLOW_RUN_HEAD_SHA}" ]]; then
            echo "::error::release tag moved away from the completed build source" >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${source_sha}" != "$(git rev-parse "${GITHUB_SHA}^{commit}")" ]]; then
            echo "::error::release tag moved away from the triggering source" >&2
            exit 1
          fi
          source_dir="${RUNNER_TEMP}/release-source"
          git worktree add --detach "${source_dir}" "${source_sha}"
          version="${tag#v}"
          out_dir="supply-chain/sbom/${tag}"
          mkdir -p "${out_dir}"
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "source_sha=${source_sha}"
            echo "source_dir=${source_dir}"
            echo "out_dir=${out_dir}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install syft
        shell: bash
        run: |
          set -euo pipefail
          asset="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          archive="${RUNNER_TEMP}/${asset}"
          extract_dir="${RUNNER_TEMP}/syft-${SYFT_VERSION}"
          mkdir -p "${HOME}/.local/bin" "${extract_dir}"
          curl -fsSLo "${archive}" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${asset}"
          printf '%s  %s\n' "${SYFT_LINUX_AMD64_SHA256}" "${archive}" | shasum -a 256 -c -
          tar -xzf "${archive}" -C "${extract_dir}"
          install -m 0755 "${extract_dir}/syft" "${HOME}/.local/bin/syft"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Install cosign
        uses: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409
        with:
          cosign-release: v2.4.1

      - name: Compare full source CycloneDX inventories
        shell: bash
        env:
          OUT_DIR: ${{ steps.release.outputs.out_dir }}
          SOURCE_DIR: ${{ steps.release.outputs.source_dir }}
        run: |
          set -euo pipefail
          first="${GITHUB_WORKSPACE}/${OUT_DIR}/source.cdx.json"
          second="${GITHUB_WORKSPACE}/${OUT_DIR}/source-repeat.cdx.json"
          # Scan the immutable release tree, retaining the current workflow's verifier.
          (
            cd "${SOURCE_DIR}"
            syft --config deploy/sbom/syft.yaml \
              -o "cyclonedx-json@1.6=${first}" "dir:." \
              >"${first}.stdout" 2> >(tee "${first}.stderr" >&2)
            syft --config deploy/sbom/syft.yaml \
              -o "cyclonedx-json@1.6=${second}" "dir:." \
              >"${second}.stdout" 2> >(tee "${second}.stderr" >&2)
          )
          python3 scripts/check-source-sbom-determinism.py \
            --first "${first}" --second "${second}" \
            --report "${OUT_DIR}/source-comparison.json" \
            >"${OUT_DIR}/source-comparison.stdout" 2> >(tee "${OUT_DIR}/source-comparison.stderr" >&2)

      - name: Download release archives
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release-assets"
          for attempt in 1 2 3 4 5; do
            if gh release download "${RELEASE_TAG}" \
              --dir "${RUNNER_TEMP}/release-assets" \
              --pattern "chio-${RELEASE_VERSION}-*" \
              --clobber; then
              break
            fi
            if [ "${attempt}" -eq 5 ]; then
              echo "::error::release assets for ${RELEASE_TAG} were not downloadable" >&2
              exit 1
            fi
            sleep 30
          done
          find "${RUNNER_TEMP}/release-assets" -type f \
            \( -name '*.tar.gz' -o -name '*.zip' \) \
            -print | sort > "${RUNNER_TEMP}/release-assets/archives.txt"
          if [ ! -s "${RUNNER_TEMP}/release-assets/archives.txt" ]; then
            echo "::error::no release archives found for ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Authenticate archives and rescan extracted executables
        shell: bash
        env:
          OUT_DIR: ${{ steps.release.outputs.out_dir }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_DIR: ${{ steps.release.outputs.source_dir }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 scripts/rescan-release-sboms.py \
            --assets "${RUNNER_TEMP}/release-assets" --root "${SOURCE_DIR}" \
            --output "${OUT_DIR}/binary" --work "${RUNNER_TEMP}/release-binary-rescan" \
            --repository "${GITHUB_REPOSITORY}" --tag "${RELEASE_TAG}" --source-sha "${SOURCE_SHA}" \
            >"${OUT_DIR}/rescan.stdout" 2> >(tee "${OUT_DIR}/rescan.stderr" >&2)

      - name: Cosign sign-blob SBOM files
        shell: bash
        env:
          OUT_DIR: ${{ steps.release.outputs.out_dir }}
        run: |
          set -euo pipefail
          mapfile -t sboms < <(find "${OUT_DIR}" -type f -name '*.cdx.json' -print | sort)
          if [ "${#sboms[@]}" -eq 0 ]; then
            echo "::error::no SBOM files found under ${OUT_DIR}" >&2
            exit 1
          fi
          for sbom in "${sboms[@]}"; do
            cosign sign-blob --yes \
              --output-signature "${sbom}.sig" \
              --output-certificate "${sbom}.pem" \
              "${sbom}"
            if [ ! -s "${sbom}.sig" ] || [ ! -s "${sbom}.pem" ]; then
              echo "::error::cosign sign-blob did not produce non-empty signing material for ${sbom}" >&2
              exit 1
            fi
          done

      - name: Retain SBOM evidence on success or refusal
        if: always() && steps.release.outputs.out_dir != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom-${{ steps.release.outputs.tag }}
          path: ${{ steps.release.outputs.out_dir }}/
          if-no-files-found: error
          retention-days: 180
