name: CI

# Required-check inventory (GitHub branch rulesets match by `name:` field,
# not job id).
#
#   required (reported check context names):
#     - "Build, lint, test"                                  # check job
#     - "MSRV build and test"                                # msrv job
#     - "cargo-vet (locked supply-chain audit)"              # cargo-vet job
#     - "cargo-deny (supply-chain bans/advisories/licenses)" # cargo-deny job
#
# PR-tier CI is intentionally fast and Linux-only: format, clippy, build, the
# workspace test lane, and the cheap structural gates. Heavier lanes live
# elsewhere: the Lean 4 / Aeneas / Creusot proof report, portable browser and
# mobile qualification, the polyglot SDK-parity lane, and workspace coverage
# run nightly in nightly.yml; formal model checking is path-scoped in
# apalache-safety.yml; Lean, Kani, and Rust verification metadata are
# path-scoped in formal-pr-smoke.yml and Kani also runs nightly; the JVM SDK
# build is path-scoped in jvm.yml; macOS coverage stays in
# release-binaries.yml for tag releases, where macOS artifact behavior is
# actually exercised.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, chio/autonomous-commerce-brainstorm]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CHIO_CI_RUSTFLAGS: "-D warnings -C link-arg=-Wl,--threads=1"
  # PR-tier proptest case count for the named invariants. The nightly tier
  # (4096) lives in .github/workflows/nightly.yml.
  PROPTEST_CASES: "256"

jobs:
  check:
    name: Build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal --component rustfmt --component clippy
          rustup show active-toolchain

      - name: Install protobuf compiler
        uses: ./.github/actions/apt-install
        with:
          packages: protobuf-compiler ripgrep zstd

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      # Gate the named capability-algebra invariants. The authoritative name
      # set is in the script itself; a silent rename of any invariant fn
      # fails this step before the workspace lane builds.
      - name: Proptest invariant coverage
        run: ./scripts/check-proptest-coverage.sh

      - name: Kani public core registry contract
        run: bash scripts/tests/check-kani-public-core.test.sh

      - name: Test regression-test deletion guard
        run: bash scripts/tests/check-regression-tests.test.sh

      - name: Run regression-test deletion guard
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: bash scripts/check-regression-tests.sh

      - name: Workspace structural gates
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: |
          ./scripts/check-release-inputs.sh
          ./scripts/check-workspace-layering.sh
          python3 scripts/check-review-slices.py
          python3 scripts/check-mutants-examine-globs.py
          bash scripts/tests/check-mutants-examine-globs.test.sh
          python3 scripts/check-rust-public-surface.py
          bash scripts/tests/check-rust-public-surface.test.sh
          python3 scripts/check-architecture-docs.py
          bash ./scripts/check-sre-metrics-registry.sh
          bash ./scripts/check-log-redaction.sh
          bash ./scripts/check-http-egress-contract.sh
          bash ./scripts/tests/check-http-egress-contract.test.sh
          bash ./scripts/check-chio-proof-room-release-truth.sh
          bash ./scripts/tests/check-chio-proof-room-release-truth.test.sh
          bash ./scripts/check-chio-schema-registry.sh
          bash ./scripts/tests/check-chio-schema-registry.test.sh
          bash ./scripts/check-agent-web-proof-envelope-schema.sh
          bash ./scripts/tests/check-agent-web-proof-envelope-schema.test.sh
          bash ./scripts/check-mapping.sh
          bash ./scripts/tests/check-rust-verification-gates.test.sh
          bash ./scripts/tests/formal-workflow-wiring.test.sh
          cargo metadata --manifest-path fuzz/Cargo.toml --locked --no-deps --format-version 1 >/dev/null
          bash ./scripts/check-corpus-metadata.sh
          bash ./scripts/tests/fuzz-budget-hard-halt.test.sh
          bash ./scripts/tests/check-proof-report.test.sh
          bash ./scripts/tests/lane-gate.test.sh

      - name: Anchor batch async witness lint
        run: bash ./scripts/check-anchor-batch-async-witness.sh

      - name: crate-path go-dark guard
        run: cargo xtask check crate-paths

      - name: formal mirror drift guard
        run: cargo xtask check formal-mirrors

      - name: proof coverage drift guard
        run: cargo xtask gen proof-coverage --check

      - name: Workspace format
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: cargo fmt --all -- --check

      - name: Rust file hygiene
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: |
          python3 scripts/check-rust-file-hygiene.py
          bash scripts/tests/check-rust-file-hygiene.test.sh

      - name: Stub surface hygiene
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: |
          python3 scripts/check-stub-surfaces.py
          bash scripts/tests/check-stub-surfaces.test.sh
          bash scripts/tests/check-sdk-release-python-generated.test.sh
          bash scripts/tests/check-sdk-release-ts-bun.test.sh
          bash scripts/tests/conformance-matrix-peer-target.test.sh
          bash scripts/tests/qualify-release-provider-replay.test.sh
          bash scripts/tests/qualify-release-peer-smoke.test.sh
          bash scripts/tests/release-qualification-formal-tools.test.sh
          bash scripts/tests/release-npm-package-matrix.test.sh
          bash scripts/tests/release-pypi-package-matrix.test.sh
          bash scripts/tests/provider-fixture-claims.test.sh

      - name: Workspace clippy
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: cargo clippy --workspace --lib --bins --examples -- -D warnings

      - name: Workspace build
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: cargo build --workspace

      - name: Policy analysis self-check
        run: ./scripts/check-policy-analysis.sh target/debug/chio

      - name: Build Proof Room dashboard
        uses: ./.github/actions/setup-node
        with:
          node-version: "22"
          cache-dependency-path: crates/products/chio-cli/dashboard/package-lock.json
          working-directory: crates/products/chio-cli/dashboard

      - name: Export Proof Room static UI
        working-directory: crates/products/chio-cli/dashboard
        run: npm run build

      - name: Transaction Passport fixture gate
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
          CHIO_BIN: target/debug/chio
        run: bash ./scripts/check-chio-transaction-passport.sh

      - name: Proof Room launch acceptance package
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
          CHIO_BIN: target/debug/chio
        run: |
          cargo xtask verify launch-acceptance --out target/proof-room/public-bundle
          bash ./scripts/tests/check-chio-proof-room-launch-acceptance.test.sh

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.3"

      - name: Workspace tests
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: cargo test --workspace --exclude chio-wasm-guards

      - name: Wasm guards library tests
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: cargo test -p chio-wasm-guards --lib

      - name: Build Python guard WASM fixture
        run: |
          python3 -m pip install "componentize-py==$(cat .tooling/componentize-py.version)"
          ./sdks/guard/chio-guard-py/scripts/build-guard.sh

      - name: Wasm guards Python SDK round-trip tests
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: cargo test -p chio-wasm-guards --test py_guard_integration -- --nocapture

      - name: Tokio console smoke
        env:
          CARGO_BUILD_JOBS: "1"
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0 --cfg tokio_unstable"
        run: cargo test -p chio-kernel --features tokio-console-smoke --test tokio_console_smoke

  msrv:
    name: MSRV build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.93.0"

      - name: MSRV workspace lane
        env:
          CARGO_BUILD_JOBS: "1"
          CARGO_TARGET_DIR: ${{ runner.temp }}/chio-msrv-target
          RUSTFLAGS: "${{ env.CHIO_CI_RUSTFLAGS }} -C debuginfo=0"
        run: |
          cargo build --workspace
          cargo test --workspace --exclude chio-conformance --exclude chio-wasm-guards --exclude chio-formal-diff-tests
          cargo test -p chio-formal-diff-tests --no-run
          cargo test -p chio-wasm-guards --lib

  cargo-vet:
    name: cargo-vet (locked supply-chain audit)
    # owner: Chio maintainers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup show active-toolchain
      - name: Install cargo-vet
        run: cargo install cargo-vet --locked --version 0.10.2
      - name: cargo vet --locked
        run: cargo vet --locked

  cargo-deny:
    name: cargo-deny (supply-chain bans/advisories/licenses)
    # owner: Chio maintainers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup show active-toolchain
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.4
      - name: cargo deny check advisories
        run: cargo deny check advisories
      - name: cargo deny check licenses
        run: cargo deny check licenses
      - name: cargo deny check sources
        # Enforces the [sources] block in deny.toml (unknown-registry =
        # "deny", unknown-git = "deny", explicit allow-registry +
        # allow-git lists). Without this step a new dependency from an
        # unapproved registry or git repo passes CI even though the
        # policy denies it.
        run: cargo deny check sources
      - name: cargo deny check bans
        run: cargo deny check bans
      - name: Check external wildcard dependencies
        run: python3 scripts/check-external-wildcard-deps.py
      - name: cargo deny duplicate baseline
        run: python3 scripts/check-cargo-deny-duplicate-baseline.py
