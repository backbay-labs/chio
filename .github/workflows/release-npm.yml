name: Release npm

# Publishes Chio TypeScript SDKs to npm on git tag push, using OIDC-backed
# `npm publish --provenance`. See `docs/install/PUBLISHING.md` for tag
# format, npm org trust setup, and rollback procedures.
#
# Tag formats:
#   ts/v<X.Y.Z>                 -> publishes every TypeScript package
#   ts/<slug>-v<X.Y.Z>          -> publishes only that package
#                                  (e.g. ts/chio-ts-v1.2.0 publishes
#                                  @chio-protocol/sdk)
#
# workflow_dispatch always builds and lints only; package publishing is
# restricted to tag pushes. No stored NPM_TOKEN is required;
# authentication is via GitHub's OIDC token and npm's Trusted Publisher
# configuration (`--provenance`).

on:
  push:
    tags:
      - "ts/v*.*.*"
      - "ts/*-v*.*.*"
  workflow_dispatch:
    inputs:
      package:
        description: "Package slug (e.g. express, node-http). Leave blank for all."
        required: false
        type: string
        default: ""
      dry_run:
        description: "Build and lint only. Manual dispatch never publishes."
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan matrix
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.select.outputs.packages }}
      dry_run: ${{ steps.select.outputs.dry_run }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Determine packages to publish
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PACKAGE: ${{ github.event.inputs.package }}
        run: |
          set -euo pipefail

          # Canonical list of publishable TypeScript packages. The
          # `conformance` workspace is marked `"private": true` and is
          # intentionally excluded.
          #
          # chio-ts is the core SDK package. node-http stays ahead of
          # packages that depend on it via `file:../node-http`.
          all_packages=(
            "sdks/typescript/chio-ts"
            "sdks/typescript/packages/node-http"
            "sdks/typescript/packages/browser"
            "sdks/typescript/packages/wasm-core"
            "sdks/typescript/packages/workers"
            "sdks/typescript/packages/edge"
            "sdks/typescript/packages/deno"
            "sdks/typescript/packages/mobile"
            "sdks/typescript/packages/passkey"
            "sdks/typescript/packages/chio-next"
            "sdks/typescript/packages/chio-ai-sdk-middleware"
            "sdks/typescript/packages/express"
            "sdks/typescript/packages/fastify"
            "sdks/typescript/packages/elysia"
            "sdks/typescript/packages/ai-sdk"
            "sdks/typescript/packages/create-chio-app"
          )

          selected=()

          resolve_slug() {
            local slug="$1"
            local match=""
            for path in "${all_packages[@]}"; do
              if [[ "$(basename "$path")" == "$slug" ]]; then
                match="$path"
                break
              fi
            done
            if [[ -z "$match" ]]; then
              echo "Unknown package slug: $slug" >&2
              exit 1
            fi
            echo "$match"
          }

          dry_run="false"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            dry_run="true"
            if [[ -n "$INPUT_PACKAGE" ]]; then
              selected+=("$(resolve_slug "$INPUT_PACKAGE")")
            else
              selected=("${all_packages[@]}")
            fi
          else
            semver_re='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?'
            # Slug-specific tags are matched by iterating the known
            # `all_packages` list rather than a greedy `.+-v` capture
            # - the greedy regex would misparse slugs that themselves
            # contain `-v` (e.g. a hypothetical `ai-sdk-v2-preview`).
            if [[ "$REF_NAME" =~ ^ts/v${semver_re}$ ]]; then
              selected=("${all_packages[@]}")
            else
              matched=""
              for candidate in "${all_packages[@]}"; do
                slug="$(basename "$candidate")"
                if [[ "$REF_NAME" =~ ^ts/${slug}-v${semver_re}$ ]]; then
                  matched="$candidate"
                  break
                fi
              done
              if [[ -n "$matched" ]]; then
                selected+=("$matched")
              else
                echo "Tag $REF_NAME does not match ts/v<semver> or ts/<slug>-v<semver> for any known slug" >&2
                exit 1
              fi
            fi
          fi

          json="["
          for i in "${!selected[@]}"; do
            if [[ $i -gt 0 ]]; then json+=","; fi
            json+="\"${selected[$i]}\""
          done
          json+="]"

          echo "packages=$json" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "Selected packages: $json"
          echo "Dry run: $dry_run"

  build:
    name: Build ${{ matrix.package }}
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      # Required for cosign keyless signing via Sigstore Fulcio.
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      # Keep publishes deterministic; node-http must build before
      # anything that depends on it.
      max-parallel: 1
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    outputs:
      dry_run: ${{ needs.plan.outputs.dry_run }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          # `registry-url` must be set here so that later `npm publish`
          # invocations pick up the OIDC-provisioned token via
          # $NODE_AUTH_TOKEN. See docs/install/PUBLISHING.md.
          registry-url: "https://registry.npmjs.org"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.3"

      - name: Detect wasm-backed package
        id: wasm
        shell: bash
        env:
          PACKAGE_DIR: ${{ matrix.package }}
        run: |
          set -euo pipefail
          required=$(node <<'NODE'
            const fs = require("fs");
            const path = require("path");

            const repoRoot = process.env.GITHUB_WORKSPACE ?? process.cwd();
            const workspaceRoot = path.join(repoRoot, "sdks/typescript");
            const packageDir = path.join(repoRoot, process.env.PACKAGE_DIR);
            const localByName = new Map();
            const wasmScriptPattern = /\bbuild:wasm\b|build-wasm\.sh/;

            for (const dir of [path.join(workspaceRoot, "chio-ts")]) {
              const manifestPath = path.join(dir, "package.json");
              const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
              localByName.set(manifest.name, dir);
            }
            for (const entry of fs.readdirSync(path.join(workspaceRoot, "packages"))) {
              const dir = path.join(workspaceRoot, "packages", entry);
              const manifestPath = path.join(dir, "package.json");
              if (!fs.existsSync(manifestPath)) continue;
              const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
              localByName.set(manifest.name, dir);
            }

            const seen = new Set();
            function visit(dir) {
              const resolved = path.resolve(dir);
              if (seen.has(resolved)) return false;
              seen.add(resolved);

              const manifestPath = path.join(resolved, "package.json");
              const pkg = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
              const scriptText = Object.values(pkg.scripts ?? {}).join("\n");
              if (wasmScriptPattern.test(scriptText)) return true;

              for (const block of ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"]) {
                const deps = pkg[block] ?? {};
                for (const name of Object.keys(deps)) {
                  if (!name.startsWith("@chio-protocol/")) continue;
                  const localDir = localByName.get(name);
                  if (!localDir || path.resolve(localDir) === resolved) continue;
                  if (visit(localDir)) return true;
                }
              }
              return false;
            }

            process.stdout.write(visit(packageDir) ? "true" : "false");
          NODE
          )
          echo "required=$required" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        if: steps.wasm.outputs.required == 'true'
        with:
          targets: wasm32-unknown-unknown

      - name: Ensure wasm32 target on pinned toolchain
        if: steps.wasm.outputs.required == 'true'
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack (pinned)
        if: steps.wasm.outputs.required == 'true'
        run: cargo install wasm-pack --version "$(cat .tooling/wasm-pack.version)" --locked

      - name: Install wasm-bindgen-cli (pinned)
        if: steps.wasm.outputs.required == 'true'
        run: cargo install wasm-bindgen-cli --version "$(cat .tooling/wasm-bindgen.version)" --locked

      - name: Cargo wasm32 build
        if: steps.wasm.outputs.required == 'true'
        run: cargo build -p chio-kernel-browser --target wasm32-unknown-unknown --release

      - name: Read package metadata
        id: meta
        shell: bash
        env:
          PACKAGE_DIR: ${{ matrix.package }}
        run: |
          set -euo pipefail
          name=$(node -e "process.stdout.write(require('./${PACKAGE_DIR}/package.json').name)")
          version=$(node -e "process.stdout.write(require('./${PACKAGE_DIR}/package.json').version)")
          slug=$(basename "$PACKAGE_DIR")
          {
            echo "name=$name"
            echo "version=$version"
            echo "slug=$slug"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved $name@$version"

      - name: Validate tag version matches package.json
        if: github.event_name == 'push'
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          EXPECTED: ${{ steps.meta.outputs.version }}
          SLUG: ${{ steps.meta.outputs.slug }}
        run: |
          set -euo pipefail
          semver_re='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?'
          # Non-greedy leading strip so pre-release tags whose suffix
          # contains `v` (e.g. ts/v1.2.3-preview.1) are extracted
          # correctly. release-pypi.yml handles the same case.
          if [[ "$REF_NAME" =~ ^ts/v(${semver_re})$ ]]; then
            tag_version="${BASH_REMATCH[1]}"
          elif [[ "$REF_NAME" =~ ^ts/$SLUG-v(${semver_re})$ ]]; then
            # Anchor against the known package slug instead of a greedy
            # `.+-v`. Without this anchor, a valid semver prerelease
            # containing `-v` (e.g. `ts/ai-sdk-v1.2.3-preview-v1`)
            # would let the greedy match consume through the prerelease
            # suffix and capture `1` instead of `1.2.3-preview-v1`.
            tag_version="${BASH_REMATCH[1]}"
          else
            echo "Tag $REF_NAME does not match ts/v<semver> or ts/$SLUG-v<semver>" >&2
            exit 1
          fi
          if [[ "$REF_NAME" == ts/v* ]] && [[ "$tag_version" != "$EXPECTED" ]]; then
            echo "Meta tag $REF_NAME pins version $tag_version but $SLUG is at $EXPECTED" >&2
            exit 1
          fi
          if [[ "$REF_NAME" == ts/$SLUG-v* ]] && [[ "$tag_version" != "$EXPECTED" ]]; then
            echo "Slug tag $REF_NAME pins version $tag_version but $SLUG is at $EXPECTED" >&2
            exit 1
          fi

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        shell: bash
        run: |
          set -euo pipefail
          same_release_marker="$(mktemp)"
          trap 'rm -f "$same_release_marker"' EXIT
          SAME_RELEASE_MARKER="$same_release_marker" node <<'NODE'
            const fs = require("fs");
            const path = require("path");

            const repoRoot = process.env.GITHUB_WORKSPACE ?? path.resolve("../../..");
            const workspaceRoot = path.join(repoRoot, "sdks/typescript");
            const packageDir = process.cwd();
            const pkgPath = path.join(packageDir, "package.json");
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            const localByName = new Map();

            for (const dir of [path.join(workspaceRoot, "chio-ts")]) {
              const manifestPath = path.join(dir, "package.json");
              const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
              localByName.set(manifest.name, dir);
            }
            for (const entry of fs.readdirSync(path.join(workspaceRoot, "packages"))) {
              const dir = path.join(workspaceRoot, "packages", entry);
              const manifestPath = path.join(dir, "package.json");
              if (!fs.existsSync(manifestPath)) continue;
              const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
              localByName.set(manifest.name, dir);
            }

            let mutated = false;
            for (const block of ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"]) {
              const deps = pkg[block] ?? {};
              for (const [name, spec] of Object.entries(deps)) {
                if (typeof spec !== "string" || spec.startsWith("file:")) continue;
                if (!name.startsWith("@chio-protocol/")) continue;
                const localDir = localByName.get(name);
                if (!localDir || path.resolve(localDir) === path.resolve(packageDir)) continue;
                const rel = path.relative(packageDir, localDir).replaceAll(path.sep, "/");
                deps[name] = `file:${rel}`;
                mutated = true;
                console.log(`using local same-release ${block}.${name}: ${spec} -> file:${rel}`);
              }
            }

            if (mutated) {
              fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
              fs.writeFileSync(process.env.SAME_RELEASE_MARKER, "1");
            }
          NODE
          mapfile -t local_file_deps < <(
            node -e '
              const fs = require("fs");
              const path = require("path");
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
              const seen = new Set();
              for (const block of ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"]) {
                const deps = pkg[block] ?? {};
                for (const spec of Object.values(deps)) {
                  if (typeof spec !== "string" || !spec.startsWith("file:")) continue;
                  const dir = path.resolve(spec.slice("file:".length));
                  if (seen.has(dir)) continue;
                  seen.add(dir);
                  console.log(dir);
                }
              }
            '
          )
          for dep_dir in "${local_file_deps[@]}"; do
            [[ -n "$dep_dir" ]] || continue
            echo "Bootstrapping local file dependency $dep_dir"
            pushd "$dep_dir" >/dev/null
            if [[ -f package-lock.json ]]; then
              npm ci --workspaces=false
            else
              npm install --workspaces=false
            fi
            if node -e 'const pkg = require("./package.json"); process.exit(pkg.scripts?.build ? 0 : 1)'; then
              npm run build
            fi
            popd >/dev/null
          done
          if [[ -f package-lock.json && ! -s "$same_release_marker" ]]; then
            npm ci --workspaces=false
          else
            npm install --workspaces=false
          fi

      - name: Build
        working-directory: ${{ matrix.package }}
        env:
          CHIO_REQUIRE_WASM_TOOLCHAIN: "1"
        run: npm run build

      - name: Lint
        working-directory: ${{ matrix.package }}
        run: |
          set -euo pipefail
          if node -e 'const pkg = require("./package.json"); process.exit(pkg.scripts?.lint ? 0 : 1)'; then
            npm run lint
          else
            echo "package has no lint script; skipping"
          fi

      - name: Test
        working-directory: ${{ matrix.package }}
        run: |
          set -euo pipefail
          if node -e 'const pkg = require("./package.json"); process.exit(pkg.scripts?.test ? 0 : 1)'; then
            npm test
          else
            echo "package has no test script; skipping"
          fi

      - name: Rewrite `file:` workspace deps to semver for publish
        working-directory: ${{ matrix.package }}
        shell: bash
        run: |
          set -euo pipefail
          # npm consumers cannot resolve `file:../<sibling>` paths from a
          # published tarball, so every `file:../<pkg>` dep is rewritten
          # to `^<pkg.version>` before `npm pack`. The rewrite is
          # in-place on the working copy for this matrix leg only.
          # The single-quoted heredoc below is a JS program with template
          # literals (`${name}`); the `${...}` are JS, not bash, so the
          # SC2016 "expressions don't expand in single quotes" diagnostic
          # is a false positive here.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("fs");
            const path = require("path");
            const pkgPath = path.resolve("./package.json");
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            let mutated = false;
            for (const block of ["dependencies", "devDependencies", "peerDependencies", "optionalDependencies"]) {
              const deps = pkg[block];
              if (!deps) continue;
              for (const [name, spec] of Object.entries(deps)) {
                if (typeof spec !== "string" || !spec.startsWith("file:")) continue;
                const rel = spec.slice("file:".length);
                const sibling = path.resolve(path.dirname(pkgPath), rel, "package.json");
                if (!fs.existsSync(sibling)) {
                  throw new Error(`Cannot resolve file: dep ${name} -> ${sibling}`);
                }
                const ver = JSON.parse(fs.readFileSync(sibling, "utf8")).version;
                deps[name] = `^${ver}`;
                mutated = true;
                console.log(`rewrote ${block}.${name}: ${spec} -> ^${ver}`);
              }
            }
            if (mutated) fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
            else console.log("no file: deps to rewrite");
          '

      - name: npm pack (produce tarball artifact)
        id: pack
        working-directory: ${{ matrix.package }}
        shell: bash
        run: |
          set -euo pipefail
          tarball=$(npm pack --silent)
          mkdir -p "${GITHUB_WORKSPACE}/npm-dist"
          mv "$tarball" "${GITHUB_WORKSPACE}/npm-dist/"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"

      - name: Smoke install packed tarball
        shell: bash
        env:
          PACKAGE_DIR: ${{ matrix.package }}
          PACKAGE_NAME: ${{ steps.meta.outputs.name }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          tarball="${GITHUB_WORKSPACE}/npm-dist/${TARBALL}"
          if [[ ! -f "$tarball" ]]; then
            echo "::error::expected npm tarball $tarball not found" >&2
            exit 1
          fi

          local_dep_pack_dir="${GITHUB_WORKSPACE}/npm-dist/local-deps"
          mkdir -p "$local_dep_pack_dir"
          mapfile -t local_dep_dirs < <(
            node <<'NODE'
            const fs = require("fs");
            const path = require("path");

            const repoRoot = process.env.GITHUB_WORKSPACE;
            const packageDir = path.join(repoRoot, process.env.PACKAGE_DIR);
            const workspaceRoot = path.join(repoRoot, "sdks/typescript");
            const packageJson = JSON.parse(fs.readFileSync(path.join(packageDir, "package.json"), "utf8"));
            const localByName = new Map();

            for (const dir of [path.join(workspaceRoot, "chio-ts")]) {
              const manifestPath = path.join(dir, "package.json");
              const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
              localByName.set(manifest.name, dir);
            }
            for (const entry of fs.readdirSync(path.join(workspaceRoot, "packages"))) {
              const dir = path.join(workspaceRoot, "packages", entry);
              const manifestPath = path.join(dir, "package.json");
              if (!fs.existsSync(manifestPath)) continue;
              const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
              localByName.set(manifest.name, dir);
            }

            const seen = new Set();
            for (const block of ["dependencies", "optionalDependencies", "peerDependencies"]) {
              for (const name of Object.keys(packageJson[block] ?? {})) {
                const dir = localByName.get(name);
                if (!dir || path.resolve(dir) === path.resolve(packageDir) || seen.has(dir)) continue;
                seen.add(dir);
                console.log(dir);
              }
            }
          NODE
          )

          install_args=()
          for dep_dir in "${local_dep_dirs[@]}"; do
            [[ -n "$dep_dir" ]] || continue
            dep_tarball="$(
              cd "$dep_dir" &&
                npm pack --pack-destination "$local_dep_pack_dir" --silent
            )"
            install_args+=("$local_dep_pack_dir/$dep_tarball")
          done
          install_args+=("$tarball")

          consumer_dir="$(mktemp -d)"
          cat > "${consumer_dir}/package.json" <<'EOF'
          {
            "name": "chio-npm-packed-consumer-smoke",
            "private": true,
            "type": "module"
          }
          EOF
          (
            cd "$consumer_dir"
            npm install --ignore-scripts --no-fund --no-audit "${install_args[@]}"
            CHIO_PACKAGE_NAME="$PACKAGE_NAME" node --experimental-wasm-modules --input-type=module <<'NODE'
            import { execFileSync } from "node:child_process";
            import { createRequire } from "node:module";
            import fs from "node:fs";
            import path from "node:path";

            const packageName = process.env.CHIO_PACKAGE_NAME;
            if (packageName == null || packageName === "") {
              throw new Error("CHIO_PACKAGE_NAME is required");
            }

            const packageRoot = path.join(process.cwd(), "node_modules", ...packageName.split("/"));
            const manifest = JSON.parse(fs.readFileSync(path.join(packageRoot, "package.json"), "utf8"));
            const rootExport = typeof manifest.exports === "object" ? manifest.exports["."] : manifest.exports;
            const hasImport =
              typeof rootExport === "string" ||
              (rootExport != null && typeof rootExport === "object" && typeof rootExport.import === "string") ||
              typeof manifest.module === "string";
            const hasRequire =
              rootExport != null &&
              typeof rootExport === "object" &&
              typeof rootExport.require === "string";

            if (hasImport && packageName !== "@chio-protocol/workers") {
              const moduleNamespace = await import(packageName);
              const exportNames = Object.keys(moduleNamespace);
              if (exportNames.length === 0 && !("default" in moduleNamespace)) {
                throw new Error(`expected at least one ESM export from ${packageName}`);
              }
              console.log(`ESM import smoke verified ${packageName}`);
            }

            if (hasRequire) {
              const require = createRequire(import.meta.url);
              const moduleNamespace = require(packageName);
              const exportNames = Object.keys(moduleNamespace);
              if (exportNames.length === 0 && !("default" in moduleNamespace)) {
                throw new Error(`expected at least one CommonJS export from ${packageName}`);
              }
              console.log(`CommonJS require smoke verified ${packageName}`);
            }

            const binEntries =
              typeof manifest.bin === "string"
                ? [[packageName, manifest.bin]]
                : Object.entries(manifest.bin ?? {});
            for (const [binName] of binEntries) {
              const binPath = path.join(process.cwd(), "node_modules", ".bin", binName);
              const output = execFileSync(binPath, ["--help"], {
                encoding: "utf8",
                timeout: 30_000,
              });
              if (output.trim() === "") {
                throw new Error(`CLI ${binName} produced empty --help output`);
              }
              console.log(`CLI smoke verified ${binName}`);
            }
          NODE
            if [[ "$PACKAGE_NAME" == "@chio-protocol/workers" ]]; then
              node --input-type=module <<'NODE'
              import { existsSync } from "node:fs";
              import path from "node:path";

              const packageRoot = path.join(
                process.cwd(),
                "node_modules",
                "@chio-protocol",
                "workers",
              );
              const expectedFiles = [
                "dist/index.js",
                "dist/bundler/chio_kernel_browser_bg.js",
                "dist/bundler/chio_kernel_browser_bg.wasm",
              ];

              for (const relativePath of expectedFiles) {
                const candidate = path.join(packageRoot, relativePath);
                if (!existsSync(candidate)) {
                  throw new Error(`missing packed Workers artifact: ${relativePath}`);
                }
              }

              console.log("Workers package artifact smoke verified @chio-protocol/workers");
          NODE
              (
                cd "${GITHUB_WORKSPACE}/${PACKAGE_DIR}"
                CHIO_WORKERS_PACKAGE_JSON="${consumer_dir}/node_modules/@chio-protocol/workers/package.json" node --input-type=module <<'NODE'
                import { Miniflare } from "miniflare";
                import path from "node:path";

                const packageJsonPath = process.env.CHIO_WORKERS_PACKAGE_JSON;
                if (packageJsonPath == null || packageJsonPath === "") {
                  throw new Error("CHIO_WORKERS_PACKAGE_JSON is required");
                }

                const packageRoot = path.dirname(packageJsonPath);
                process.chdir(packageRoot);
                const mf = new Miniflare({
                  modules: true,
                  scriptPath: "dist/index.js",
                  compatibilityDate: "2026-04-27",
                  modulesRules: [
                    { type: "ESModule", include: ["**/*.js"], fallthrough: true },
                    { type: "CompiledWasm", include: ["**/*.wasm"], fallthrough: true },
                  ],
                });
                try {
                  const res = await mf.dispatchFetch("https://workers.test/__chio_workers_smoke");
                  const body = await res.json();
                  if (
                    !res.ok ||
                    body.package !== "@chio-protocol/workers" ||
                    body.wasmTarget !== "bundler" ||
                    body.verifyReceipt !== true
                  ) {
                    throw new Error(`Miniflare smoke failed: ${JSON.stringify(body)}`);
                  }
                  console.log("Workers Miniflare smoke verified @chio-protocol/workers");
                } finally {
                  await mf.dispose();
                }
          NODE
              )
            fi
          )

      - name: Install cosign
        # Pinned to a tagged release of sigstore/cosign-installer so the
        # signing-side toolchain version is auditable. The Renovate config
        # in .github/renovate.json tracks upstream
        # cosign-installer releases for review.
        uses: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409
        with:
          cosign-release: "v2.4.1"

      - name: Sign npm tarball with cosign keyless
        # Produces a detached `.sig` and Fulcio leaf cert `.pem` for
        # the npm tarball. npm provenance (--provenance) and cosign keyless
        # are complementary; cosign is verified client-side via the recipe
        # in docs/install/VERIFY.md.
        shell: bash
        env:
          COSIGN_YES: "true"
          COSIGN_EXPERIMENTAL: "1"
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/npm-dist"
          if [[ ! -f "${TARBALL}" ]]; then
            echo "::error::expected npm tarball ${TARBALL} not found in npm-dist" >&2
            ls -la
            exit 1
          fi
          echo "Signing ${TARBALL}"
          cosign sign-blob --yes \
            --output-signature "${TARBALL}.sig" \
            --output-certificate "${TARBALL}.pem" \
            "${TARBALL}"
          # Sanity-check both sidecars exist and are non-empty so a silent
          # cosign success that produced no files fails the job.
          for ext in sig pem; do
            if [[ ! -s "${TARBALL}.${ext}" ]]; then
              echo "::error::cosign produced empty ${TARBALL}.${ext}" >&2
              exit 1
            fi
          done
          ls -la

      - name: Upload tarball artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-dist-${{ steps.meta.outputs.slug }}
          # Include .sig + .pem so the release-attest job can attach
          # them to the GitHub Release alongside each tarball.
          path: |
            npm-dist/*.tgz
            npm-dist/*.sig
            npm-dist/*.pem
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.package }}
    needs: [plan, build]
    if: needs.plan.outputs.dry_run != 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Serialize to keep provenance attestations ordered and avoid
      # registry races when workspaces depend on each other.
      max-parallel: 1
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    environment:
      name: npm
      # Deliberately no `url:` -- `environment` is evaluated at job
      # creation time, before any step has run, so
      # `steps.meta.outputs.name` resolves to an empty string and
      # produces a broken `https://www.npmjs.com/package/` link.
      # Wiring the package name through the `plan` matrix would require
      # restructuring the matrix to emit `{dir, name}` objects; the
      # operator can navigate to the published package from the step
      # output ("Publish to npm") without a preview URL in GitHub's
      # Environments panel.
    permissions:
      # Required for npm provenance attestations via GitHub OIDC.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Pin trusted publishing toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@^11.5.1
          node - <<'NODE'
          const [major, minor] = process.versions.node.split(".").map(Number);
          if (major < 22 || (major === 22 && minor < 14)) {
            throw new Error(
              `node trusted publishing runtime must be >= 22.14.0; got ${process.versions.node}`,
            );
          }
          NODE
          npm_version="$(npm --version)"
          node - "$npm_version" <<'NODE'
          const version = process.argv[2];
          const [major, minor, patch] = version.split(".").map(Number);
          if (
            major < 11 ||
            (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))
          ) {
            throw new Error(`npm trusted publishing CLI must be >= 11.5.1; got ${version}`);
          }
          NODE

      - name: Read package metadata
        id: meta
        shell: bash
        env:
          PACKAGE_DIR: ${{ matrix.package }}
        run: |
          set -euo pipefail
          name=$(node -e "process.stdout.write(require('./${PACKAGE_DIR}/package.json').name)")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "slug=$(basename "$PACKAGE_DIR")" >> "$GITHUB_OUTPUT"

      - name: Download tarball artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-dist-${{ steps.meta.outputs.slug }}
          path: npm-dist

      - name: Publish to npm
        shell: bash
        env:
          # $NODE_AUTH_TOKEN is normally supplied by setup-node. For OIDC
          # Trusted Publishing we rely on the `id-token: write` permission
          # above and npm's --provenance flag; the npm CLI (>= 11.5.1) will
          # use the workflow's OIDC token when no legacy token is present.
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          tarball=$(find npm-dist -maxdepth 1 -name '*.tgz' -print -quit)
          echo "Publishing $tarball"
          # `--access public` is required for scoped packages (@chio-protocol/*)
          # to be accessible without auth. Only the .tgz is uploaded; the
          # cosign `.sig`/`.pem` sidecars in the same directory ride to
          # the GitHub Release via the release-attest job, not to npm.
          npm publish "$tarball" --access public --provenance

  release-attest:
    name: Attach cosign signatures to GitHub Release
    # Attaches `.sig` + `.pem` for every npm tarball to the GitHub Release.
    # Verification recipe: docs/install/VERIFY.md.
    # Gates on `publish` so signed artifacts only attach after the
    # npm-environment-protected publish job has actually succeeded.
    needs: [plan, build, publish]
    # Skip on workflow_dispatch dry runs; only attach on real tag pushes.
    if: needs.plan.outputs.dry_run != 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Download all tarball artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
          pattern: npm-dist-*
          merge-multiple: true

      - name: Stage release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          # Copy tarballs and their cosign sidecars. The tarball itself
          # is also attached so consumers can fetch the exact byte-for-byte
          # artifact registry-side copies of npm differ across mirrors;
          # `cosign verify-blob` requires the original file alongside its
          # `.sig` + `.pem`.
          find artifacts -maxdepth 2 -type f \
            \( -name '*.tgz' -o -name '*.sig' -o -name '*.pem' \) \
            -exec cp {} release/ \;
          (cd release && ls -la)

      - name: Attach signatures to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ github.ref_name }}
          # release-npm.yml fires from either a meta tag (ts/v0.2.0) or
          # a slug-specific tag (ts/express-v1.2.0); the GitHub Release
          # for that tag may not exist yet, so let action-gh-release
          # create it on first run. Subsequent re-runs append rather
          # than fail the upload.
          fail_on_unmatched_files: true
          files: |
            release/*.tgz
            release/*.sig
            release/*.pem
