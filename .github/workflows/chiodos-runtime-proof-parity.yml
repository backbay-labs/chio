name: Legacy Chiodos Runtime Proof Parity

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-chiodos-runtime-proof-parity-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  legacy-runtime-proof-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/check-chio-runtime-proof-parity.sh
