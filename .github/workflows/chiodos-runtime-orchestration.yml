name: Legacy Chiodos Runtime Orchestration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-chiodos-runtime-orchestration-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  runtime-orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Chio runtime orchestration gate
        run: bash scripts/check-chio-runtime-orchestration.sh
