name: Chiodos Pheromone Relay

on:
  pull_request:
    paths:
      - "crates/chio-pheromone-relay/**"
      - "crates/chio-pheromone-runtime/**"
      - "crates/chio-pheromone/**"
      - "crates/chio-federation/**"
      - "crates/chio-cli/**"
      - "examples/chiodos-3vendor/**"
      - "spec/CHIODOS_PHEROMONE.md"
      - "spec/schemas/chio-pheromone/**"
      - "spec/schemas/registry.json"
      - "scripts/check-chiodos-pheromone-relay.sh"
      - ".github/workflows/chiodos-pheromone-relay.yml"
  push:
    branches: [main]
    paths:
      - "crates/chio-pheromone-relay/**"
      - "crates/chio-pheromone-runtime/**"
      - "crates/chio-pheromone/**"
      - "crates/chio-federation/**"
      - "crates/chio-cli/**"
      - "examples/chiodos-3vendor/**"
      - "spec/CHIODOS_PHEROMONE.md"
      - "spec/schemas/chio-pheromone/**"
      - "spec/schemas/registry.json"
      - "scripts/check-chiodos-pheromone-relay.sh"
      - ".github/workflows/chiodos-pheromone-relay.yml"

jobs:
  chiodos-pheromone-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Chiodos pheromone relay
        run: bash scripts/check-chiodos-pheromone-relay.sh
