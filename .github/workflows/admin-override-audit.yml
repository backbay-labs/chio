name: admin-override-audit

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  checks: read
  contents: read
  pull-requests: write

jobs:
  audit:
    name: admin-override-audit
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
    steps:
      # gh CLI calls below (gh api, gh pr comment) require a repository
      # working directory to resolve the target repo. Without this checkout
      # the very first step fails with "fatal: not a git repository".
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1

      - name: Audit required checks at merge commit
        shell: bash
        run: |
          set -euo pipefail

          required_checks=(
            "Build, lint, test"
            "MSRV build and test"
            "cargo-vet (locked supply-chain audit)"
            "cargo-deny (supply-chain bans/advisories/licenses)"
          )

          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${MERGE_SHA}/check-runs" \
            --paginate \
            --jq '.check_runs[] | [.name, .status, (.conclusion // "pending"), .html_url] | @tsv' \
            > check-runs.tsv

          {
            echo "## Admin override audit"
            echo
            echo "Merge commit: \`${MERGE_SHA}\`"
            echo
            echo "| Required check | Status | Conclusion | Run |"
            echo "|----------------|--------|------------|-----|"
          } > audit.md

          red=0
          for check in "${required_checks[@]}"; do
            line="$(awk -F '\t' -v want="${check}" '$1 == want {print; found=1; exit} END {if (!found) exit 1}' check-runs.tsv || true)"
            if [[ -z "${line}" ]]; then
              status="missing"
              conclusion="missing"
              url=""
              red=1
            else
              IFS=$'\t' read -r _name status conclusion url <<< "${line}"
              case "${status}:${conclusion}" in
                completed:success|completed:neutral|completed:skipped)
                  ;;
                *)
                  red=1
                  ;;
              esac
            fi

            if [[ -n "${url}" ]]; then
              run_cell="[run](${url})"
            else
              run_cell="n/a"
            fi
            printf '| %s | %s | %s | %s |\n' "${check}" "${status}" "${conclusion}" "${run_cell}" >> audit.md
          done

          cat audit.md >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${red}" == "1" && -n "${PR_NUMBER}" ]]; then
            {
              echo "Admin override audit detected a missing or non-success required check on merge commit \`${MERGE_SHA}\`."
              echo
              cat audit.md
            } > comment.md
            gh pr comment "${PR_NUMBER}" --body-file comment.md
          fi
