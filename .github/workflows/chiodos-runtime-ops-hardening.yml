name: Legacy Chiodos Runtime Ops Hardening

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-chiodos-runtime-ops-hardening-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  runtime-ops-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Chio runtime ops gate
        run: bash scripts/check-chio-runtime-ops-hardening.sh
