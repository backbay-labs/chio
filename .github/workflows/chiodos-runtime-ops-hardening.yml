name: Chiodos Runtime Ops Hardening

on:
  push:
    branches: [main]
    paths:
      - "crates/chio-chiodos-runtime/**"
      - "crates/chio-cli/**"
      - "crates/chio-kernel/**"
      - "examples/chiodos-3vendor/**"
      - "spec/schemas/chiodos/**"
      - "spec/schemas/registry.json"
      - "spec/schemas/MANIFEST.sha256"
      - "scripts/check-chiodos-runtime-ops-hardening.sh"
      - ".github/workflows/chiodos-runtime-ops-hardening.yml"
  pull_request:
    paths:
      - "crates/chio-chiodos-runtime/**"
      - "crates/chio-cli/**"
      - "crates/chio-kernel/**"
      - "examples/chiodos-3vendor/**"
      - "spec/schemas/chiodos/**"
      - "spec/schemas/registry.json"
      - "spec/schemas/MANIFEST.sha256"
      - "scripts/check-chiodos-runtime-ops-hardening.sh"
      - ".github/workflows/chiodos-runtime-ops-hardening.yml"

permissions:
  contents: read

concurrency:
  group: chiodos-runtime-ops-hardening-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  runtime-ops-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Chiodos runtime ops gate
        run: bash scripts/check-chiodos-runtime-ops-hardening.sh
