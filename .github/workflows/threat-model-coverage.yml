# threat-model-coverage.yml - M05.P5.T4 CI gate.
#
# Fails the build if any threat ID in
# spec/security/chio-threat-model.v1.json lacks a populated test
# body (the codegen stub at crates/chio-conformance/tests/threats/<id>.rs
# still calls `unimplemented!()`) and is not explicitly marked
# `coverage_state: pending` or `coverage_state: partial` in the
# threat-model JSON.
#
# Pending vectors auto-promoted by the M05.P2 fuzz-seed promoter
# (D14) live in the corpus, not the threat list, and are excluded
# from this gate by construction.
#
# Required status check name: threat-model-coverage / coverage-gate

name: threat-model-coverage

on:
  pull_request:
    paths:
      - "spec/security/chio-threat-model.v1.json"
      - "spec/security/chio-threat-model.schema.json"
      - "crates/chio-conformance/tests/threats/**"
      - "crates/chio-spec-codegen/src/threat_model.rs"
      - "scripts/check-threat-coverage.sh"
      - "scripts/tests/check-threat-coverage.test.sh"
      - ".github/workflows/threat-model-coverage.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: threat-model-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-gate:
    name: coverage-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (json parser)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Run threat-model coverage gate
        run: bash scripts/check-threat-coverage.sh

      - name: Self-test the coverage gate (state matrix)
        run: bash scripts/tests/check-threat-coverage.test.sh

      - name: Cargo test - threat_model_schema_test
        run: cargo test -p chio-spec-codegen --test threat_model_schema_test

      - name: Cargo test - threat-model integration test
        run: cargo test -p chio-conformance --test threats
