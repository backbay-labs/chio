name: Chio Runtime Spine

on:
  pull_request:
    paths:
      - "crates/chio-attest-buyer/**"
      - "crates/chio-attest-buyer-core/**"
      - "crates/chio-runtime-core/**"
      - "crates/chio-runtime-harness/**"
      - "crates/chio-attest-loopback/**"
      - "crates/chio-cli/**"
      - "crates/chio-federation/**"
      - "crates/chio-kernel/**"
      - "crates/chio-runtime/**"
      - "examples/chio-3vendor/**"
      - "scripts/check-chio-runtime-spine.sh"
      - "scripts/check-chio-runtime-spine-fixtures.sh"
      - "scripts/check-chio-treaty-buyer-hero-loop.sh"
      - "spec/schemas/chio-attest/**"
      - "spec/schemas/chio-federation/**"
      - "spec/schemas/chio-runtime/**"
      - "spec/schemas/registry.json"
      - "spec/schemas/MANIFEST.sha256"
      - ".github/workflows/chio-runtime-spine.yml"
  push:
    branches: ["main"]
    paths:
      - "crates/chio-attest-buyer/**"
      - "crates/chio-attest-buyer-core/**"
      - "crates/chio-runtime-core/**"
      - "crates/chio-runtime-harness/**"
      - "crates/chio-attest-loopback/**"
      - "crates/chio-cli/**"
      - "crates/chio-federation/**"
      - "crates/chio-kernel/**"
      - "crates/chio-runtime/**"
      - "examples/chio-3vendor/**"
      - "scripts/check-chio-runtime-spine.sh"
      - "scripts/check-chio-runtime-spine-fixtures.sh"
      - "scripts/check-chio-treaty-buyer-hero-loop.sh"
      - "spec/schemas/chio-attest/**"
      - "spec/schemas/chio-federation/**"
      - "spec/schemas/chio-runtime/**"
      - "spec/schemas/registry.json"
      - "spec/schemas/MANIFEST.sha256"
      - ".github/workflows/chio-runtime-spine.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chio-runtime-spine-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  runtime-spine-gate:
    name: runtime-spine-gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Run Chio runtime-spine gate
        run: bash scripts/check-chio-runtime-spine.sh
