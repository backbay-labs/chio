name: Legacy Chiodos Runtime Spine

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-chiodos-runtime-spine-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  legacy-runtime-spine-gate:
    name: legacy-runtime-spine-gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Run Chio runtime-spine gate
        run: bash scripts/check-chio-runtime-spine.sh
