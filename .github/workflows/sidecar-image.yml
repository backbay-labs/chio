name: Sidecar Image

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Ignored for manual smoke builds. Pushes and signing run only on push events."
        required: false
        type: string

concurrency:
  group: sidecar-image-${{ github.ref }}
  cancel-in-progress: false

# Workflow-level principle-of-least-privilege default. Consistent with
# release-binaries.yml and release-pypi.yml. Native build jobs add
# `packages: write` for digest pushes. The assembly job also adds
# `id-token: write` for OIDC attestation.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build sidecar image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          semver_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if [[ ! "${tag}" =~ ${semver_re} ]]; then
            echo "sidecar-image refuses non-semver release tag: ${tag}" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image repository
        id: image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          owner="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "name=${REGISTRY}/${owner}/chio-sidecar" >> "$GITHUB_OUTPUT"

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            # Intentionally do NOT emit `:latest` on tag pushes. An older
            # patch release (e.g. v0.1.1) tagged after a newer one
            # (e.g. v0.2.0) would otherwise overwrite `:latest` back to
            # the older image since we have no version-ordering check.
            # Versioned tags (v0.1.1, 0.1, etc.) still ship via the
            # semver patterns above, so operators can pin to them and
            # `:latest` only tracks the default branch.
          labels: |
            org.opencontainers.image.title=chio-sidecar
            org.opencontainers.image.description=Chio sidecar runtime
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build native-platform smoke image
        if: github.event_name != 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/docker/Dockerfile.sidecar
          platforms: ${{ matrix.platform }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=sidecar-${{ matrix.artifact }}
          cache-to: type=gha,scope=sidecar-${{ matrix.artifact }},mode=max

      - name: Build and push native-platform image by digest
        if: github.event_name == 'push'
        id: build_push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/docker/Dockerfile.sidecar
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=sidecar-${{ matrix.artifact }}
          cache-to: type=gha,scope=sidecar-${{ matrix.artifact }},mode=max

      - name: Export native-platform digest
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          digest="${{ steps.build_push.outputs.digest }}"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::native build emitted an invalid digest: ${digest}" >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/sidecar-digests"
          touch "${RUNNER_TEMP}/sidecar-digests/${digest#sha256:}"

      - name: Upload native-platform digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sidecar-digest-${{ matrix.artifact }}
          path: ${{ runner.temp }}/sidecar-digests/*
          if-no-files-found: error
          retention-days: 1

  assemble-and-sign:
    name: Assemble and sign multi-arch sidecar image
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Normalize image repository
        id: image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          owner="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "name=${REGISTRY}/${owner}/chio-sidecar" >> "$GITHUB_OUTPUT"

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            # Intentionally do NOT emit `:latest` on tag pushes. An older
            # patch release (e.g. v0.1.1) tagged after a newer one
            # (e.g. v0.2.0) would otherwise overwrite `:latest` back to
            # the older image since we have no version-ordering check.
          labels: |
            org.opencontainers.image.title=chio-sidecar
            org.opencontainers.image.description=Chio sidecar runtime
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Download native-platform digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: sidecar-digest-*
          path: ${{ runner.temp }}/sidecar-digests
          merge-multiple: true

      - name: Assemble and verify multi-arch manifest
        id: manifest
        shell: bash
        env:
          DIGEST_DIR: ${{ runner.temp }}/sidecar-digests
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          mapfile -t digest_files < <(find "${DIGEST_DIR}" -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${#digest_files[@]}" -ne 2 ]]; then
            echo "::error::expected two native-platform digests, found ${#digest_files[@]}" >&2
            exit 1
          fi

          sources=()
          for digest in "${digest_files[@]}"; do
            if [[ ! "${digest}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::invalid native-platform digest artifact: ${digest}" >&2
              exit 1
            fi
            sources+=("${IMAGE_NAME}@sha256:${digest}")
          done

          mapfile -t tags < <(jq -r '.tags[]' <<< "${METADATA_JSON}")
          if [[ "${#tags[@]}" -eq 0 ]]; then
            echo "::error::metadata action emitted no image tags" >&2
            exit 1
          fi
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "${tag}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

          manifest_json="$(docker buildx imagetools inspect "${tags[0]}" --raw)"
          mapfile -t platforms < <(
            jq -r '
              .manifests[]?
              | select(.platform.os == "linux")
              | select(.platform.architecture == "amd64" or .platform.architecture == "arm64")
              | "\(.platform.os)/\(.platform.architecture)"
            ' <<< "${manifest_json}" | sort -u
          )
          if [[ "${#platforms[@]}" -ne 2 || "${platforms[0]}" != "linux/amd64" || "${platforms[1]}" != "linux/arm64" ]]; then
            printf '::error::unexpected sidecar platforms: %s\n' "${platforms[*]:-none}" >&2
            exit 1
          fi

          digest="$(
            docker buildx imagetools inspect "${tags[0]}" --format '{{json .Manifest}}' \
              | jq -r '.digest'
          )"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::assembled manifest emitted an invalid digest: ${digest}" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Pushed multi-arch image digest: ${digest}"

      # Sigstore keyless cosign signing of the multi-arch image manifest by
      # digest. Signing the digest covers every tag (semver, sha, latest)
      # because all point at the same content-addressed manifest. The OIDC
      # token from `id-token: write` is exchanged with Fulcio; no long-lived
      # signing key is held in secrets. Verification recipe:
      # docs/install/PUBLISHING.md, section "Sidecar image signing".
      - name: Install cosign
        uses: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409
        with:
          cosign-release: v2.4.1

      - name: Cosign sign image by digest
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          if [ -z "${IMAGE_DIGEST}" ]; then
            echo "::error::manifest assembly did not emit a digest; refusing to sign" >&2
            exit 1
          fi
          ref="${IMAGE_NAME}@${IMAGE_DIGEST}"
          echo "Signing ${ref} (covers every tag pointing at this manifest)"
          cosign sign --yes "${ref}"
