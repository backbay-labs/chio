          test "$(jq -cs 'length' "${bundle_file}")" = 1
          binding="$(jq -cS . "${binding_file}")"
          test "${binding}" = "$(< "${binding_file}")"
          test "$(jq -cS 'keys' <<< "${binding}")" = '["base","builder","caller","ci","head","merge","pull_request_number","repository","schema"]'
          test "$(jq -r '.schema' <<< "${binding}")" = "https://github.com/bb-connor/arc/attestations/ci-merge-binding/v1"
          test "$(jq -r '.repository.name' <<< "${binding}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.repository.owner' <<< "${binding}")" = "${GITHUB_REPOSITORY_OWNER}"
          test "$(jq -r '.repository.visibility' <<< "${binding}")" = public
          test "$(jq -r '.pull_request_number' <<< "${binding}")" = "${PR_NUMBER}"
          test "$(jq -r '.head.repository' <<< "${binding}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.head.ref' <<< "${binding}")" = "${HEAD_REF}"
          test "$(jq -r '.head.sha' <<< "${binding}")" = "${EVIDENCE_SHA}"
          test "$(jq -r '.base.repository' <<< "${binding}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.base.ref' <<< "${binding}")" = "${BASE_REF}"
          test "$(jq -r '.base.sha' <<< "${binding}")" = "${BASE_SHA}"
          test "$(jq -r '.merge.ref' <<< "${binding}")" = "refs/pull/${PR_NUMBER}/merge"
          test "$(jq -r '.merge.sha' <<< "${binding}")" = "${MERGE_COMMIT_SHA}"
          test "$(jq -r '.merge.tree_sha' <<< "${binding}")" = "${MERGE_TREE_SHA}"
          test "$(jq -cS '.merge.parents' <<< "${binding}")" = "[\"${BASE_SHA}\",\"${EVIDENCE_SHA}\"]"
          test "$(jq -r '.ci.workflow_id' <<< "${binding}")" = "${CI_WORKFLOW_ID}"
          test "$(jq -r '.ci.run_id' <<< "${binding}")" = "${CI_RUN_ID}"
          test "$(jq -r '.ci.run_attempt' <<< "${binding}")" = "${CI_RUN_ATTEMPT}"
          test "$(jq -r '.ci.run_name' <<< "${binding}")" = "CI N=${PR_NUMBER} E=${EVIDENCE_SHA} B=${BASE_SHA} M=${MERGE_COMMIT_SHA}"
          test "$(jq -r '.builder.definition_sha' <<< "${binding}")" = "${SECURITY_DEFINITION_SHA}"
          test "$(jq -r '.builder.workflow_path' <<< "${binding}")" = ".github/workflows/enterprise-hardening.yml"
          test "$(jq -r '.caller.definition_sha' <<< "${binding}")" = "${MERGE_COMMIT_SHA}"
          test "$(jq -r '.caller.workflow_path' <<< "${binding}")" = ".github/workflows/ci.yml"
          test "$(jq -r '.caller.workflow_ref' <<< "${binding}")" = "${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/pull/${PR_NUMBER}/merge"
          repository_id="$(jq -r '.repository.id' <<< "${binding}")"
          repository_owner_id="$(jq -r '.repository.owner_id' <<< "${binding}")"
          test "$(jq -r '.head.repository_id' <<< "${binding}")" = "${repository_id}"
          test "$(jq -r '.base.repository_id' <<< "${binding}")" = "${repository_id}"
          [[ "${repository_id}" =~ ^[1-9][0-9]*$ ]]
          [[ "${repository_owner_id}" =~ ^[1-9][0-9]*$ ]]

          gh_archive="${RUNNER_TEMP}/gh_2.96.0_linux_amd64.tar.gz"
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --location \
            --silent \
            --show-error \
            --max-filesize 67108864 \
            --output "${gh_archive}" \
            "https://github.com/cli/cli/releases/download/v2.96.0/gh_2.96.0_linux_amd64.tar.gz"
          test "$(sha256sum "${gh_archive}" | cut -d' ' -f1)" = "83d5c2ccad5498f58bf6368acb1ab32588cf43ab3a4b1c301bf36328b1c8bd60"
          gh_bin="${RUNNER_TEMP}/trusted-gh/gh"
          /usr/bin/python3 - "${gh_archive}" "${gh_bin}" <<'PY'
          import pathlib
          import stat
          import sys
          import tarfile

          archive = pathlib.Path(sys.argv[1])
          output = pathlib.Path(sys.argv[2])
          expected = "gh_2.96.0_linux_amd64/bin/gh"
          with tarfile.open(archive, mode="r:gz") as source:
              members = source.getmembers()
              if not 1 <= len(members) <= 128:
                  raise SystemExit("invalid GitHub CLI archive inventory")
              if sum(member.size for member in members) > 134217728:
                  raise SystemExit("GitHub CLI archive is too large")
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit("unsafe GitHub CLI archive path")
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit("unsafe GitHub CLI archive member")
              member = source.getmember(expected)
              if not member.isfile() or member.size <= 0 or member.size > 134217728:
                  raise SystemExit("invalid GitHub CLI executable")
              stream = source.extractfile(member)
              if stream is None:
                  raise SystemExit("missing GitHub CLI executable")
              data = stream.read()
              if len(data) != member.size:
                  raise SystemExit("truncated GitHub CLI executable")
              output.parent.mkdir(mode=0o700)
              output.write_bytes(data)
              output.chmod(0o500)
          PY
          gh_version_output="$("${gh_bin}" version)"
          test "$(sed -n '1s/^gh version \([^ ]*\) .*/\1/p' <<< "${gh_version_output}")" = 2.96.0
          verification_json="${RUNNER_TEMP}/ci-merge-binding-verification.json"
          "${gh_bin}" attestation verify "${binding_file}" \
            --bundle "${bundle_file}" \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type "https://github.com/bb-connor/arc/attestations/ci-merge-binding/v1" \
            --signer-workflow "bb-connor/arc/.github/workflows/enterprise-hardening.yml" \
            --signer-digest "${SECURITY_DEFINITION_SHA}" \
            --source-digest "${MERGE_COMMIT_SHA}" \
            --source-ref "refs/pull/${PR_NUMBER}/merge" \
            --deny-self-hosted-runners \
            --format json > "${verification_json}"
          test "$(stat --format='%s' "${verification_json}")" -gt 0
          test "$(stat --format='%s' "${verification_json}")" -le 16777216
          test "$(jq -r 'length' "${verification_json}")" = 1
          statement="$(jq -cS '.[0].verificationResult.statement' "${verification_json}")"
          certificate="$(jq -cS '.[0].verificationResult.signature.certificate' "${verification_json}")"
          test "$(jq -r '.predicateType' <<< "${statement}")" = "https://github.com/bb-connor/arc/attestations/ci-merge-binding/v1"
          test "$(jq -r '.subject | length' <<< "${statement}")" = 1
          test "$(jq -r '.subject[0].name' <<< "${statement}")" = ci-merge-binding.json
          test "$(jq -r '.subject[0].digest.sha256' <<< "${statement}")" = "${binding_sha256}"
          test "$(jq -cS '.predicate' <<< "${statement}")" = "${binding}"
          test "$(jq -r '.issuer' <<< "${certificate}")" = "https://token.actions.githubusercontent.com"
          signer_uri="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/enterprise-hardening.yml@${SECURITY_DEFINITION_SHA}"
          caller_uri="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/pull/${PR_NUMBER}/merge"
          test "$(jq -r '.subjectAlternativeName' <<< "${certificate}")" = "${signer_uri}"
          test "$(jq -r '.buildSignerURI' <<< "${certificate}")" = "${signer_uri}"
          test "$(jq -r '.buildSignerDigest' <<< "${certificate}")" = "${SECURITY_DEFINITION_SHA}"
          test "$(jq -r '.runnerEnvironment' <<< "${certificate}")" = github-hosted
          test "$(jq -r '.sourceRepositoryURI' <<< "${certificate}")" = "https://github.com/${GITHUB_REPOSITORY}"
          test "$(jq -r '.sourceRepositoryDigest' <<< "${certificate}")" = "${MERGE_COMMIT_SHA}"
          test "$(jq -r '.sourceRepositoryRef' <<< "${certificate}")" = "refs/pull/${PR_NUMBER}/merge"
          test "$(jq -r '.sourceRepositoryIdentifier' <<< "${certificate}")" = "${repository_id}"
          test "$(jq -r '.sourceRepositoryOwnerURI' <<< "${certificate}")" = "https://github.com/${GITHUB_REPOSITORY_OWNER}"
          test "$(jq -r '.sourceRepositoryOwnerIdentifier' <<< "${certificate}")" = "${repository_owner_id}"
          test "$(jq -r '.buildConfigURI' <<< "${certificate}")" = "${caller_uri}"
          test "$(jq -r '.buildConfigDigest' <<< "${certificate}")" = "${MERGE_COMMIT_SHA}"
          test "$(jq -r '.buildTrigger' <<< "${certificate}")" = pull_request
          test "$(jq -r '.runInvocationURI' <<< "${certificate}")" = "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}/attempts/${CI_RUN_ATTEMPT}"
          test "$(jq -r '.sourceRepositoryVisibilityAtSigning' <<< "${certificate}")" = public
          test "$(jq -r '.githubWorkflowTrigger' <<< "${certificate}")" = pull_request
          test "$(jq -r '.githubWorkflowSHA' <<< "${certificate}")" = "${MERGE_COMMIT_SHA}"
          test "$(jq -r '.githubWorkflowName' <<< "${certificate}")" = CI
          test "$(jq -r '.githubWorkflowRepository' <<< "${certificate}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.githubWorkflowRef' <<< "${certificate}")" = "refs/pull/${PR_NUMBER}/merge"
          [[ "$(jq -r '.certificateIssuer' <<< "${certificate}")" =~ ^[[:print:]]{1,512}$ ]]
          timestamps="$(jq -c '.[0].verificationResult.verifiedTimestamps' "${verification_json}")"
          test "$(jq -r 'length >= 1 and length <= 8' <<< "${timestamps}")" = true
          test "$(jq -r 'all(.[]; (.type == "Tlog" or .type == "TimestampAuthority") and (.uri | type == "string" and length >= 1 and length <= 2048) and (.timestamp | type == "string" and length >= 20 and length <= 64))' <<< "${timestamps}")" = true
          while read -r timestamp; do
            timestamp_epoch="$(date --date="${timestamp}" +%s)"
            test "${timestamp_epoch}" -ge "$((created_epoch - 300))"
            test "${timestamp_epoch}" -le "$((now_epoch + 300))"
          done < <(jq -r '.[].timestamp' <<< "${timestamps}")
          stable_pr="$({
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"
          })"
          test "$(jq -r '.state' <<< "${stable_pr}")" = open
          test "$(jq -r '.head.repo.full_name' <<< "${stable_pr}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.head.sha' <<< "${stable_pr}")" = "${EVIDENCE_SHA}"
          test "$(jq -r '.head.ref' <<< "${stable_pr}")" = "${HEAD_REF}"
          test "$(jq -r '.base.repo.full_name' <<< "${stable_pr}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.base.ref' <<< "${stable_pr}")" = "${BASE_REF}"
          test "$(jq -r '.base.sha' <<< "${stable_pr}")" = "${BASE_SHA}"
          stable_merge_ref="$({
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/git/ref/pull/${PR_NUMBER}/merge"
          })"
          test "$(jq -r '.ref' <<< "${stable_merge_ref}")" = "refs/pull/${PR_NUMBER}/merge"
          test "$(jq -r '.object.type' <<< "${stable_merge_ref}")" = commit
          test "$(jq -r '.object.sha' <<< "${stable_merge_ref}")" = "${MERGE_COMMIT_SHA}"
          stable_merge_commit="$({
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/git/commits/${MERGE_COMMIT_SHA}"
          })"
          test "$(jq -cS '[.parents[].sha]' <<< "${stable_merge_commit}")" = "[\"${BASE_SHA}\",\"${EVIDENCE_SHA}\"]"
          test "$(jq -r '.tree.sha' <<< "${stable_merge_commit}")" = "${MERGE_TREE_SHA}"
          {
            echo "attestation_bundle_sha256=${attestation_bundle_sha256}"
            echo "binding_artifact_digest=${archive_sha256}"
            echo "binding_artifact_id=${binding_artifact_id}"
            echo "binding_sha256=${binding_sha256}"
          } >> "${GITHUB_OUTPUT}"

      - name: Seal exact publication binding
        id: seal
        env:
          ATTESTATION_BUNDLE_SHA256: ${{ steps.attestation.outputs.attestation_bundle_sha256 }}
          ARTIFACT_DIGEST: ${{ needs.validate-capture.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ needs.validate-capture.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.validate-capture.outputs.artifact_name }}
          ARTIFACT_SIZE: ${{ needs.validate-capture.outputs.artifact_size }}
          AUTHORIZED_SOURCE_SHA: ${{ steps.bind.outputs.authorized_source_sha }}
          BASE_REF: ${{ needs.validate-capture.outputs.base_ref }}
          BASE_REPOSITORY: ${{ needs.validate-capture.outputs.base_repository }}
          BASE_SHA: ${{ needs.validate-capture.outputs.base_sha }}
          BINDING_ARTIFACT_DIGEST: ${{ steps.attestation.outputs.binding_artifact_digest }}
          BINDING_ARTIFACT_ID: ${{ steps.attestation.outputs.binding_artifact_id }}
          BINDING_SHA256: ${{ steps.attestation.outputs.binding_sha256 }}
          BROKER_BOUNDARY_DIGEST: ${{ needs.validate-capture.outputs.broker_boundary_digest }}
          BUILD_CHECK_RUN_ID: ${{ steps.ci.outputs.build_check_run_id }}
          CAGE_ENFORCEMENT_DIGEST: ${{ needs.validate-capture.outputs.cage_enforcement_digest }}
          CAPTURE_ACTOR: ${{ needs.validate-capture.outputs.capture_actor }}
          CAPTURE_DEFINITION_BLOB: ${{ needs.validate-capture.outputs.capture_definition_blob }}
          CAPTURE_ISSUED_AT_UNIX_MS: ${{ needs.validate-capture.outputs.capture_issued_at_unix_ms }}
          CAPTURE_JOB_ID: ${{ needs.validate-capture.outputs.capture_job_id }}
          CAPTURE_RUN_ATTEMPT: ${{ needs.validate-capture.outputs.capture_run_attempt }}
          CAPTURE_RUN_ID: ${{ needs.validate-capture.outputs.capture_run_id }}
          CAPTURE_WORKFLOW_ID: ${{ needs.validate-capture.outputs.capture_workflow_id }}
          CI_AGGREGATE_CHECK_RUN_ID: ${{ steps.ci.outputs.aggregate_check_run_id }}
          CI_RUN_ATTEMPT: ${{ steps.ci.outputs.ci_run_attempt }}
          CI_RUN_ID: ${{ steps.ci.outputs.ci_run_id }}
          CI_WORKFLOW_ID: ${{ steps.bind.outputs.ci_workflow_id }}
          COMMITTED_ADVERSARIAL_EVIDENCE_DIGEST: ${{ needs.validate-capture.outputs.committed_adversarial_evidence_digest }}
          COMMITTED_BINDING_DIGEST: ${{ steps.strict.outputs.committed_binding_digest }}
          CONFIGURATION_DIGEST: ${{ needs.validate-capture.outputs.configuration_digest }}
          CONTROLLER_ACTOR: ${{ needs.validate-capture.outputs.controller_actor }}
          CONTROLLER_DEFINITION_BLOB: ${{ needs.validate-capture.outputs.controller_definition_blob }}
          CONTROLLER_ISSUED_AT_UNIX_MS: ${{ needs.validate-capture.outputs.controller_issued_at_unix_ms }}
          CONTROLLER_RUN_ATTEMPT: ${{ needs.validate-capture.outputs.controller_run_attempt }}
          CONTROLLER_RUN_ID: ${{ needs.validate-capture.outputs.controller_run_id }}
          CONTROLLER_WORKFLOW_ID: ${{ needs.validate-capture.outputs.controller_workflow_id }}
          DENY_CHECK_RUN_ID: ${{ steps.ci.outputs.deny_check_run_id }}
          EVIDENCE_SHA: ${{ steps.bind.outputs.evidence_sha }}
          INVENTORY_DIGEST: ${{ needs.validate-capture.outputs.inventory_digest }}
          KEY_LOG_TRANSPARENCY_DIGEST: ${{ needs.validate-capture.outputs.key_log_transparency_digest }}
          LABELS_DIGEST: ${{ needs.validate-capture.outputs.labels_digest }}
          LINUX_ADVERSARIAL_CONTROLS_DIGEST: ${{ needs.validate-capture.outputs.linux_adversarial_controls_digest }}
          MERGE_COMMIT_SHA: ${{ needs.validate-capture.outputs.merge_commit_sha }}
          MERGE_TREE_SHA: ${{ needs.validate-capture.outputs.merge_tree_sha }}
          MIGRATION_STATE_STORE_DIGEST: ${{ needs.validate-capture.outputs.migration_state_store_digest }}
          MSRV_CHECK_RUN_ID: ${{ steps.ci.outputs.msrv_check_run_id }}
          PR_NUMBER: ${{ steps.bind.outputs.pr_number }}
          RUNNER_ARCH: ${{ needs.validate-capture.outputs.runner_arch }}
          RUNNER_CONTRACT_DIGEST: ${{ needs.validate-capture.outputs.runner_contract_digest }}
          RUNNER_LABELS_DIGEST: ${{ needs.validate-capture.outputs.runner_labels_digest }}
          RUNNER_NAME: ${{ needs.validate-capture.outputs.runner_name }}
          RUNNER_OS: ${{ needs.validate-capture.outputs.runner_os }}
          SECURITY_DEFINITION_SHA: ${{ steps.bind.outputs.security_definition_sha }}
          SOURCE_REPOSITORY: ${{ steps.bind.outputs.source_repository }}
          VET_CHECK_RUN_ID: ${{ steps.ci.outputs.vet_check_run_id }}
        run: |
          set -euo pipefail
          for commit in \
            "${AUTHORIZED_SOURCE_SHA}" \
            "${BASE_SHA}" \
            "${CAPTURE_DEFINITION_BLOB}" \
            "${CONTROLLER_DEFINITION_BLOB}" \
            "${EVIDENCE_SHA}" \
            "${MERGE_COMMIT_SHA}" \
            "${MERGE_TREE_SHA}" \
