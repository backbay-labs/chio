              --arg authorized_source_sha "${AUTHORIZED_SOURCE_SHA}" \
              --arg base_ref "${BASE_REF}" \
              --arg base_repository "${BASE_REPOSITORY}" \
              --arg base_sha "${BASE_SHA}" \
              --arg binding_artifact_digest "${BINDING_ARTIFACT_DIGEST}" \
              --arg binding_artifact_id "${BINDING_ARTIFACT_ID}" \
              --arg binding_sha256 "${BINDING_SHA256}" \
              --arg broker_boundary_digest "${BROKER_BOUNDARY_DIGEST}" \
              --arg build_check_run_id "${BUILD_CHECK_RUN_ID}" \
              --arg cage_enforcement_digest "${CAGE_ENFORCEMENT_DIGEST}" \
              --arg capture_actor "${CAPTURE_ACTOR}" \
              --arg capture_definition_blob "${CAPTURE_DEFINITION_BLOB}" \
              --arg capture_issued_at_unix_ms "${CAPTURE_ISSUED_AT_UNIX_MS}" \
              --arg capture_job_id "${CAPTURE_JOB_ID}" \
              --arg capture_run_attempt "${CAPTURE_RUN_ATTEMPT}" \
              --arg capture_run_id "${CAPTURE_RUN_ID}" \
              --arg capture_workflow_id "${CAPTURE_WORKFLOW_ID}" \
              --arg ci_aggregate_check_run_id "${CI_AGGREGATE_CHECK_RUN_ID}" \
              --arg ci_run_attempt "${CI_RUN_ATTEMPT}" \
              --arg ci_run_id "${CI_RUN_ID}" \
              --arg ci_workflow_id "${CI_WORKFLOW_ID}" \
              --arg committed_adversarial_evidence_digest "${COMMITTED_ADVERSARIAL_EVIDENCE_DIGEST}" \
              --arg committed_binding_digest "${COMMITTED_BINDING_DIGEST}" \
              --arg configuration_digest "${CONFIGURATION_DIGEST}" \
              --arg controller_actor "${CONTROLLER_ACTOR}" \
              --arg controller_definition_blob "${CONTROLLER_DEFINITION_BLOB}" \
              --arg controller_issued_at_unix_ms "${CONTROLLER_ISSUED_AT_UNIX_MS}" \
              --arg controller_run_attempt "${CONTROLLER_RUN_ATTEMPT}" \
              --arg controller_run_id "${CONTROLLER_RUN_ID}" \
              --arg controller_workflow_id "${CONTROLLER_WORKFLOW_ID}" \
              --arg deny_check_run_id "${DENY_CHECK_RUN_ID}" \
              --arg evidence_sha "${EVIDENCE_SHA}" \
              --arg inventory_digest "${INVENTORY_DIGEST}" \
              --arg key_log_transparency_digest "${KEY_LOG_TRANSPARENCY_DIGEST}" \
              --arg labels_digest "${LABELS_DIGEST}" \
              --arg linux_adversarial_controls_digest "${LINUX_ADVERSARIAL_CONTROLS_DIGEST}" \
              --arg merge_commit_sha "${MERGE_COMMIT_SHA}" \
              --arg merge_tree_sha "${MERGE_TREE_SHA}" \
              --arg migration_state_store_digest "${MIGRATION_STATE_STORE_DIGEST}" \
              --arg msrv_check_run_id "${MSRV_CHECK_RUN_ID}" \
              --arg pr_number "${PR_NUMBER}" \
              --arg repository "${GITHUB_REPOSITORY}" \
              --arg runner_arch "${RUNNER_ARCH}" \
              --arg runner_contract_digest "${RUNNER_CONTRACT_DIGEST}" \
              --arg runner_labels_digest "${RUNNER_LABELS_DIGEST}" \
              --arg runner_name "${RUNNER_NAME}" \
              --arg runner_os "${RUNNER_OS}" \
              --arg security_definition_sha "${SECURITY_DEFINITION_SHA}" \
              --arg vet_check_run_id "${VET_CHECK_RUN_ID}" \
              '{
                artifact: {
                  digest: $artifact_digest,
                  id: $artifact_id,
                  name: $artifact_name,
                  size: $artifact_size
                },
                authorized_source_sha: $authorized_source_sha,
                base: {
                  ref: $base_ref,
                  repository: $base_repository,
                  sha: $base_sha
                },
                capture: {
                  actor: $capture_actor,
                  definition_blob: $capture_definition_blob,
                  issued_at_unix_ms: $capture_issued_at_unix_ms,
                  job_id: $capture_job_id,
                  run_attempt: $capture_run_attempt,
                  run_id: $capture_run_id,
                  workflow_id: $capture_workflow_id
                },
                ci: {
                  aggregate_check_run_id: $ci_aggregate_check_run_id,
                  merge_binding: {
                    artifact_digest: $binding_artifact_digest,
                    artifact_id: $binding_artifact_id,
                    attestation_bundle_sha256: $attestation_bundle_sha256,
                    binding_sha256: $binding_sha256
                  },
                  required_check_run_ids: {
                    build: $build_check_run_id,
                    deny: $deny_check_run_id,
                    msrv: $msrv_check_run_id,
                    vet: $vet_check_run_id
                  },
                  run_attempt: $ci_run_attempt,
                  run_id: $ci_run_id,
                  workflow_id: $ci_workflow_id
                },
                committed_binding_digest: $committed_binding_digest,
                configuration_digest: $configuration_digest,
                controller: {
                  actor: $controller_actor,
                  definition_blob: $controller_definition_blob,
                  issued_at_unix_ms: $controller_issued_at_unix_ms,
                  run_attempt: $controller_run_attempt,
                  run_id: $controller_run_id,
                  workflow_id: $controller_workflow_id
                },
                evidence_sha: $evidence_sha,
                gate_result_digests: {
                  broker_boundary: $broker_boundary_digest,
                  cage_enforcement: $cage_enforcement_digest,
                  committed_adversarial_evidence: $committed_adversarial_evidence_digest,
                  key_log_transparency: $key_log_transparency_digest,
                  linux_adversarial_controls: $linux_adversarial_controls_digest,
                  migration_state_store: $migration_state_store_digest,
                  runner_contract: $runner_contract_digest
                },
                inventory_digest: $inventory_digest,
                labels_digest: $labels_digest,
                merge_commit_sha: $merge_commit_sha,
                merge_tree_sha: $merge_tree_sha,
                pr_number: $pr_number,
                repository: $repository,
                runner: {
                  arch: $runner_arch,
                  labels_digest: $runner_labels_digest,
                  name: $runner_name,
                  os: $runner_os
                },
                schema: "chio.security-check-publication.v1",
                security_definition_sha: $security_definition_sha
              }'
          })"
          publication_binding_digest="$(printf '%s' "${publication_binding}" | sha256sum | cut -d' ' -f1)"
          external_id="arc:${PR_NUMBER}:${EVIDENCE_SHA}:${MERGE_COMMIT_SHA}:${AUTHORIZED_SOURCE_SHA}"
          {
            echo "authorized_source_sha=${AUTHORIZED_SOURCE_SHA}"
            echo "ci_aggregate_check_run_id=${CI_AGGREGATE_CHECK_RUN_ID}"
            echo "ci_run_attempt=${CI_RUN_ATTEMPT}"
            echo "ci_run_id=${CI_RUN_ID}"
            echo "ci_workflow_id=${CI_WORKFLOW_ID}"
            echo "evidence_sha=${EVIDENCE_SHA}"
            echo "external_id=${external_id}"
            echo "merge_commit_sha=${MERGE_COMMIT_SHA}"
            echo "pr_number=${PR_NUMBER}"
            echo "publication_binding_digest=${publication_binding_digest}"
            echo "publication_binding_json=${publication_binding}"
            echo "security_definition_sha=${SECURITY_DEFINITION_SHA}"
          } >> "${GITHUB_OUTPUT}"

  publish-security-contract:
    name: reconcile exact merge authority contexts
    needs: [authorize-security-check-publication, sign-validated-capture]
    environment: security-check-publisher
    concurrency:
      group: security-check-authority-${{ needs.authorize-security-check-publication.outputs.merge_commit_sha }}
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reconcile exact five-context merge authority
        env:
          AUTHORIZED_SOURCE_SHA: ${{ needs.authorize-security-check-publication.outputs.authorized_source_sha }}
          CI_AGGREGATE_CHECK_RUN_ID: ${{ needs.authorize-security-check-publication.outputs.ci_aggregate_check_run_id }}
          CI_RUN_ATTEMPT: ${{ needs.authorize-security-check-publication.outputs.ci_run_attempt }}
          CI_RUN_ID: ${{ needs.authorize-security-check-publication.outputs.ci_run_id }}
          CI_WORKFLOW_ID: ${{ needs.authorize-security-check-publication.outputs.ci_workflow_id }}
          COMMITTED_EVIDENCE_SHA: ${{ vars.CHIO_COMMITTED_LINUX_EVIDENCE_SHA }}
          EVIDENCE_SHA: ${{ needs.authorize-security-check-publication.outputs.evidence_sha }}
          EXTERNAL_ID: ${{ needs.authorize-security-check-publication.outputs.external_id }}
          FINALIZER_RUN_ATTEMPT: ${{ github.run_attempt }}
          FINALIZER_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          MERGE_COMMIT_SHA: ${{ needs.authorize-security-check-publication.outputs.merge_commit_sha }}
          PR_NUMBER: ${{ needs.authorize-security-check-publication.outputs.pr_number }}
          PUBLICATION_BINDING_DIGEST: ${{ needs.authorize-security-check-publication.outputs.publication_binding_digest }}
          PUBLICATION_BINDING_JSON: ${{ needs.authorize-security-check-publication.outputs.publication_binding_json }}
          PUBLISHER_REF: ${{ github.ref }}
          PUBLISHER_SHA: ${{ github.sha }}
          SECURITY_APP_ID: ${{ vars.CHIO_SECURITY_APP_ID }}
          SECURITY_APP_INSTALLATION_ID: ${{ vars.CHIO_SECURITY_APP_INSTALLATION_ID }}
          SECURITY_APP_PRIVATE_KEY_PEM: ${{ secrets.CHIO_SECURITY_APP_PRIVATE_KEY_PEM }}
          SECURITY_DEFINITION_SHA: ${{ needs.authorize-security-check-publication.outputs.security_definition_sha }}
          LIVE_AUTHORIZED_SOURCE_SHA: ${{ vars.CHIO_AUTHORIZED_SECURITY_SOURCE_SHA }}
          LIVE_SECURITY_DEFINITION_SHA: ${{ vars.CHIO_ENTERPRISE_SECURITY_DEFINITION_SHA }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          umask 077
          [[ "${SECURITY_APP_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${SECURITY_APP_INSTALLATION_ID}" =~ ^[1-9][0-9]*$ ]]
          test "${SECURITY_APP_ID}" != "15368"
          [[ "${AUTHORIZED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EVIDENCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${FINALIZER_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          [[ "${FINALIZER_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${MERGE_COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PUBLISHER_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${SECURITY_DEFINITION_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${LIVE_SECURITY_DEFINITION_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PUBLICATION_BINDING_DIGEST}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          [[ "${CI_AGGREGATE_CHECK_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${CI_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          [[ "${CI_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${CI_WORKFLOW_ID}" =~ ^[1-9][0-9]*$ ]]
          test "${PUBLISHER_REF}" = "refs/heads/main"
          test "${LIVE_SECURITY_DEFINITION_SHA}" = "${SECURITY_DEFINITION_SHA}"
          authorized_publisher_blob_sha="$({
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/enterprise-evidence-finalizer.yml?ref=${SECURITY_DEFINITION_SHA}" \
              --jq '.sha'
          })"
          running_publisher_blob_sha="$({
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/enterprise-evidence-finalizer.yml?ref=${PUBLISHER_SHA}" \
              --jq '.sha'
          })"
          [[ "${authorized_publisher_blob_sha}" =~ ^[0-9a-f]{40}$ ]]
          test "${running_publisher_blob_sha}" = "${authorized_publisher_blob_sha}"
          test "${COMMITTED_EVIDENCE_SHA}" = "${EVIDENCE_SHA}"
          test "${LIVE_AUTHORIZED_SOURCE_SHA}" = "${AUTHORIZED_SOURCE_SHA}"
          test "${EXTERNAL_ID}" = "arc:${PR_NUMBER}:${EVIDENCE_SHA}:${MERGE_COMMIT_SHA}:${AUTHORIZED_SOURCE_SHA}"
          publication_details_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${FINALIZER_RUN_ID}/attempts/${FINALIZER_RUN_ATTEMPT}"
          canonical_binding="$(jq -cS . <<< "${PUBLICATION_BINDING_JSON}")"
          test "${canonical_binding}" = "${PUBLICATION_BINDING_JSON}"
          test "$(printf '%s' "${canonical_binding}" | sha256sum | cut -d' ' -f1)" = "${PUBLICATION_BINDING_DIGEST}"
          test "$(jq -r '.schema' <<< "${canonical_binding}")" = "chio.security-check-publication.v1"
          test "$(jq -r '.repository' <<< "${canonical_binding}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.pr_number' <<< "${canonical_binding}")" = "${PR_NUMBER}"
          test "$(jq -r '.evidence_sha' <<< "${canonical_binding}")" = "${EVIDENCE_SHA}"
          test "$(jq -r '.merge_commit_sha' <<< "${canonical_binding}")" = "${MERGE_COMMIT_SHA}"
          test "$(jq -r '.authorized_source_sha' <<< "${canonical_binding}")" = "${AUTHORIZED_SOURCE_SHA}"
          test "$(jq -r '.security_definition_sha' <<< "${canonical_binding}")" = "${SECURITY_DEFINITION_SHA}"
          test "$(jq -r '.ci.workflow_id' <<< "${canonical_binding}")" = "${CI_WORKFLOW_ID}"
          test "$(jq -r '.ci.run_id' <<< "${canonical_binding}")" = "${CI_RUN_ID}"
          test "$(jq -r '.ci.run_attempt' <<< "${canonical_binding}")" = "${CI_RUN_ATTEMPT}"
          test "$(jq -r '.ci.aggregate_check_run_id' <<< "${canonical_binding}")" = "${CI_AGGREGATE_CHECK_RUN_ID}"
          [[ "$(jq -r '.labels_digest' <<< "${canonical_binding}")" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(jq -r '.merge_commit_sha' <<< "${canonical_binding}")" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(jq -r '.merge_tree_sha' <<< "${canonical_binding}")" =~ ^[0-9a-f]{40}$ ]]

          private_key="${RUNNER_TEMP}/chio-security-authority.pem"
          trap 'unset SECURITY_APP_PRIVATE_KEY_PEM installation_token token_response jwt jwt_header jwt_claims jwt_unsigned jwt_signature; rm -f -- "${private_key}"' EXIT
          printf '%s\n' "${SECURITY_APP_PRIVATE_KEY_PEM}" > "${private_key}"
          unset SECURITY_APP_PRIVATE_KEY_PEM
          test "$(stat --format='%F:%a' "${private_key}")" = "regular file:600"
          openssl pkey -in "${private_key}" -check -noout > /dev/null

          base64url() {
            openssl base64 -A | tr '+/' '-_' | tr -d '='
          }
          now_epoch="$(date +%s)"
          jwt_header="$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | base64url)"
          jwt_claims="$({
            jq -cS -n \
              --arg iss "${SECURITY_APP_ID}" \
              --argjson exp "$((now_epoch + 540))" \
              --argjson iat "$((now_epoch - 60))" \
              '{exp: $exp, iat: $iat, iss: $iss}'
          })"
          jwt_unsigned="${jwt_header}.$(printf '%s' "${jwt_claims}" | base64url)"
          jwt_signature="$(
            printf '%s' "${jwt_unsigned}" |
              openssl dgst -sha256 -sign "${private_key}" -binary |
              base64url
          )"
          jwt="${jwt_unsigned}.${jwt_signature}"

          app="$({
            curl \
              --proto '=https' \
              --tlsv1.2 \
              --fail \
              --silent \
              --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${jwt}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              https://api.github.com/app
          })"
          test "$(jq -r '.id' <<< "${app}")" = "${SECURITY_APP_ID}"
          test "$(jq -r '.slug' <<< "${app}")" = "chio-security-authority"
          test "$(jq -r '.owner.login' <<< "${app}")" = "${GITHUB_REPOSITORY_OWNER}"
          test "$(jq -cS '.permissions' <<< "${app}")" = '{"checks":"write","metadata":"read","statuses":"write"}'

          token_request='{"permissions":{"checks":"write"}}'
          token_response="$({
            curl \
              --proto '=https' \
              --tlsv1.2 \
              --fail \
              --silent \
              --show-error \
              --request POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${jwt}" \
              -H "Content-Type: application/json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              --data-binary "${token_request}" \
              "https://api.github.com/app/installations/${SECURITY_APP_INSTALLATION_ID}/access_tokens"
          })"
          installation_token="$(jq -r '.token // empty' <<< "${token_response}")"
          [[ "${installation_token}" =~ ^ghs_[A-Za-z0-9_.-]{16,4096}$ ]]
          token_permissions="$(jq -cS '.permissions' <<< "${token_response}")"
          case "${token_permissions}" in
            '{"checks":"write"}'|'{"checks":"write","metadata":"read"}') ;;
            *) echo "unexpected installation token permissions" >&2; exit 1 ;;
          esac
          token_expires_epoch="$(date --date="$(jq -r '.expires_at' <<< "${token_response}")" +%s)"
          test "${now_epoch}" -lt "${token_expires_epoch}"
          test "$((token_expires_epoch - now_epoch))" -le 3600
          unset token_response jwt jwt_header jwt_claims jwt_unsigned jwt_signature
          rm -f -- "${private_key}"

          installation="$({
            curl \
              --proto '=https' \
              --tlsv1.2 \
              --fail \
              --silent \
              --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${installation_token}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              https://api.github.com/installation
          })"
          test "$(jq -r '.id' <<< "${installation}")" = "${SECURITY_APP_INSTALLATION_ID}"
          test "$(jq -r '.app_id' <<< "${installation}")" = "${SECURITY_APP_ID}"
          test "$(jq -r '.app_slug' <<< "${installation}")" = "chio-security-authority"
          test "$(jq -r '.account.login' <<< "${installation}")" = "${GITHUB_REPOSITORY_OWNER}"
          test "$(jq -r '.repository_selection' <<< "${installation}")" = "selected"
          test "$(jq -cS '.permissions' <<< "${installation}")" = '{"checks":"write","metadata":"read","statuses":"write"}'
          repositories="$({
            curl \
              --proto '=https' \
              --tlsv1.2 \
              --fail \
              --silent \
              --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${installation_token}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              'https://api.github.com/installation/repositories?per_page=100'
          })"
          test "$(jq -r '.total_count' <<< "${repositories}")" = "1"
          test "$(jq -r '.repositories | length' <<< "${repositories}")" = "1"
          test "$(jq -r '.repositories[0].full_name' <<< "${repositories}")" = "${GITHUB_REPOSITORY}"

          revalidate_live_publication_head() {
            live_pr="$({
              curl \
                --proto '=https' \
                --tlsv1.2 \
                --fail \
                --silent \
                --show-error \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"
            })"
            test "$(jq -r '.state' <<< "${live_pr}")" = "open"
            test "$(jq -r '.head.repo.full_name' <<< "${live_pr}")" = "${GITHUB_REPOSITORY}"
            test "$(jq -r '.head.sha' <<< "${live_pr}")" = "${EVIDENCE_SHA}"
            test "$(jq -r '.base.repo.full_name' <<< "${live_pr}")" = "$(jq -r '.base.repository' <<< "${canonical_binding}")"
            test "$(jq -r '.base.ref' <<< "${live_pr}")" = "$(jq -r '.base.ref' <<< "${canonical_binding}")"
            test "$(jq -r '.base.sha' <<< "${live_pr}")" = "$(jq -r '.base.sha' <<< "${canonical_binding}")"
            merge_commit_sha="$(jq -r '.merge_commit_sha' <<< "${canonical_binding}")"
            merge_ref="$({
              curl \
                --proto '=https' \
                --tlsv1.2 \
                --fail \
                --silent \
                --show-error \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/pull/${PR_NUMBER}/merge"
            })"
            test "$(jq -r '.ref' <<< "${merge_ref}")" = "refs/pull/${PR_NUMBER}/merge"
            test "$(jq -r '.object.type' <<< "${merge_ref}")" = commit
            test "$(jq -r '.object.sha' <<< "${merge_ref}")" = "${merge_commit_sha}"
            merge_commit="$({
              curl \
                --proto '=https' \
                --tlsv1.2 \
                --fail \
                --silent \
                --show-error \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/commits/${merge_commit_sha}"
            })"
            test "$(jq -r '.parents | length' <<< "${merge_commit}")" = "2"
            test "$(jq -r '.parents[0].sha' <<< "${merge_commit}")" = "$(jq -r '.base.sha' <<< "${canonical_binding}")"
            test "$(jq -r '.parents[1].sha' <<< "${merge_commit}")" = "${EVIDENCE_SHA}"
            test "$(jq -r '.tree.sha' <<< "${merge_commit}")" = "$(jq -r '.merge_tree_sha' <<< "${canonical_binding}")"
          }

          list_actions_mirror_checks() {
            mirror_name="$1"
            encoded_name="$(jq -rn --arg value "${mirror_name}" '$value | @uri')"
            page=1
            total_count=''
            collected_checks='[]'
            while true; do
              page_response="$({
                curl \
                  --proto '=https' \
                  --tlsv1.2 \
                  --fail \
                  --silent \
                  --show-error \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "X-GitHub-Api-Version: 2026-03-10" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${MERGE_COMMIT_SHA}/check-runs?app_id=15368&check_name=${encoded_name}&filter=all&per_page=100&page=${page}"
              })"
              page_total="$(jq -r '.total_count' <<< "${page_response}")"
              [[ "${page_total}" =~ ^[0-9]+$ ]]
              if test -z "${total_count}"; then
                total_count="${page_total}"
              else
                test "${page_total}" = "${total_count}"
              fi
              page_checks="$(jq -cS '.check_runs' <<< "${page_response}")"
              test "$(jq -r 'type' <<< "${page_checks}")" = "array"
              collected_checks="$({
                jq -cS -n \
                  --argjson collected "${collected_checks}" \
                  --argjson page "${page_checks}" \
                  '$collected + $page'
              })"
              collected_count="$(jq -r 'length' <<< "${collected_checks}")"
              test "${collected_count}" -le "${total_count}"
              if test "${collected_count}" = "${total_count}"; then
                break
              fi
              test "$(jq -r 'length' <<< "${page_checks}")" = "100"
              page="$((page + 1))"
            done
            test "$(jq -r '[.[].id] | unique | length' <<< "${collected_checks}")" = "${total_count}"
            jq -cS -n \
              --argjson check_runs "${collected_checks}" \
              --argjson total_count "${total_count}" \
              '{check_runs: $check_runs, total_count: $total_count}'
          }

          list_namespace_checks() {
            token="$1"
            app_id="$2"
            check_name="$3"
            encoded_name="$(jq -rn --arg value "${check_name}" '$value | @uri')"
            page=1
            total_count=''
            collected_checks='[]'
            while true; do
              page_response="$({
                curl \
                  --proto '=https' \
                  --tlsv1.2 \
                  --fail \
                  --silent \
                  --show-error \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer ${token}" \
                  -H "X-GitHub-Api-Version: 2026-03-10" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${MERGE_COMMIT_SHA}/check-runs?app_id=${app_id}&check_name=${encoded_name}&filter=all&per_page=100&page=${page}"
              })"
              page_total="$(jq -r '.total_count' <<< "${page_response}")"
              [[ "${page_total}" =~ ^[0-9]+$ ]]
              if test -z "${total_count}"; then
                total_count="${page_total}"
              else
                test "${page_total}" = "${total_count}"
              fi
              page_checks="$(jq -cS '.check_runs' <<< "${page_response}")"
              test "$(jq -r 'type' <<< "${page_checks}")" = "array"
              collected_checks="$(jq -cS -n --argjson collected "${collected_checks}" --argjson page "${page_checks}" '$collected + $page')"
              collected_count="$(jq -r 'length' <<< "${collected_checks}")"
              test "${collected_count}" -le "${total_count}"
              if test "${collected_count}" = "${total_count}"; then
                break
              fi
              test "$(jq -r 'length' <<< "${page_checks}")" = "100"
              page="$((page + 1))"
            done
            test "$(jq -r '[.[].id] | unique | length' <<< "${collected_checks}")" = "${total_count}"
            jq -cS -n --argjson check_runs "${collected_checks}" --argjson total_count "${total_count}" '{check_runs: $check_runs, total_count: $total_count}'
          }

          normalize_bad_ci_namespace() {
            token="$1"
            app_id="$2"
            app_slug="$3"
            check_name="$4"
            required_external_id="$5"
            namespace="$(list_namespace_checks "${token}" "${app_id}" "${check_name}")"
            namespace_count="$(jq -r '.total_count' <<< "${namespace}")"
            test "$(jq -r '.check_runs | length' <<< "${namespace}")" = "${namespace_count}"
            test "$(jq -r --arg app_id "${app_id}" --arg app_slug "${app_slug}" --arg head_sha "${MERGE_COMMIT_SHA}" --arg name "${check_name}" 'all(.check_runs[]; .name == $name and .head_sha == $head_sha and (.app.id | tostring) == $app_id and .app.slug == $app_slug)' <<< "${namespace}")" = "true"
            summary="Authority ${required_external_id} is permanently revoked for ci-regression."
            if test "${namespace_count}" = "0"; then
              if test "${bad_ci_create_missing}" = false; then
                return 0
              fi
              tombstone_text="$({
                jq -cS -n \
                  --arg authorized_source_sha "${AUTHORIZED_SOURCE_SHA}" \
                  --arg evidence_sha "${EVIDENCE_SHA}" \
                  --arg merge_commit_sha "${MERGE_COMMIT_SHA}" \
                  --arg pr_number "${PR_NUMBER}" \
                  --arg security_definition_sha "${SECURITY_DEFINITION_SHA}" \
                  --argjson bad_ci_runs "${bad_ci_runs}" \
                  '{
                    bad_ci_runs: [$bad_ci_runs[] | {
                      conclusion: .conclusion,
                      run_attempt: .run_attempt,
                      run_id: .id,
                      workflow_id: .workflow_id
                    }],
                    identity: {
                      authorized_source_sha: $authorized_source_sha,
                      evidence_sha: $evidence_sha,
                      merge_commit_sha: $merge_commit_sha,
                      pr_number: $pr_number
                    },
                    reason: "ci-regression",
                    schema: "chio.security-check-revocation.v1",
                    security_definition_sha: $security_definition_sha
                  }'
              })"
              failure_payload="$(jq -cS -n --arg completed_at "$(date --utc +%Y-%m-%dT%H:%M:%SZ)" --arg external_id "${required_external_id}" --arg head_sha "${MERGE_COMMIT_SHA}" --arg name "${check_name}" --arg summary "${summary}" --arg text "${tombstone_text}" '{completed_at: $completed_at, conclusion: "failure", external_id: $external_id, head_sha: $head_sha, name: $name, output: {summary: $summary, text: $text, title: "Chio security authority revoked"}, status: "completed"}')"
              revalidate_live_publication_head
              failed_check="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --request POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${token}" -H "Content-Type: application/json" -H "X-GitHub-Api-Version: 2026-03-10" --data-binary "${failure_payload}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs")"
              revalidate_live_publication_head
              [[ "$(jq -r '.id' <<< "${failed_check}")" =~ ^[1-9][0-9]*$ ]]
              test "$(jq -r '.name' <<< "${failed_check}")" = "${check_name}"
              test "$(jq -r '.head_sha' <<< "${failed_check}")" = "${MERGE_COMMIT_SHA}"
              test "$(jq -r '.external_id' <<< "${failed_check}")" = "${required_external_id}"
              test "$(jq -r '.status' <<< "${failed_check}")" = "completed"
              test "$(jq -r '.conclusion' <<< "${failed_check}")" = "failure"
              test "$(jq -r '.app.id' <<< "${failed_check}")" = "${app_id}"
              test "$(jq -r '.app.slug' <<< "${failed_check}")" = "${app_slug}"
            else
              canonical_check_id="$(jq -r --arg external_id "${required_external_id}" '[.check_runs[] | select(.external_id == $external_id)] | sort_by(.id) | .[0].id // empty' <<< "${namespace}")"
              [[ "${canonical_check_id}" =~ ^[1-9][0-9]*$ ]]
              preserved_metadata="$(jq -cS --arg canonical_check_id "${canonical_check_id}" '[.check_runs[] | select((.id | tostring) == $canonical_check_id) | {external_id: .external_id, id: .id, text: (.output.text // "")}]' <<< "${namespace}")"
              test "$(jq -r 'length' <<< "${preserved_metadata}")" = 1
              while IFS= read -r existing_check; do
                existing_check_id="$(jq -r '.id' <<< "${existing_check}")"
                [[ "${existing_check_id}" =~ ^[1-9][0-9]*$ ]]
                target_name="${check_name}"
                if test "${existing_check_id}" != "${canonical_check_id}"; then
                  target_name="${check_name} / superseded ${existing_check_id}"
                fi
                if test "$(jq -r '.name' <<< "${existing_check}")" = "${target_name}" &&
                   test "$(jq -r '.status' <<< "${existing_check}")" = "completed" &&
                   test "$(jq -r '.conclusion' <<< "${existing_check}")" = "failure"; then
                  continue
                fi
                current_external_id="$(jq -c '.external_id' <<< "${existing_check}")"
                current_text="$(jq -r '.output.text // ""' <<< "${existing_check}")"
                failure_payload="$(jq -cS -n --arg completed_at "$(date --utc +%Y-%m-%dT%H:%M:%SZ)" --arg name "${target_name}" --arg summary "${summary}" --arg text "${current_text}" --argjson external_id "${current_external_id}" '{completed_at: $completed_at, conclusion: "failure", external_id: $external_id, name: $name, output: {summary: $summary, text: $text, title: "Chio security authority revoked"}, status: "completed"}')"
                failed_check="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --request PATCH -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${token}" -H "Content-Type: application/json" -H "X-GitHub-Api-Version: 2026-03-10" --data-binary "${failure_payload}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs/${existing_check_id}")"
                test "$(jq -r '.id' <<< "${failed_check}")" = "${existing_check_id}"
                test "$(jq -r '.name' <<< "${failed_check}")" = "${target_name}"
                test "$(jq -r '.head_sha' <<< "${failed_check}")" = "${MERGE_COMMIT_SHA}"
                test "$(jq -r '.external_id' <<< "${failed_check}")" = "$(jq -r '.external_id // ""' <<< "${existing_check}")"
                test "$(jq -r '.output.text // ""' <<< "${failed_check}")" = "${current_text}"
                test "$(jq -r '.status' <<< "${failed_check}")" = "completed"
                test "$(jq -r '.conclusion' <<< "${failed_check}")" = "failure"
              done < <(jq -c '.check_runs[]' <<< "${namespace}")
            fi
            verified_failure="$(list_namespace_checks "${token}" "${app_id}" "${check_name}")"
            test "$(jq -r '.total_count' <<< "${verified_failure}")" = "1"
            test "$(jq -r '.check_runs | length' <<< "${verified_failure}")" = "1"
            test "$(jq -r --arg app_id "${app_id}" --arg app_slug "${app_slug}" --arg external_id "${required_external_id}" --arg head_sha "${MERGE_COMMIT_SHA}" --arg name "${check_name}" 'all(.check_runs[]; .name == $name and .head_sha == $head_sha and .external_id == $external_id and .status == "completed" and .conclusion == "failure" and (.app.id | tostring) == $app_id and .app.slug == $app_slug)' <<< "${verified_failure}")" = "true"
            if test "${namespace_count}" -gt 0; then
              verified_metadata="$(jq -cS '[.check_runs[] | {external_id: .external_id, id: .id, text: (.output.text // "")}] | sort_by(.id)' <<< "${verified_failure}")"
              test "${verified_metadata}" = "${preserved_metadata}"
            fi
          }

          reconcile_bad_ci() {
            bad_ci_observed=false
            expected_ci_run_name="CI N=${PR_NUMBER} E=${EVIDENCE_SHA} B=$(jq -r '.base.sha' <<< "${canonical_binding}") M=${MERGE_COMMIT_SHA}"

            list_matching_ci_runs() {
              local page=1
              local query="event=pull_request&head_sha=${EVIDENCE_SHA}&"
              local ci_runs='[]'
              local first_response total_count page_response page_total page_runs collected_count
              first_response="$({
                curl \
                  --proto '=https' \
                  --tlsv1.2 \
                  --fail \
                  --silent \
                  --show-error \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "X-GitHub-Api-Version: 2026-03-10" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?${query}per_page=100&page=1"
              })"
              total_count="$(jq -r '.total_count' <<< "${first_response}")"
              [[ "${total_count}" =~ ^[0-9]+$ ]]
              if test "${total_count}" -ge 1000; then
                query=''
                first_response="$({
                  curl \
                    --proto '=https' \
                    --tlsv1.2 \
                    --fail \
                    --silent \
                    --show-error \
                    -H "Accept: application/vnd.github+json" \
                    -H "Authorization: Bearer ${GH_TOKEN}" \
                    -H "X-GitHub-Api-Version: 2026-03-10" \
                    "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?per_page=100&page=1"
                })"
                total_count="$(jq -r '.total_count' <<< "${first_response}")"
                [[ "${total_count}" =~ ^[0-9]+$ ]]
              fi
              while true; do
                if test "${page}" = 1; then
                  page_response="${first_response}"
                else
                  page_response="$({
                    curl \
                      --proto '=https' \
                      --tlsv1.2 \
                      --fail \
                      --silent \
                      --show-error \
                      -H "Accept: application/vnd.github+json" \
                      -H "Authorization: Bearer ${GH_TOKEN}" \
                      -H "X-GitHub-Api-Version: 2026-03-10" \
                      "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?${query}per_page=100&page=${page}"
                  })"
                fi
                page_total="$(jq -r '.total_count' <<< "${page_response}")"
                [[ "${page_total}" =~ ^[0-9]+$ ]]
                test "${page_total}" = "${total_count}"
                page_runs="$(jq -cS '.workflow_runs' <<< "${page_response}")"
                test "$(jq -r 'type' <<< "${page_runs}")" = array
                ci_runs="$(jq -cS -n --argjson collected "${ci_runs}" --argjson page "${page_runs}" '$collected + $page')"
                collected_count="$(jq -r 'length' <<< "${ci_runs}")"
                test "${collected_count}" -le "${total_count}"
                if test "${collected_count}" = "${total_count}"; then
                  break
                fi
                test "$(jq -r 'length' <<< "${page_runs}")" = 100
                page="$((page + 1))"
              done
              test "$(jq -r '[.[].id] | unique | length' <<< "${ci_runs}")" = "${total_count}"
              jq -cS \
                --arg evidence_sha "${EVIDENCE_SHA}" \
                --arg expected_run_name "${expected_ci_run_name}" \
                --arg repository "${GITHUB_REPOSITORY}" \
                --arg workflow_id "${CI_WORKFLOW_ID}" \
                '[.[] | select(
                  .name == "CI" and
                  .path == ".github/workflows/ci.yml" and
                  .event == "pull_request" and
                  (.workflow_id | tostring) == $workflow_id and
                  .display_title == $expected_run_name and
                  .head_sha == $evidence_sha and
                  .head_repository.full_name == $repository
                )] | sort_by(.id)' <<< "${ci_runs}"
            }

            get_current_ci_run() {
              local run_id="$1"
              curl \
                --proto '=https' \
                --tlsv1.2 \
                --fail \
                --silent \
                --show-error \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            }

            get_exact_ci_attempt() {
              local run_id="$1"
              local run_attempt="$2"
              curl \
                --proto '=https' \
                --tlsv1.2 \
                --fail \
                --silent \
                --show-error \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/attempts/${run_attempt}"
            }

            require_matching_ci_identity() {
              local candidate_run="$1"
              local required_run_id="$2"
              test "$(jq -r '.id' <<< "${candidate_run}")" = "${required_run_id}"
              test "$(jq -r '.workflow_id' <<< "${candidate_run}")" = "${CI_WORKFLOW_ID}"
              test "$(jq -r '.name' <<< "${candidate_run}")" = CI
              test "$(jq -r '.path' <<< "${candidate_run}")" = .github/workflows/ci.yml
              test "$(jq -r '.event' <<< "${candidate_run}")" = pull_request
              test "$(jq -r '.display_title' <<< "${candidate_run}")" = "${expected_ci_run_name}"
              test "$(jq -r '.head_sha' <<< "${candidate_run}")" = "${EVIDENCE_SHA}"
              test "$(jq -r '.head_repository.full_name' <<< "${candidate_run}")" = "${GITHUB_REPOSITORY}"
            }

            scan_stable=false
            bad_ci_runs='[]'
            for _ in 1 2 3; do
              if ! matching_ci_runs="$(list_matching_ci_runs)"; then
                continue
              fi
              test "$(jq -r 'length' <<< "${matching_ci_runs}")" -ge 1
              test "$(jq -r --arg run_id "${CI_RUN_ID}" '[.[] | select((.id | tostring) == $run_id)] | length' <<< "${matching_ci_runs}")" = 1
              matching_ci_ids="$(jq -cS '[.[].id]' <<< "${matching_ci_runs}")"
              scan_snapshot='[]'
              scanned_bad_ci_runs='[]'
              scan_incomplete=false
              round_stable=true
              while IFS= read -r listed_ci_run; do
                run_id="$(jq -r '.id' <<< "${listed_ci_run}")"
                [[ "${run_id}" =~ ^[1-9][0-9]*$ ]]
                current_ci_run="$(get_current_ci_run "${run_id}")"
                require_matching_ci_identity "${current_ci_run}" "${run_id}"
                max_attempt="$(jq -r '.run_attempt' <<< "${current_ci_run}")"
                [[ "${max_attempt}" =~ ^[1-9][0-9]*$ ]]
                current_max_fingerprint="$(jq -cS '{conclusion: (.conclusion // ""), run_attempt: .run_attempt, status: .status}' <<< "${current_ci_run}")"
                exact_max_fingerprint=''
                for ((run_attempt = 1; run_attempt <= max_attempt; run_attempt++)); do
                  exact_attempt="$(get_exact_ci_attempt "${run_id}" "${run_attempt}")"
                  require_matching_ci_identity "${exact_attempt}" "${run_id}"
                  test "$(jq -r '.run_attempt' <<< "${exact_attempt}")" = "${run_attempt}"
                  attempt_status="$(jq -r '.status' <<< "${exact_attempt}")"
                  if test "${run_attempt}" = "${max_attempt}"; then
                    exact_max_fingerprint="$(jq -cS '{conclusion: (.conclusion // ""), run_attempt: .run_attempt, status: .status}' <<< "${exact_attempt}")"
                  fi
                  if test "${attempt_status}" != completed; then
                    scan_incomplete=true
                    continue
                  fi
                  attempt_conclusion="$(jq -r '.conclusion // ""' <<< "${exact_attempt}")"
                  if test "${attempt_conclusion}" != success; then
                    bad_attempt="$(jq -cS '{conclusion: (.conclusion // ""), id: .id, run_attempt: .run_attempt, workflow_id: .workflow_id}' <<< "${exact_attempt}")"
                    scanned_bad_ci_runs="$(jq -cS -n --argjson collected "${scanned_bad_ci_runs}" --argjson candidate "${bad_attempt}" '$collected + [$candidate]')"
                  fi
                done
                stable_ci_run="$(get_current_ci_run "${run_id}")"
                require_matching_ci_identity "${stable_ci_run}" "${run_id}"
                stable_max_attempt="$(jq -r '.run_attempt' <<< "${stable_ci_run}")"
                [[ "${stable_max_attempt}" =~ ^[1-9][0-9]*$ ]]
                stable_max_fingerprint="$(jq -cS '{conclusion: (.conclusion // ""), run_attempt: .run_attempt, status: .status}' <<< "${stable_ci_run}")"
                if test "${stable_max_attempt}" != "${max_attempt}"; then
                  test "${stable_max_attempt}" -gt "${max_attempt}"
                  round_stable=false
                  break
                fi
                if test "${current_max_fingerprint}" != "${exact_max_fingerprint}" ||
                   test "${stable_max_fingerprint}" != "${exact_max_fingerprint}"; then
                  round_stable=false
                  break
                fi
                snapshot_entry="$(jq -cS -n --argjson fingerprint "${exact_max_fingerprint}" --arg run_id "${run_id}" '{fingerprint: $fingerprint, run_id: ($run_id | tonumber)}')"
                scan_snapshot="$(jq -cS -n --argjson collected "${scan_snapshot}" --argjson candidate "${snapshot_entry}" '$collected + [$candidate]')"
              done < <(jq -c '.[]' <<< "${matching_ci_runs}")
              if test "$(jq -r 'length' <<< "${scanned_bad_ci_runs}")" -gt 0; then
                bad_ci_runs="${scanned_bad_ci_runs}"
                scan_stable=true
                break
              fi
              if test "${scan_incomplete}" = true; then
                continue
              fi
              if test "${round_stable}" = false; then
                continue
              fi
              test "$(jq -r 'length' <<< "${scan_snapshot}")" = "$(jq -r 'length' <<< "${matching_ci_runs}")"
              if ! stable_matching_ci_runs="$(list_matching_ci_runs)"; then
                continue
              fi
              test "$(jq -r 'length' <<< "${stable_matching_ci_runs}")" -ge 1
              test "$(jq -r --arg run_id "${CI_RUN_ID}" '[.[] | select((.id | tostring) == $run_id)] | length' <<< "${stable_matching_ci_runs}")" = 1
              stable_matching_ci_ids="$(jq -cS '[.[].id]' <<< "${stable_matching_ci_runs}")"
              if test "${stable_matching_ci_ids}" != "${matching_ci_ids}"; then
                continue
              fi
              while IFS= read -r snapshot_entry; do
                run_id="$(jq -r '.run_id' <<< "${snapshot_entry}")"
                expected_fingerprint="$(jq -cS '.fingerprint' <<< "${snapshot_entry}")"
                revalidated_ci_run="$(get_current_ci_run "${run_id}")"
                require_matching_ci_identity "${revalidated_ci_run}" "${run_id}"
                revalidated_fingerprint="$(jq -cS '{conclusion: (.conclusion // ""), run_attempt: .run_attempt, status: .status}' <<< "${revalidated_ci_run}")"
                if test "${revalidated_fingerprint}" != "${expected_fingerprint}"; then
                  round_stable=false
                  break
                fi
              done < <(jq -c '.[]' <<< "${scan_snapshot}")
              if test "${round_stable}" = false; then
                continue
              fi
              bad_ci_runs="${scanned_bad_ci_runs}"
              scan_stable=true
              break
            done
            test "${scan_stable}" = true
            bad_ci_runs="$(jq -cS 'sort_by([.id, .run_attempt])' <<< "${bad_ci_runs}")"
            test "$(jq -r '[.[] | "\(.id):\(.run_attempt)"] | unique | length' <<< "${bad_ci_runs}")" = "$(jq -r 'length' <<< "${bad_ci_runs}")"
            if test "$(jq -r 'length' <<< "${bad_ci_runs}")" = "0"; then
              return 0
            fi
            bad_ci_create_missing=false
            if live_bad_ci_pr="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2026-03-10" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" 2>/dev/null)" &&
               test "$(jq -r '.state' <<< "${live_bad_ci_pr}")" = open &&
               test "$(jq -r '.head.repo.full_name' <<< "${live_bad_ci_pr}")" = "${GITHUB_REPOSITORY}" &&
               test "$(jq -r '.head.sha' <<< "${live_bad_ci_pr}")" = "${EVIDENCE_SHA}" &&
               test "$(jq -r '.base.repo.full_name' <<< "${live_bad_ci_pr}")" = "$(jq -r '.base.repository' <<< "${canonical_binding}")" &&
               test "$(jq -r '.base.ref' <<< "${live_bad_ci_pr}")" = "$(jq -r '.base.ref' <<< "${canonical_binding}")" &&
               test "$(jq -r '.base.sha' <<< "${live_bad_ci_pr}")" = "$(jq -r '.base.sha' <<< "${canonical_binding}")"; then
              if live_bad_ci_merge_ref="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2026-03-10" "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/pull/${PR_NUMBER}/merge" 2>/dev/null)" &&
                 test "$(jq -r '.ref' <<< "${live_bad_ci_merge_ref}")" = "refs/pull/${PR_NUMBER}/merge" &&
                 test "$(jq -r '.object.type' <<< "${live_bad_ci_merge_ref}")" = commit &&
                 test "$(jq -r '.object.sha' <<< "${live_bad_ci_merge_ref}")" = "${MERGE_COMMIT_SHA}"; then
                bad_ci_create_missing=true
              fi
            fi
            normalize_bad_ci_namespace "${GH_TOKEN}" 15368 github-actions "Security mirror / Build, lint, test" "${EXTERNAL_ID}:actions:build"
            normalize_bad_ci_namespace "${GH_TOKEN}" 15368 github-actions "Security mirror / MSRV build and test" "${EXTERNAL_ID}:actions:msrv"
            normalize_bad_ci_namespace "${GH_TOKEN}" 15368 github-actions "Security mirror / cargo-vet (locked supply-chain audit)" "${EXTERNAL_ID}:actions:vet"
            normalize_bad_ci_namespace "${GH_TOKEN}" 15368 github-actions "Security mirror / cargo-deny (supply-chain bans/advisories/licenses)" "${EXTERNAL_ID}:actions:deny"
            normalize_bad_ci_namespace "${installation_token}" "${SECURITY_APP_ID}" chio-security-authority "Security contract" "${EXTERNAL_ID}"
            echo "Bad current CI completion permanently tombstoned ${EXTERNAL_ID}." >> "${GITHUB_STEP_SUMMARY}"
            bad_ci_observed=true
            return 0
          }

          require_publishable_ci() {
            reconcile_bad_ci
            test "${bad_ci_observed}" = false
          }

          publish_success_authority() {
          require_publishable_ci
          revalidate_live_publication_head
          mirror_rows="$({
            jq -r '
              [
                ["Security mirror / Build, lint, test", "build", "Build, lint, test", .ci.required_check_run_ids.build],
                ["Security mirror / MSRV build and test", "msrv", "MSRV build and test", .ci.required_check_run_ids.msrv],
                ["Security mirror / cargo-vet (locked supply-chain audit)", "vet", "cargo-vet (locked supply-chain audit)", .ci.required_check_run_ids.vet],
                ["Security mirror / cargo-deny (supply-chain bans/advisories/licenses)", "deny", "cargo-deny (supply-chain bans/advisories/licenses)", .ci.required_check_run_ids.deny]
              ][] | @tsv
            ' <<< "${canonical_binding}"
          })"
          while IFS=$'\t' read -r mirror_name mirror_key source_check_name source_check_run_id; do
            test -n "${mirror_name}"
            test -n "${source_check_name}"
            [[ "${mirror_key}" =~ ^(build|msrv|vet|deny)$ ]]
            [[ "${source_check_run_id}" =~ ^[1-9][0-9]*$ ]]
            mirror_external_id="${EXTERNAL_ID}:actions:${mirror_key}"
            mirror_summary="Trusted mirror of authenticated ${source_check_name} for ${EXTERNAL_ID}."
            mirror_text="$({
              jq -cS -n \
                --arg authorized_source_sha "${AUTHORIZED_SOURCE_SHA}" \
                --arg evidence_sha "${EVIDENCE_SHA}" \
                --arg merge_commit_sha "${MERGE_COMMIT_SHA}" \
                --arg pr_number "${PR_NUMBER}" \
                --arg source_check_name "${source_check_name}" \
                --arg source_check_run_id "${source_check_run_id}" \
                --arg source_ci_run_attempt "${CI_RUN_ATTEMPT}" \
                --arg source_ci_run_id "${CI_RUN_ID}" \
                --arg source_ci_workflow_id "${CI_WORKFLOW_ID}" \
                '{
                  identity: {
                    authorized_source_sha: $authorized_source_sha,
                    evidence_sha: $evidence_sha,
                    merge_commit_sha: $merge_commit_sha,
                    pr_number: $pr_number
                  },
                  schema: "chio.security-check-authority.v2",
                  source_check: {
                    check_run_id: $source_check_run_id,
                    name: $source_check_name
                  },
                  source_ci: {
                    run_attempt: $source_ci_run_attempt,
                    run_id: $source_ci_run_id,
                    workflow_id: $source_ci_workflow_id
                  }
                }'
            })"
            mirror_namespace="$(list_actions_mirror_checks "${mirror_name}")"
            test "$(jq -r '.check_runs | length' <<< "${mirror_namespace}")" = "$(jq -r '.total_count' <<< "${mirror_namespace}")"
            test "$({
              jq -r \
                --arg head_sha "${MERGE_COMMIT_SHA}" \
                --arg name "${mirror_name}" \
                'all(.check_runs[];
                  .name == $name and
                  .head_sha == $head_sha and
                  .app.id == 15368 and
                  .app.slug == "github-actions"
                )' <<< "${mirror_namespace}"
            })" = "true"
            mirror_matches="$(jq -cS '.check_runs | sort_by(.id)' <<< "${mirror_namespace}")"
            mirror_match_count="$(jq -r 'length' <<< "${mirror_matches}")"
            test "${mirror_match_count}" -le 1
            mirror_created=false
            if test "${mirror_match_count}" = "1"; then
              mirror_check="$(jq -cS '.[0]' <<< "${mirror_matches}")"
              test "$(jq -r '.external_id' <<< "${mirror_check}")" = "${mirror_external_id}"
              test "$(jq -r '.status' <<< "${mirror_check}")" = "completed"
              test "$(jq -r '.conclusion' <<< "${mirror_check}")" = "success"
              test "$(jq -r '.output.title' <<< "${mirror_check}")" = "Chio trusted Actions mirror"
              test "$(jq -r '.output.summary' <<< "${mirror_check}")" = "${mirror_summary}"
              existing_mirror_text="$(jq -cS '.output.text | fromjson' <<< "${mirror_check}")"
              test "${existing_mirror_text}" = "${mirror_text}"
            else
              mirror_payload="$({
                jq -cS -n \
                  --arg details_url "${publication_details_url}" \
                  --arg external_id "${mirror_external_id}" \
                  --arg head_sha "${MERGE_COMMIT_SHA}" \
                  --arg name "${mirror_name}" \
                  --arg summary "${mirror_summary}" \
                  --arg text "${mirror_text}" \
                  '{
                    conclusion: "success",
                    details_url: $details_url,
                    external_id: $external_id,
                    head_sha: $head_sha,
                    name: $name,
                    output: {
                      summary: $summary,
                      text: $text,
                      title: "Chio trusted Actions mirror"
                    },
                    status: "completed"
                }'
              })"
              require_publishable_ci
              revalidate_live_publication_head
              mirror_check="$({
                curl \
                  --proto '=https' \
                  --tlsv1.2 \
                  --fail \
                  --silent \
                  --show-error \
                  --request POST \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -H "X-GitHub-Api-Version: 2026-03-10" \
                  --data-binary "${mirror_payload}" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs"
              })"
              revalidate_live_publication_head
              mirror_created=true
            fi
            require_publishable_ci
            [[ "$(jq -r '.id' <<< "${mirror_check}")" =~ ^[1-9][0-9]*$ ]]
            test "$(jq -r '.name' <<< "${mirror_check}")" = "${mirror_name}"
            test "$(jq -r '.head_sha' <<< "${mirror_check}")" = "${MERGE_COMMIT_SHA}"
            test "$(jq -r '.status' <<< "${mirror_check}")" = "completed"
            test "$(jq -r '.conclusion' <<< "${mirror_check}")" = "success"
            test "$(jq -r '.external_id' <<< "${mirror_check}")" = "${mirror_external_id}"
            [[ "$(jq -r '.details_url' <<< "${mirror_check}")" =~ ^https://github\.com/${GITHUB_REPOSITORY}/actions/runs/[1-9][0-9]*/attempts/[1-9][0-9]*$ ]]
            if test "${mirror_created}" = true; then
              test "$(jq -r '.details_url' <<< "${mirror_check}")" = "${publication_details_url}"
            fi
            test "$(jq -r '.app.id' <<< "${mirror_check}")" = "15368"
            test "$(jq -r '.app.slug' <<< "${mirror_check}")" = "github-actions"
            observed_mirror_text="$(jq -cS '.output.text | fromjson' <<< "${mirror_check}")"
            test "${observed_mirror_text}" = "${mirror_text}"
            require_publishable_ci
          done <<< "${mirror_rows}"
          revalidate_live_publication_head

          list_authority_checks() {
            page=1
            total_count=''
            collected_checks='[]'
            while true; do
              page_response="$({
                curl \
                  --proto '=https' \
                  --tlsv1.2 \
                  --fail \
                  --silent \
                  --show-error \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer ${installation_token}" \
                  -H "X-GitHub-Api-Version: 2026-03-10" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${MERGE_COMMIT_SHA}/check-runs?app_id=${SECURITY_APP_ID}&check_name=Security%20contract&filter=all&per_page=100&page=${page}"
              })"
              page_total="$(jq -r '.total_count' <<< "${page_response}")"
              [[ "${page_total}" =~ ^[0-9]+$ ]]
              if test -z "${total_count}"; then
                total_count="${page_total}"
              else
                test "${page_total}" = "${total_count}"
              fi
              page_checks="$(jq -cS '.check_runs' <<< "${page_response}")"
              test "$(jq -r 'type' <<< "${page_checks}")" = "array"
              collected_checks="$({
                jq -cS -n \
                  --argjson collected "${collected_checks}" \
                  --argjson page "${page_checks}" \
                  '$collected + $page'
              })"
              collected_count="$(jq -r 'length' <<< "${collected_checks}")"
              test "${collected_count}" -le "${total_count}"
              if test "${collected_count}" = "${total_count}"; then
                break
              fi
              test "$(jq -r 'length' <<< "${page_checks}")" = "100"
              page="$((page + 1))"
            done
            test "$(jq -r '[.[].id] | unique | length' <<< "${collected_checks}")" = "${total_count}"
            jq -cS -n \
              --argjson check_runs "${collected_checks}" \
              --argjson total_count "${total_count}" \
              '{check_runs: $check_runs, total_count: $total_count}'
          }
          existing_authority_checks="$(list_authority_checks)"
          test "$(jq -r '.check_runs | length' <<< "${existing_authority_checks}")" = "$(jq -r '.total_count' <<< "${existing_authority_checks}")"
          test "$({
            jq -r \
              --arg app_id "${SECURITY_APP_ID}" \
              --arg head_sha "${MERGE_COMMIT_SHA}" \
              'all(.check_runs[];
                .name == "Security contract" and
                .head_sha == $head_sha and
                (.app.id | tostring) == $app_id and
                .app.slug == "chio-security-authority"
              )' <<< "${existing_authority_checks}"
          })" = "true"
          existing_authority_matches="$(jq -cS '.check_runs | sort_by(.id)' <<< "${existing_authority_checks}")"
          existing_authority_match_count="$(jq -r 'length' <<< "${existing_authority_matches}")"
          test "${existing_authority_match_count}" -le 1
          if test "${existing_authority_match_count}" = "1"; then
            test "$(jq -r '.[0].external_id' <<< "${existing_authority_matches}")" = "${EXTERNAL_ID}"
            test "$(jq -r '.[0].status' <<< "${existing_authority_matches}")" = "completed"
            test "$(jq -r '.[0].conclusion' <<< "${existing_authority_matches}")" = "success"
          fi

          summary="Dedicated chio-security-authority approval for ${EXTERNAL_ID}."
          authority_text="$({
            jq -cS -n \
              --arg authorized_source_sha "${AUTHORIZED_SOURCE_SHA}" \
              --arg evidence_sha "${EVIDENCE_SHA}" \
              --arg merge_commit_sha "${MERGE_COMMIT_SHA}" \
              --arg pr_number "${PR_NUMBER}" \
              --arg publication_binding_digest "${PUBLICATION_BINDING_DIGEST}" \
              --arg source_ci_run_attempt "${CI_RUN_ATTEMPT}" \
              --arg source_ci_run_id "${CI_RUN_ID}" \
              --arg source_ci_workflow_id "${CI_WORKFLOW_ID}" \
              '{
                identity: {
                  authorized_source_sha: $authorized_source_sha,
                  evidence_sha: $evidence_sha,
                  merge_commit_sha: $merge_commit_sha,
                  pr_number: $pr_number
                },
                publication_binding_digest: $publication_binding_digest,
                schema: "chio.security-check-authority.v2",
                source_ci: {
                  run_attempt: $source_ci_run_attempt,
                  run_id: $source_ci_run_id,
                  workflow_id: $source_ci_workflow_id
                }
              }'
          })"
          check_payload="$({
            jq -cS -n \
              --arg details_url "${publication_details_url}" \
              --arg external_id "${EXTERNAL_ID}" \
              --arg head_sha "${MERGE_COMMIT_SHA}" \
              --arg summary "${summary}" \
              --arg text "${authority_text}" \
              '{
                conclusion: "success",
                details_url: $details_url,
                external_id: $external_id,
                head_sha: $head_sha,
                name: "Security contract",
                output: {
                  summary: $summary,
                  text: $text,
                  title: "Chio security authority"
                },
                status: "completed"
              }'
          })"
          revalidate_live_publication_head
          authority_created=false
          if test "${existing_authority_match_count}" = "1"; then
            check_run="$(jq -cS '.[0]' <<< "${existing_authority_matches}")"
          else
            require_publishable_ci
            revalidate_live_publication_head
            check_run="$({
              curl \
                --proto '=https' \
                --tlsv1.2 \
                --fail \
                --silent \
                --show-error \
                --request POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${installation_token}" \
                -H "Content-Type: application/json" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                --data-binary "${check_payload}" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs"
            })"
            revalidate_live_publication_head
            authority_created=true
          fi
          require_publishable_ci
          check_run_id="$(jq -r '.id' <<< "${check_run}")"
          [[ "${check_run_id}" =~ ^[1-9][0-9]*$ ]]
          test "$(jq -r '.name' <<< "${check_run}")" = "Security contract"
          test "$(jq -r '.head_sha' <<< "${check_run}")" = "${MERGE_COMMIT_SHA}"
          test "$(jq -r '.status' <<< "${check_run}")" = "completed"
          test "$(jq -r '.conclusion' <<< "${check_run}")" = "success"
          test "$(jq -r '.external_id' <<< "${check_run}")" = "${EXTERNAL_ID}"
          [[ "$(jq -r '.details_url' <<< "${check_run}")" =~ ^https://github\.com/${GITHUB_REPOSITORY}/actions/runs/[1-9][0-9]*/attempts/[1-9][0-9]*$ ]]
          if test "${authority_created}" = true; then
            test "$(jq -r '.details_url' <<< "${check_run}")" = "${publication_details_url}"
          fi
          test "$(jq -r '.app.id' <<< "${check_run}")" = "${SECURITY_APP_ID}"
          test "$(jq -r '.app.slug' <<< "${check_run}")" = "chio-security-authority"
          test "$(jq -r '.output.title' <<< "${check_run}")" = "Chio security authority"
          test "$(jq -r '.output.summary' <<< "${check_run}")" = "${summary}"
          observed_authority_text="$(jq -cS '.output.text | fromjson' <<< "${check_run}")"
          test "${observed_authority_text}" = "${authority_text}"
          verified_check="$({
            curl \
              --proto '=https' \
              --tlsv1.2 \
              --fail \
              --silent \
              --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${installation_token}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs/${check_run_id}"
          })"
          test "$(jq -r '.name' <<< "${verified_check}")" = "Security contract"
          test "$(jq -r '.head_sha' <<< "${verified_check}")" = "${MERGE_COMMIT_SHA}"
          test "$(jq -r '.status' <<< "${verified_check}")" = "completed"
          test "$(jq -r '.conclusion' <<< "${verified_check}")" = "success"
          test "$(jq -r '.external_id' <<< "${verified_check}")" = "${EXTERNAL_ID}"
          [[ "$(jq -r '.details_url' <<< "${verified_check}")" =~ ^https://github\.com/${GITHUB_REPOSITORY}/actions/runs/[1-9][0-9]*/attempts/[1-9][0-9]*$ ]]
          test "$(jq -r '.app.id' <<< "${verified_check}")" = "${SECURITY_APP_ID}"
          test "$(jq -r '.app.slug' <<< "${verified_check}")" = "chio-security-authority"
          verified_authority_text="$(jq -cS '.output.text | fromjson' <<< "${verified_check}")"
          test "${verified_authority_text}" = "${authority_text}"
          require_publishable_ci
          while IFS=$'\t' read -r mirror_name mirror_key source_check_name source_check_run_id; do
            verified_mirror_namespace="$(list_actions_mirror_checks "${mirror_name}")"
            test "$(jq -r '.total_count' <<< "${verified_mirror_namespace}")" = "1"
            expected_mirror_text="$(
              jq -cS -n \
                --arg authorized_source_sha "${AUTHORIZED_SOURCE_SHA}" \
                --arg evidence_sha "${EVIDENCE_SHA}" \
                --arg merge_commit_sha "${MERGE_COMMIT_SHA}" \
                --arg pr_number "${PR_NUMBER}" \
                --arg source_check_name "${source_check_name}" \
                --arg source_check_run_id "${source_check_run_id}" \
                --arg source_ci_run_attempt "${CI_RUN_ATTEMPT}" \
                --arg source_ci_run_id "${CI_RUN_ID}" \
                --arg source_ci_workflow_id "${CI_WORKFLOW_ID}" \
                '{identity: {authorized_source_sha: $authorized_source_sha, evidence_sha: $evidence_sha, merge_commit_sha: $merge_commit_sha, pr_number: $pr_number}, schema: "chio.security-check-authority.v2", source_check: {check_run_id: $source_check_run_id, name: $source_check_name}, source_ci: {run_attempt: $source_ci_run_attempt, run_id: $source_ci_run_id, workflow_id: $source_ci_workflow_id}}'
            )"
            test "$({
              jq -r \
                --arg external_id "${EXTERNAL_ID}:actions:${mirror_key}" \
                --arg head_sha "${MERGE_COMMIT_SHA}" \
                --arg name "${mirror_name}" \
                --arg expected_text "${expected_mirror_text}" \
                'all(.check_runs[];
                  .name == $name and
                  .head_sha == $head_sha and
                  .external_id == $external_id and
                  .status == "completed" and
                  .conclusion == "success" and
                  .app.id == 15368 and
                  .app.slug == "github-actions" and
                  ((.output.text | fromjson) == ($expected_text | fromjson))
                )' <<< "${verified_mirror_namespace}"
            })" = "true"
          done <<< "${mirror_rows}"
          require_publishable_ci
          revalidate_live_publication_head
          unset installation_token
          trap - EXIT
          echo "Five exact merge-authority contexts published for ${MERGE_COMMIT_SHA}; Security contract check run ${check_run_id}." >> "${GITHUB_STEP_SUMMARY}"
          }

          reconcile_bad_ci
          if test "${bad_ci_observed}" = false; then
            publish_success_authority
          else
            exit 1
          fi
