            "${ARTIFACT_DIGEST}" \
            "${BINDING_ARTIFACT_DIGEST}" \
            "${BINDING_SHA256}" \
            "${BROKER_BOUNDARY_DIGEST}" \
            "${CAGE_ENFORCEMENT_DIGEST}" \
            "${COMMITTED_ADVERSARIAL_EVIDENCE_DIGEST}" \
            "${COMMITTED_BINDING_DIGEST}" \
            "${CONFIGURATION_DIGEST}" \
            "${INVENTORY_DIGEST}" \
            "${KEY_LOG_TRANSPARENCY_DIGEST}" \
            "${LABELS_DIGEST}" \
            "${LINUX_ADVERSARIAL_CONTROLS_DIGEST}" \
            "${MIGRATION_STATE_STORE_DIGEST}" \
            "${RUNNER_CONTRACT_DIGEST}" \
            "${RUNNER_LABELS_DIGEST}"; do
            [[ "${digest}" =~ ^[0-9a-f]{64}$ ]]
          done
          for identifier in \
            "${ARTIFACT_ID}" \
            "${ARTIFACT_SIZE}" \
            "${BINDING_ARTIFACT_ID}" \
            "${BUILD_CHECK_RUN_ID}" \
            "${CAPTURE_ISSUED_AT_UNIX_MS}" \
            "${CAPTURE_JOB_ID}" \
            "${CAPTURE_RUN_ATTEMPT}" \
            "${CAPTURE_RUN_ID}" \
            "${CAPTURE_WORKFLOW_ID}" \
            "${CI_AGGREGATE_CHECK_RUN_ID}" \
            "${CI_RUN_ATTEMPT}" \
            "${CI_RUN_ID}" \
            "${CI_WORKFLOW_ID}" \
            "${CONTROLLER_ISSUED_AT_UNIX_MS}" \
            "${CONTROLLER_RUN_ATTEMPT}" \
            "${CONTROLLER_RUN_ID}" \
            "${CONTROLLER_WORKFLOW_ID}" \
            "${DENY_CHECK_RUN_ID}" \
            "${MSRV_CHECK_RUN_ID}" \
            "${PR_NUMBER}" \
