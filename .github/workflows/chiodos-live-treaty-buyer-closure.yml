name: Legacy Chiodos Live Treaty Buyer Closure

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-chiodos-live-treaty-buyer-closure-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  legacy-live-treaty-buyer-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Chio live treaty buyer closure gate
        run: bash scripts/check-chio-live-treaty-buyer-closure.sh
