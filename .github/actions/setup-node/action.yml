name: setup-node
description: Install Node and run an npm ci in a given working directory.
inputs:
  node-version:
    description: Node major version (e.g. "22" or "24").
    required: true
  cache-dependency-path:
    description: Path to package-lock.json for npm cache keying.
    required: false
    default: ""
  working-directory:
    description: Directory to run npm ci in. Empty skips the install.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
    - name: npm ci
      if: inputs.working-directory != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci
