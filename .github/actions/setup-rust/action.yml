name: setup-rust
description: Checkout, install the pinned Rust toolchain, install protoc, and prime the Rust cache.
inputs:
  toolchain:
    description: Toolchain spec passed to rustup. Empty string uses rust-toolchain.toml.
    required: false
    default: ""
  components:
    description: Space-separated rustup components (e.g. "rustfmt clippy").
    required: false
    default: ""
  targets:
    description: Space-separated rustup targets (e.g. "wasm32-unknown-unknown").
    required: false
    default: ""
  fetch-depth:
    description: actions/checkout fetch-depth. Use 0 for git-diff gates.
    required: false
    default: "1"
  cache:
    description: Set to "false" to skip Swatinem/rust-cache.
    required: false
    default: "true"
  cache-key:
    description: Extra cache key suffix passed to rust-cache (shared-key).
    required: false
    default: ""
  protoc:
    description: Set to "false" to skip apt-installing protobuf-compiler.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
    - name: Install Rust toolchain
      shell: bash
      run: |
        set -euo pipefail
        components=""
        for c in ${{ inputs.components }}; do components="$components --component $c"; done
        targets=""
        for t in ${{ inputs.targets }}; do targets="$targets --target $t"; done
        if [ -n "${{ inputs.toolchain }}" ]; then
          rustup toolchain install "${{ inputs.toolchain }}" --profile minimal $components $targets
          rustup default "${{ inputs.toolchain }}"
        else
          rustup toolchain install --profile minimal $components $targets
        fi
        rustup show active-toolchain
    - name: Install protobuf compiler
      if: inputs.protoc == 'true' && runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      if: inputs.cache == 'true'
      with:
        shared-key: ${{ inputs.cache-key }}
