AWSTemplateFormatVersion: "2010-09-09"
Description: "Chio AWS Bedrock integration quick launch for us-east-1"

Parameters:
  ChioControlPlaneEndpoint:
    Type: String
    AllowedPattern: "^https://.+"
    Description: "HTTPS endpoint for the Chio control plane tenant gateway."
  ChioTenantId:
    Type: String
    MinLength: 1
    MaxLength: 32
    AllowedPattern: "^[A-Za-z0-9+=,.@_-]+$"
    Description: "Tenant identifier issued by Chio during Marketplace onboarding."
  ExternalId:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: "External ID supplied by Chio for cross-account role assumption."
  ChioSellerAccountPrincipalArn:
    Type: String
    AllowedPattern: "^arn:aws:iam::[0-9]{12}:(root|role/.+)$"
    Description: "AWS principal ARN for the Chio seller account or control-plane role."

Conditions:
  IsSupportedRegion: !Equals [!Ref "AWS::Region", "us-east-1"]

Resources:
  ChioBedrockIntegrationRole:
    Type: AWS::IAM::Role
    Condition: IsSupportedRegion
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref ChioSellerAccountPrincipalArn
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                "sts:ExternalId": !Ref ExternalId
      Policies:
        - PolicyName: ChioBedrockRuntimeMinimum
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "bedrock:InvokeModel"
                  - "bedrock:InvokeModelWithResponseStream"
                Resource:
                  - "arn:aws:bedrock:us-east-1::foundation-model/*"
              - Effect: Allow
                Action:
                  - "sts:GetCallerIdentity"
                Resource: "*"

  ChioControlPlaneEndpointParameter:
    Type: AWS::SSM::Parameter
    Condition: IsSupportedRegion
    Properties:
      Name: !Sub "/chio/bedrock/${ChioTenantId}/control-plane-endpoint"
      Type: String
      Value: !Ref ChioControlPlaneEndpoint
      Description: "Chio control-plane endpoint used by the Bedrock integration."

Outputs:
  SupportedRegion:
    Description: "The listing region."
    Value: "us-east-1"
  IntegrationRoleArn:
    Condition: IsSupportedRegion
    Description: "IAM role assumed by the Chio control plane."
    Value: !GetAtt ChioBedrockIntegrationRole.Arn
  ControlPlaneEndpointParameter:
    Condition: IsSupportedRegion
    Description: "SSM parameter containing the Chio control-plane endpoint."
    Value: !Ref ChioControlPlaneEndpointParameter
