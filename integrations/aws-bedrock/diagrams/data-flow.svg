<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" role="img" aria-labelledby="title desc">
  <title id="title">Chio AWS Bedrock data flow</title>
  <desc id="desc">Customer VPC traffic enters the Chio control plane, a receipt is signed at the boundary, then Bedrock is invoked in us-east-1 and Marketplace metering records overage.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,4 L0,8 Z" fill="#1f2937"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 8; }
      .zone { fill: #f8fafc; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 6; }
      .receipt { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 8; }
      .meter { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .label { font: 15px sans-serif; fill: #111827; }
      .small { font: 12px sans-serif; fill: #374151; }
      .arrow { stroke: #1f2937; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="zone" x="30" y="55" width="250" height="330"/>
  <text class="label" x="55" y="90">Customer account and VPC</text>
  <rect class="box" x="65" y="135" width="175" height="72"/>
  <text class="label" x="90" y="166">Agent runtime</text>
  <text class="small" x="88" y="188">tenant workload</text>
  <rect class="box" x="65" y="260" width="175" height="72"/>
  <text class="label" x="86" y="292">Integration role</text>
  <text class="small" x="88" y="314">sts:GetCallerIdentity</text>

  <rect class="zone" x="365" y="55" width="260" height="330"/>
  <text class="label" x="392" y="90">Chio control plane</text>
  <rect class="meter" x="405" y="125" width="175" height="68"/>
  <text class="label" x="431" y="155">Entitlement gate</text>
  <text class="small" x="424" y="177">GetEntitlements</text>
  <rect class="receipt" x="405" y="220" width="175" height="78"/>
  <text class="label" x="442" y="250">Receipt</text>
  <text class="small" x="426" y="272">guards plus signature</text>
  <rect class="meter" x="405" y="320" width="175" height="48"/>
  <text class="label" x="430" y="350">Meter overage</text>

  <rect class="zone" x="705" y="55" width="245" height="330"/>
  <text class="label" x="735" y="90">AWS services in us-east-1</text>
  <rect class="box" x="748" y="145" width="160" height="70"/>
  <text class="label" x="782" y="176">Bedrock</text>
  <text class="small" x="772" y="198">Converse runtime</text>
  <rect class="meter" x="748" y="280" width="160" height="70"/>
  <text class="label" x="770" y="310">Marketplace</text>
  <text class="small" x="760" y="332">MeterUsage APIs</text>

  <path class="arrow" d="M240 171 C305 171 330 159 405 159"/>
  <path class="arrow" d="M492 193 L492 220"/>
  <path class="arrow" d="M580 259 C650 245 688 200 748 180"/>
  <path class="arrow" d="M240 296 C307 296 332 276 405 259"/>
  <path class="arrow" d="M580 344 C650 344 688 320 748 315"/>

  <text class="small" x="284" y="150">tenant request</text>
  <text class="small" x="607" y="233">signed, mediated call</text>
  <text class="small" x="607" y="365">receipt overage</text>
</svg>
