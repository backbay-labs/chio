services:
  kb-postgres:
    image: pgvector/pgvector:pg16@sha256:7d400e340efb42f4d8c9c12c6427adb253f726881a9985d2a471bf0eed824dff
    command: ["postgres", "-c", "maintenance_work_mem=512MB"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chio_kb}
      POSTGRES_USER: ${POSTGRES_USER:-cocoindex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cocoindex}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - kb_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: "no"

  kb-neo4j:
    image: neo4j:5.26-community@sha256:b357872da95a164c5243ca8d9060601130717ff43cee3c829402fab46209a412
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-demodemo}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - kb_neo4j_data:/data
      - kb_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: "no"

  graphiti-mcp:
    image: zepai/knowledge-graph-mcp:standalone@sha256:460bafb39439d99ff001ea6ef03efbe0bd5d9e6afe2655edf926da4fd9df97c5
    depends_on:
      kb-neo4j:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      GRAPHITI_GROUP_ID: ${GRAPHITI_GROUP_ID:-chio-repo}
      GRAPHITI_TELEMETRY_ENABLED: ${GRAPHITI_TELEMETRY_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_URL: ${OPENAI_API_URL:-https://api.openai.com/v1}
      GRAPHITI_NEO4J_URI: bolt://kb-neo4j:7687
      NEO4J_URI: bolt://kb-neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-demodemo}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      SEMAPHORE_LIMIT: ${SEMAPHORE_LIMIT:-5}
      CONFIG_PATH: /app/mcp/config/config.yaml
      PATH: /root/.local/bin:/usr/local/bin:/usr/bin:/bin
    volumes:
      - ./config/graphiti-neo4j.yaml:/app/mcp/config/config.yaml:ro
    ports:
      - "127.0.0.1:8000:8000"
    command: ["uv", "run", "main.py"]
    restart: "no"

  chio-kb-mcp:
    build:
      context: .
      dockerfile: Dockerfile.kb-mcp
    depends_on:
      kb-postgres:
        condition: service_healthy
      kb-neo4j:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER:-cocoindex}:${POSTGRES_PASSWORD:-cocoindex}@kb-postgres:5432/${POSTGRES_DB:-chio_kb}
      COCOINDEX_DB: /cocoindex/chio-kb
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_URL: ${OPENAI_API_URL:-https://api.openai.com/v1}
      NEO4J_URI: bolt://kb-neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-demodemo}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      GRAPHITI_MCP_URL: http://graphiti-mcp:8000/mcp
      GRAPHITI_MCP_HOST_HEADER: localhost:8000
      CHIO_KB_REPO_ROOT: /workspace
      # Uvicorn must listen on the container interface for Docker port
      # publishing. The published host port remains loopback-only.
      CHIO_KB_MCP_HOST: 0.0.0.0
      CHIO_KB_MCP_PORT: 8111
      CHIO_KB_MCP_BEARER_TOKEN: ${CHIO_KB_MCP_BEARER_TOKEN:-}
      CHIO_KB_EMBED_MODEL: ${CHIO_KB_EMBED_MODEL:-text-embedding-3-small}
      CHIO_KB_MAX_INFLIGHT_COMPONENTS: ${CHIO_KB_MAX_INFLIGHT_COMPONENTS:-8}
      COCOINDEX_SOURCE_MAX_INFLIGHT_ROWS: ${COCOINDEX_SOURCE_MAX_INFLIGHT_ROWS:-8}
    volumes:
      - ../..:/workspace:ro
      - kb_model_cache:/home/app/.cache
      - kb_cocoindex_state:/cocoindex
    ports:
      - "127.0.0.1:8111:8111"
    command: ["python", "-m", "chio_kb.mcp_server"]
    restart: "no"

volumes:
  kb_postgres_data:
  kb_neo4j_data:
  kb_neo4j_logs:
  kb_model_cache:
  kb_cocoindex_state:
