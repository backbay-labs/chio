# Healthcare design-partner SIEM and PagerDuty overrides for M01.P1.
deployment_id: healthcare-design-partner
pagerduty:
  service_name: chio-healthcare-pilot-prod
  endpoint: https://events.pagerduty.com/v2/enqueue
  routing_key_secret: CHIO_HEALTHCARE_PILOT_PAGERDUTY_ROUTING_KEY
  min_severity: High
  summary_phi_policy: no_phi
  include_receipt_in_custom_details: true
severity_overrides:
  pii_phi_exposure: Critical
  patient_identifier_exposure: Critical
  receipt_redaction_failure: Critical
  pagerduty_payload_phi: Critical
alert_runbooks:
  critical-deny: docs/operator-runbook/incidents.md#p0-criteria
  high-deny: docs/operator-runbook/incidents.md#p1-criteria
  exporter-dlq-overflow: docs/operator-runbook/incidents.md#p1-criteria
  trust-control-split-brain: docs/operator-runbook/incidents.md#p0-criteria
  pii_phi_exposure: docs/operator-runbook/incidents.md#phi-guardrail
heartbeat:
  cadence: weekly
  workflow: .github/workflows/healthcare-pilot-pagerduty-heartbeat.yml
