# Per-run override config for chio-guards mutation baseline.
#
# Same as workspace .cargo/mutants.toml EXCEPT the additional_cargo_test_args
# is scoped to the chio-guards package only, to avoid a pre-existing
# unrelated test failure in chio-acp-proxy
# (assertion failed: verdict.reason.contains("signature") || ...
#  verdict.reason.contains("untrusted")) which would otherwise cause every
# mutant to register as caught regardless of its own effect on chio-guards
# behavior.
#
# This is a methodology fix, not a test fix. The chio-acp-proxy failure is
# pre-existing on main (commit 708c7bb33) and is out of scope for the
# A1 mutation baseline. The CI hosted-nightly remains the authoritative
# workspace-scope measurement.
#
# Mirrors audits/mutation/per-crate-configs/chio-attest-verify.toml shape;
# see that file for the methodology rationale and the README in this
# directory for the per-crate override convention.
#
# A subset run (8 of 27 files; 119 of 1291 mutants; 9.2% surface)
# cannot retire a crate-level `>= 65%` target: such a run is labeled
# PARTIAL-SUBSET in the aggregate docs and JSON evidence, and crate-level
# target satisfaction requires either a full run OR a pre-registered
# statistically defensible sampling scheme.
#
# `text_utils.rs` and `embedding_anomaly.rs` are in `examine_globs` because
# both are decision-capable, not advisory:
#
#   - `text_utils.rs::canonicalize` is the canonical-form input to
#     prompt-injection and jailbreak guards before they make deny
#     decisions. Mutations that stop stripping zero-width characters or
#     folding homoglyphs can let obfuscated payloads evade the
#     trust-boundary guards.
#
#   - `embedding_anomaly.rs::EmbeddingAnomalyGuard` returns `Verdict::Deny` for
#     dimension mismatch (line 290), non-finite embeddings (line 293),
#     high similarity scores, and ambiguous-deny policy (line 299). Its
#     module-level doc-comment lists three explicit `Verdict::Deny`
#     paths (lines 10-28).
#
# SCOPE NOTE: chio-guards has the largest examine_globs of any
# trust-boundary crate (27 files, 1291 total mutants per
# `cargo mutants --list`). The full sweep is estimated at ~25 hours
# wall-clock on the local workstation (per-mutant rebuild + test
# averages 60-90s). This local config defines the trust-boundary core
# surface including text_utils and embedding_anomaly. The hosted nightly uses
# .cargo/mutants.toml, not this per-crate file; that workspace config
# also includes text_utils and embedding_anomaly. The nightly matrix is per
# crate, not sharded within chio-guards, so a timeout or budget
# exhaustion remains a partial result until a full completed sweep is
# recorded.
#
# Trust-boundary core surface (rationale per file):
#   - pipeline.rs           : guard pipeline orchestration
#   - forbidden_path.rs     : filesystem read-side boundary
#   - path_allowlist.rs     : filesystem write-side boundary
#   - path_normalization.rs : filesystem canonicalization (precondition)
#   - egress_allowlist.rs   : network-egress boundary
#   - secret_leak.rs        : data-flow boundary (secret detection)
#   - data_flow.rs          : cumulative-exfiltration boundary
#   - behavioral_sequence.rs: sequence-attack detection boundary
#   - text_utils.rs         : canonicalize() feeds prompt-injection /
#                             jailbreak guards before deny decisions
#   - embedding_anomaly.rs       : EmbeddingAnomalyGuard returns Verdict::Deny
#                             on multiple paths
#
# Files NOT in this local surface (measured by the hosted nightly):
#   shell_command, response_sanitization, jailbreak_detector,
#   browser_automation, content_review, behavioral_profile,
#   computer_use, memory_governance, code_execution, prompt_injection,
#   input_injection, remote_desktop, mcp_tool, jailbreak, velocity,
#   post_invocation, agent_velocity, internal_network, patch_integrity.
# These are excluded here for mutant volume, not scope-of-concern
# reasons. The full workspace .cargo/mutants.toml surface is the
# hosted-nightly input.
#
# ITEMIZED EXCLUSION RATIONALE (per file):
#
#   crates/guards/chio-guards/src/action.rs
#     OK -- pure type definitions for the Action enum; no decision
#     logic.
#
#   crates/guards/chio-guards/src/advisory.rs
#     OK -- advisory-by-design guard surface. By construction
#     advisory guards do not deny; their decisions are not on the
#     trust boundary.
#
#   crates/guards/chio-guards/src/external/**
#     PARTIAL-DEFER -- remote-process bridges, integration-tested
#     rather than mutation-tested. external/ kill-rate evidence comes
#     from the integration-test suite, not cargo-mutants.

additional_cargo_test_args = ["--package", "chio-guards"]
timeout_multiplier = 3.0
minimum_test_timeout = 60

examine_globs = [
    "crates/guards/chio-guards/src/pipeline.rs",
    "crates/guards/chio-guards/src/forbidden_path.rs",
    "crates/guards/chio-guards/src/path_allowlist.rs",
    "crates/guards/chio-guards/src/path_normalization.rs",
    "crates/guards/chio-guards/src/egress_allowlist.rs",
    "crates/guards/chio-guards/src/secret_leak.rs",
    "crates/guards/chio-guards/src/data_flow.rs",
    "crates/guards/chio-guards/src/behavioral_sequence.rs",
    # Decision-capable per audits/evidence/mutation exclusion audit/exclude-audit.md.
    "crates/guards/chio-guards/src/text_utils.rs",
    "crates/guards/chio-guards/src/embedding_anomaly.rs",
]

# Itemized exclusions (rationale per file in the header above).
exclude_globs = [
    "**/tests.rs",
    "**/test_*.rs",
    "**/*_test.rs",
    "**/tests/**",
    "**/benches/**",
    "**/build.rs",
    "**/fuzz.rs",
    "crates/guards/chio-guards/src/action.rs",
    "crates/guards/chio-guards/src/advisory.rs",
    "crates/guards/chio-guards/src/external/**",
]
