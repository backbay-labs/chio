[package]
name = "chio-groq-tools-adapter"
description = "Groq OpenAI-compatible chat/completions tool-use adapter for Chio (pinned to 2025-04)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[lib]
name = "chio_groq_tools_adapter"

# Pinned upstream API version. Bumping requires a deliberate PR with a fixture
# re-record. The same string is exposed at `crate::transport::GROQ_API_VERSION`.
[package.metadata.chio]
groq_api_version = "2025-04"

[dependencies]
chio-core = { package = "chio-core-types", path = "../chio-core-types" }
chio-provider-adapter-core = { path = "../chio-provider-adapter-core" }
chio-tool-call-fabric = { path = "../chio-tool-call-fabric" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[[bench]]
name = "verdict_latency"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
