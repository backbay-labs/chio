[package]
name = "chio-siem"
description = "SIEM exporter pipeline for Chio receipt audit logs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_siem"

[dependencies]
chio-core = { package = "chio-core-types", path = "../chio-core-types" }
chio-egress-contract = { path = "../chio-egress-contract", features = ["reqwest-egress"] }
chio-kernel = { path = "../chio-kernel" }
chio-log-redact = { path = "../chio-log-redact" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rusqlite = { workspace = true }
reqwest = { workspace = true, features = ["form", "json", "query", "rustls"] }
url = { workspace = true }
zeroize = "1"

[dev-dependencies]
chio-test-support = { path = "../chio-test-support" }
wiremock = "0.6"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
