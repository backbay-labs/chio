# Focused cargo-mutants config for chio-kernel-core.
#
# cargo-mutants 25.x does not auto-discover this file from the crate
# directory. Load it explicitly with:
#
#   cargo mutants --config crates/chio-kernel-core/mutants.toml --package chio-kernel-core
#
# Globs are workspace-rooted because cargo-mutants resolves paths with slashes
# against the source-tree root even when this file is loaded explicitly.

timeout_multiplier = 3.0
minimum_test_timeout = 60

examine_globs = [
    "crates/chio-kernel-core/src/evaluate.rs",
    "crates/chio-kernel-core/src/capability_verify.rs",
    "crates/chio-kernel-core/src/scope.rs",
    "crates/chio-kernel-core/src/receipts.rs",
    "crates/chio-kernel-core/src/passport_verify.rs",
    "crates/chio-kernel-core/src/guard.rs",
    "crates/chio-kernel-core/src/normalized.rs",
]

exclude_globs = [
    # rationale: adapters, formal harnesses, fuzz targets, tests, and benches
    # are covered by their dedicated lanes rather than kernel mutation scoring.
    "crates/chio-kernel-core/src/clock.rs", # rationale: excluded helper or verification surface.
    "crates/chio-kernel-core/src/rng.rs", # rationale: excluded helper or verification surface.
    "crates/chio-kernel-core/src/formal_aeneas.rs", # rationale: excluded helper or verification surface.
    "crates/chio-kernel-core/src/formal_core.rs", # rationale: excluded helper or verification surface.
    "crates/chio-kernel-core/src/kani_harnesses.rs", # rationale: excluded helper or verification surface.
    "crates/chio-kernel-core/src/kani_public_harnesses.rs", # rationale: excluded helper or verification surface.
    "crates/chio-kernel-core/src/fuzz.rs", # rationale: excluded helper or verification surface.
    "**/tests.rs", # rationale: excluded helper or verification surface.
    "**/test_*.rs", # rationale: excluded helper or verification surface.
    "**/*_test.rs", # rationale: excluded helper or verification surface.
    "**/tests/**", # rationale: excluded helper or verification surface.
    "**/benches/**", # rationale: excluded helper or verification surface.
]
