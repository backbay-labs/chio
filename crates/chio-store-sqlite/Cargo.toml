[package]
name = "chio-store-sqlite"
description = "SQLite-backed persistence, query, and report implementations for Chio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_store_sqlite"

[features]
default = []
# Lineage: gates the recursive-CTE query helpers and the lineage
# DAG view atop the existing receipt store. Default-off so the
# receipt store and capability lineage indexers keep their
# byte-equivalent behaviour. Enabling this feature wires the
# recursive-CTE query layer.
lineage = []

[dependencies]
chacha20poly1305 = { workspace = true }
chio-core = { package = "chio-core-types", path = "../chio-core-types" }
chio-credit = { path = "../chio-credit" }
chio-kernel = { path = "../chio-kernel" }
chio-settle = { path = "../chio-settle" }
thiserror = { workspace = true }
r2d2 = "0.8"
r2d2_sqlite = "0.33.0"
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
chio-test-support = { path = "../chio-test-support" }
criterion = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "store_receipt_write_throughput"
harness = false

[lints]
workspace = true
