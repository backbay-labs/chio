[package]
name = "chio-cohere-tools-adapter"
description = "Cohere /v2/chat tool-use adapter for Chio (pinned to v2 2025-04)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[lib]
name = "chio_cohere_tools_adapter"

# Pinned upstream API version. Bumping requires a deliberate PR with a fixture
# re-record. The same string is exposed at `crate::transport::COHERE_API_VERSION`.
[package.metadata.chio]
cohere_api_version = "2025-04"

[dependencies]
chio-core = { package = "chio-core-types", path = "../chio-core-types" }
chio-provider-adapter-core = { path = "../chio-provider-adapter-core" }
chio-tool-call-fabric = { path = "../chio-tool-call-fabric" }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = { workspace = true }

[[bench]]
name = "verdict_latency"

[lints]
workspace = true
