[package]
name = "chio-siem"
description = "SIEM exporter pipeline for Chio receipt audit logs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_siem"

[dependencies]
chio-core = { package = "chio-core-types", path = "../../core/chio-core-types" }
chio-egress-contract = { workspace = true, features = ["reqwest-egress"] }
chio-kernel = { workspace = true }
chio-log-redact = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rusqlite = { workspace = true }
reqwest = { workspace = true, features = ["form", "json", "query", "rustls"] }
url = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
chio-test-support = { workspace = true }
wiremock = "0.6"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
