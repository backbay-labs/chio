[package]
name = "chio-otel-receipt-exporter"
description = "OpenTelemetry trace ingress and receipt-store sink for Chio receipts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_otel_receipt_exporter"

[target.'cfg(not(loom))'.dependencies]
chio-core = { workspace = true }
chio-kernel = { workspace = true }
chio-metrics-spec = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
loom = { workspace = true }
proptest = { workspace = true }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
