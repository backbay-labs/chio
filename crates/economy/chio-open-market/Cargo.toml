[package]
name = "chio-open-market"
description = "Chio open-market economics and penalty contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_open_market"

[dependencies]
chio-core-types = { workspace = true }
chio-finding = { workspace = true, optional = true }
chio-fiscal = { workspace = true }
chio-governance = { workspace = true }
chio-listing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }

[features]
# The finding admission seam compiles only when this feature is enabled,
# so default builds omit it entirely and keep byte-identical behavior.
cognition-market-experimental = ["dep:chio-finding", "dep:serde_json"]

[dev-dependencies]
chio-finding = { workspace = true }
chio-test-support = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
