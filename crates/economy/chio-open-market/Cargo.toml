[package]
name = "chio-open-market"
description = "Chio open-market economics and penalty contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_open_market"

[dependencies]
base64 = { workspace = true }
chio-core-types = { workspace = true }
chio-finding = { workspace = true }
chio-fiscal = { workspace = true }
chio-governance = { workspace = true }
chio-listing = { workspace = true }
chio-pheromone = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
# Opts in to the cognition-market surface exercised by the
# `#[cfg(kani)]` public proof harness. Production builds never compile the
# harness module because cargo-kani alone supplies that cfg.
kani = []

[dev-dependencies]
chio-finding = { workspace = true }
chio-test-support = { workspace = true }
serde_json = { workspace = true }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[lints.rust]
# `cfg(kani)` is set automatically by cargo-kani. Register it so normal
# Cargo and Clippy builds keep the conditional proof module warning-free.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
