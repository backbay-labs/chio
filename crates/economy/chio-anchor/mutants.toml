# Focused cargo-mutants config for chio-anchor.
#
# cargo-mutants 25.x does not auto-discover this file from the crate
# directory. Load it explicitly with:
#
#   cargo mutants --config crates/economy/chio-anchor/mutants.toml --package chio-anchor
#
# Globs are workspace-rooted because cargo-mutants resolves paths with slashes
# against the source-tree root even when this file is loaded explicitly.

timeout_multiplier = 3.0
minimum_test_timeout = 60

examine_globs = [
    "crates/economy/chio-anchor/src/lib.rs",
    "crates/economy/chio-anchor/src/automation.rs",
    "crates/economy/chio-anchor/src/bitcoin.rs",
    "crates/economy/chio-anchor/src/bundle.rs",
    "crates/economy/chio-anchor/src/discovery.rs",
    "crates/economy/chio-anchor/src/evm/*.rs",
    "crates/economy/chio-anchor/src/functions.rs",
    "crates/economy/chio-anchor/src/ops.rs",
    "crates/economy/chio-anchor/src/solana.rs",
]

exclude_globs = [
    # rationale: fuzz, tests, and benches are verification surfaces rather
    # than production anchor publication or discovery logic.
    "crates/economy/chio-anchor/src/fuzz.rs", # rationale: excluded helper or verification surface.
    "**/tests.rs", # rationale: excluded helper or verification surface.
    "**/test_*.rs", # rationale: excluded helper or verification surface.
    "**/*_test.rs", # rationale: excluded helper or verification surface.
    "**/tests/**", # rationale: excluded helper or verification surface.
    "**/benches/**", # rationale: excluded helper or verification surface.
]
