[package]
name = "chio-web3-bindings"
description = "Alloy bindings and packaged artifacts for the official Chio web3 contract family"
version.workspace = true
edition.workspace = true
# Kani 0.67 uses Rust 1.93; this formal-proof dependency remains compatible.
rust-version = "1.93"
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_web3_bindings"

[features]
default = ["web3"]
web3 = ["dep:alloy", "dep:serde_json"]

[dependencies]
alloy = { version = "1.8.3", default-features = false, features = ["json", "json-abi", "sol-types", "std"], optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
chio-core = { workspace = true }
chio-link = { workspace = true }
chio-web3 = { workspace = true }

[lints]
workspace = true
