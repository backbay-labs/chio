[package]
name = "chio-chiodos"
description = "Offline Chiodos proof package verifier"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_chiodos"

[dependencies]
chio-core-types = { version = "0.1.0", path = "../chio-core-types" }
chio-federation = { version = "0.1.0", path = "../chio-federation" }
chio-governance = { version = "0.1.0", path = "../chio-governance" }
chio-selective-disclosure = { version = "0.1.0", path = "../chio-selective-disclosure", features = ["bbs"] }
chio-workflow = { version = "0.1.0", path = "../chio-workflow" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
