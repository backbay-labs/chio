[package]
name = "chio-chiodos-runtime"
description = "Live Chiodos runtime admission for kernel-mediated cross-vendor workflows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_chiodos_runtime"

[dependencies]
chio-chiodos = { version = "0.1.0", path = "../chio-chiodos" }
chio-core-types = { version = "0.1.0", path = "../chio-core-types" }
chio-federation = { version = "0.1.0", path = "../chio-federation" }
chio-kernel = { version = "0.1.0", path = "../chio-kernel" }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
