schema = "chio.verdict-matrix.manifest.v1"
version = 1
scenario_spec = "chio.verdict-matrix.scenario.v1"

[corpus]
status = "active"
scenario_count = 48
scenario_root = "scenarios"
scenario_index_algorithm = "sha256(relative-path-tab-file-sha256-newline)"
scenario_index_hash = "sha256:47e8d5394c807196d9567d97515e786cb1abfb0c7676e54db269ca82c735422f"
corpus_sha256 = "47e8d5394c807196d9567d97515e786cb1abfb0c7676e54db269ca82c735422f"

[corpus.categories]
capability_subset = 12
revocation_propagation = 12
replay_verdict = 12
redaction_determinism = 12

[drivers]
required = ["rust-kernel"]

[drivers.rust-kernel]
status = "active"
entrypoint = "drivers/rust"
command = "cargo test -p chio-conformance --test verdict_matrix_rust_driver --quiet"

[drivers.python-sdk]
status = "active"
entrypoint = "drivers/python"
command = "cd sdks/python/chio-sdk-python && python -m pytest tests/test_verdict_matrix.py -q"

[drivers.go-http-sdk]
status = "unsupported-no-local-verdict-emitter"
entrypoint = "drivers/go"
command = "cd sdks/go/chio-go-http && go test -run VerdictMatrix ./..."

[drivers.typescript-node-http]
status = "transport-client"
entrypoint = "drivers/typescript"
command = "cd sdks/typescript/packages/conformance && npm test -- verdict_matrix"
requires_sidecar_env = ["CHIO_VERDICT_MATRIX_SIDECAR_URL", "CHIO_SIDECAR_URL"]

# Framework wrappers (M07.P1.T5). Both delegate to typescript-node-http and
# assert the verdict tuple is preserved across the wrapper. While M02.P5.T2
# is still in flight, status stays `prepared` so matrix tooling enumerates
# the entries without attempting execution.
[drivers.typescript-ai-sdk-middleware]
status = "prepared"
entrypoint = "drivers/typescript/ai_sdk_middleware.ts"
underlying_driver = "typescript-node-http"
package = "@chio/ai-sdk-middleware"
matrix_role = "framework-wrapper"
blocked_on = "M02.P5.T2 TypeScript verdict driver shape"

[drivers.typescript-chio-next]
status = "prepared"
entrypoint = "drivers/typescript/chio_next.ts"
underlying_driver = "typescript-node-http"
package = "@chio/next"
matrix_role = "framework-wrapper"
blocked_on = "M02.P5.T2 TypeScript verdict driver shape"

[drivers.wasm-browser]
status = "partial"
entrypoint = "drivers/wasm-browser"
command = "crates/chio-conformance/verdict_matrix/drivers/wasm-browser/run.sh"
supported_categories = ["capability"]

# Deployment-shape SDK drivers (M07.P6, closes the M02 D07 deferral). The
# four drivers below re-host one of the primary kernels (Rust, Python,
# TS node-http, WASM browser, Go) but expose distinct wire surfaces and
# therefore register their own driver shape. Active execution gates on an
# operator-supplied Chio sidecar URL (CHIO_VERDICT_MATRIX_SIDECAR_URL with
# CHIO_SIDECAR_URL fallback); status stays `prepared` until the local-
# invoke / controller-test-harness wiring lands in a follow-on operator-
# tactical ticket. The cross-deployment smoke gate at
# crates/chio-conformance/tests/deployment_shape_smoke.rs asserts the
# registration shape and the verdict-tuple equality contract.
[drivers.jvm-sdk]
driver = "jvm"
status = "prepared"
entrypoint = "drivers/jvm"
command = "cd crates/chio-conformance/verdict_matrix/drivers/jvm && ./gradlew --quiet test"
underlying_driver = "rust-kernel"
matrix_role = "deployment-shape"
package = "io.backbay.chio:chio-sdk-jvm"
requires_sidecar_env = ["CHIO_VERDICT_MATRIX_SIDECAR_URL", "CHIO_SIDECAR_URL"]
blocked_on = "M07.P6 sidecar wiring (operator-tactical)"

[drivers.dotnet-sdk]
driver = "dotnet"
status = "prepared"
entrypoint = "drivers/dotnet"
command = "cd crates/chio-conformance/verdict_matrix/drivers/dotnet && dotnet test --nologo --verbosity quiet"
underlying_driver = "rust-kernel"
matrix_role = "deployment-shape"
package = "BackBay.Chio.ChioMiddleware"
requires_sidecar_env = ["CHIO_VERDICT_MATRIX_SIDECAR_URL", "CHIO_SIDECAR_URL"]
blocked_on = "M07.P6 sidecar wiring (operator-tactical)"

[drivers.lambda-deployment-shape]
driver = "lambda"
status = "prepared"
entrypoint = "drivers/lambda"
command = "cargo test -p chio-verdict-matrix-driver-lambda --quiet"
underlying_driver = "rust-kernel"
matrix_role = "deployment-shape"
package = "chio-lambda-extension"
requires_sidecar_env = ["CHIO_VERDICT_MATRIX_SIDECAR_URL", "CHIO_SIDECAR_URL"]
blocked_on = "M07.P6 local-invoke shim wiring (operator-tactical)"

[drivers.k8s-admission-webhook]
driver = "k8s"
status = "prepared"
entrypoint = "drivers/k8s"
command = "cd crates/chio-conformance/verdict_matrix/drivers/k8s && go test ./... -count=1"
underlying_driver = "rust-kernel"
matrix_role = "deployment-shape"
package = "sdks/k8s/webhooks"
requires_sidecar_env = ["CHIO_VERDICT_MATRIX_SIDECAR_URL", "CHIO_SIDECAR_URL"]
blocked_on = "M07.P6 controller test harness wiring (operator-tactical)"

[oracle]
tuple_fields = ["verdict", "reason_code", "scope_set"]
reason_registry = "spec/errors/registry.yaml"
