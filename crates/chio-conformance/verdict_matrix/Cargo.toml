[package]
name = "chio-conformance-verdict-matrix"
description = "Scenario format scaffold for Chio cross-SDK verdict comparison"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/backbay/chio"
publish = false

[lib]
name = "chio_conformance_verdict_matrix"
path = "src/lib.rs"

[workspace]

[dependencies]
chio-core = { package = "chio-core-types", path = "../../chio-core-types" }
chio-kernel = { path = "../../chio-kernel" }
chio-kernel-browser = { path = "../../chio-kernel-browser" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
toml = "0.8"
# The driver in src/driver.rs uses `#[async_trait::async_trait(?Send)]`
# on its `ToolServerConnection` impl, so the standalone crate must
# declare the macro in its own dependencies (the parent workspace's
# transitive copy is not visible to a standalone `cargo check
# --manifest-path` run because `verdict_matrix/Cargo.toml` declares
# `[workspace]` to root itself at this directory).
async-trait = "0.1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
