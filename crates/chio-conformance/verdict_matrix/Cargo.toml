[package]
name = "chio-conformance-verdict-matrix"
description = "Scenario format scaffold for Chio cross-SDK verdict comparison"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/backbay/chio"
publish = false

[lib]
name = "chio_conformance_verdict_matrix"
path = "src/lib.rs"

[workspace]

[dependencies]
chio-core = { package = "chio-core-types", path = "../../chio-core-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
toml = "0.8"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
