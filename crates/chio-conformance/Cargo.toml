[package]
name = "chio-conformance"
description = "Scenario loading and report generation for Chio cross-language conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
keywords = ["chio", "conformance", "mcp", "agent-protocol"]
categories = ["development-tools::testing", "command-line-utilities"]
include = [
    "src/**",
    "README.md",
    "Cargo.toml",
    "peers.lock.toml",
    "verdict_matrix/**",
    "tests/cross_surface/**",
    "tests/conformance/scenarios/**",
    "tests/conformance/peers/python/**",
    "tests/conformance/peers/js/**",
]

[lib]
name = "chio_conformance"

[[bin]]
name = "chio-conformance-report"
path = "src/bin/chio_conformance_report.rs"

[[bin]]
name = "chio-conformance-runner"
path = "src/bin/chio_conformance_runner.rs"

[[bin]]
name = "chio-native-conformance-runner"
path = "src/bin/chio_native_conformance_runner.rs"

[[bin]]
name = "chio-native-conformance-fixture"
path = "src/bin/chio_native_conformance_fixture.rs"

[features]
# Default keeps the historical in-repo behaviour: paths resolved relative to
# the workspace root point at the tests/conformance/{scenarios,peers,fixtures}
# directories that ship inside this repository. External consumers who pull
# the crate from crates.io can keep this feature on (the included fixtures
# under tests/conformance/{scenarios,peers/python,peers/js}/ ride along) or
# disable it via `--no-default-features` when wiring their own scenario
# directories through `ConformanceRunOptions`.
default = ["in-repo-fixtures"]
in-repo-fixtures = []

[dependencies]
chio-core = { package = "chio-core-types", version = "0.1.0", path = "../chio-core-types" }
chio-kernel = { version = "0.1.0", path = "../chio-kernel" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
toml = "0.8"
reqwest = { workspace = true, features = ["blocking", "form", "query", "rustls"] }
tiny_http = "0.12"

[[test]]
name = "verdict_matrix_rust_driver"
path = "verdict_matrix/tests/verdict_matrix_rust_driver.rs"

[[test]]
name = "diff_oracle_self_test"
path = "verdict_matrix/tests/diff_oracle_self_test.rs"

[[test]]
name = "verdict_matrix_typescript"
path = "verdict_matrix/tests/verdict_matrix_typescript.rs"

[[test]]
name = "deployment_shape_smoke"
path = "verdict_matrix/tests/deployment_shape_smoke.rs"

[[test]]
name = "verdict_matrix_cross_language"
path = "verdict_matrix/tests/verdict_matrix_cross_language.rs"

[dev-dependencies]
# M02.P5.T5: cross-language verdict-matrix oracle exercises the WASM
# browser kernel through its native (non-wasm32) cargo test surface.
chio-kernel-browser = { version = "0.1.0", path = "../chio-kernel-browser" }
# W1.1: attenuation chain-binding conformance test exercises
# verify_capability_with_floor_and_trust_root via chio-kernel-core directly.
# W1.2: sibling-sum budget conformance tests exercise
# evaluate_with_crypto_floor_and_budgets via chio-kernel-core directly.
# W1.3: portable verifier surface for negotiated-floor capability tests.
chio-kernel-core = { version = "0.1.0", path = "../chio-kernel-core" }
chio-custody-hw = { version = "0.1.0", path = "../chio-custody-hw" }
chio-http-core = { version = "0.1.0", path = "../chio-http-core" }
chio-http-session = { version = "0.1.0", path = "../chio-http-session" }
chio-guards = { version = "0.1.0", path = "../chio-guards" }
chio-weights = { version = "0.1.0", path = "../chio-weights" }
base64ct = { workspace = true, features = ["alloc"] }
coset = { workspace = true }
jsonwebtoken = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
# M05.P5.T3: threat-model coverage tests load curated adversarial
# vectors and assert each of the six initial threat IDs is backed
# by at least one non-pending DENY-asserted case.
chio-adversarial-suite = { version = "0.1.0", path = "../chio-adversarial-suite" }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
