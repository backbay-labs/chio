[package]
name = "chio-federation-transport-iroh"
description = "Iroh federation-transport adapter: accept-time admission gate over an issuer-signed EndpointId directory (sits strictly under chio-federation, replaces no trust logic)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_federation_transport_iroh"

[dependencies]
chio-core-types = { workspace = true }
chio-pheromone-relay = { workspace = true }
# Slim iroh per ADAPTER-SPEC section 8: drop metrics/portmapper/fast-apple-datapath,
# keep exactly one TLS backend (tls-ring). NEVER add test-utils (pulls axum + a relay
# server + the insecure_skip_verify dev path). iroh-gossip / iroh-blobs are the lanes
# phase (section 3.3/3.4), not this foundation.
iroh = { version = "1.0", default-features = false, features = ["tls-ring"] }
# lanes phase: gossip fan-out (lane c) + content-addressed catch-up (module catchup).
iroh-gossip = "0.101"
iroh-blobs = "0.103"
chio-federation = { workspace = true }
# Security telemetry: registered Prometheus metric-name constants. In-workspace
# path dep with no heavy transitive graph; does NOT un-slim iroh (no new runtime
# facade, counters are hand-rolled AtomicU64 in src/metrics.rs).
chio-metrics-spec = { workspace = true }
# Lane b + catch-up verify each SignedEpochRoot against the REAL pinned
# revocation-oracle verifier (Ed25519RootVerifier / EpochRootVerifier +
# SignedEpochRoot), which chio-federation does not re-export - depend on the
# oracle crate directly rather than re-implement (and weaken) the check.
chio-revocation-oracle = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
blake3 = "1"
# lane c (fan-out) receive/broadcast over iroh-gossip. `bytes` is the payload type
# `GossipSender::broadcast(Bytes)` takes and `Message::content` is; `n0-future`
# provides the `StreamExt` that drives `GossipReceiver` (a `Stream<Item=Result<Event,
# ApiError>>`). Versions match what iroh-gossip 0.101 already resolves in Cargo.lock
# (bytes 1.11.x, n0-future 0.3.x), so no new tree is pulled.
bytes = "1"
n0-future = "0.3"
# Lock-free reads on the hot admission path behind a single-writer swap, backing
# live directory reload. Already resolved at 1.9.1 in Cargo.lock as a transitive
# dep, so this promotes it to a direct dep, not a new resolution.
arc-swap = "1.9"

[dev-dependencies]
tokio = { workspace = true }
# lane c tests build + sign real `PheromoneDeposit`s (sign_deposit / PheromoneDepositBody)
# to exercise the self-signed origin-verification path. Production code reaches the
# deposit through `chio_federation`'s re-exported field types and needs no direct dep.
chio-pheromone = { workspace = true }
# The verdict-recovery test wires a real PheromoneBatchHandler with a
# RelayBatchReceiver double. The trait's report type
# (chio_pheromone_runtime::PheromoneReceiveReport) is not re-exported by
# chio-pheromone-relay, so the test names it directly; async-trait implements the
# `#[async_trait]` receiver double. Both are test-only (production reaches the report
# only through `Arc<dyn RelayBatchReceiver>`, by inference).
chio-pheromone-runtime = { workspace = true }
async-trait = { workspace = true }
# Nightly concurrency models for the per-peer counter and the ArcSwap publish/read,
# cfg-gated behind chio_iroh_transport_loom (off by default). loom is a workspace
# dep; adding it here mirrors chio-kernel.
loom = { workspace = true }
# Per-peer fairness property test.
proptest = { workspace = true }

# Explicit lint tables (mirroring chio-kernel): `[lints] workspace = true` cannot
# register the loom cfg, so switch to explicit `[lints.clippy]` (verbatim copy of
# the two workspace clippy lints) plus a `[lints.rust]` unexpected_cfgs block for
# the loom cfg.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(chio_iroh_transport_loom)"] }
