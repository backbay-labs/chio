# Pinned AWS Nitro NSM fixture corpus.
# Regenerate with: cargo run -p chio-attest-verify \
#   --example generate_nitro_fixtures --features tee-quotes
# Each entry pins file path, role, role tag, note, and sha256 digest.
# Reviewers verify a fixture matches its manifest digest by re-running
# the generator and diffing the working tree against HEAD.

[corpus]
kernel_seed_hex = "0909090909090909090909090909090909090909090909090909090909090909"
receipt_root_hex = "0808080808080808080808080808080808080808080808080808080808080808"
pcr0_hex = "777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777"

