[package]
name = "chio-attest-verify"
description = "Chio shared Sigstore verification surface (supply-chain attestation)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_attest_verify"

[dependencies]
chio-core-types = { workspace = true }
sigstore = { version = "0.14", default-features = false, features = [
    "cosign",
    "rustls-tls",
    "sigstore-trust-root",
    "bundle",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
regex = "1"
tokio = { workspace = true, features = ["rt"] }
toml = "0.8"
futures-util = "0.3"
x509-cert = { version = "0.2", default-features = false, features = ["pem", "std"] }
pem = "3"
pki-types = { version = "1.11", default-features = false, package = "rustls-pki-types" }
webpki = { version = "0.103", default-features = false, features = ["std", "aws-lc-rs"], package = "rustls-webpki" }
const-oid = "0.9"
sigstore_protobuf_specs = { version = "0.5", default-features = false }
tough = "0.22"
url = "2"
fips204 = { workspace = true, optional = true }
sev = { workspace = true, optional = true }
coset = { workspace = true, optional = true }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"], optional = true }
p384 = { version = "0.13", default-features = false, features = ["ecdsa"], optional = true }

[features]
default = []
pq = ["dep:fips204", "chio-core-types/pq"]
tee-quotes = ["dep:sev", "dep:coset", "dep:p256", "dep:p384"]
# `kani` is an opt-in feature toggle for the model-checked harness module
# (`src/kani_public_harnesses.rs`). The module body itself is gated by
# `#[cfg(kani)]` so production builds never compile it; this feature is
# kept available for tooling that wants to opt in without invoking the
# Kani toolchain (e.g. doc/clippy passes that include the module's
# inline documentation comments). No production code path depends on it.
kani = []

[dev-dependencies]
chio-adversarial-suite = { workspace = true }
tempfile = { workspace = true }
rcgen = "0.13"

# v3.18 receipt bundle migration test. Locks the byte-equivalence contract
# between classical receipts and the hybrid signing path under
# crypto_floor=allow_classical, then proves the rolled hybrid bundle
# re-verifies under crypto_floor=pq_required.
[[test]]
name = "v318_migration"
path = "tests/v318_migration.rs"
required-features = ["pq"]

# End-to-end PQ migration suite. Drives the v3.18 bundle through
# allow_classical -> allow_hybrid -> pq_required with a PQ key roll between
# stages 2 and 3, pinned against tests/fixtures/migration/key_roll_state.json.
# Threat-model row pq_signature_downgrade is the surface guarded.
[[test]]
name = "migration"
path = "tests/migration.rs"
required-features = ["pq"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[lints.rust]
# `cfg(kani)` is set automatically by the Kani toolchain (see
# `crates/trust/chio-attest-verify/src/kani_public_harnesses.rs`). Register
# the cfg with check-cfg so default `cargo build` / `cargo clippy`
# passes do not warn about an unknown cfg name.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
