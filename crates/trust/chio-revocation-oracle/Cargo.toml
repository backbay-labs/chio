[package]
name = "chio-revocation-oracle"
description = "Chio revocation oracle: signed sparse-Merkle epoch roots, freshness windows, and passport-bridge revocation lookups"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_revocation_oracle"

[dependencies]
chio-core-types = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
rs_merkle = { workspace = true }
sha2 = { workspace = true }

[features]
default = []
# Acceptance gate: enables the 3-tier swarm e2e test which
# wires this crate's signed-epoch-root path through the federation
# gossip push queue into a `chio-kernel-core::RevocationView` cache.
# The feature is dev-only (no library-side surface changes); it gates
# the integration test target itself so the workspace default build
# stays untouched.
delegation = []

[dev-dependencies]
chio-test-support = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }
chio-federation = { workspace = true }
chio-kernel-core = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "oracle_throughput"
harness = false

# Swarm acceptance test target. Runs only with
# `--features delegation` so the trust-boundary surface stays gated.
[[test]]
name = "swarm_revocation_e2e"
path = "tests/swarm_revocation_e2e.rs"
required-features = ["delegation"]

# Receipt-chain proof target. Walks the JSONL receipt log
# emitted by an in-process re-run of the swarm fixture and asserts
# the NoAllowAfterRevoke invariant on the real
# receipts: every allow has seen_epoch < revoke_epoch.
[[test]]
name = "receipt_chain_proof"
path = "tests/receipt_chain_proof.rs"
required-features = ["delegation"]

[lints]
workspace = true
