[package]
name = "chio-tee"
description = "Chio TEE shadow runner: captures kernel decisions and emits signed, redacted replay frames"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# FIPS smoke builds route Chio signing surfaces through chio-core-types'
# aws-lc-rs backed FIPS feature without changing default builds. The
# `chio-tee fips smoke` CI job builds `--features fips`.
fips = ["chio-core/fips"]

[lib]
name = "chio_tee"

[[bin]]
name = "chio-tee"
path = "src/main.rs"

[dependencies]
chio-tee-frame = { workspace = true }
chio-core = { package = "chio-core-types", path = "../../core/chio-core-types" }
chio-data-guards-redactors-default = { workspace = true }
chio-store-sqlite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
arc-swap = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
toml = "0.8"
# Pinned to 1.8.x; the derive feature provides the `Zeroize` + `ZeroizeOnDrop`
# derives used by `RawPayloadBuffer` in `src/buffer.rs`.
zeroize = { workspace = true, features = ["derive"] }

[target.'cfg(unix)'.dependencies]
# Signal handling for SIGUSR1 hot-toggle. Linux/BSD/macOS only; the toggle
# path is RPC-only on Windows.
signal-hook = "0.3"

[dev-dependencies]
chio-test-support = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
