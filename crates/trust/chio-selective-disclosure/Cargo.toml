[package]
name = "chio-selective-disclosure"
description = "Real BBS selective disclosure projections and proof packages for Chio receipts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_selective_disclosure"
test = false

[[example]]
name = "chio_fixture"
required-features = ["bbs"]

[features]
default = []
bbs = ["dep:affinidi-bbs"]

[dependencies]
chio-disclosure-lineage = { workspace = true }
chio-core-types = { workspace = true }
chio-workflow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
affinidi-bbs = { version = "=0.1.0", optional = true }

[dev-dependencies]
jsonschema = { workspace = true }

[lints]
workspace = true
