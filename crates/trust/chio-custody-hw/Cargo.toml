[package]
name = "chio-custody-hw"
description = "Chio hardware custody surface (HybridBackend-signed capabilities, replay-resistant nonce store, revocation cascade)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_custody_hw"

[features]
# The durable SQLite-backed stores (revocation oracle + nonce store) are
# the WIRED-BY-DEFAULT custody path: a default build persists revocation
# and replay state across issuer restarts. Mobile attestation consumers
# that only need verification (and want to avoid the rusqlite/OpenSSL
# graph in iOS staticlib builds) disable default features; the in-memory
# stores remain available for tests and single-process deployments.
default = ["passkey", "sqlite-store"]
# Passkey/WebAuthn relying-party verification is enabled for the custody
# issuer by default. Mobile attestation consumers can disable default
# features to avoid pulling the OpenSSL-backed webauthn-rs graph into iOS
# staticlib builds.
passkey = ["dep:webauthn-rs", "dep:webauthn-rs-proto"]
# Enable post-quantum HybridBackend signing for issuer mint paths. The
# `pq` feature pulls in `chio-core-types/pq` (ML-DSA-65 via FIPS 204).
# Classical-only deployments leave this disabled and use the Ed25519 /
# P-256 / P-384 backends directly; the signed capability bytes are
# byte-identical between classical and hybrid mode at the unsigned
# canonical envelope (the `signature` field is the only differing slot).
pq = ["chio-core-types/pq"]

# Synthetic mobile-attestation fixtures (the App Attest compact-map shape
# and caller-supplied Play Integrity JWKS). These bypasses exist only for
# deterministic tests and local development; they are compiled out of
# production builds. `cfg(test)` enables them automatically for the crate's
# own unit/integration tests, and downstream test harnesses opt in with
# `--features dev-fixtures`. NEVER enable this feature in a shipped binary:
# it re-introduces the development-fixture App Attest path and lets callers
# supply their own Play Integrity verification key set instead of the pinned
# Google root.
dev-fixtures = []

# SQLite-backed durable stores: the replay-detection `PasskeyNonceStore`
# AND the `CredentialRevocationOracle` cascade. Re-uses the rusqlite
# version pinned by the workspace (the same version chio-store-sqlite
# uses) so a deployment persists both the replay-detection store and the
# revocation cascade across issuer restarts. ON by default (see the
# `default` feature); disable default features to fall back to the
# in-memory stores for unit tests and single-process integration tests.
sqlite-store = ["dep:rusqlite"]

[dependencies]
chio-core-types = { workspace = true }
chio-revocation-oracle = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
base64ct = { workspace = true, features = ["alloc"] }
coset = { workspace = true }
der = { workspace = true }
hex = { workspace = true }
jsonwebtoken = { workspace = true }
sha2 = { workspace = true }
webauthn-rs = { workspace = true, optional = true }
webauthn-rs-proto = { workspace = true, optional = true }
x509-parser = { workspace = true, features = ["verify"] }
url = { workspace = true }
rusqlite = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
proptest = { workspace = true }
rusqlite = { workspace = true }
# Enable the synthetic mobile-attestation fixtures for this crate's own
# integration tests. Integration tests link the regular (non-`cfg(test)`)
# library, so the development-fixture helpers would otherwise be compiled
# out; this self dev-dependency turns them on under `cargo test` only,
# without making `dev-fixtures` a default feature of the shipped crate.
# `default-features = false` so a `--no-default-features` (mobile/staticlib)
# test profile is not silently re-enabled with `default = ["passkey"]` (and the
# OpenSSL-backed webauthn-rs graph) via feature unification on this self edge.
chio-custody-hw = { path = ".", default-features = false, features = ["dev-fixtures"] }

[lints]
workspace = true
