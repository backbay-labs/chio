[package]
name = "chio-mistral-tools-adapter"
description = "Mistral chat/completions tool-use adapter for Chio: forwards requests to api.mistral.ai over HTTPS, lifts tool_calls into the kernel fabric, and gates streamed responses (pinned to the 2025-04 chat/completions API)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[lib]
name = "chio_mistral_tools_adapter"

# Pinned upstream API version. Bumping requires a deliberate PR with a fixture
# re-record. The same string is exposed at `crate::transport::MISTRAL_API_VERSION`.
[package.metadata.chio]
mistral_api_version = "2025-04"

[dependencies]
chio-core = { package = "chio-core-types", path = "../chio-core-types" }
chio-provider-adapter-core = { path = "../chio-provider-adapter-core" }
chio-tool-call-fabric = { path = "../chio-tool-call-fabric" }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = { workspace = true }

[[bench]]
name = "verdict_latency"

[lints]
workspace = true
