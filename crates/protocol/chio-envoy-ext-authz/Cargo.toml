[package]
name = "chio-envoy-ext-authz"
description = "Envoy ext_authz gRPC adapter that bridges external authorization checks to the Chio kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_envoy_ext_authz"

[[bin]]
name = "chio-envoy-ext-authz"
path = "src/main.rs"
required-features = ["runtime"]

[features]
default = []
runtime = ["dep:chio-http-core", "dep:chio-core-types", "dep:reqwest", "dep:serde", "dep:serde_json", "dep:clap", "dep:axum", "dep:uuid", "dep:url", "dep:tracing-subscriber"]

[dependencies]
chio-http-core = { workspace = true, optional = true }
chio-core-types = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "rustls"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
clap = { version = "4", features = ["derive"], optional = true }
axum = { version = "0.8", optional = true }
uuid = { workspace = true, features = ["v7"], optional = true }
url = { workspace = true, optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tokio = { workspace = true }
async-trait = "0.1"
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[dev-dependencies]
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.12", features = ["transport"] }

[lints]
workspace = true
