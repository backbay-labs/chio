[package]
name = "chio-mcp-remote"
description = "Remote hosted MCP runtime surface for Chio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[package.metadata.chio]
public_entrypoint = true

[lib]
name = "chio_mcp_remote"

[dependencies]
async-trait = { workspace = true }
chio-control-plane = { workspace = true }
chio-core = { package = "chio-core-types", path = "../../core/chio-core-types" }
chio-egress-contract = { workspace = true, features = ["reqwest-egress"] }
chio-kernel = { workspace = true }
chio-mcp-adapter = { workspace = true }
chio-metrics-spec = { workspace = true }
chio-store-sqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
axum = "0.8"
async-stream = "0.3"
url = "2"
base64 = "0.22"
reqwest = { workspace = true, features = ["form", "json", "query", "rustls"] }
rusqlite = { workspace = true }
rsa = { version = "0.9", features = ["sha2"] }
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
sha2 = { workspace = true }
subtle = "2.6"

[dev-dependencies]
chio-siem = { workspace = true }

[lints]
workspace = true
