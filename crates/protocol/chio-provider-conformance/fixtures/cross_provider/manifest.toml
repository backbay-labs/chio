# Cross-provider verdict-equality oracle manifest.
#
# The oracle in `tests/cross_provider_equality.rs` asserts that the
# kernel verdict bytes recorded for the canonical
# `weather_lookup_allow` scenario are byte-identical across every
# provider listed below. This manifest is the source of truth for
# matrix cardinality; bumping the cardinality requires re-recording
# every provider's fixture corpus and updating the test in lockstep.
#
# This oracle covers 8 providers without changing the verdict-equality surface.

schema = "chio-provider-conformance.cross-provider.v1"
matrix_id = "weather_lookup_allow"
required_ci = true

