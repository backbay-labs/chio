[package]
name = "chio-a2a-edge"
description = "A2A edge crate that exposes Chio tools as blocking A2A skills with truthful compatibility isolation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_a2a_edge"

[features]
default = []
compatibility-surface = []
otel = ["chio-kernel/otel", "chio-mcp-edge/otel"]

[dependencies]
chio-core = { package = "chio-core-types", path = "../../core/chio-core-types" }
chio-cross-protocol = { workspace = true }
chio-edge-metrics = { workspace = true }
chio-kernel = { workspace = true }
chio-manifest = { workspace = true }
chio-mcp-edge = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
chio-test-support = { workspace = true }

[lints]
workspace = true
