[package]
name = "chio-tower"
description = "Tower middleware for Chio capability validation and receipt signing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_tower"

[dependencies]
async-trait = { workspace = true }
chio-core-types = { workspace = true }
chio-http-core = { workspace = true }
chio-kernel = { workspace = true }
chio-metrics-spec = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
tracing = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
tower = { version = "0.5", features = ["util", "timeout", "limit", "load-shed"] }
tower-layer = "0.3"
tower-service = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"

[dev-dependencies]
chio-store-sqlite = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }
axum = "0.8"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util", "timeout"] }

[lints]
workspace = true
