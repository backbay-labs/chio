[package]
name = "chio-mcp-adapter"
description = "Adapter that wraps MCP servers as Chio tool servers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[package.metadata.chio]
public_entrypoint = true

[lib]
name = "chio_mcp_adapter"

[dependencies]
async-trait = { workspace = true }
chio-core = { package = "chio-core-types", path = "../../core/chio-core-types" }
chio-mcp-edge = { workspace = true }
chio-kernel = { workspace = true }
chio-manifest = { workspace = true }
chrono = { version = "0.4", features = ["clock"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
# `arbitrary` is gated behind the `fuzz` feature so production builds stay
# free of fuzz instrumentation. Pulled in by `fuzz/fuzz_targets/mcp_envelope_decode.rs`
# via `chio-mcp-adapter = { features = ["fuzz"] }`.
arbitrary = { version = "1", features = ["derive"], optional = true }

[features]
# Enables `chio_mcp_adapter::fuzz`, the libFuzzer entry-point module driving
# the MCP envelope (newline-delimited JSON-RPC) parse path. Off by default;
# turned on only by the `chio-fuzz` standalone workspace at `../../fuzz`.
# Production builds never pull in `arbitrary` and never expose `fuzz` symbols.
fuzz = ["dep:arbitrary"]

[dev-dependencies]
chio-test-support = { workspace = true }

[lints]
workspace = true
