[package]
name = "chio-acp-proxy"
description = "ACP security proxy that enforces Chio capability-based access control on ACP agent sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_acp_proxy"

[features]
default = []
otel = ["chio-kernel/otel"]

[dependencies]
async-trait = { workspace = true }
chio-core = { package = "chio-core-types", path = "../../core/chio-core-types" }
chio-cross-protocol = { workspace = true }
chio-kernel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
