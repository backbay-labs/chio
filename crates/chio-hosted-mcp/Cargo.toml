[package]
name = "chio-hosted-mcp"
description = "Hosted MCP runtime surface for Chio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[package.metadata.chio]
public_entrypoint = true

[lib]
name = "chio_hosted_mcp"

[dependencies]
chio-control-plane = { path = "../chio-control-plane" }
chio-mcp-remote = { path = "../chio-mcp-remote" }

[dev-dependencies]
base64 = "0.22"
chio-core = { package = "chio-core-types", path = "../chio-core-types" }
chio-kernel = { path = "../chio-kernel" }
chio-siem = { path = "../chio-siem" }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "form", "json", "query", "rustls"] }
sha2 = { workspace = true }
url = "2"

[lints]
workspace = true
