[package]
name = "chio-external-guards"
description = "HTTP-backed external guard adapters for Chio guard pipelines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_external_guards"

[dependencies]
chio-guards = { workspace = true }
chio-core-types = { workspace = true }
chio-kernel = { workspace = true }
chio-egress-contract = { workspace = true, features = ["reqwest-egress"] }
async-trait = "0.1"
base64 = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
wiremock = "0.6"

[lints]
workspace = true
