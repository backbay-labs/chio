# Focused cargo-mutants config for chio-policy.
#
# cargo-mutants 25.x does not auto-discover this file from the crate
# directory. Load it explicitly with:
#
#   cargo mutants --config crates/guards/chio-policy/mutants.toml --package chio-policy
#
# Globs are workspace-rooted because cargo-mutants resolves paths with slashes
# against the source-tree root even when this file is loaded explicitly.

timeout_multiplier = 3.0
minimum_test_timeout = 60

examine_globs = [
    "crates/guards/chio-policy/src/evaluate.rs",
    "crates/guards/chio-policy/src/compiler/*.rs",
    "crates/guards/chio-policy/src/conditions.rs",
    "crates/guards/chio-policy/src/detection.rs",
    "crates/guards/chio-policy/src/merge.rs",
    "crates/guards/chio-policy/src/resolve.rs",
    "crates/guards/chio-policy/src/validate.rs",
    "crates/guards/chio-policy/src/regex_safety.rs",
    "crates/guards/chio-policy/src/receipt.rs",
]

exclude_globs = [
    # rationale: pure model/constants data, embedded rulesets, and tests are
    # validated through parser, compiler, schema, and policy test lanes.
    "crates/guards/chio-policy/src/models.rs", # rationale: excluded helper or verification surface.
    "crates/guards/chio-policy/src/version.rs", # rationale: excluded helper or verification surface.
    "crates/guards/chio-policy/src/rulesets/**", # rationale: excluded helper or verification surface.
    "**/tests.rs", # rationale: excluded helper or verification surface.
    "**/test_*.rs", # rationale: excluded helper or verification surface.
    "**/*_test.rs", # rationale: excluded helper or verification surface.
    "**/tests/**", # rationale: excluded helper or verification surface.
]
