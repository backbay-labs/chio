schema = "chio.verdict-matrix.manifest.v1"
version = 1
scenario_spec = "chio.verdict-matrix.scenario.v1"

[corpus]
status = "active"
scenario_count = 60
scenario_root = "scenarios"
scenario_index_algorithm = "sha256(relative-path-tab-file-sha256-newline)"
scenario_index_hash = "sha256:6ef424c7410290675d796330ec46aef1a1c3a4c56952349f452c72cdc139f0d3"
corpus_sha256 = "6ef424c7410290675d796330ec46aef1a1c3a4c56952349f452c72cdc139f0d3"

[corpus.categories]
capability_subset = 12
revocation_propagation = 12
replay_verdict = 12
redaction_determinism = 12
delivery_contract = 12

[drivers]
required = ["rust-kernel"]

[drivers.rust-kernel]
status = "active"
entrypoint = "drivers/rust"
command = "cargo test -p chio-conformance --test verdict_matrix_rust_driver --quiet"

[drivers.python-sdk]
status = "active"
entrypoint = "drivers/python"
command = "cd sdks/python/chio-sdk-python && python -m pytest tests/test_verdict_matrix.py -q"

[drivers.go-http-sdk]
status = "active"
entrypoint = "drivers/go"
command = "cd sdks/go/chio-go-http && go test -run VerdictMatrix ./..."

[drivers.typescript-node-http]
status = "transport-client"
entrypoint = "drivers/typescript"
command = "cd sdks/typescript/packages/conformance && npm test -- verdict_matrix"
requires_sidecar_env = ["CHIO_VERDICT_MATRIX_SIDECAR_URL", "CHIO_SIDECAR_URL"]

# Framework wrappers. Both delegate to typescript-node-http and assert the
# verdict tuple is preserved across the wrapper. They are wired transport
# clients: each issues a real per-scenario evaluation through its framework
# package and the underlying node-http sidecar client. Like
# typescript-node-http, active execution gates on an operator-supplied Chio
# sidecar URL (CHIO_VERDICT_MATRIX_SIDECAR_URL with CHIO_SIDECAR_URL fallback);
# without a sidecar the driver reports every scenario as unsupported.
[drivers.typescript-ai-sdk-middleware]
status = "transport-client"
entrypoint = "drivers/typescript/ai_sdk_middleware.ts"
underlying_driver = "typescript-node-http"
package = "@chio-protocol/ai-sdk-middleware"
matrix_role = "framework-wrapper"
requires_sidecar_env = ["CHIO_VERDICT_MATRIX_SIDECAR_URL", "CHIO_SIDECAR_URL"]

[drivers.typescript-chio-next]
status = "transport-client"
entrypoint = "drivers/typescript/chio_next.ts"
underlying_driver = "typescript-node-http"
package = "@chio-protocol/next"
matrix_role = "framework-wrapper"
requires_sidecar_env = ["CHIO_VERDICT_MATRIX_SIDECAR_URL", "CHIO_SIDECAR_URL"]

[drivers.wasm-browser]
status = "partial"
entrypoint = "drivers/wasm-browser"
command = "crates/tooling/chio-conformance/verdict_matrix/drivers/wasm-browser/run.sh"
# The browser `evaluate_pure` surface has no revocation store, execution-nonce
# store, guard pipeline, or output-aware terminal, so it emits real tuples for
# the capability category only. delivery_contract is deliberately absent here:
# the cross-language oracle proves the browser kernel emits no tuple for it, so
# claiming support would contradict enforced behavior. The required rust-kernel,
# python-sdk, and go-http-sdk drivers carry the delivery_contract category.
supported_categories = ["capability"]

# Deployment-shape SDK drivers. The four drivers below re-host one of the
# primary kernels (Rust, Python, TS node-http, WASM browser, Go) but expose
# distinct wire surfaces and therefore register their own driver shape. Each
# driver is a wired transport client: it forwards every scenario to a Chio
# sidecar over the production POST /chio/evaluate wire surface and emits a
# verdict tuple parsed from the response. Active execution gates on an
# operator-supplied Chio sidecar URL (CHIO_VERDICT_MATRIX_SIDECAR_URL with
# CHIO_SIDECAR_URL fallback); without a sidecar the driver reports every
# scenario as unsupported, and a sidecar that is set-but-unreachable surfaces
# as a failure rather than a silent skip. The cross-deployment smoke gate at
# crates/tooling/chio-conformance/tests/deployment_shape_smoke.rs asserts the
# registration shape and the verdict-tuple equality contract.
[drivers.jvm-sdk]
driver = "jvm"
status = "transport-client"
entrypoint = "drivers/jvm"
command = "cd crates/tooling/chio-conformance/verdict_matrix/drivers/jvm && ./gradlew --quiet test"
underlying_driver = "rust-kernel"
matrix_role = "deployment-shape"
package = "world.chio:chio-sdk-jvm"
requires_sidecar_env = ["CHIO_VERDICT_MATRIX_SIDECAR_URL", "CHIO_SIDECAR_URL"]

[drivers.dotnet-sdk]
driver = "dotnet"
status = "transport-client"
entrypoint = "drivers/dotnet"
command = "cd crates/tooling/chio-conformance/verdict_matrix/drivers/dotnet && dotnet test --nologo --verbosity quiet"
underlying_driver = "rust-kernel"
matrix_role = "deployment-shape"
package = "BackBay.Chio.ChioMiddleware"
requires_sidecar_env = ["CHIO_VERDICT_MATRIX_SIDECAR_URL", "CHIO_SIDECAR_URL"]

[drivers.lambda-deployment-shape]
driver = "lambda"
status = "transport-client"
entrypoint = "drivers/lambda"
command = "cargo test -p chio-verdict-matrix-driver-lambda --quiet"
underlying_driver = "rust-kernel"
matrix_role = "deployment-shape"
package = "chio-lambda-extension"
requires_sidecar_env = ["CHIO_VERDICT_MATRIX_SIDECAR_URL", "CHIO_SIDECAR_URL"]

[drivers.k8s-admission-webhook]
driver = "k8s"
status = "transport-client"
entrypoint = "drivers/k8s"
command = "cd crates/tooling/chio-conformance/verdict_matrix/drivers/k8s && go test ./... -count=1"
underlying_driver = "rust-kernel"
matrix_role = "deployment-shape"
package = "sdks/k8s/webhooks"
requires_sidecar_env = ["CHIO_VERDICT_MATRIX_SIDECAR_URL", "CHIO_SIDECAR_URL"]

[oracle]
tuple_fields = ["verdict", "reason_code", "scope_set"]
reason_registry = "spec/errors/registry.yaml"
