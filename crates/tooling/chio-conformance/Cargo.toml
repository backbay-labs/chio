[package]
name = "chio-conformance"
description = "Scenario loading and report generation for Chio cross-language conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "README.md"
keywords = ["chio", "conformance", "mcp", "agent-protocol"]
categories = ["development-tools::testing", "command-line-utilities"]
include = [
    "src/**",
    "README.md",
    "Cargo.toml",
    "peers.lock.toml",
    "verdict_matrix/**",
    "tests/cross_surface/**",
    "tests/runtime_edges/**",
    "tests/conformance/fixtures/mcp_core/**",
    "tests/conformance/native/scenarios/**",
    "tests/conformance/scenarios/**",
    "tests/conformance/peers/python/**",
    "!tests/conformance/peers/python/__pycache__/**",
    "tests/conformance/peers/js/**",
]

[lib]
name = "chio_conformance"

[[bin]]
name = "chio-conformance-report"
path = "src/bin/chio_conformance_report.rs"

[[bin]]
name = "chio-conformance-runner"
path = "src/bin/chio_conformance_runner.rs"

[[bin]]
name = "chio-native-conformance-runner"
path = "src/bin/chio_native_conformance_runner.rs"

[[bin]]
name = "chio-native-conformance-fixture"
path = "src/bin/chio_native_conformance_fixture.rs"

[features]
# Default resolves fixture paths relative to the workspace root, pointing at
# the tests/conformance/{scenarios,peers,fixtures}
# directories that ship inside this repository. External consumers who pull
# the crate from crates.io can keep this feature on (the included fixtures
# under tests/conformance/{scenarios,peers/python,peers/js}/ ride along) or
# disable it via `--no-default-features` when wiring their own scenario
# directories through `ConformanceRunOptions`.
default = ["in-repo-fixtures"]
in-repo-fixtures = []
chio-bbs = [
    "dep:chio-selective-disclosure",
    "dep:chio-workflow",
    "chio-selective-disclosure/bbs",
]

[package.metadata.chio]
public_entrypoint = true

[dependencies]
chio-core = { package = "chio-core-types", version = "0.1.0", path = "../../core/chio-core-types" }
chio-kernel = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = "0.8"
reqwest = { workspace = true, features = ["blocking", "form", "query", "rustls"] }
tiny_http = "0.12"
chio-selective-disclosure = { path = "../../trust/chio-selective-disclosure", default-features = false, optional = true }
chio-workflow = { workspace = true, optional = true }

[[test]]
name = "authoritative_spend_enforcement"
path = "tests/authoritative_spend_enforcement.rs"

[[test]]
name = "authoritative_spend_double_spend"
path = "tests/authoritative_spend_double_spend.rs"

[[test]]
name = "authoritative_spend_predicate_matrix"
path = "tests/authoritative_spend_predicate_matrix.rs"

[[test]]
name = "verdict_matrix_rust_driver"
path = "verdict_matrix/tests/verdict_matrix_rust_driver.rs"

[[test]]
name = "diff_oracle_self_test"
path = "verdict_matrix/tests/diff_oracle_self_test.rs"

[[test]]
name = "verdict_matrix_typescript"
path = "verdict_matrix/tests/verdict_matrix_typescript.rs"

[[test]]
name = "deployment_shape_smoke"
path = "verdict_matrix/tests/deployment_shape_smoke.rs"

[[test]]
name = "verdict_matrix_cross_language"
path = "verdict_matrix/tests/verdict_matrix_cross_language.rs"

[dev-dependencies]
# verdict-matrix test targets (deployment_shape_smoke, diff_oracle_self_test)
# compile verdict_matrix/src/diff_oracle.rs, which parses the error registry as YAML.
serde_yaml = { workspace = true }
# Cross-language verdict-matrix oracle exercises the WASM
# browser kernel through its native (non-wasm32) cargo test surface.
chio-kernel-browser = { workspace = true }
chio-federation = { workspace = true, features = ["demo"] }
# Attenuation chain-binding conformance test exercises
# verify_capability_with_floor_and_trust_root via chio-kernel-core directly.
# Sibling-sum budget conformance tests exercise
# evaluate_with_crypto_floor_and_budgets via chio-kernel-core directly.
# Portable verifier surface for negotiated-floor capability tests.
chio-kernel-core = { workspace = true }
chio-swarm-authority = { workspace = true }
# `dev-fixtures` exposes the synthetic App Attest compact-map shape and the
# Play Integrity signer/JWKS helpers that the mobile-attestation threat tests
# use to mint deterministic adversarial inputs. These bypasses are compiled
# out of production builds of chio-custody-hw; the threat suite is a
# test-only consumer, so it opts in here.
# `default-features = false` so conformance fixtures do not pull the
# `default = ["passkey"]` WebAuthn/OpenSSL graph the threat tests never use;
# only `dev-fixtures` is requested.
chio-custody-hw = { workspace = true, default-features = false, features = ["dev-fixtures"] }
chio-http-core = { workspace = true }
chio-http-session = { workspace = true }
chio-guards = { workspace = true }
chio-weights = { workspace = true }
base64ct = { workspace = true, features = ["alloc"] }
# Negative conformance fixture: `b4_bilateral_dsse_signature_slice.rs`
# re-encodes signature bytes in base64 to forge a DSSE envelope;
# chio-federation's DSSE envelope wire format is RFC 4648 standard
# base64 (workspace-pinned `base64` crate).
base64 = { workspace = true }
# c2_bilateral_invocation_partial_verifier.rs hex-encodes canonical-JSON
# SHA-256 governance receipt digests. Keep the workspace-pinned crate so test
# and producer encodings match.
hex = { workspace = true }
coset = { workspace = true }
jsonwebtoken = { workspace = true }
jsonschema = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
# Threat-model coverage tests load curated adversarial
# vectors and assert each of the six initial threat IDs is backed
# by at least one non-pending DENY-asserted case.
chio-adversarial-suite = { workspace = true }
# SSRF negative-conformance tests exercise typed HttpEgressContract
# enforcement through real production callers (chio-siem WebhookExporter,
# chio-siem SplunkHecExporter, chio-siem DatadogExporter, chio-link
# PythHermesClient, chio-openapi-mcp-bridge OpenApiMcpBridge,
# chio-a2a-adapter A2aAdapter).
chio-egress-contract = { workspace = true }
chio-siem = { workspace = true }
chio-link = { workspace = true }
chio-openapi-mcp-bridge = { workspace = true }
chio-a2a-adapter = { workspace = true }
chio-mcp-remote = { workspace = true }
chio-api-protect = { workspace = true }
chio-external-guards = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
url = "2"
zeroize = { workspace = true }
# Anchor-batch witness-lane conformance tests exercise
# AnchorWitnessClient (RekorClient + OtsClient) and the WitnessState
# state machine via the chio-anchor crate. tokio drives the async
# trait surface; tiny_http stages the mock Rekor server.
chio-anchor = { workspace = true }
async-trait = "0.1"
# Negative conformance test: anchor_batch_witness_impersonation_rejected.rs
# forges a Rekor SET
# under an attacker-held P-256 key to prove the verifier rejects it.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pem"] }
rand = { workspace = true }
proptest = { workspace = true }
chio-store-sqlite = { workspace = true }
rusqlite = { workspace = true }
tempfile = { workspace = true }
# Registry-consumed smoke test pulls in the six edges plus
# chio-wasm-guards so it can drive each emission boundary directly.
chio-mcp-edge = { workspace = true }
chio-acp-edge = { workspace = true }
chio-a2a-edge = { workspace = true }
chio-manifest = { workspace = true }
chio-wasm-guards = { path = "../../guards/chio-wasm-guards", default-features = false, features = ["wasmtime-runtime"] }
chio-metrics-spec = { workspace = true }
# Registry-consumed smoke test also drives the iroh federation-transport security
# metrics (admission 403 + identity verify-failure) through their real public
# paths. `iroh` (slim, matching the transport crate) mints the EndpointId/SecretKey
# the directory fixture needs.
chio-federation-transport-iroh = { workspace = true }
iroh = { version = "1.0", default-features = false, features = ["tls-ring"] }
# The metrics conformance gate also count-checks the remaining iroh
# federation-transport families through their real public production paths:
# `chio-pheromone-relay` supplies the `SqlitePheromoneRelayStore` outbox the
# `drain_outbox_over_iroh` helper drains (driving `outbox_total`), and
# `chio-revocation-oracle` supplies the `SignedEpochRoot` type the stub
# `RevocationRootSink` / `RevocationCatchupHistory` seams name so a real
# `RevocationHandler` accept can be driven over loopback QUIC (driving
# `lane_total` and `accept_duration_seconds`).
chio-pheromone-relay = { workspace = true }
chio-revocation-oracle = { workspace = true }
wat = "1.246"
# tee_quote_forgery threat-evidence test imports chio-tee-frame to
# drive validate_signed and verify_tenant_sig deny branches with forged
# tenant signatures.
chio-tee-frame = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
