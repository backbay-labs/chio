[package]
name = "chio-http-core"
description = "Protocol-agnostic HTTP security types for the Chio kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_http_core"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
chio-core-types = { workspace = true }
chio-cross-protocol = { workspace = true }
chio-egress-contract = { workspace = true }
chio-kernel = { workspace = true }
chio-metrics-spec = { workspace = true }

[features]
default = []
# Re-exports `chio-egress-contract`'s reqwest helper. Callers that already
# depend on `reqwest` and on this crate get `send_with_contract` via
# `chio_http_core::send_with_contract`.
reqwest-egress = ["chio-egress-contract/reqwest-egress"]

[dev-dependencies]
chio-core = { workspace = true }
chio-store-sqlite = { workspace = true }
chio-test-support = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["rustls"] }

[lints]
workspace = true
