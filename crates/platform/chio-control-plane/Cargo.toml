[package]
name = "chio-control-plane"
description = "Trust-control service, client, and shared runtime support for Chio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[package.metadata.chio]
public_entrypoint = true

[lib]
name = "chio_control_plane"

[features]
default = []
pq = ["chio-core/pq", "chio-kernel/pq", "chio-store-sqlite/pq"]
[dependencies]
async-trait = { workspace = true }
chio-agent-web-interop = { workspace = true }
chio-finding = { workspace = true }
chio-finding-challenge = { workspace = true }
chio-revocation-oracle = { workspace = true }
chio-spec-validate = { workspace = true }
chio-appraisal = { workspace = true }
chio-commerce-order = { workspace = true }
chio-core = { workspace = true }
chio-credentials = { workspace = true }
chio-data-guards = { workspace = true }
chio-errors = { workspace = true }
chio-enterprise-export = { workspace = true }
chio-did = { workspace = true }
chio-egress-contract = { workspace = true }
chio-external-guards = { workspace = true }
chio-federation = { workspace = true }
chio-fiscal = { workspace = true }
chio-http-serve = { workspace = true }
chio-kernel = { workspace = true }
chio-log-redact = { workspace = true }
chio-open-market = { workspace = true }
chio-metrics-spec = { workspace = true }
chio-guards = { workspace = true }
chio-policy = { workspace = true }
chio-reputation = { workspace = true }
chio-conformance = { workspace = true }
chio-mcp-adapter = { workspace = true }
chio-store-sqlite = { workspace = true }
chio-risk-comptroller = { workspace = true }
chio-settle = { workspace = true }
chio-transaction-passport = { workspace = true }
chio-trust-market-context = { workspace = true }
chio-underwriting = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yml = { workspace = true }
thiserror = { workspace = true }
clap = { version = "4", features = ["derive"] }
tracing = { workspace = true }
tokio = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
subtle = "2.6"
axum = "0.8"
reqwest = { workspace = true, features = ["blocking", "form", "json", "query", "rustls"] }
ureq = { version = "2.10", features = ["json"] }
serde_urlencoded = "0.7"
percent-encoding = "2"
rusqlite = { workspace = true }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
chrono = { version = "0.4", features = ["clock"] }
base64 = "0.22"
ciborium = "0.2"
rsa = { version = "0.9", features = ["sha2"] }
p384 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
x509-cert = "0.2"
url = "2"
uuid = { workspace = true }
libc = "0.2"
nix = { version = "0.31.2", features = ["dir", "user"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
chio-anchor = { workspace = true }
chio-finding-verifier = { workspace = true }
chio-link = { workspace = true }
chio-store-sqlite = { workspace = true, features = ["cognition-market-test-support"] }
chio-test-support = { workspace = true }
proptest = { workspace = true }
rcgen = "0.13"
tempfile = { workspace = true }
tower = { workspace = true }

[lints]
workspace = true
