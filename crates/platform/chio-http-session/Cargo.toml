[package]
name = "chio-http-session"
description = "Per-session journal tracking request history, cumulative data flow, and tool invocation sequence for Chio guards"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_http_session"

[dependencies]
chio-bounded = { workspace = true }
# Journal entry cap is single-sourced from the kernel's MemoryBudgetConfig.
# chio-kernel already coexists with this crate in every consumer via
# chio-guards, so this edge adds no new crate to the build graph.
chio-kernel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
