[package]
name = "chio-store-sqlite"
description = "SQLite-backed persistence, query, and report implementations for Chio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_store_sqlite"

[features]
default = []
pq = ["chio-core/pq", "chio-kernel/pq"]
# Lineage: gates the recursive-CTE query helpers and the lineage
# DAG view atop the existing receipt store. Default-off so the
# receipt store and capability lineage indexers keep their
# byte-equivalent behaviour. Enabling this feature wires the
# recursive-CTE query layer.
lineage = []
# Deterministic fault-injection hooks used only by the separate-process chaos
# harness. Default-off so production store builds expose no environment-driven
# pause points.
chaos-test-hooks = []
# Cognition market: gates the durable finding-market store (published
# findings, replay-recipe blobs, collateral allocations, fee events,
# and venue admissions) for the M2 publish-and-discover wedge.
# Default-off so the workspace ships dark with byte-identical
# behaviour. Enabling this feature wires the finding-market schema and
# store atop the serving-owner fence, plus the chio-finding artifact
# types it persists.
cognition-market-experimental = ["dep:chio-finding"]

[dependencies]
chacha20poly1305 = { workspace = true }
chio-agent-web-interop = { workspace = true }
chio-core = { package = "chio-core-types", path = "../../core/chio-core-types" }
chio-credit = { workspace = true }
chio-federation = { workspace = true }
chio-federation-authority = { workspace = true }
chio-finding = { workspace = true, optional = true }
chio-fiscal = { workspace = true }
chio-kernel = { workspace = true }
chio-kernel-core = { workspace = true }
chio-settle = { workspace = true }
chio-supervisor = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
r2d2 = "0.8"
r2d2_sqlite = "0.33.0"
serde = { workspace = true }
serde_json = { workspace = true }
subtle = "2.6"
rusqlite = { workspace = true }
rand_core = { workspace = true }
libc = "0.2"
nix = { version = "0.31.2", features = ["user"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
async-trait = { workspace = true }
chio-kernel = { workspace = true, features = ["admission-test-support"] }
chio-test-support = { workspace = true }
criterion = { workspace = true }
frost-ed25519 = { workspace = true }
loom = { workspace = true }
proptest = { workspace = true }
rand_chacha = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "store_receipt_write_throughput"
harness = false

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)", "cfg(chio_store_sqlite_loom)"] }
