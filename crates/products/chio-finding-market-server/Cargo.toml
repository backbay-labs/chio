[package]
name = "chio-finding-market-server"
description = "Authenticated PostgreSQL cognition-market HTTP server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "chio-finding-market-server"
path = "src/main.rs"

[dependencies]
chio-control-plane = { workspace = true }
chio-core-types = { workspace = true }
chio-finding-hosted-edge = { workspace = true }
chio-finding-market-store-postgres = { workspace = true }
clap = { version = "4", features = ["derive"] }
nix = { version = "0.31.2", features = ["user"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
