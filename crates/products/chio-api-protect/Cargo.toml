[package]
name = "chio-api-protect"
description = "Zero-code reverse proxy that protects HTTP APIs with Chio receipts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[lib]
name = "chio_api_protect"

[package.metadata.chio]
public_entrypoint = true

[dependencies]
async-trait = { workspace = true }
chio-control-plane = { workspace = true }
chio-core-types = { workspace = true }
chio-http-core = { workspace = true, features = ["reqwest-egress"] }
chio-http-serve = { workspace = true }
chio-kernel = { workspace = true }
chio-metrics-spec = { workspace = true }
chio-openapi = { workspace = true }
chio-store-sqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
tracing = { workspace = true }
url = { workspace = true }
axum = "0.8"
rusqlite = { workspace = true }
subtle = "2.6"

[dev-dependencies]
chio-test-support = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
