[package]
name = "chio-cli"
description = "CLI binary for the Chio runtime kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "chio"
autobins = false
readme = "README.md"
publish = false

[package.metadata.chio]
public_entrypoint = true

[[bin]]
name = "chio"
path = "src/bin/chio.rs"

[dependencies]
async-trait = { workspace = true }
chio-appraisal = { workspace = true }
chio-arena = { workspace = true }
chio-api-protect = { workspace = true }
chio-attest-buyer-core = { workspace = true }
chio-federation-authority = { workspace = true }
chio-attest-loopback = { workspace = true }
chio-runtime-core = { workspace = true }
chio-runtime-harness = { workspace = true }
chio-commerce-order = { workspace = true }
chio-control-plane = { workspace = true }
chio-acp-proxy = { workspace = true }
chio-core = { workspace = true }
chio-core-types = { workspace = true }
chio-credentials = { workspace = true }
chio-data-guards = { workspace = true }
chio-egress-contract = { workspace = true, features = ["reqwest-egress"] }
chio-errors = { workspace = true }
chio-did = { workspace = true }
chio-external-guards = { workspace = true }
chio-federation = { workspace = true }
chio-federation-transport-iroh = { workspace = true, optional = true }
iroh = { version = "1.0", default-features = false, features = ["tls-ring"], optional = true }
chio-finding = { workspace = true, optional = true }
chio-finding-verifier = { workspace = true, optional = true }
chio-open-market = { workspace = true, optional = true }
chio-spec-validate = { workspace = true, optional = true }
chio-hosted-mcp = { workspace = true }
chio-http-serve = { workspace = true }
chio-kernel = { workspace = true }
chio-guards = { workspace = true }
chio-guard-registry = { workspace = true, features = ["marketplace"] }
chio-underwriting = { workspace = true }
chio-web3 = { workspace = true }
chio-lineage = { workspace = true }
chio-listing = { workspace = true }
chio-log-redact = { workspace = true }
chio-metrics-spec = { workspace = true }
chio-policy = { workspace = true }
chio-proof-room = { workspace = true }
chio-mcp-adapter = { workspace = true }
chio-mcp-remote = { workspace = true }
chio-attest-buyer = { workspace = true }
chio-attest-verify = { workspace = true }
chio-weights = { workspace = true }
chio-conformance = { workspace = true }
chio-pheromone = { workspace = true }
chio-pheromone-relay = { workspace = true }
chio-pheromone-runtime = { workspace = true }
chio-replay-corpus = { workspace = true }
chio-reputation = { workspace = true }
chio-runtime = { workspace = true }
chio-swarm-authority = { workspace = true }
chio-selective-disclosure = { workspace = true, features = ["bbs"] }
chio-store-sqlite = { workspace = true }
chio-tee-frame = { workspace = true }
chio-tool-call-fabric = { workspace = true }
chio-trace-validate = { workspace = true }
chio-workflow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yml = { workspace = true }
thiserror = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = { workspace = true }
hex = { workspace = true }
subtle = "2.6"
tokio = { workspace = true }
axum = "0.8"
async-stream = "0.3"
url = "2"
percent-encoding = "2"
base64 = "0.22"
reqwest = { workspace = true, features = ["blocking", "form", "json", "query", "rustls"] }
ureq = { version = "2.10", features = ["json"] }
serde_urlencoded = "0.7"
toml = "0.8"
rusqlite = { workspace = true }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
chrono = { version = "0.4", features = ["clock"] }
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
chio-wasm-guards = { workspace = true, features = ["wasmtime-runtime"] }
ed25519-dalek = { workspace = true }
wasmparser = "0.221"
flate2 = "1"
tar = "0.4"
zstd = "0.13"
libc = "0.2"
rand_core = { workspace = true }
semver = "1"
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
chio-credit = { workspace = true }
chio-open-market = { workspace = true }
chio-settle = { workspace = true }
chio-test-support = { workspace = true }
insta = { version = "1.42", features = ["json", "redactions"] }
jsonschema = { workspace = true }
rand_core = { workspace = true }
rsa = { version = "0.9", features = ["sha2"] }
tempfile = "3"
wiremock = "0.6"

[features]
tee-quotes = ["chio-attest-verify/tee-quotes"]
# Default-OFF. Gating iroh out of the shipped `chio` binary shrinks its size and
# supply-chain surface (for example the iroh -> netwatch -> netdev -> plist -> quick-xml
# RUSTSEC-2026-0194 / 0195 chain, deny.toml:62-71). It does NOT remove iroh from
# `cargo build --workspace` / `cargo test --workspace`: chio-federation-transport-iroh
# stays a workspace member (root Cargo.toml:85) and a chio-conformance dev-dep
# (crates/tooling/chio-conformance/Cargo.toml). Containment, not removal.
iroh = ["dep:chio-federation-transport-iroh", "dep:iroh"]
# Default-OFF. The `chio finding` family and the crates behind it compile
# only under this flag, matching the control plane, whose finding routes
# are gated by the same feature name. Default builds link none of it.
cognition-market-experimental = [
    "dep:chio-finding",
    "dep:chio-finding-verifier",
    "dep:chio-open-market",
    "dep:chio-spec-validate",
    "chio-control-plane/cognition-market-experimental",
    "chio-open-market/cognition-market-experimental",
]

[lints]
workspace = true
