[package]
name = "chio-wall"
description = "Chio-Wall companion-product CLI built on Chio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "chio-wall"
autobins = false
readme = "README.md"
publish = false

[package.metadata.chio]
public_entrypoint = true

[[bin]]
name = "chio-wall"
path = "src/main.rs"

[dependencies]
chio-control-plane = { workspace = true }
chio-core = { workspace = true }
chio-guards = { workspace = true }
chio-kernel = { workspace = true }
chio-metrics-spec = { workspace = true }
chio-siem = { workspace = true }
chio-store-sqlite = { workspace = true }
chio-wall-core = { workspace = true }
chrono = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
