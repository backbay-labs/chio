[package]
name = "chio-provider-adapter-core"
description = "Shared provider-adapter primitives for Chio native tool adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_provider_adapter_core"

[dependencies]
chio-core = { package = "chio-core-types", path = "../chio-core-types" }
chio-tool-call-fabric = { path = "../chio-tool-call-fabric" }
async-trait = { workspace = true }
reqwest = { workspace = true, features = ["json", "query", "rustls"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
chio-test-support = { path = "../chio-test-support" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = { workspace = true }

[lints]
workspace = true
