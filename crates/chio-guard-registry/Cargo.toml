[package]
name = "chio-guard-registry"
description = "Chio guard OCI registry client scaffold"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_guard_registry"

[features]
default = []
# M09 marketplace: gates the optional `price: GuardPrice` and
# `reputation_floor: ReputationTier` manifest fields. Default-off so the
# trajectory-1 M06 cosign-gated publish and pull paths keep working
# unchanged. Enabling this feature in M09 P4 wires the marketplace
# discovery surface; P0 lands the gate only.
marketplace = ["dep:chio-reputation"]

[dependencies]
chio-attest-verify = { path = "../chio-attest-verify" }
chio-reputation = { path = "../chio-reputation", optional = true }
oci-distribution = { version = "0.11", default-features = false, features = ["rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true }
tokio = { workspace = true }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
