[package]
name = "chio-guard-registry"
description = "Chio guard OCI registry client with local Sigstore bundle verification and offline cache support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_guard_registry"

[features]
default = []
# Marketplace: gates the optional `price: GuardPrice` and
# `reputation_floor: ReputationTier` manifest fields. Default-off so the
# local Sigstore bundle verification and pull paths keep working unchanged. Enabling
# this feature wires the marketplace discovery surface.
marketplace = ["dep:chio-reputation"]
# Regression-only feature that pulls chio-attest-verify/pq so
# the cosign-bundle regression test can exercise the verifier under all
# three crypto_floor settings. Cosign payload bytes themselves are NOT
# hybrid-signed; this feature exists solely to ride the same compile
# matrix the kernel-side hybrid path runs in.
pq = ["chio-attest-verify/pq"]

[[test]]
name = "cosign_under_crypto_floor"
path = "tests/cosign_under_crypto_floor.rs"
required-features = ["pq"]

[dependencies]
chio-attest-verify = { path = "../chio-attest-verify" }
chio-egress-contract = { path = "../chio-egress-contract", features = ["reqwest-egress"] }
chio-reputation = { path = "../chio-reputation", optional = true }
oci-distribution = { version = "0.11", default-features = false, features = ["rustls-tls"] }
reqwest = { workspace = true, features = ["json", "query", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
testcontainers = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
