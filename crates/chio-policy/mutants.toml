# Focused cargo-mutants config for chio-policy.
#
# cargo-mutants 25.x does not auto-discover this file from the crate
# directory. Load it explicitly with:
#
#   cargo mutants --config crates/chio-policy/mutants.toml --package chio-policy
#
# Globs are workspace-rooted because cargo-mutants resolves paths with slashes
# against the source-tree root even when this file is loaded explicitly.

timeout_multiplier = 3.0
minimum_test_timeout = 60

examine_globs = [
    "crates/chio-policy/src/evaluate.rs",
    "crates/chio-policy/src/compiler.rs",
    "crates/chio-policy/src/conditions.rs",
    "crates/chio-policy/src/detection.rs",
    "crates/chio-policy/src/merge.rs",
    "crates/chio-policy/src/resolve.rs",
    "crates/chio-policy/src/validate.rs",
    "crates/chio-policy/src/regex_safety.rs",
    "crates/chio-policy/src/receipt.rs",
]

exclude_globs = [
    "crates/chio-policy/src/models.rs",
    "crates/chio-policy/src/version.rs",
    "crates/chio-policy/src/rulesets/**",
    "**/tests.rs",
    "**/test_*.rs",
    "**/*_test.rs",
    "**/tests/**",
]
