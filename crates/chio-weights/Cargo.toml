[package]
name = "chio-weights"
description = "Chio model-card surface (M10 P4 signed weights cards, cosign bundle helper, kernel binding refusal, arc bind --card)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "chio_weights"

[dependencies]
chio-core-types = { path = "../chio-core-types" }
chio-attest-verify = { path = "../chio-attest-verify" }
chio-lineage = { path = "../chio-lineage" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
chio-provider-conformance = { path = "../chio-provider-conformance" }
serde_json = { workspace = true }
toml = { workspace = true }

[features]
default = []
# Smoke subset gate: PR CI runs cross-provider equivalence on the
# canonical 8-fixture cross_provider matrix (one fixture per provider
# / adversary class) when this feature is enabled. The full
# 8-provider * 12-fixture sweep (96 fixtures) runs nightly via the
# existing trajectory-1 M07 nightly conformance lane and is not
# duplicated here.
smoke = []

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
