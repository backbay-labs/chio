# Frozen runtime-limit snapshot for the WASM-guard escape harness.
#
# Every escape companion fixture under
# `crates/chio-wasm-guards/tests/escape/` loads these limits and asserts
# them against the live `chio-wasm-guards` constants. Any change to
# `MAX_MEMORY_BYTES`, `DEFAULT_MAX_MODULE_SIZE`, or the fuel ceiling
# enforced by the host runtime must be paired with a deliberate update
# here AND a CODEOWNERS review (matches the threat-model risk-register
# entry on "false negatives from runtime config drift").
#
# Format: TOML, schema_version = 1.

schema_version = 1

# Maximum guest linear memory (bytes). Mirrors `host::MAX_MEMORY_BYTES`.
# 16 MiB.
max_memory_bytes = 16777216

# Maximum compiled module size (bytes). Mirrors
# `runtime::wasmtime_backend::DEFAULT_MAX_MODULE_SIZE`. 10 MiB.
max_module_size = 10485760

# Fuel ceiling used by every escape companion fixture. Chosen tight
# enough that a fuel-exhaustion or deep-recursion module trips
# FuelExhausted / Trap inside one evaluate call without dragging the
# test suite into multi-second iterations.
escape_fuel_limit = 50000
