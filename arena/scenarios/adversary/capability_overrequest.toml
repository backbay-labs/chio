[[guards]]
id = "native-allowlist"
mode = "enforce"
config_ref = "guards/native-allowlist.toml"

[[steps]]
id = "step-1"
agent = "agent-a"
server = "filesystem"
tool = "read_file"
arguments = { path = "/tmp/adversary/capability-overrequest.txt" }
expect_verdict = "allow"

[[adversaries]]
class = "capability-overrequest"
population = "default-overrequest"
seed_ref = "scope-monotone"
