schema = "chio.kani.multi-crate.v1"

# Multi-crate Kani harness manifest (Kani multi-crate manifest).
#
# Each `[[harness]]` entry pins one (crate, harness) pair the Kani workflows
# iterate. The runner invokes the harness with:
#
#     cargo kani -p <crate> --lib \
#       --harness kani_public_harnesses::<name> --exact \
#       --default-unwind <default_unwind> [--no-unwinding-checks]
#
# Manifest values remain leaf names. The runner qualifies them through the
# standardized crate-local `kani_public_harnesses` module at invocation time.
#
# Wrapped under a per-harness wall-clock cap of `timeout_secs`.
#
# Lanes:
#   * lane = "pr"      Runs on scoped PR changes and in the nightly sweep.
#   * lane = "nightly" Runs only in the nightly Kani sweep.
#
# This file is the source of truth for the multi-crate sweep. The public-core
# runner reads `formal/rust-verification/kani-public-harnesses.toml`; the
# chio-kernel-core entries below mirror its PR lane for multi-crate consumers.
# `scripts/tests/check-kani-public-core.test.sh` fails if the two lists drift.
#
# Adding a harness:
#   1. Land the `#[kani::proof]` in `crates/<crate>/src/<file>.rs`,
#      gated by `#[cfg(kani)]`.
#   2. Append a `[[harness]]` block here. For chio-kernel-core, also update the
#      public-core registry.
#   3. The manifest runner auto-iterates; no workflow edit required.
#
# Schema:
#   crate           string  Cargo package name (-p flag value).
#   harness         string  Symbol passed to `--harness`.
#   default_unwind  int     Value for `--default-unwind`.
#   unwinding_checks bool   Optional; defaults false. True keeps CBMC checks on.
#   timeout_secs    int     Per-harness wall-clock cap.
#   lane            string  "pr" | "nightly".
#   features        list    Optional Cargo features (e.g. ["pq"]).
#   primary_rust_symbol string Optional explicit coverage owner for cross-module harnesses.
#   notes           string  Free-form comment for future maintainers.

# ---------------------------------------------------------------------
# chio-kernel-core baseline floor
# ---------------------------------------------------------------------
# Mirrors `[lanes.pr]` of formal/rust-verification/kani-public-harnesses.toml.
# Per-harness wall-clock figures (Apple M-series, hot cargo cache,
# kani 0.67.0): see that file's comment block. CI runner overhead is
# typically 2-3x; the heaviest harness (`public_verify_capability...`)
