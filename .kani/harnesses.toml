crate = "chio-kernel-core"
harness = "public_verify_capability_rejects_untrusted_issuer_before_signature"
default_unwind = 8
timeout_secs = 1800
lane = "pr"
notes = "Concrete Ed25519 + canonical-JSON path; heaviest in the lane (~31s local)."

