schema = "chio.kani.multi-crate.v1"

# Multi-crate Kani harness manifest (Kani multi-crate manifest).
#
# Each `[[harness]]` entry pins one (crate, harness) pair the CI
# `kani-public-pr` job iterates. The job invokes the harness with:
#
#     cargo kani -p <crate> --lib --harness <name> \
#       --default-unwind <default_unwind> --no-unwinding-checks
#
# Wrapped under a per-harness wall-clock cap of `timeout_secs`.
#
# Lanes:
#   * lane = "pr"      Always runs on every PR and on push-to-main.
#   * lane = "nightly" Runs only in the nightly Kani sweep workflow.
#
# This file is the source of truth for the multi-crate sweep. The
# legacy `formal/rust-verification/kani-public-harnesses.toml` retains
# the v1 chio-kernel-core schema for backwards-compatible consumers
# (`scripts/check-kani-public-core.sh` and the M06 evidence bundle
# expect `[lanes.pr]`); the entries below for chio-kernel-core mirror
# that lane so there is exactly one place to extend the sweep.
#
# Adding a harness:
#   1. Land the `#[kani::proof]` in `crates/<crate>/src/<file>.rs`,
#      gated by `#[cfg(kani)]`.
#   2. Append a `[[harness]]` block here.
#   3. The CI workflow auto-iterates; no workflow edit required.
#
# Schema:
#   crate           string  Cargo package name (-p flag value).
#   harness         string  Symbol passed to `--harness`.
#   default_unwind  int     Value for `--default-unwind`.
#   timeout_secs    int     Per-harness wall-clock cap.
#   lane            string  "pr" | "nightly".
#   features        list    Optional Cargo features (e.g. ["pq"]).
#   notes           string  Free-form comment for future maintainers.

# ---------------------------------------------------------------------
# chio-kernel-core (TRJ4 floor, originally landed)
# ---------------------------------------------------------------------
# Mirrors `[lanes.pr]` of formal/rust-verification/kani-public-harnesses.toml.
# Per-harness wall-clock figures (Apple M-series, hot cargo cache,
# kani 0.67.0): see that file's comment block. CI runner overhead is
# typically 2-3x; the heaviest harness (`public_verify_capability...`)
# is ~31s locally and stays well under the 1800s cap.

[[harness]]
crate = "chio-kernel-core"
harness = "public_verify_capability_rejects_untrusted_issuer_before_signature"
default_unwind = 8
timeout_secs = 1800
lane = "pr"
notes = "Concrete Ed25519 + canonical-JSON path; heaviest in the lane (~31s local)."

