# ---------------------------------------------------------------------
# Per-crate sections landed in their own PR (audit review item)
# ---------------------------------------------------------------------
# To make manifest enrollment atomic with harness source, each non-core
# crate's `[[harness]]` block now lands in the SAME PR that adds the
# harness source. This file (PR #607) ships the runner script, the
# schema documentation, and the chio-kernel-core lane mirror; other
# per-crate sections arrive via:
#
#   * chio-attest-verify  -> PR #605 (PR branch)
#   * chio-anchor         -> PR #613 (PR branch)
#   * chio-weights        -> PR #613 (PR branch)
#
# Integrator merges combine the per-crate sections additively. Adding a
# new harness in the future: land the `#[kani::proof]` and the matching
# `[[harness]]` block in the same PR; the multi-crate runner will pick
# it up without further workflow edits.

# ---------------------------------------------------------------------
# chio-attest-verify (Kani harness evidence, PR #605)
# ---------------------------------------------------------------------
# Four public-entry harnesses pinning the trust-boundary invariants of
# `expect_report_data` and the three TEE quote backends. Algebraic
# `verify_quote` models reflect the post-fix production order
# TCB -> algorithm -> report_data; a bug had inverted that order and was
# caught + fixed in PR #605. See the harness module doc comment for
# bound parameters (default_unwind = 8, symbolic byte-arrays <= 64).

[[harness]]
crate = "chio-attest-verify"
harness = "public_expect_report_data_determinism_under_input_change"
default_unwind = 8
timeout_secs = 1800
lane = "pr"
notes = "Direct call into pub fn expect_report_data; pure determinism + tampering arms."

[[harness]]
crate = "chio-attest-verify"
harness = "public_nitro_verify_quote_rejects_report_data_mismatch"
default_unwind = 8
timeout_secs = 1800
lane = "pr"
notes = "MODEL-ONLY: proves model_verify_quote algebra over ModelQuoteOutcome, NOT the production <NitroVerifier as QuoteVerifier>::verify_quote impl. Live runtime regression: crates/chio-attest-verify/tests/nitro_unit.rs (ReportDataMismatch). See audit P0-018."

[[harness]]
crate = "chio-attest-verify"
harness = "public_sev_snp_verify_quote_rejects_unacceptable_tcb"
default_unwind = 8
timeout_secs = 1800
lane = "pr"
notes = "MODEL-ONLY: proves model_verify_quote algebra, NOT the production <SevSnpVerifier as QuoteVerifier>::verify_quote impl. Live runtime regression: per-backend unit tests asserting QuoteRejected for non-acceptable TCB. See audit P0-018."

[[harness]]
crate = "chio-attest-verify"
harness = "public_tdx_verify_quote_rejects_algorithm_mismatch"
default_unwind = 8
timeout_secs = 1800
lane = "pr"
notes = "MODEL-ONLY: proves model_verify_quote algebra, NOT the production <TdxDcapVerifier as QuoteVerifier>::verify_quote impl. Live runtime regression: crates/chio-attest-verify/tests/tdx_integration.rs (ReportDataMismatch on intel-tdx-report-data-mismatch and intel-tdx-upper-half-tamper fixtures). See audit P0-018."
