# ---------------------------------------------------------------------
# Per-crate sections land with their harness source
# ---------------------------------------------------------------------
# To make manifest enrollment atomic with harness source, each non-core
# crate's `[[harness]]` block lands with the same change that adds the
# harness source. The shared runner lane ships the runner script, the
# schema documentation, and the chio-kernel-core lane mirror; other
# per-crate sections arrive with their crate-local harnesses:
#
#   * chio-attest-verify
#   * chio-anchor
#   * chio-credit
#   * chio-web3
#   * chio-weights
#
# Integrator merges combine the per-crate sections additively. Adding a
# new harness in the future: land the `#[kani::proof]` and the matching
# `[[harness]]` block in the same PR; the multi-crate runner will pick
# it up without further workflow edits.

# ---------------------------------------------------------------------
# chio-attest-verify Kani harness evidence
# ---------------------------------------------------------------------
# Four public-entry harnesses pinning the trust-boundary invariants of
# `expect_report_data` and the three TEE quote backends. Algebraic
# `verify_quote` models reflect the post-fix production order
# TCB -> algorithm -> report_data; a bug had inverted that order and is
# pinned by this harness set. See the harness module doc comment for
# bound parameters (default_unwind = 8, symbolic byte-arrays <= 64).

[[harness]]
crate = "chio-attest-verify"
harness = "public_expect_report_data_determinism_under_input_change"
default_unwind = 8
timeout_secs = 1800
lane = "pr"
notes = "Direct call into pub fn expect_report_data; pure determinism + tampering arms."

[[harness]]
crate = "chio-attest-verify"
harness = "public_nitro_verify_quote_rejects_report_data_mismatch"
default_unwind = 8
timeout_secs = 1800
lane = "pr"
notes = "MODEL-ONLY: proves model_verify_quote algebra over ModelQuoteOutcome, NOT the production <NitroVerifier as QuoteVerifier>::verify_quote impl. Live runtime regression: crates/trust/chio-attest-verify/tests/nitro_unit.rs (ReportDataMismatch). See the model-only scope notes."

[[harness]]
crate = "chio-attest-verify"
harness = "public_sev_snp_verify_quote_rejects_unacceptable_tcb"
default_unwind = 8
timeout_secs = 1800
lane = "pr"
notes = "MODEL-ONLY: proves model_verify_quote algebra, NOT the production <SevSnpVerifier as QuoteVerifier>::verify_quote impl. Live runtime regression: per-backend unit tests asserting QuoteRejected for non-acceptable TCB. See the model-only scope notes."

[[harness]]
crate = "chio-attest-verify"
harness = "public_tdx_verify_quote_rejects_algorithm_mismatch"
default_unwind = 8
timeout_secs = 1800
lane = "pr"
notes = "MODEL-ONLY: proves model_verify_quote algebra, NOT the production <TdxDcapVerifier as QuoteVerifier>::verify_quote impl. Live runtime regression: crates/trust/chio-attest-verify/tests/tdx_integration.rs (ReportDataMismatch on intel-tdx-report-data-mismatch and intel-tdx-upper-half-tamper fixtures). See the model-only scope notes."

# ---------------------------------------------------------------------
# chio-anchor Kani harness evidence
# ---------------------------------------------------------------------
# Source: crates/economy/chio-anchor/src/kani_public_harnesses.rs.
# The four `public_*_emergency_controls_*`,
# `public_ensure_anchor_operation_*`, `public_classify_anchor_lane_*`,
# and `public_anchor_indexer_cursor_lag_*` harnesses prove invariants
# of real `pub fn`s in `crates/economy/chio-anchor/src/lib.rs`. The
# `public_evaluate_witness_policy_advisory_fail_closed_model` harness
# is a model harness over the witness-policy decision algebra; the
# docstring in the harness file is the source of truth on
# what it covers and what Future hardening follow-up is required to extract the
# decision logic into a production helper called by both runtime and
# Kani.

[[harness]]
crate = "chio-anchor"
harness = "public_anchor_emergency_controls_allows_truth_table"
default_unwind = 8
timeout_secs = 1800
lane = "pr"
features = ["kani"]
notes = "Truth table over chio_anchor::emergency_controls_allows. `features = [kani]` is required: the chio-anchor crate body in src/lib.rs is gated by `#![cfg(feature = \"web3\")]`, and the `kani` Cargo feature implies `web3` so cargo-kani compiles a non-empty crate."

[[harness]]
crate = "chio-anchor"
harness = "public_ensure_anchor_operation_allowed_fail_closed"
default_unwind = 4
timeout_secs = 1800
lane = "pr"
features = ["kani"]
notes = "PR-tier fail-closed semantics of chio_anchor::ensure_anchor_operation_allowed over all five emergency modes and three operation kinds. The production denial arm selects one of three bounded static diagnostic strings before returning AnchorError::InvalidInput; this preserves the public Result/error behavior and stable operation-specific diagnostic prefixes without traversing dynamic formatting internals. The original format!-based implementation exhausted a 3600s nightly solver budget during propositional reduction; the bounded implementation verifies the same real public function within the standard 1800s non-core PR ceiling. The nightly workflow runs both pr and nightly manifest lanes, so this harness remains in the nightly union. Runtime negative tests and `public_anchor_emergency_controls_allows_truth_table` provide complementary PR-tier coverage."

[[harness]]
crate = "chio-anchor"
harness = "public_classify_anchor_lane_invariants"
default_unwind = 8
timeout_secs = 1800
lane = "pr"
features = ["kani"]
notes = "Lane classification invariants for chio_anchor::classify_anchor_lane."

[[harness]]
crate = "chio-anchor"
harness = "public_anchor_indexer_cursor_lag_classification"
default_unwind = 8
timeout_secs = 1800
lane = "pr"
features = ["kani"]
notes = "Cursor-lag classification for chio_anchor::anchor_indexer_cursor_lag."

[[harness]]
crate = "chio-anchor"
harness = "public_evaluate_witness_policy_advisory_fail_closed_model"
default_unwind = 8
timeout_secs = 1800
lane = "pr"
features = ["kani"]
notes = "MODEL-ONLY: proves the local model_evaluate_witness_policy decision algebra, not the production chio_anchor::witness::evaluate_witness_policy. Live runtime regression is checked separately by crates/economy/chio-anchor/tests/integration_smoke.rs and the chio-conformance negative tests. See the model-scope notes and harness module docstring for the future hardening follow-up."

