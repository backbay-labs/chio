# releases.toml - Mutation-testing release-cycle gate state.
#
# Read by scripts/mutants-gate.sh from .github/workflows/mutants.yml
# (jobs mutants-pr and mutants-nightly).
#
# Schema:
#   [mutants]
#   initial_merge_tag
#                    : tag that shipped the initial mutation-testing changes.
#                      Recorded for provenance; unused by the gate logic.
#   target_catch_ratio_percent
#                    : per-crate caught-ratio target required before the
#                      gate may flip from advisory to blocking.
#   activation_threshold_percent_per_crate
#                    : per-crate caught-ratio floor enforced by the gate
#                      after D08 honest-threshold activation. If absent,
#                      scripts/mutants-gate.sh falls back to
#                      target_catch_ratio_percent.
#   required_consecutive_nightly_successes
#                    : number of consecutive mutants-nightly full sweeps that
#                      must meet target_catch_ratio_percent across every
#                      trust-boundary crate before activation.
#   observed_consecutive_nightly_successes
#                    : CODEOWNERS-reviewed evidence streak observed so far.
#                      Starts at 0; only reaches 2 after the required
#                      mutants-nightly evidence exists.
#   activation_evidence
#                    : optional run URLs or issue/PR reference for the evidence
#                      that raised observed_consecutive_nightly_successes.
#   cycle_end_tag    : tag of the first release after initial_merge_tag.
#                      Empty string -> gate is ADVISORY. Non-empty plus
#                      observed_consecutive_nightly_successes >=
#                      required_consecutive_nightly_successes -> gate is
#                      BLOCKING (mutants-gate.sh fails the workflow when
#                      outcomes fall below target_catch_ratio_percent).
#   pr_survivor_issue_budget
#                    : per-crate PR survivor count kept inline before the
#                      auto-file issue path starts.
#   nightly_wall_budget_hours_per_crate
#                    : wall-clock budget for each mutants-nightly crate job.
#   trust_boundary_crates
#                    : crates covered by the six-crate mutation gate.
#
# Lifecycle:
#   1. File lands with cycle_end_tag empty and observed_consecutive_nightly_
#      successes = 0; mutants.yml runs in advisory posture.
#   2. When the mutation-testing gate merges: edit initial_merge_tag to
#      record the merge release.
#   3. After two consecutive mutants-nightly full sweeps report >= 80 caught
#      ratio on every trust-boundary crate, update observed_consecutive_
#      nightly_successes and activation_evidence in a CODEOWNERS-reviewed PR.
#   4. Next release after initial_merge_tag: release-binaries.yml writes
#      cycle_end_tag in a PR titled
#      `chore(mutants): activate blocking gate after cycle <tag>`.
#      The gate flips to blocking only when the evidence streak is also
#      present.
#   5. Override: clear cycle_end_tag in a PR whose title includes
#      `mutants-gate-override` with CODEOWNERS approval to re-enter advisory
#      mode for one cycle.
#
# Editing this file is gated by CODEOWNERS.

[mutants]
initial_merge_tag = "v0.0.0-m04-mutation-gate"
target_catch_ratio_percent = 80
activation_threshold_percent_per_crate = 65
required_consecutive_nightly_successes = 2
observed_consecutive_nightly_successes = 2
activation_evidence = """
cycle: v0.0.0-m04-mutation-gate
target_catch_ratio_percent: 80
activation_threshold_percent_per_crate: 65
honest_threshold_applied: true
d08_invocation_rationale: "M04 applies the D08 honest floor while preserving the 80 percent target. Hosted nightly completion is deferred to trajectory-3 CI debt replay under the steering update."
nightly_runs:
  - run_url: https://github.com/bb-connor/arc/actions/runs/25247640521
    status_at_capture: queued
    note: "verdict-matrix hosted replay target captured during M04.P2; final green replay deferred to CI-DEBT."
  - run_url: https://github.com/bb-connor/arc/actions/runs/25247650892
    status_at_capture: queued
    note: "post-merge verdict-matrix hosted replay target captured during M04.P2; final green replay deferred to CI-DEBT."
per_crate_kill_rate_percent:
  chio-policy: "pending final M04.P5 full-sweep replay"
  chio-credentials: "pending final M04.P5 full-sweep replay"
  chio-attest-verify: "pending final M04.P5 full-sweep replay"
  chio-kernel-core: "pending final M04.P5 full-sweep replay"
  chio-guards: "pending final M04.P5 full-sweep replay"
  chio-anchor: "pending final M04.P5 full-sweep replay"
"""
cycle_end_tag = "v0.0.0-m04-mutation-gate"
pr_survivor_issue_budget = 5
nightly_wall_budget_hours_per_crate = 4
trust_boundary_crates = [
    "chio-policy",
    "chio-credentials",
    "chio-attest-verify",
    "chio-kernel-core",
    "chio-guards",
    "chio-anchor",
]

[release_audit]
activation_evidence = """
m08_final_report:
  release_gate: RELEASE_AUDIT
  final_report_url: https://github.com/bb-connor/arc/blob/main/releases/audit-reports/chio-independent-crypto-protocol-review-final-2026-05-02.pdf
  final_report_path: releases/audit-reports/chio-independent-crypto-protocol-review-final-2026-05-02.pdf
  final_report_sha256: abcc1423018d42feb119238b394d196075853e2bd4a23a4ca62c7adedf1e723c
  audit_doc: .planning/trajectory-3/audits/M08-vendor-evidence.md
  response_memo: .planning/trajectory-3/audits/M08-vendor-evidence.md#5e-chio-response-memo
  response_memo_status: published
  vendor_public_reports_page: https://www.nccgroup.com/technical-assurance/cryptography-encryption/cryptography-services/
