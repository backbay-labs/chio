# Mutation-testing release-cycle gate state follows. Its scored, reviewed
# evidence lifecycle remains separate from pass/fail lane posture.
#
# Pass/fail lane posture is read by scripts/lane-gate.sh. Mutation scoring is
# governed separately by scripts/mutants-gate.sh because its evidence requires
# a reviewed catch-ratio judgment.
#
# Pass/fail lane schema:
#   [gates.<lane>]
#   workflow             : workflow filename registered by GitHub Actions.
#   job                  : exact job display name returned by the jobs API.
#   event                : schedule or pull_request; dispatch runs never count.
#   posture              : advisory or required.
#   required_streak      : consecutive matching-event job successes needed for
#                          promotion.
#   evidence_after_run_id
#                         : exclusive reset boundary for promotion evidence.
#   max_age_hours        : freshness bound used by release fleet checks.
#   activation_target    : optional scored-lane percentage required in the
#                          bound report before a success can count.
#   scored_artifact_prefix
#                         : required with activation_target; followed by the
#                          exact run ID and latest run attempt.
#   scored_artifact_schema
#                         : exact report schema selected from the scored
#                          artifact. Exactly one matching JSON report is
#                          required.
#   scored_sample_size    : exact number of mutants required in each scored
#                          scheduled report.
#   scored_inventory_size : exact enumerated inventory ratchet for the lane.
#   scored_inventory_sha256
#                         : canonical full-inventory identity ratchet.
#   scored_sources        : exact source-name and repository-path bindings
#                          required for specification mutation reports.
#   scored_seeds          : exact historical regression seeds required in
#                          every specification mutation report.
#   scored_files          : exact source files required in proof mutation
#                          reports.
#   scored_viability_target
#                         : minimum proof mutants that must compile and run.
#   scored_tools          : exact normalized tool versions accepted by the
#                          scored report verifier.
#   strict_mode_required : optional; successful evidence also needs the named
#                         strict proof-report artifact.
#   strict_artifact_prefix
#                         : required prefix followed by the exact run ID and
#                          latest run attempt.
#   base_branch           : required pull-request base branch. Runs targeting
#                          another base do not count.
#   execution_artifact_prefix
#                         : required for pull-request lanes. The proof job
#                          uploads this prefix plus run ID and attempt only
#                          after real verification work completes.
#   frozen               : optional; rejects required posture while true.
#   frozen_reason        : required explanation when frozen is true.
#   promotion_evidence   : required inline table for required posture; absent
#                          for advisory posture. run_ids must contain exactly
#                          required_streak unique post-reset run IDs, and
#                          report_sha256 is SHA-256 over those verified run IDs,
#                          one decimal ID plus newline in listed order.
#
# Mutation scoring schema:
#   [mutants]
#   initial_merge_tag
#                    : tag that shipped the initial mutation-testing changes.
#                      Recorded for provenance; unused by the gate logic.
#   target_catch_ratio_percent
#                    : per-crate caught-ratio target required before the
#                      gate may flip from advisory to blocking.
#   activation_threshold_percent_per_crate
#                    : per-crate caught-ratio floor enforced by the gate
#                      after D08 honest-threshold activation. If absent,
#                      scripts/mutants-gate.sh falls back to
#                      target_catch_ratio_percent.
#   required_consecutive_nightly_successes
#                    : number of consecutive mutants-nightly full sweeps that
#                      must meet target_catch_ratio_percent across every
#                      trust-boundary crate before activation.
#   observed_consecutive_nightly_successes
#                    : CODEOWNERS-reviewed evidence streak observed so far.
#                      Starts at 0; only reaches 2 after the required
#                      mutants-nightly evidence exists.
#   activation_evidence
#                    : optional run URLs or issue/PR reference for the evidence
#                      that raised observed_consecutive_nightly_successes.
#   cycle_end_tag    : tag of the first release after initial_merge_tag.
#                      Empty string -> gate is ADVISORY. Non-empty plus
#                      observed_consecutive_nightly_successes >=
#                      required_consecutive_nightly_successes -> gate is
#                      BLOCKING (mutants-gate.sh fails the workflow when
#                      outcomes fall below target_catch_ratio_percent).
#   pr_survivor_issue_budget
#                    : per-crate PR survivor count kept inline before the
#                      auto-file issue path starts.
#   nightly_wall_budget_hours_per_crate
#                    : wall-clock budget for each mutants-nightly crate job.
#   trust_boundary_crates
#                    : crates covered by the six-crate mutation gate.
#
# Lifecycle:
#   1. File lands with cycle_end_tag empty and observed_consecutive_nightly_
#      successes = 0; mutants.yml runs in advisory posture.
#   2. When the mutation-testing gate merges: edit initial_merge_tag to
#      record the merge release.
#   3. After two consecutive mutants-nightly full sweeps report >= 80 caught
#      ratio on every trust-boundary crate, update observed_consecutive_
#      nightly_successes and activation_evidence in a CODEOWNERS-reviewed PR.
#   4. Next release after initial_merge_tag: release-binaries.yml writes
#      cycle_end_tag in a PR titled
#      `chore(mutants): activate blocking gate after cycle <tag>`.
#      The gate flips to blocking only when the evidence streak is also
#      present.
#   5. Override: clear cycle_end_tag in a PR whose title includes
#      `mutants-gate-override` with CODEOWNERS approval to re-enter advisory
#      mode for one cycle.
#
# Editing this file is gated by CODEOWNERS.

